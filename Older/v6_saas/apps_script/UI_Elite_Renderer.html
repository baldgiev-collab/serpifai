/**
 * Main entry point: Render complete competitor intelligence dashboard
 * @param {Object} result - Response from COMP_orchestrateAnalysis()
 */
function renderEliteCompetitorDashboard(result) {
  console.log('🚀 Rendering ELITE Board-Ready Dashboard...');
  console.log('📦 Received data structure:', result);
  
  if (!result || !result.success) {
    showError(result ? result.error : 'No data received');
    return;
  }
  
  // Hide loading, show results
  hideElement('comp-loading-state');
  hideElement('comp-empty-state');
  showElement('comp-results');
  
  try {
    // Transform data if needed
    const transformedData = {
      competitors: result.competitors || {},
      intelligence: result.intelligence || result.categories || {},
      overview: result.overview || result.aggregatedInsights || {},
      dashboardCharts: result.dashboardCharts || {},
      analysis: result.analysis || {},
      metadata: result.metadata || {}
    };
    
    console.log('📊 Transformed data:', {
      competitorCount: Object.keys(transformedData.competitors).length,
      intelligenceCategories: Object.keys(transformedData.intelligence).length,
      hasOverview: !!transformedData.overview,
      hasAnalysis: !!transformedData.analysis,
      metadata: transformedData.metadata
    });
    
    // Inject Elite Styles
    injectEliteStyles();
    
    // Render Executive Summary FIRST (3-sentence summary at top)
    renderExecutiveSummaryBanner(transformedData.analysis);
    
    // Render overview dashboard with elite design
    renderOverviewDashboard(transformedData.overview, transformedData.intelligence, transformedData.competitors);
    
    // Render Elite Gemini Insights with board-ready design
    if (transformedData.analysis) {
      renderEliteGeminiInsights(transformedData.analysis);
    }
    
    // Render all category tabs with real data
    renderAllCategoryTabs(transformedData.competitors, transformedData.intelligence);
    
    // Render all category charts
    if (transformedData.dashboardCharts && Object.keys(transformedData.dashboardCharts).length > 0) {
      renderAllCategoryCharts(transformedData.dashboardCharts, transformedData.intelligence);
    }
    
    // Render overview radar chart (Category Performance)
    if (transformedData.overview && transformedData.overview.categoryScores) {
      console.log('📊 Rendering overview radar chart...');
      renderOverviewRadarChart(transformedData.overview, transformedData.intelligence);
    } else {
      console.warn('⚠️ No overview.categoryScores for radar chart');
    }
    
    // Render metrics grids with data quality badges
    renderAllMetricsGrids(transformedData.intelligence, transformedData.competitors);
    
    // Render insights for each category
    renderAllInsights(transformedData.intelligence, transformedData.competitors);
    
    // Adapt and render charts
    console.log('🔄 Adapting data for chart compatibility...');
    const adaptedForCharts = adaptCompetitorDataForOldCharts(transformedData.competitors);
    console.log('✅ Data adapted for charts:', adaptedForCharts.length, 'competitors');
    
    if (typeof renderAllCompetitorCharts === 'function') {
      try {
        renderAllCompetitorCharts({ competitors: adaptedForCharts });
        console.log('✅ Charts rendered successfully');
      } catch (chartError) {
        console.error('❌ Chart rendering failed:', chartError);
      }
    }
    
    console.log('✅ ELITE Board-Ready Dashboard rendered successfully');
    
  } catch (error) {
    console.error('❌ Error rendering dashboard:', error);
    console.error('Stack:', error.stack);
    showError(error.toString());
  }
}

/**
 * Render 3-Sentence Executive Summary Banner at the TOP
 */
function renderExecutiveSummaryBanner(analysis) {
  const container = document.getElementById('comp-overview-metrics');
  if (!container) return;
  
  // Extract 3-sentence summary from analysis
  let summaryLines = [];
  
  if (analysis?.executiveBrief?.threeLineSummary) {
    summaryLines = analysis.executiveBrief.threeLineSummary;
  } else if (analysis?.executiveBrief?.landscapeOverview) {
    // Fallback: split landscape overview into sentences
    const overview = analysis.executiveBrief.landscapeOverview;
    summaryLines = overview.split(/[.!?]+/).filter(s => s.trim()).slice(0, 3).map(s => s.trim() + '.');
  } else {
    // Generate from available data
    summaryLines = [
      'Comprehensive competitive analysis complete with actionable strategic insights.',
      'Key opportunities identified across technical SEO, content authority, and market positioning.',
      'Prioritized roadmap ready for immediate implementation.'
    ];
  }
  
  // Create banner HTML
  const bannerHtml = `
    <div class="executive-summary-banner animate-slide-up">
      <div class="executive-summary-title">
        3-Sentence Executive Summary
      </div>
      <div class="executive-summary-content">
        ${summaryLines.map((line, i) => `
          <div class="executive-summary-line">${translateToPlainEnglish(line)}</div>
        `).join('')}
      </div>
    </div>
  `;
  
  // Prepend to container
  container.insertAdjacentHTML('afterbegin', bannerHtml);
}

/**
 * Translate technical jargon to plain English
 */
function translateToPlainEnglish(text) {
  if (!text) return '';
  
  const translations = {
    // Technical SEO terms
    'PageRank': 'website authority score',
    'SERP': 'search results',
    'SERPs': 'search results',
    'SEO': 'search visibility',
    'CTA': 'call-to-action',
    'CTR': 'click rate',
    'backlinks': 'links from other websites',
    'backlink profile': 'network of sites linking to them',
    'referring domains': 'websites linking to them',
    'organic traffic': 'visitors from search engines',
    'domain authority': 'website credibility score',
    'Core Web Vitals': 'website speed and user experience',
    'CWV': 'website speed metrics',
    'LCP': 'page load speed',
    'FID': 'page responsiveness',
    'CLS': 'visual stability',
    'schema markup': 'structured data for search engines',
    'canonical': 'primary page version',
    'indexability': 'ability to appear in search',
    
    // Content & Strategy terms
    'conversion surface': 'pages that turn visitors into customers',
    'topical dominance': 'owning the conversation on a topic',
    'topical authority': 'being the go-to source on a topic',
    'semantic cluster': 'group of related topics',
    'content gap': 'topics competitors cover that you don\'t',
    'content velocity': 'speed of publishing new content',
    'Entity-Based SEO': 'becoming the recognized authority',
    'entity SEO': 'building topical authority',
    'EEAT': 'expertise, experience, authority, and trust signals',
    'E-E-A-T': 'expertise, experience, authority, and trust signals',
    'thought leadership': 'industry expert positioning',
    
    // Business & Market terms
    'market positioning': 'how you compare to competitors',
    'competitive moat': 'defensible business advantage',
    'programmatic moat': 'automated defensible advantage',
    'TAM': 'total market opportunity',
    'ARR': 'annual recurring revenue',
    'MRR': 'monthly recurring revenue',
    'CAC': 'cost to acquire a customer',
    'LTV': 'lifetime customer value',
    'churn': 'customer loss rate',
    'ICP': 'ideal customer profile',
    
    // Technical terms for non-technical readers
    'API': 'software connection',
    'ML': 'machine learning',
    'AI-powered': 'intelligent automation',
    'infrastructure': 'technical foundation',
    'scalability': 'ability to grow',
    'latency': 'response speed',
    'uptime': 'availability',
    'ROI': 'return on investment'
  };
  
  let result = text;
  Object.entries(translations).forEach(([tech, plain]) => {
    const regex = new RegExp(`\\b${tech}\\b`, 'gi');
    result = result.replace(regex, plain);
  });
  
  return result;
}

/**
 * Adapt NEW system data structure for OLD chart functions
 * Converts: { "url": { categories: {...} } } 
 * To: [ { domain, processedMetrics: {...} } ]
 */
function adaptCompetitorDataForOldCharts(competitors) {
  console.log('🔄 adaptCompetitorDataForOldCharts called');
  console.log('   Input type:', typeof competitors);
  console.log('   Input keys:', Object.keys(competitors || {}).length);
  
  if (!competitors || typeof competitors !== 'object') {
    console.warn('⚠️ Invalid competitors data for adaptation');
    return [];
  }
  
  const adapted = [];
  
  Object.keys(competitors).forEach(url => {
    const comp = competitors[url];
    
    // Extract metrics from categories structure
    const processedMetrics = {
      // Authority metrics
      authorityMomentum: extractCategoryMetric(comp, 'authority', 'domainAuthority', 50),
      backlinks: extractCategoryMetric(comp, 'authority', 'totalBacklinks', 1000),
      referringDomains: extractCategoryMetric(comp, 'authority', 'referringDomains', 100),
      
      // Technical SEO metrics  
      technicalScore: extractCategoryMetric(comp, 'technicalSEO', 'technicalScore', 75),
      pageSpeed: extractCategoryMetric(comp, 'technicalSEO', 'pageSpeed', 80),
      mobileScore: extractCategoryMetric(comp, 'technicalSEO', 'mobileScore', 85),
      
      // Content metrics
      contentQuality: extractCategoryMetric(comp, 'contentIntelligence', 'contentQuality', 70),
      contentDepth: extractCategoryMetric(comp, 'contentIntelligence', 'avgWordCount', 1500),
      
      // Market metrics
      marketShare: extractCategoryMetric(comp, 'marketPositioning', 'estimatedTraffic', 50000),
      searchVisibility: extractCategoryMetric(comp, 'marketPositioning', 'searchVisibility', 60),
      
      // Brand metrics
      brandStrength: extractCategoryMetric(comp, 'brandMessaging', 'brandStrength', 65),
      
      // Keyword metrics
      keywordCount: extractCategoryMetric(comp, 'keywordStrategy', 'totalKeywords', 500),
      
      // Performance metrics
      coreCWV: extractCategoryMetric(comp, 'performance', 'coreWebVitals', 80)
    };
    
    adapted.push({
      domain: comp.domain || extractDomain(url),
      url: url,
      processedMetrics: processedMetrics,
      categories: comp.categories || {},
      rawData: comp
    });
  });
  
  console.log('✅ Adapted ' + adapted.length + ' competitors for charts');
  if (adapted.length > 0) {
    console.log('   Sample processedMetrics:', adapted[0].processedMetrics);
  }
  
  return adapted;
}

/**
 * Extract metric from category structure with fallback
 */
function extractCategoryMetric(competitor, categoryKey, metricKey, defaultValue) {
  try {
    if (!competitor || !competitor.categories) return defaultValue;
    const category = competitor.categories[categoryKey];
    if (!category || !category.metrics) return defaultValue;
    
    const value = category.metrics[metricKey];
    return (value !== undefined && value !== null) ? value : defaultValue;
  } catch (error) {
    return defaultValue;
  }
}

/**
 * Extract domain from URL
 */
function extractDomain(url) {
  try {
    const urlObj = new URL(url);
    return urlObj.hostname.replace('www.', '');
  } catch (error) {
    return url.replace('https://', '').replace('http://', '').replace('www.', '').split('/')[0];
  }
}

/**
 * Extract Efficiency Data from competitorRankings
 */
function extractEfficiencyData(analysis) {
  if (!analysis.competitorRankings || !Array.isArray(analysis.competitorRankings)) {
    return null;
  }
  
  const efficiencyRatios = analysis.competitorRankings.map(comp => {
    const ratio = comp.efficiencyRatio || 0;
    let grade = 'C';
    let interpretation = 'Average efficiency';
    
    if (ratio >= 10) {
      grade = 'A';
      interpretation = 'Highly efficient - grows with minimal link building investment';
    } else if (ratio >= 5) {
      grade = 'B';
      interpretation = 'Good efficiency - reasonable returns on authority building';
    } else if (ratio >= 2) {
      grade = 'C';
      interpretation = 'Average efficiency - typical for competitive markets';
    } else {
      grade = 'D';
      interpretation = 'Bloated profile - high links, low traffic. Opportunity to outmaneuver.';
    }
    
    return {
      competitor: comp.domain,
      trafficPerRefDomain: ratio,
      efficiencyGrade: grade,
      interpretation: interpretation,
      competitiveImplication: comp.efficiencyAnalysis || 
        (grade === 'D' ? 'Can be outmaneuvered with less capital investment' : 
         grade === 'A' ? 'Strong competitor - needs strategic differentiation' : 
         'Monitor and target weak points')
    };
  });
  
  // Calculate market insight
  const avgRatio = efficiencyRatios.reduce((sum, r) => sum + r.trafficPerRefDomain, 0) / efficiencyRatios.length;
  const marketInsight = avgRatio >= 7 
    ? 'Market shows high efficiency overall - focus on content quality over link building'
    : avgRatio >= 4 
      ? 'Market has moderate efficiency - balanced strategy recommended'
      : 'Market appears saturated with low-efficiency players - opportunity for lean, targeted approach';
  
  return {
    efficiencyRatios,
    marketInsight
  };
}

/**
 * Render overview radar chart showing category breakdown
 */
function renderOverviewRadarChart(overview, intelligence) {
  const canvasId = 'chart-comp-overview-radar';
  destroyChart(canvasId);
  
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  
  const ctx = canvas.getContext('2d');
  
  // Extract category labels and average scores
  const labels = [];
  const data = [];
  
  Object.keys(overview.categoryScores || {}).forEach(categoryKey => {
    const category = overview.categoryScores[categoryKey];
    if (category.average !== undefined) {
      labels.push(category.displayName.substring(0, 20)); // Truncate long names
      data.push(category.average);
    }
  });
  
  // Generate strategic insight for category performance
  const sortedCategories = Object.entries(overview.categoryScores || {})
    .filter(([k, v]) => v.average !== undefined)
    .sort((a, b) => b[1].average - a[1].average);
  
  let insight = '';
  if (sortedCategories.length > 0) {
    const strongest = sortedCategories[0];
    const weakest = sortedCategories[sortedCategories.length - 1];
    const avgScore = overview.averageScore || Math.round(data.reduce((a,b) => a+b, 0) / data.length);
    insight = `<strong>${strongest[1].displayName}</strong> is the strongest category (${strongest[1].average}%), while <strong>${weakest[1].displayName}</strong> presents the biggest opportunity gap (${weakest[1].average}%). Market average: ${avgScore}%. Prioritize improving weak categories for competitive advantage.`;
  } else {
    insight = 'Insufficient data to analyze category performance.';
  }
  
  window.eliteChartInstances[canvasId] = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Category Averages',
        data: data,
        borderColor: '#1a73e8',
        backgroundColor: 'rgba(26, 115, 232, 0.2)',
        borderWidth: 2,
        pointRadius: 4,
        pointHoverRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        r: {
          beginAtZero: true,
          max: 100,
          ticks: { stepSize: 25 }
        }
      },
      plugins: {
        legend: { display: false },
        title: { 
          display: true, 
          text: '📊 Category Performance Overview',
          font: { size: 14, weight: 'bold' }
        }
      }
    }
  });
  
  // Add insight below chart
  insertCategoryChartInsight(canvasId, insight);
}

/**
 * Render data quality badge with proper icon and styling
 */
function renderDataQualityBadge(dataQuality) {
  if (!dataQuality) return '';
  
  const qualityStr = String(dataQuality);
  
  if (qualityStr.includes('✅') || qualityStr.includes('real')) {
    return `<div class="metric-badge data-badge-real">✅ real</div>`;
  } else if (qualityStr.includes('🤖') || qualityStr.includes('predicted')) {
    // Extract confidence percentage if present
    const confidenceMatch = qualityStr.match(/(\d+)%/);
    const confidence = confidenceMatch ? confidenceMatch[1] + '%' : '';
    return `<div class="metric-badge data-badge-predicted">🤖 predicted ${confidence}</div>`;
  } else if (qualityStr.includes('📊') || qualityStr.includes('calculated')) {
    return `<div class="metric-badge data-badge-calculated">📊 calculated</div>`;
  } else if (qualityStr.includes('⚠️') || qualityStr.includes('unavailable')) {
    return `<div class="metric-badge data-badge-unavailable">⚠️ unavailable</div>`;
  }
  
  return `<div class="metric-badge">${dataQuality}</div>`;
}

function destroyChart(canvasId) {
  if (window.eliteChartInstances[canvasId]) {
    window.eliteChartInstances[canvasId].destroy();
    delete window.eliteChartInstances[canvasId];
  }
}

function showElement(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = 'block';
}

function hideElement(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = 'none';
}

function showError(message) {
  console.error('❌ Error:', message);
  const container = document.getElementById('comp-results');
  if (container) {
    container.innerHTML = `
      <div class="error-state">
        <div class="error-icon">❌</div>
        <h3>Analysis Failed</h3>
        <p>${message}</p>
        <button onclick="location.reload()" class="retry-btn">Retry</button>
      </div>
    `;
    container.style.display = 'block';
  }
}

function getDataQualityForMetric(dataQuality, metricKey) {
  if (!dataQuality) return '✅ real';
  
  // Check if there's a specific quality for this metric
  if (dataQuality[metricKey]) {
    return dataQuality[metricKey];
  }
  
  // Otherwise return generic quality
  return Object.values(dataQuality)[0] || '✅ real';
}

function formatMetricLabel(metricKey) {
  // Convert camelCase to Title Case
  return metricKey
    .replace(/([A-Z])/g, ' $1')
    .replace(/^./, str => str.toUpperCase())
    .trim();
}

function formatMetricValue(value) {
  if (typeof value === 'number') {
    return value % 1 === 0 ? value : value.toFixed(2);
  }
  if (Array.isArray(value)) {
    return value.join(', ');
  }
  if (typeof value === 'object') {
    return JSON.stringify(value);
  }
  return String(value);
}

function getMetricValueClass(value) {
  if (typeof value === 'number') {
    if (value >= 80) return 'metric-excellent';
    if (value >= 60) return 'metric-good';
    if (value >= 40) return 'metric-average';
    return 'metric-poor';
  }
  return 'metric-neutral';
}

function getScoreClass(score) {
  if (score >= 80) return 'excellent';
  if (score >= 60) return 'good';
  if (score >= 40) return 'average';
  return 'needs-work';
}

function getDataQualityForMetric(dataQuality, metricKey) {
  if (!dataQuality || !dataQuality.fieldQuality) return 'mockup';
  
  const quality = dataQuality.fieldQuality[metricKey];
  if (quality === 'real') return 'real';
  if (quality === 'calculated') return 'calculated';
  if (quality === 'inferred') return 'inferred';
  return 'mockup';
}

function renderDataQualityBadge(quality) {
  const badges = {
    'real': '<div class="metric-badge data-badge-real">✅ real</div>',
    'calculated': '<div class="metric-badge data-badge-calculated">📊 calculated</div>',
    'inferred': '<div class="metric-badge data-badge-inferred">🤔 inferred</div>',
    'mockup': '<div class="metric-badge data-badge-mockup">🎨 mockup</div>'
  };
  return badges[quality] || badges['mockup'];
}

function getColorByIndex(index) {
  const colors = [
    '#1a73e8', '#34a853', '#fbbc04', '#ea4335', '#8e24aa',
    '#00acc1', '#ff6f00', '#c2185b', '#7cb342', '#5e35b1'
  ];
  return colors[index % colors.length];
}

function getChartColors(count) {
  const colors = [
    '#1a73e8', '#34a853', '#fbbc04', '#ea4335', '#8e24aa',
    '#00acc1', '#ff6f00', '#c2185b', '#7cb342', '#5e35b1'
  ];
  return Array.from({ length: count }, (_, i) => colors[i % colors.length]);
}

function getChartScales(chartType) {
  if (chartType === 'radar') {
    return {
      r: {
        beginAtZero: true,
        max: 100
      }
    };
  } else if (chartType === 'doughnut' || chartType === 'pie') {
    return {};
  } else {
    return {
      y: { beginAtZero: true, max: 100 },
      x: { beginAtZero: true }
    };
  }
}
