 * - UI_Scripts_App.html (tab population functions)

 * - Gauge charts (scores, health metrics)

/**
 * Main entry point - render all ELITE visualizations
 * @param {Object} eliteData - Pre-processed data from ELITE_DataVisualizationEngine
 */
function ELITE_renderAllVisualizations(eliteData) {
  console.log('🎨 ELITE UI RENDERER: Starting visualization render...');
  console.log('📊 Data received:', {
    tabs: eliteData.tabs ? Object.keys(eliteData.tabs).length : 0,
    geminiInsights: eliteData.geminiInsights ? Object.keys(eliteData.geminiInsights).length : 0,
    comparative: eliteData.comparative ? Object.keys(eliteData.comparative).length : 0
  });
  
  if (!eliteData || !eliteData.tabs) {
    console.warn('⚠️ No ELITE data available for rendering');
    return;
  }
  
  try {
    // Render each tab's visualizations
    Object.keys(eliteData.tabs).forEach(tabId => {
      const tabData = eliteData.tabs[tabId];
      ELITE_renderTabVisualization(tabId, tabData, eliteData.comparative);
    });
    
    // Render Gemini insights for each tab
    if (eliteData.geminiInsights) {
      Object.keys(eliteData.geminiInsights).forEach(tabId => {
        const insights = eliteData.geminiInsights[tabId];
        ELITE_renderGeminiInsights(tabId, insights);
      });
    }
    
    console.log('✅ ELITE visualizations rendered successfully');
  } catch (error) {
    console.error('❌ Error in ELITE render:', error);
  }
}

/**
 * Render visualizations for a specific tab
 */
function ELITE_renderTabVisualization(tabId, tabData, comparativeData) {
  console.log(`🎨 Rendering tab: ${tabId}`);
  
  // Find the tab panel
  const panel = document.querySelector(`[data-comp-panel="${tabId}"]`) || 
                document.getElementById(`panel-${tabId}`);
  
  if (!panel) {
    console.warn(`⚠️ Panel not found for tab: ${tabId}`);
    return;
  }
  
  // Get visualization specs for this tab
  const specs = ELITE_getVisualizationSpecs(tabId);
  if (!specs) {
    console.warn(`⚠️ No visualization specs for tab: ${tabId}`);
    return;
  }
  
  // Render each visualization type
  if (specs.cards) {
    specs.cards.forEach(cardSpec => {
      ELITE_renderKPICard(panel, cardSpec, tabData, comparativeData);
    });
  }
  
  if (specs.charts) {
    specs.charts.forEach(chartSpec => {
      ELITE_renderChart(panel, chartSpec, tabData, comparativeData);
    });
  }
  
  if (specs.tables) {
    specs.tables.forEach(tableSpec => {
      ELITE_renderComparisonTable(panel, tableSpec, tabData, comparativeData);
    });
  }
  
  if (specs.heatmaps) {
    specs.heatmaps.forEach(heatmapSpec => {
      ELITE_renderHeatmap(panel, heatmapSpec, tabData, comparativeData);
    });
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// KPI CARD RENDERING
// ═══════════════════════════════════════════════════════════════════════════════

function ELITE_renderKPICard(panel, spec, tabData, comparativeData) {
  const container = panel.querySelector(`#elite-card-${spec.id}`) || 
                    panel.querySelector(`[data-elite-card="${spec.id}"]`);
  
  // Create container if it doesn't exist
  let cardContainer = container;
  if (!cardContainer) {
    const metricsSection = panel.querySelector('.elite-metrics-section') || 
                           panel.querySelector('.comp-metrics');
    if (metricsSection) {
      cardContainer = document.createElement('div');
      cardContainer.id = `elite-card-${spec.id}`;
      cardContainer.className = 'elite-kpi-card';
      metricsSection.appendChild(cardContainer);
    } else {
      return; // No place to put the card
    }
  }
  
  const value = ELITE_getDataValue(tabData, spec.data);
  const comparative = comparativeData ? ELITE_getComparativeInfo(comparativeData, spec.data) : null;
  
  switch (spec.type) {
    case 'gauge':
      cardContainer.innerHTML = ELITE_renderGaugeCard(spec, value, comparative);
      break;
    case 'metric':
      cardContainer.innerHTML = ELITE_renderMetricCard(spec, value, comparative);
      break;
    case 'highlight':
      cardContainer.innerHTML = ELITE_renderHighlightCard(spec, value, comparative);
      break;
    case 'opportunity':
      cardContainer.innerHTML = ELITE_renderOpportunityCard(spec, value, comparative);
      break;
    case 'grade':
      cardContainer.innerHTML = ELITE_renderGradeCard(spec, value, comparative);
      break;
  }
}

function ELITE_renderGaugeCard(spec, value, comparative) {
  const numValue = parseFloat(value) || 0;
  const color = spec.color || ELITE_getColorForValue(numValue, spec.thresholds);
  const rank = comparative ? comparative.rank : null;
  const gap = comparative ? comparative.gap : null;
  
  return `
    <div class="elite-gauge-card">
      <div class="elite-gauge-container">
        <svg viewBox="0 0 120 70" class="elite-gauge-svg">
          <path d="M15 60 A45 45 0 0 1 105 60" fill="none" stroke="#e0e0e0" stroke-width="10" stroke-linecap="round"/>
          <path d="M15 60 A45 45 0 0 1 105 60" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
                stroke-dasharray="${numValue * 1.41} 141.3" class="elite-gauge-arc"/>
        </svg>
        <div class="elite-gauge-value">${Math.round(numValue)}</div>
      </div>
      <div class="elite-gauge-label">${spec.label}</div>
      ${rank ? `<div class="elite-gauge-rank">#${rank} of ${comparative.total}</div>` : ''}
      ${gap ? `<div class="elite-gauge-gap" style="color: ${gap > 0 ? '#ea4335' : '#34a853'}">${gap > 0 ? '+' : ''}${gap.toFixed(1)} to leader</div>` : ''}
    </div>
  `;
}

function ELITE_renderMetricCard(spec, value, comparative) {
  const displayValue = typeof value === 'number' ? value.toLocaleString() : value;
  const trend = comparative ? comparative.trend : null;
  
  return `
    <div class="elite-metric-card">
      <div class="elite-metric-value">${displayValue}</div>
      <div class="elite-metric-label">${spec.label}</div>
      ${trend ? `
        <div class="elite-metric-trend ${trend > 0 ? 'up' : 'down'}">
          <span class="trend-icon">${trend > 0 ? '↑' : '↓'}</span>
          <span class="trend-value">${Math.abs(trend)}%</span>
        </div>
      ` : ''}
    </div>
  `;
}

function ELITE_renderHighlightCard(spec, value, comparative) {
  return `
    <div class="elite-highlight-card">
      <div class="elite-highlight-label">${spec.label}</div>
      <div class="elite-highlight-value">${value || 'N/A'}</div>
      ${comparative?.details ? `<div class="elite-highlight-details">${comparative.details}</div>` : ''}
    </div>
  `;
}

function ELITE_renderOpportunityCard(spec, value, comparative) {
  const opportunities = Array.isArray(value) ? value : [value];
  
  return `
    <div class="elite-opportunity-card">
      <div class="elite-opportunity-label">${spec.label}</div>
      <div class="elite-opportunity-count">${opportunities.length}</div>
      <div class="elite-opportunity-list">
        ${opportunities.slice(0, 3).map(opp => `<div class="opportunity-item">• ${opp}</div>`).join('')}
      </div>
    </div>
  `;
}

function ELITE_renderGradeCard(spec, value, comparative) {
  const gradeColors = { 'A+': '#1a73e8', 'A': '#1a73e8', 'A-': '#1a73e8', 
                        'B+': '#34a853', 'B': '#34a853', 'B-': '#34a853',
                        'C+': '#fbbc04', 'C': '#fbbc04', 'C-': '#fbbc04',
                        'D+': '#ff9800', 'D': '#ff9800', 'D-': '#ff9800',
                        'F': '#ea4335' };
  const color = gradeColors[value] || '#666';
  
  return `
    <div class="elite-grade-card" style="border-color: ${color}">
      <div class="elite-grade-value" style="color: ${color}">${value || 'N/A'}</div>
      <div class="elite-grade-label">${spec.label}</div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════════════════════════
// CHART RENDERING (integrates with Chart.js from UI_Charts_Competitor.html)
// ═══════════════════════════════════════════════════════════════════════════════

function ELITE_renderChart(panel, spec, tabData, comparativeData) {
  const canvasId = `elite-chart-${spec.id}`;
  let canvas = panel.querySelector(`#${canvasId}`);
  
  // Create canvas if it doesn't exist
  if (!canvas) {
    const chartSection = panel.querySelector('.elite-charts-section') || 
                         panel.querySelector('.chart-row') ||
                         panel.querySelector('.comp-charts');
    if (chartSection) {
      const wrapper = document.createElement('div');
      wrapper.className = 'elite-chart-wrapper';
      wrapper.innerHTML = `
        <div class="elite-chart-title">${spec.title}</div>
        <canvas id="${canvasId}" width="400" height="250"></canvas>
      `;
      chartSection.appendChild(wrapper);
      canvas = wrapper.querySelector(`#${canvasId}`);
    } else {
      return;
    }
  }
  
  // Destroy existing chart instance
  if (window.eliteChartInstances[canvasId]) {
    window.eliteChartInstances[canvasId].destroy();
  }
  
  const chartData = ELITE_getDataValue(tabData, spec.data);
  if (!chartData) return;
  
  const ctx = canvas.getContext('2d');
  
  switch (spec.type) {
    case 'radar':
      window.eliteChartInstances[canvasId] = ELITE_createRadarChart(ctx, chartData, spec);
      break;
    case 'horizontalBar':
      window.eliteChartInstances[canvasId] = ELITE_createHorizontalBarChart(ctx, chartData, spec);
      break;
    case 'bar':
      window.eliteChartInstances[canvasId] = ELITE_createBarChart(ctx, chartData, spec);
      break;
    case 'groupedBar':
      window.eliteChartInstances[canvasId] = ELITE_createGroupedBarChart(ctx, chartData, spec);
      break;
    case 'pie':
      window.eliteChartInstances[canvasId] = ELITE_createPieChart(ctx, chartData, spec);
      break;
    case 'doughnut':
      window.eliteChartInstances[canvasId] = ELITE_createDoughnutChart(ctx, chartData, spec);
      break;
    case 'line':
      window.eliteChartInstances[canvasId] = ELITE_createLineChart(ctx, chartData, spec);
      break;
    case 'bubble':
      window.eliteChartInstances[canvasId] = ELITE_createBubbleChart(ctx, chartData, spec);
      break;
  }
}

function ELITE_createRadarChart(ctx, data, spec) {
  const colors = ['#1a73e8', '#34a853', '#fbbc04', '#ea4335', '#8e24aa', '#00bcd4'];
  
  return new Chart(ctx, {
    type: 'radar',
    data: {
      labels: data.labels || Object.keys(data.datasets?.[0]?.data || {}),
      datasets: (data.datasets || [data]).map((ds, i) => ({
        label: ds.label || `Dataset ${i + 1}`,
        data: ds.data || Object.values(ds),
        borderColor: colors[i % colors.length],
        backgroundColor: colors[i % colors.length] + '20',
        borderWidth: 2,
        pointRadius: 3
      }))
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      scales: {
        r: {
          beginAtZero: true,
          max: 100,
          ticks: { stepSize: 25, font: { size: 10 } },
          pointLabels: { font: { size: 11, weight: '600' } }
        }
      },
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 11 }, usePointStyle: true } }
      }
    }
  });
}

function ELITE_createHorizontalBarChart(ctx, data, spec) {
  const sortedData = [...(data.items || data)].sort((a, b) => (b.value || b) - (a.value || a));
  
  return new Chart(ctx, {
    type: 'bar',
    data: {
      labels: sortedData.map(item => item.label || item.domain || 'Unknown'),
      datasets: [{
        data: sortedData.map(item => item.value || item),
        backgroundColor: sortedData.map((item, i) => 
          i === 0 ? '#1a73e8' : (item.isYou ? '#34a853' : '#e3f2fd')
        ),
        borderRadius: 4
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { display: false }
      },
      scales: {
        x: { beginAtZero: true }
      }
    }
  });
}

function ELITE_createBarChart(ctx, data, spec) {
  return new Chart(ctx, {
    type: 'bar',
    data: {
      labels: data.labels || data.map(d => d.label),
      datasets: [{
        data: data.values || data.map(d => d.value),
        backgroundColor: '#1a73e8',
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } }
    }
  });
}

function ELITE_createGroupedBarChart(ctx, data, spec) {
  const colors = ['#1a73e8', '#34a853', '#fbbc04', '#ea4335'];
  
  return new Chart(ctx, {
    type: 'bar',
    data: {
      labels: data.labels,
      datasets: data.groups.map((group, i) => ({
        label: group.label,
        data: group.values,
        backgroundColor: colors[i % colors.length],
        borderRadius: 4
      }))
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom' }
      }
    }
  });
}

function ELITE_createPieChart(ctx, data, spec) {
  const colors = ['#1a73e8', '#34a853', '#fbbc04', '#ea4335', '#8e24aa', '#00bcd4', '#ff9800', '#9c27b0'];
  
  return new Chart(ctx, {
    type: 'pie',
    data: {
      labels: data.labels || data.map(d => d.label),
      datasets: [{
        data: data.values || data.map(d => d.value),
        backgroundColor: colors
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'right', labels: { font: { size: 11 } } }
      }
    }
  });
}

function ELITE_createDoughnutChart(ctx, data, spec) {
  const colors = ['#1a73e8', '#34a853', '#fbbc04', '#ea4335', '#8e24aa'];
  
  return new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: data.labels || data.map(d => d.label),
      datasets: [{
        data: data.values || data.map(d => d.value),
        backgroundColor: colors,
        cutout: '60%'
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'right' }
      }
    }
  });
}

function ELITE_createLineChart(ctx, data, spec) {
  const colors = ['#1a73e8', '#34a853', '#fbbc04', '#ea4335'];
  
  return new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.labels,
      datasets: data.series.map((s, i) => ({
        label: s.label,
        data: s.values,
        borderColor: colors[i % colors.length],
        backgroundColor: colors[i % colors.length] + '20',
        tension: 0.3,
        fill: i === 0
      }))
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom' }
      }
    }
  });
}

function ELITE_createBubbleChart(ctx, data, spec) {
  const colors = ['#1a73e8', '#34a853', '#fbbc04', '#ea4335', '#8e24aa'];
  
  return new Chart(ctx, {
    type: 'bubble',
    data: {
      datasets: data.items.map((item, i) => ({
        label: item.label,
        data: [{ x: item.x, y: item.y, r: Math.max(5, Math.min(30, item.r / 2)) }],
        backgroundColor: colors[i % colors.length] + '80'
      }))
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom' }
      },
      scales: {
        x: { title: { display: true, text: spec.xLabel || 'Authority' } },
        y: { title: { display: true, text: spec.yLabel || 'Traffic' } }
      }
    }
  });
}

// ═══════════════════════════════════════════════════════════════════════════════
// COMPARISON TABLE RENDERING
// ═══════════════════════════════════════════════════════════════════════════════

function ELITE_renderComparisonTable(panel, spec, tabData, comparativeData) {
  const tableId = `elite-table-${spec.id}`;
  let tableContainer = panel.querySelector(`#${tableId}`);
  
  if (!tableContainer) {
    const tableSection = panel.querySelector('.elite-tables-section') || 
                         panel.querySelector('.comp-tables') ||
                         panel;
    tableContainer = document.createElement('div');
    tableContainer.id = tableId;
    tableContainer.className = 'elite-table-wrapper';
    tableSection.appendChild(tableContainer);
  }
  
  const tableData = ELITE_getDataValue(tabData, spec.data);
  if (!tableData || !tableData.length) return;
  
  const rows = tableData.map((row, i) => {
    const isLeader = i === 0;
    const isYou = row.isYou || row.domain === 'Your Site';
    const rowClass = isLeader ? 'elite-row-leader' : (isYou ? 'elite-row-you' : '');
    
    return `
      <tr class="${rowClass}">
        <td><span class="elite-rank">${i + 1}</span></td>
        ${spec.columns.map(col => {
          const value = row[col.toLowerCase()] || row[col] || '-';
          const formattedValue = ELITE_formatTableValue(value, col);
          return `<td>${formattedValue}</td>`;
        }).join('')}
      </tr>
    `;
  }).join('');
  
  tableContainer.innerHTML = `
    <table class="elite-comparison-table">
      <thead>
        <tr>
          <th>#</th>
          ${spec.columns.map(col => `<th>${col}</th>`).join('')}
        </tr>
      </thead>
      <tbody>
        ${rows}
      </tbody>
    </table>
  `;
}

function ELITE_formatTableValue(value, column) {
  if (value === null || value === undefined || value === '-') return '-';
  
  // Format based on column type
  if (typeof value === 'number') {
    if (column.toLowerCase().includes('score') || column.toLowerCase().includes('rate')) {
      return `<span class="elite-score ${ELITE_getScoreClass(value)}">${value}%</span>`;
    }
    if (column.toLowerCase().includes('traffic') || column.toLowerCase().includes('keywords')) {
      return value.toLocaleString();
    }
    return value.toFixed(1);
  }
  
  if (typeof value === 'boolean') {
    return value ? '✅' : '❌';
  }
  
  return value;
}

function ELITE_getScoreClass(value) {
  if (value >= 90) return 'elite-score-excellent';
  if (value >= 70) return 'elite-score-good';
  if (value >= 50) return 'elite-score-average';
  return 'elite-score-poor';
}

// ═══════════════════════════════════════════════════════════════════════════════
// HEATMAP RENDERING
// ═══════════════════════════════════════════════════════════════════════════════

function ELITE_renderHeatmap(panel, spec, tabData, comparativeData) {
  const heatmapId = `elite-heatmap-${spec.id}`;
  let heatmapContainer = panel.querySelector(`#${heatmapId}`);
  
  if (!heatmapContainer) {
    const section = panel.querySelector('.elite-heatmaps-section') || panel;
    heatmapContainer = document.createElement('div');
    heatmapContainer.id = heatmapId;
    heatmapContainer.className = 'elite-heatmap-wrapper';
    section.appendChild(heatmapContainer);
  }
  
  const matrixData = ELITE_getDataValue(tabData, spec.data);
  if (!matrixData) return;
  
  const { rows, columns, values } = matrixData;
  
  const headerCells = columns.map(col => `<th>${col}</th>`).join('');
  const dataRows = rows.map((row, i) => {
    const cells = values[i].map(val => {
      const color = ELITE_getHeatmapColor(val);
      return `<td style="background-color: ${color}; color: ${val > 50 ? '#fff' : '#333'}">${val}</td>`;
    }).join('');
    return `<tr><th>${row}</th>${cells}</tr>`;
  }).join('');
  
  heatmapContainer.innerHTML = `
    <div class="elite-heatmap-title">${spec.title}</div>
    <table class="elite-heatmap-table">
      <thead><tr><th></th>${headerCells}</tr></thead>
      <tbody>${dataRows}</tbody>
    </table>
  `;
}

function ELITE_getHeatmapColor(value) {
  // Green to Red gradient based on value (0-100)
  const normalized = Math.max(0, Math.min(100, value)) / 100;
  const r = Math.round(255 * (1 - normalized));
  const g = Math.round(255 * normalized);
  const b = 0;
  return `rgb(${r}, ${g}, ${b})`;
}

  if (insights.executiveSummary) {

  }
  
  if (insights.opportunities && insights.opportunities.length > 0) {
    html += `
      <div class="elite-insight-section">
        <div class="elite-insight-title">🎯 Top Opportunities</div>
        <div class="elite-opportunities-list">
          ${insights.opportunities.slice(0, 5).map(opp => `
            <div class="elite-opportunity-item">
              <div class="elite-opp-title">${opp.title}</div>
              <div class="elite-opp-impact">Impact: <span class="impact-${opp.impact}">${opp.impact}</span></div>
              <div class="elite-opp-action">${opp.action}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }
  
  if (insights.threats && insights.threats.length > 0) {
    html += `
      <div class="elite-insight-section">
        <div class="elite-insight-title">⚠️ Key Threats</div>
        <div class="elite-threats-list">
          ${insights.threats.slice(0, 3).map(threat => `
            <div class="elite-threat-item">
              <span class="elite-threat-source">${threat.source}</span>
              <span class="elite-threat-desc">${threat.description}</span>
            </div>

    `;
  }
  
  if (insights.recommendations && insights.recommendations.length > 0) {
    html += `
      <div class="elite-insight-section">
        <div class="elite-insight-title">💡 Strategic Recommendations</div>

          ${insights.recommendations.slice(0, 5).map((rec, i) => `

  insightsContainer.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════════════════════
// UTILITY FUNCTIONS
// ═══════════════════════════════════════════════════════════════════════════════

function ELITE_getDataValue(data, path) {
  if (!data || !path) return null;
  
  const parts = path.split('.');
  let value = data;
  
  for (const part of parts) {
    if (value === null || value === undefined) return null;
    value = value[part];
  }
  
  return value;
}

function ELITE_getComparativeInfo(comparativeData, metric) {
  if (!comparativeData || !comparativeData[metric]) return null;
  return comparativeData[metric];
}

function ELITE_getColorForValue(value, thresholds) {
  thresholds = thresholds || [50, 75];
  if (value >= thresholds[1]) return '#34a853'; // Green
  if (value >= thresholds[0]) return '#fbbc04'; // Yellow
  return '#ea4335'; // Red
}
