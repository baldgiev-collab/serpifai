<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SerpifAI - Forensic Analysis</title>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --accent: #238636;
      --accent-hover: #2ea043;
      --text-primary: #c9d1d9;
      --text-secondary: #8b949e;
      --border: #30363d;
      --success: #238636;
      --warning: #d29922;
      --error: #f85149;
      --info: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 20px; }
    h2 { font-size: 18px; margin-bottom: 15px; color: var(--text-primary); }
    
    .input-section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 500;
    }
    .form-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 14px;
    }
    .form-input:focus { outline: none; border-color: var(--accent); }
    
    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { background: var(--text-secondary); cursor: not-allowed; }
    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    
    .results-section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      display: none;
    }
    .results-section.active { display: block; }
    
    .score-card {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px;
      background: var(--bg-tertiary);
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .score-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: white;
    }
    .score-circle.good { background: var(--success); }
    .score-circle.warning { background: var(--warning); }
    .score-circle.poor { background: var(--error); }
    .score-info h3 { font-size: 18px; margin-bottom: 5px; }
    .score-info p { color: var(--text-secondary); font-size: 14px; }
    
    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .analysis-item {
      background: var(--bg-tertiary);
      border-radius: 6px;
      padding: 15px;
    }
    .analysis-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .analysis-item-title { font-weight: 500; }
    .analysis-item-score {
      font-size: 14px;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .analysis-item-score.good { background: rgba(35, 134, 54, 0.2); color: var(--success); }
    .analysis-item-score.warning { background: rgba(210, 153, 34, 0.2); color: var(--warning); }
    .analysis-item-score.poor { background: rgba(248, 81, 73, 0.2); color: var(--error); }
    .analysis-item-value { font-size: 24px; font-weight: bold; }
    .analysis-item-desc { font-size: 12px; color: var(--text-secondary); margin-top: 5px; }
    
    .recommendations {
      margin-top: 20px;
    }
    .recommendation-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: var(--bg-tertiary);
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .recommendation-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }
    .recommendation-icon.high { background: var(--error); }
    .recommendation-icon.medium { background: var(--warning); }
    .recommendation-icon.low { background: var(--info); }
    .recommendation-text { flex: 1; }
    .recommendation-title { font-weight: 500; margin-bottom: 3px; }
    .recommendation-desc { font-size: 13px; color: var(--text-secondary); }
    
    .loading { display: none; text-align: center; padding: 40px; color: var(--text-secondary); }
    .loading.active { display: block; }
    
    .message {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }
    .message.success { display: block; background: rgba(35, 134, 54, 0.2); border: 1px solid var(--success); }
    .message.error { display: block; background: rgba(248, 81, 73, 0.2); border: 1px solid var(--error); }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔬 Forensic Analysis</h1>
    
    <div id="message" class="message"></div>
    
    <div class="input-section">
      <div class="form-group">
        <label class="form-label">URL to Analyze</label>
        <input type="url" class="form-input" id="urlInput" placeholder="https://example.com/page">
      </div>
      <button class="btn btn-primary" onclick="runAnalysis()" id="analyzeBtn">🔍 Analyze</button>
      <button class="btn btn-secondary" onclick="clearResults()">Clear</button>
    </div>
    
    <div class="loading" id="loading">
      <p>🔄 Analyzing page...</p>
      <p>This may take a few moments</p>
    </div>
    
    <div class="results-section" id="results">
      <div class="score-card" id="overallScore">
        <div class="score-circle good" id="scoreCircle">85</div>
        <div class="score-info">
          <h3>Overall SEO Score</h3>
          <p id="scoreDesc">Good - Minor optimizations recommended</p>
        </div>
      </div>
      
      <h2>Analysis Breakdown</h2>
      <div class="analysis-grid" id="analysisGrid"></div>
      
      <div class="recommendations">
        <h2>Recommendations</h2>
        <div id="recommendationsList"></div>
      </div>
    </div>
  </div>

  <script>
    function runAnalysis() {
      const url = document.getElementById('urlInput').value.trim();
      
      if (!url) {
        showMessage('Please enter a URL', 'error');
        return;
      }
      
      document.getElementById('loading').classList.add('active');
      document.getElementById('results').classList.remove('active');
      document.getElementById('analyzeBtn').disabled = true;
      
      google.script.run
        .withSuccessHandler(function(result) {
          document.getElementById('loading').classList.remove('active');
          document.getElementById('analyzeBtn').disabled = false;
          
          if (result.ok) {
            displayResults(result);
          } else {
            showMessage(result.error || 'Analysis failed', 'error');
          }
        })
        .withFailureHandler(function(error) {
          document.getElementById('loading').classList.remove('active');
          document.getElementById('analyzeBtn').disabled = false;
          showMessage('Error: ' + error.message, 'error');
        })
        .FT_FORENSIC_analyze({ url: url });
    }
    
    function displayResults(result) {
      document.getElementById('results').classList.add('active');
      
      const score = result.overallScore || 50;
      const scoreCircle = document.getElementById('scoreCircle');
      scoreCircle.textContent = score;
      scoreCircle.className = 'score-circle ' + getScoreClass(score);
      
      document.getElementById('scoreDesc').textContent = getScoreDescription(score);
      
      // Display analysis breakdown
      const grid = document.getElementById('analysisGrid');
      const categories = result.categories || {};
      
      grid.innerHTML = Object.entries(categories).map(([key, data]) => {
        const itemScore = data.score || 0;
        return `
          <div class="analysis-item">
            <div class="analysis-item-header">
              <span class="analysis-item-title">${formatKey(key)}</span>
              <span class="analysis-item-score ${getScoreClass(itemScore)}">${itemScore}%</span>
            </div>
            <div class="analysis-item-value">${data.value || '-'}</div>
            <div class="analysis-item-desc">${data.description || ''}</div>
          </div>
        `;
      }).join('');
      
      // Display recommendations
      const recList = document.getElementById('recommendationsList');
      const recommendations = result.recommendations || [];
      
      recList.innerHTML = recommendations.map(rec => `
        <div class="recommendation-item">
          <div class="recommendation-icon ${rec.priority || 'medium'}">!</div>
          <div class="recommendation-text">
            <div class="recommendation-title">${rec.title || rec.category}</div>
            <div class="recommendation-desc">${rec.description || rec.action}</div>
          </div>
        </div>
      `).join('');
    }
    
    function getScoreClass(score) {
      if (score >= 80) return 'good';
      if (score >= 50) return 'warning';
      return 'poor';
    }
    
    function getScoreDescription(score) {
      if (score >= 90) return 'Excellent - Page is well optimized';
      if (score >= 80) return 'Good - Minor optimizations recommended';
      if (score >= 60) return 'Fair - Several improvements needed';
      if (score >= 40) return 'Poor - Significant work required';
      return 'Critical - Major issues detected';
    }
    
    function formatKey(key) {
      return key.replace(/([A-Z])/g, ' $1')
                .replace(/^./, str => str.toUpperCase())
                .trim();
    }
    
    function clearResults() {
      document.getElementById('urlInput').value = '';
      document.getElementById('results').classList.remove('active');
      document.getElementById('message').className = 'message';
    }
    
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
    }
  </script>
</body>
</html>
