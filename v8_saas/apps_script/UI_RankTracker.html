<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SerpifAI - Rank Tracker</title>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --accent: #238636;
      --accent-hover: #2ea043;
      --text-primary: #c9d1d9;
      --text-secondary: #8b949e;
      --border: #30363d;
      --success: #238636;
      --warning: #d29922;
      --error: #f85149;
      --info: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      padding: 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 20px; }
    h2 { font-size: 18px; margin-bottom: 15px; }
    
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    
    .section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }
    .stat-value { font-size: 32px; font-weight: bold; }
    .stat-value.green { color: var(--success); }
    .stat-value.yellow { color: var(--warning); }
    .stat-value.red { color: var(--error); }
    .stat-value.blue { color: var(--info); }
    .stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 5px; }
    .stat-change { font-size: 12px; margin-top: 5px; }
    .stat-change.up { color: var(--success); }
    .stat-change.down { color: var(--error); }
    
    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
    
    .rank-table {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .table-header {
      display: grid;
      grid-template-columns: 2fr 80px 80px 80px 80px 100px;
      gap: 10px;
      padding: 12px 15px;
      background: var(--bg-tertiary);
      font-weight: 600;
      font-size: 13px;
    }
    .table-row {
      display: grid;
      grid-template-columns: 2fr 80px 80px 80px 80px 100px;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid var(--border);
      align-items: center;
    }
    .table-row:hover { background: rgba(255,255,255,0.02); }
    
    .keyword-cell { font-weight: 500; }
    .keyword-volume { font-size: 12px; color: var(--text-secondary); }
    
    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-weight: bold;
    }
    .rank-badge.top3 { background: rgba(35, 134, 54, 0.2); color: var(--success); }
    .rank-badge.top10 { background: rgba(88, 166, 255, 0.2); color: var(--info); }
    .rank-badge.top20 { background: rgba(210, 153, 34, 0.2); color: var(--warning); }
    .rank-badge.beyond { background: rgba(139, 148, 158, 0.2); color: var(--text-secondary); }
    
    .change-indicator { text-align: center; font-weight: 500; }
    .change-indicator.up { color: var(--success); }
    .change-indicator.down { color: var(--error); }
    .change-indicator.same { color: var(--text-secondary); }
    
    .trend-chart {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 30px;
    }
    .trend-bar {
      width: 8px;
      background: var(--accent);
      border-radius: 2px;
    }
    
    .add-keyword-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .form-input {
      flex: 1;
      padding: 10px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 14px;
    }
    .form-input:focus { outline: none; border-color: var(--accent); }
    
    .loading { text-align: center; padding: 40px; display: none; }
    .loading.active { display: block; }
    
    .message {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }
    .message.success { display: block; background: rgba(35, 134, 54, 0.2); border: 1px solid var(--success); }
    .message.error { display: block; background: rgba(248, 81, 73, 0.2); border: 1px solid var(--error); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-row">
      <h1>📈 Rank Tracker</h1>
      <button class="btn btn-primary" onclick="refreshRanks()">🔄 Refresh Ranks</button>
    </div>
    <div id="message" class="message"></div>
    
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value green" id="statTop3">0</div>
        <div class="stat-label">Top 3</div>
        <div class="stat-change up" id="changeTop3">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-value blue" id="statTop10">0</div>
        <div class="stat-label">Top 10</div>
        <div class="stat-change up" id="changeTop10">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-value yellow" id="statAvgRank">0</div>
        <div class="stat-label">Avg. Position</div>
        <div class="stat-change" id="changeAvg">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">Tracked Keywords</div>
      </div>
    </div>
    
    <div class="section">
      <div class="add-keyword-form">
        <input type="text" class="form-input" id="newKeyword" placeholder="Add keyword to track...">
        <button class="btn btn-primary" onclick="addKeyword()">+ Add</button>
      </div>
    </div>
    
    <div class="loading" id="loading"><p>🔄 Checking rankings...</p></div>
    
    <div class="rank-table">
      <div class="table-header">
        <div>Keyword</div>
        <div>Position</div>
        <div>Change</div>
        <div>Best</div>
        <div>URL</div>
        <div>Trend</div>
      </div>
      <div id="rankList"></div>
    </div>
  </div>

  <script>
    let rankData = [];
    
    document.addEventListener('DOMContentLoaded', loadRankData);
    
    function loadRankData() {
      google.script.run
        .withSuccessHandler(displayRanks)
        .withFailureHandler(e => showMessage(e.message, 'error'))
        .FT_getRankingData();
    }
    
    function displayRanks(result) {
      if (!result.ok) { showMessage(result.error, 'error'); return; }
      
      rankData = result.rankings || [];
      
      // Stats
      const top3 = rankData.filter(r => r.position <= 3).length;
      const top10 = rankData.filter(r => r.position <= 10).length;
      const avgRank = rankData.length ? Math.round(rankData.reduce((s, r) => s + r.position, 0) / rankData.length) : 0;
      
      document.getElementById('statTop3').textContent = top3;
      document.getElementById('statTop10').textContent = top10;
      document.getElementById('statAvgRank').textContent = avgRank;
      document.getElementById('statTotal').textContent = rankData.length;
      
      // Table
      document.getElementById('rankList').innerHTML = rankData.map(r => {
        const posClass = r.position <= 3 ? 'top3' : r.position <= 10 ? 'top10' : r.position <= 20 ? 'top20' : 'beyond';
        const change = r.change || 0;
        const changeClass = change > 0 ? 'up' : change < 0 ? 'down' : 'same';
        const changeIcon = change > 0 ? '↑' : change < 0 ? '↓' : '−';
        
        return `
          <div class="table-row">
            <div class="keyword-cell">
              ${r.keyword}
              <div class="keyword-volume">Vol: ${formatNumber(r.volume || 0)}</div>
            </div>
            <div><span class="rank-badge ${posClass}">${r.position}</span></div>
            <div class="change-indicator ${changeClass}">${changeIcon} ${Math.abs(change)}</div>
            <div>${r.bestRank || r.position}</div>
            <div style="font-size:12px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;">${r.url || '-'}</div>
            <div class="trend-chart">${generateTrendBars(r.history || [])}</div>
          </div>
        `;
      }).join('');
    }
    
    function generateTrendBars(history) {
      const recent = history.slice(-7);
      if (recent.length === 0) return '-';
      
      const max = Math.max(...recent);
      return recent.map(pos => {
        const height = Math.max(5, (1 - pos / 100) * 30);
        return `<div class="trend-bar" style="height:${height}px"></div>`;
      }).join('');
    }
    
    function refreshRanks() {
      document.getElementById('loading').classList.add('active');
      
      google.script.run
        .withSuccessHandler(result => {
          document.getElementById('loading').classList.remove('active');
          if (result.ok) {
            showMessage('Rankings updated!', 'success');
            displayRanks(result);
          } else {
            showMessage(result.error, 'error');
          }
        })
        .withFailureHandler(e => {
          document.getElementById('loading').classList.remove('active');
          showMessage(e.message, 'error');
        })
        .FT_refreshRankings();
    }
    
    function addKeyword() {
      const keyword = document.getElementById('newKeyword').value.trim();
      if (!keyword) return;
      
      google.script.run
        .withSuccessHandler(result => {
          if (result.ok) {
            document.getElementById('newKeyword').value = '';
            showMessage('Keyword added!', 'success');
            loadRankData();
          } else {
            showMessage(result.error, 'error');
          }
        })
        .withFailureHandler(e => showMessage(e.message, 'error'))
        .FT_addTrackedKeyword({ keyword: keyword });
    }
    
    function formatNumber(n) {
      if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
      return n.toString();
    }
    
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
      setTimeout(() => msg.className = 'message', 3000);
    }
  </script>
</body>
</html>
