<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SerpifAI - Site Audit</title>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --accent: #238636;
      --accent-hover: #2ea043;
      --text-primary: #c9d1d9;
      --text-secondary: #8b949e;
      --border: #30363d;
      --success: #238636;
      --warning: #d29922;
      --error: #f85149;
      --info: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      padding: 20px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 20px; }
    h2 { font-size: 18px; margin-bottom: 15px; }
    h3 { font-size: 16px; margin-bottom: 10px; }
    
    .section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .form-row { display: flex; gap: 10px; }
    .form-input {
      flex: 1;
      padding: 12px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 14px;
    }
    .form-input:focus { outline: none; border-color: var(--accent); }
    
    .btn {
      padding: 12px 24px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { background: var(--text-secondary); cursor: not-allowed; }
    
    .audit-options {
      display: flex;
      gap: 20px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .audit-option { display: flex; align-items: center; gap: 8px; }
    .audit-option input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }
    
    .results { display: none; }
    .results.active { display: block; }
    
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }
    .summary-card {
      background: var(--bg-tertiary);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }
    .summary-value { font-size: 28px; font-weight: bold; margin-bottom: 5px; }
    .summary-value.good { color: var(--success); }
    .summary-value.warning { color: var(--warning); }
    .summary-value.error { color: var(--error); }
    .summary-label { font-size: 13px; color: var(--text-secondary); }
    
    .issues-section { margin-bottom: 20px; }
    .issues-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .issue-count { font-size: 13px; color: var(--text-secondary); }
    
    .issue-list { list-style: none; }
    .issue-item {
      background: var(--bg-tertiary);
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 10px;
    }
    .issue-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .issue-severity {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .issue-severity.critical { background: var(--error); color: white; }
    .issue-severity.warning { background: var(--warning); color: black; }
    .issue-severity.info { background: var(--info); color: white; }
    .issue-title { font-weight: 500; }
    .issue-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
    .issue-pages { font-size: 12px; color: var(--text-secondary); }
    .issue-pages a { color: var(--info); text-decoration: none; }
    
    .page-speed {
      display: flex;
      gap: 30px;
      margin-bottom: 20px;
    }
    .speed-metric {
      flex: 1;
      text-align: center;
    }
    .speed-gauge {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
    }
    .speed-gauge.good { border: 6px solid var(--success); color: var(--success); }
    .speed-gauge.warning { border: 6px solid var(--warning); color: var(--warning); }
    .speed-gauge.poor { border: 6px solid var(--error); color: var(--error); }
    .speed-label { font-size: 14px; color: var(--text-secondary); }
    
    .loading { text-align: center; padding: 40px; display: none; }
    .loading.active { display: block; }
    
    .message {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }
    .message.error { display: block; background: rgba(248, 81, 73, 0.2); border: 1px solid var(--error); }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 Site Audit</h1>
    <div id="message" class="message"></div>
    
    <div class="section">
      <div class="form-row">
        <input type="url" class="form-input" id="siteUrl" placeholder="https://example.com">
        <button class="btn btn-primary" onclick="runAudit()" id="auditBtn">🔍 Run Audit</button>
      </div>
      <div class="audit-options">
        <label class="audit-option"><input type="checkbox" id="optPerformance" checked> Performance</label>
        <label class="audit-option"><input type="checkbox" id="optSeo" checked> SEO</label>
        <label class="audit-option"><input type="checkbox" id="optSecurity" checked> Security</label>
        <label class="audit-option"><input type="checkbox" id="optAccessibility" checked> Accessibility</label>
      </div>
    </div>
    
    <div class="loading" id="loading"><p>🔄 Running audit...</p><p>This may take a minute</p></div>
    
    <div class="results" id="results">
      <div class="summary-grid">
        <div class="summary-card">
          <div class="summary-value good" id="scorePerf">92</div>
          <div class="summary-label">Performance</div>
        </div>
        <div class="summary-card">
          <div class="summary-value good" id="scoreSeo">88</div>
          <div class="summary-label">SEO</div>
        </div>
        <div class="summary-card">
          <div class="summary-value warning" id="scoreSec">75</div>
          <div class="summary-label">Security</div>
        </div>
        <div class="summary-card">
          <div class="summary-value good" id="scoreAcc">95</div>
          <div class="summary-label">Accessibility</div>
        </div>
      </div>
      
      <div class="section">
        <h3>Page Speed</h3>
        <div class="page-speed">
          <div class="speed-metric">
            <div class="speed-gauge good" id="gaugeLcp">1.2s</div>
            <div class="speed-label">LCP</div>
          </div>
          <div class="speed-metric">
            <div class="speed-gauge good" id="gaugeFid">45ms</div>
            <div class="speed-label">FID</div>
          </div>
          <div class="speed-metric">
            <div class="speed-gauge warning" id="gaugeCls">0.15</div>
            <div class="speed-label">CLS</div>
          </div>
          <div class="speed-metric">
            <div class="speed-gauge good" id="gaugeTtfb">0.3s</div>
            <div class="speed-label">TTFB</div>
          </div>
        </div>
      </div>
      
      <div class="issues-section">
        <div class="issues-header">
          <h2>Issues Found</h2>
          <span class="issue-count" id="issueCount">0 issues</span>
        </div>
        <ul class="issue-list" id="issueList"></ul>
      </div>
    </div>
  </div>

  <script>
    function runAudit() {
      const url = document.getElementById('siteUrl').value.trim();
      if (!url) { showMessage('Enter a URL', 'error'); return; }
      
      document.getElementById('loading').classList.add('active');
      document.getElementById('results').classList.remove('active');
      document.getElementById('auditBtn').disabled = true;
      
      const options = {
        performance: document.getElementById('optPerformance').checked,
        seo: document.getElementById('optSeo').checked,
        security: document.getElementById('optSecurity').checked,
        accessibility: document.getElementById('optAccessibility').checked
      };
      
      google.script.run
        .withSuccessHandler(displayResults)
        .withFailureHandler(e => { document.getElementById('loading').classList.remove('active'); document.getElementById('auditBtn').disabled = false; showMessage(e.message, 'error'); })
        .FT_PAGESPEED_audit({ url: url, options: options });
    }
    
    function displayResults(result) {
      document.getElementById('loading').classList.remove('active');
      document.getElementById('auditBtn').disabled = false;
      
      if (!result.ok) { showMessage(result.error, 'error'); return; }
      
      document.getElementById('results').classList.add('active');
      
      // Scores
      setScore('scorePerf', result.performance || 0);
      setScore('scoreSeo', result.seo || 0);
      setScore('scoreSec', result.security || 0);
      setScore('scoreAcc', result.accessibility || 0);
      
      // Core Web Vitals
      if (result.metrics) {
        setGauge('gaugeLcp', result.metrics.lcp, 's', 2.5, 4);
        setGauge('gaugeFid', result.metrics.fid, 'ms', 100, 300);
        setGauge('gaugeCls', result.metrics.cls, '', 0.1, 0.25);
        setGauge('gaugeTtfb', result.metrics.ttfb, 's', 0.8, 1.8);
      }
      
      // Issues
      const issues = result.issues || [];
      document.getElementById('issueCount').textContent = issues.length + ' issues';
      document.getElementById('issueList').innerHTML = issues.map(issue => `
        <li class="issue-item">
          <div class="issue-header">
            <span class="issue-severity ${issue.severity}">${issue.severity}</span>
            <span class="issue-title">${issue.title}</span>
          </div>
          <div class="issue-desc">${issue.description}</div>
          ${issue.pages ? '<div class="issue-pages">Affected: ' + issue.pages.join(', ') + '</div>' : ''}
        </li>
      `).join('');
    }
    
    function setScore(id, score) {
      const el = document.getElementById(id);
      el.textContent = score;
      el.className = 'summary-value ' + (score >= 90 ? 'good' : score >= 50 ? 'warning' : 'error');
    }
    
    function setGauge(id, value, unit, goodThreshold, poorThreshold) {
      const el = document.getElementById(id);
      el.textContent = value + unit;
      const numVal = parseFloat(value);
      el.className = 'speed-gauge ' + (numVal <= goodThreshold ? 'good' : numVal <= poorThreshold ? 'warning' : 'poor');
    }
    
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
    }
  </script>
</body>
</html>
