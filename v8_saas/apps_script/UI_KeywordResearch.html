<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SerpifAI - Keyword Research</title>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --accent: #238636;
      --accent-hover: #2ea043;
      --text-primary: #c9d1d9;
      --text-secondary: #8b949e;
      --border: #30363d;
      --success: #238636;
      --warning: #d29922;
      --error: #f85149;
      --info: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      padding: 20px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 20px; }
    h2 { font-size: 18px; margin-bottom: 15px; }
    
    .search-section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .search-row { display: flex; gap: 10px; }
    .search-input {
      flex: 1;
      padding: 12px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 16px;
    }
    .search-input:focus { outline: none; border-color: var(--accent); }
    
    .btn {
      padding: 12px 24px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { background: var(--text-secondary); cursor: not-allowed; }
    
    .filters {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .filter-group { display: flex; align-items: center; gap: 8px; }
    .filter-label { font-size: 13px; color: var(--text-secondary); }
    .filter-select {
      padding: 6px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 13px;
    }
    
    .results-section { display: none; }
    .results-section.active { display: block; }
    
    .stats-bar {
      display: flex;
      gap: 20px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px 20px;
      margin-bottom: 20px;
    }
    .stat-item { text-align: center; }
    .stat-value { font-size: 24px; font-weight: bold; color: var(--accent); }
    .stat-label { font-size: 12px; color: var(--text-secondary); }
    
    .keywords-table {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .table-header {
      display: grid;
      grid-template-columns: 1fr 100px 100px 100px 100px 80px;
      gap: 10px;
      padding: 12px 15px;
      background: var(--bg-tertiary);
      font-weight: 600;
      font-size: 13px;
    }
    .table-row {
      display: grid;
      grid-template-columns: 1fr 100px 100px 100px 100px 80px;
      gap: 10px;
      padding: 12px 15px;
      border-top: 1px solid var(--border);
      align-items: center;
      font-size: 14px;
    }
    .table-row:hover { background: rgba(255,255,255,0.02); }
    
    .keyword-text { font-weight: 500; }
    .keyword-volume { color: var(--info); }
    .keyword-difficulty { text-align: center; }
    .difficulty-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 12px;
    }
    .difficulty-easy { background: rgba(35, 134, 54, 0.2); color: var(--success); }
    .difficulty-medium { background: rgba(210, 153, 34, 0.2); color: var(--warning); }
    .difficulty-hard { background: rgba(248, 81, 73, 0.2); color: var(--error); }
    
    .keyword-trend { text-align: center; }
    .trend-up { color: var(--success); }
    .trend-down { color: var(--error); }
    .trend-stable { color: var(--text-secondary); }
    
    .keyword-cpc { text-align: right; }
    
    .add-btn {
      padding: 4px 8px;
      font-size: 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      cursor: pointer;
    }
    .add-btn:hover { border-color: var(--accent); }
    .add-btn.added { background: var(--accent); border-color: var(--accent); }
    
    .loading { text-align: center; padding: 40px; color: var(--text-secondary); display: none; }
    .loading.active { display: block; }
    
    .message {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }
    .message.success { display: block; background: rgba(35, 134, 54, 0.2); border: 1px solid var(--success); }
    .message.error { display: block; background: rgba(248, 81, 73, 0.2); border: 1px solid var(--error); }
    
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Keyword Research</h1>
    <div id="message" class="message"></div>
    
    <div class="search-section">
      <div class="search-row">
        <input type="text" class="search-input" id="seedKeyword" placeholder="Enter seed keyword..." onkeypress="if(event.key==='Enter')searchKeywords()">
        <button class="btn btn-primary" onclick="searchKeywords()" id="searchBtn">🔍 Research</button>
      </div>
      <div class="filters">
        <div class="filter-group">
          <span class="filter-label">Country:</span>
          <select class="filter-select" id="filterCountry">
            <option value="us">United States</option>
            <option value="uk">United Kingdom</option>
            <option value="au">Australia</option>
            <option value="ca">Canada</option>
          </select>
        </div>
        <div class="filter-group">
          <span class="filter-label">Min Volume:</span>
          <select class="filter-select" id="filterVolume">
            <option value="0">Any</option>
            <option value="100">100+</option>
            <option value="500">500+</option>
            <option value="1000">1,000+</option>
            <option value="5000">5,000+</option>
          </select>
        </div>
        <div class="filter-group">
          <span class="filter-label">Max Difficulty:</span>
          <select class="filter-select" id="filterDifficulty">
            <option value="100">Any</option>
            <option value="30">Easy (0-30)</option>
            <option value="60">Medium (0-60)</option>
            <option value="80">Hard (0-80)</option>
          </select>
        </div>
      </div>
    </div>
    
    <div class="loading" id="loading"><p>🔄 Researching keywords...</p></div>
    
    <div class="results-section" id="results">
      <div class="stats-bar">
        <div class="stat-item"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Keywords Found</div></div>
        <div class="stat-item"><div class="stat-value" id="statAvgVol">0</div><div class="stat-label">Avg. Volume</div></div>
        <div class="stat-item"><div class="stat-value" id="statEasy">0</div><div class="stat-label">Easy Keywords</div></div>
        <div class="stat-item"><div class="stat-value" id="statSelected">0</div><div class="stat-label">Selected</div></div>
      </div>
      
      <div class="keywords-table">
        <div class="table-header">
          <div>Keyword</div>
          <div>Volume</div>
          <div>Difficulty</div>
          <div>Trend</div>
          <div>CPC</div>
          <div>Add</div>
        </div>
        <div id="keywordsList"></div>
      </div>
    </div>
    
    <div class="empty-state" id="emptyState">
      <p>Enter a seed keyword to discover related keywords</p>
    </div>
  </div>

  <script>
    let selectedKeywords = [];
    
    function searchKeywords() {
      const seed = document.getElementById('seedKeyword').value.trim();
      if (!seed) { showMessage('Enter a seed keyword', 'error'); return; }
      
      document.getElementById('loading').classList.add('active');
      document.getElementById('results').classList.remove('active');
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('searchBtn').disabled = true;
      
      const filters = {
        country: document.getElementById('filterCountry').value,
        minVolume: parseInt(document.getElementById('filterVolume').value),
        maxDifficulty: parseInt(document.getElementById('filterDifficulty').value)
      };
      
      google.script.run
        .withSuccessHandler(onSearchSuccess)
        .withFailureHandler(onSearchError)
        .FT_SERPER_keywordResearch({ seed: seed, filters: filters });
    }
    
    function onSearchSuccess(result) {
      document.getElementById('loading').classList.remove('active');
      document.getElementById('searchBtn').disabled = false;
      
      if (!result.ok) { showMessage(result.error || 'Search failed', 'error'); return; }
      
      const keywords = result.keywords || [];
      displayResults(keywords);
    }
    
    function onSearchError(error) {
      document.getElementById('loading').classList.remove('active');
      document.getElementById('searchBtn').disabled = false;
      showMessage('Error: ' + error.message, 'error');
    }
    
    function displayResults(keywords) {
      document.getElementById('results').classList.add('active');
      
      // Stats
      const avgVol = keywords.length ? Math.round(keywords.reduce((s, k) => s + (k.volume || 0), 0) / keywords.length) : 0;
      const easy = keywords.filter(k => (k.difficulty || 50) <= 30).length;
      
      document.getElementById('statTotal').textContent = keywords.length;
      document.getElementById('statAvgVol').textContent = formatNumber(avgVol);
      document.getElementById('statEasy').textContent = easy;
      
      // Table
      const list = document.getElementById('keywordsList');
      list.innerHTML = keywords.map((kw, i) => {
        const diff = kw.difficulty || 50;
        const diffClass = diff <= 30 ? 'easy' : diff <= 60 ? 'medium' : 'hard';
        const trend = kw.trend || 'stable';
        const trendIcon = trend === 'up' ? '↑' : trend === 'down' ? '↓' : '→';
        
        return `
          <div class="table-row">
            <div class="keyword-text">${kw.keyword}</div>
            <div class="keyword-volume">${formatNumber(kw.volume || 0)}</div>
            <div class="keyword-difficulty">
              <span class="difficulty-badge difficulty-${diffClass}">${diff}</span>
            </div>
            <div class="keyword-trend trend-${trend}">${trendIcon}</div>
            <div class="keyword-cpc">$${(kw.cpc || 0).toFixed(2)}</div>
            <div><button class="add-btn" onclick="toggleKeyword(${i}, this)">+ Add</button></div>
          </div>
        `;
      }).join('');
      
      window.keywordsData = keywords;
    }
    
    function toggleKeyword(index, btn) {
      const kw = window.keywordsData[index];
      const idx = selectedKeywords.findIndex(k => k.keyword === kw.keyword);
      
      if (idx >= 0) {
        selectedKeywords.splice(idx, 1);
        btn.classList.remove('added');
        btn.textContent = '+ Add';
      } else {
        selectedKeywords.push(kw);
        btn.classList.add('added');
        btn.textContent = '✓';
      }
      
      document.getElementById('statSelected').textContent = selectedKeywords.length;
    }
    
    function formatNumber(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
      return n.toString();
    }
    
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
      setTimeout(() => msg.className = 'message', 3000);
    }
  </script>
</body>
</html>
