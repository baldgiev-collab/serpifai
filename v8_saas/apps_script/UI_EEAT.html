<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --primary: #4285f4;
      --success: #34a853;
      --warning: #fbbc04;
      --danger: #ea4335;
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --border: #e0e0e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Google Sans', Arial, sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
    .header { margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 500; }
    .subtitle { color: var(--muted); font-size: 14px; margin-top: 4px; }
    
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
    input:focus { outline: none; border-color: var(--primary); }
    button { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background: #1a73e8; }
    button.secondary { background: white; color: var(--text); border: 1px solid var(--border); }
    
    .card { background: var(--card); border-radius: 10px; padding: 20px; border: 1px solid var(--border); margin-bottom: 16px; }
    .card h3 { font-size: 16px; font-weight: 500; margin-bottom: 16px; }
    
    .eeat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
    .eeat-box { background: var(--card); border-radius: 10px; padding: 16px; border: 1px solid var(--border); text-align: center; }
    .eeat-box .letter { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .eeat-box .label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .eeat-box .score { font-size: 24px; font-weight: 500; }
    .eeat-box.good { border-color: var(--success); }
    .eeat-box.good .letter, .eeat-box.good .score { color: var(--success); }
    .eeat-box.medium { border-color: var(--warning); }
    .eeat-box.medium .letter, .eeat-box.medium .score { color: var(--warning); }
    .eeat-box.poor { border-color: var(--danger); }
    .eeat-box.poor .letter, .eeat-box.poor .score { color: var(--danger); }
    
    .signal-list { list-style: none; }
    .signal-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .signal-item:last-child { border-bottom: none; }
    .signal-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .signal-icon.check { background: #e6f4ea; color: var(--success); }
    .signal-icon.missing { background: #fce8e6; color: var(--danger); }
    .signal-text { flex: 1; font-size: 14px; }
    
    .rec-item { padding: 12px; border-bottom: 1px solid var(--border); }
    .rec-item:last-child { border-bottom: none; }
    .rec-component { font-size: 12px; font-weight: 500; margin-bottom: 4px; }
    .rec-component.Experience { color: #7c3aed; }
    .rec-component.Expertise { color: #2563eb; }
    .rec-component.Authority { color: #0891b2; }
    .rec-component.Trust { color: #059669; }
    .rec-text { font-size: 14px; color: var(--text); }
    .priority-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
    .priority-high { background: #fce8e6; color: var(--danger); }
    .priority-medium { background: #fef7e0; color: #b45309; }
    
    .loading { text-align: center; padding: 60px 20px; color: var(--muted); }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .empty { text-align: center; padding: 40px; color: var(--muted); }
    .error { background: #fce8e6; border: 1px solid #f5c6cb; border-radius: 8px; padding: 16px; color: #c5221f; }
    
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
    .tab { padding: 10px 20px; background: none; border: none; cursor: pointer; color: var(--muted); font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  </style>
</head>
<body>
  <div class="header">
    <h1>E-E-A-T Analyzer</h1>
    <p class="subtitle">Experience, Expertise, Authoritativeness, Trust signals</p>
  </div>
  
  <div class="input-group">
    <input type="text" id="urlInput" placeholder="Enter URL to analyze...">
    <button onclick="analyzeUrl()">Analyze E-E-A-T</button>
  </div>
  
  <div id="loading" class="loading" style="display: none;">
    <div class="spinner"></div>
    <p>Analyzing E-E-A-T signals...</p>
  </div>
  
  <div id="results" style="display: none;">
    <div class="eeat-grid">
      <div id="expBox" class="eeat-box">
        <div class="letter">E</div>
        <div class="label">Experience</div>
        <div id="expScore" class="score">--</div>
      </div>
      <div id="exptBox" class="eeat-box">
        <div class="letter">E</div>
        <div class="label">Expertise</div>
        <div id="exptScore" class="score">--</div>
      </div>
      <div id="authBox" class="eeat-box">
        <div class="letter">A</div>
        <div class="label">Authority</div>
        <div id="authScore" class="score">--</div>
      </div>
      <div id="trustBox" class="eeat-box">
        <div class="letter">T</div>
        <div class="label">Trust</div>
        <div id="trustScore" class="score">--</div>
      </div>
    </div>
    
    <div class="tabs">
      <button class="tab active" onclick="showTab('signals')">Signals Found</button>
      <button class="tab" onclick="showTab('recs')">Recommendations</button>
    </div>
    
    <div id="signalsTab" class="card">
      <h3>Signals Detected</h3>
      <div id="signalsList"></div>
    </div>
    
    <div id="recsTab" class="card" style="display: none;">
      <h3>Improvement Recommendations</h3>
      <div id="recsList"></div>
    </div>
  </div>
  
  <div id="empty" class="empty">
    <p>Enter a URL to analyze E-E-A-T signals</p>
  </div>
  
  <div id="error" class="error" style="display: none;"></div>
  
  <script>
    function analyzeUrl() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) { showError('Please enter a URL'); return; }
      
      document.getElementById('empty').style.display = 'none';
      document.getElementById('results').style.display = 'none';
      document.getElementById('error').style.display = 'none';
      document.getElementById('loading').style.display = 'block';
      
      google.script.run
        .withSuccessHandler(handleResult)
        .withFailureHandler(handleError)
        .FT_analyzeEEAT({ url: url });
    }
    
    function handleResult(data) {
      document.getElementById('loading').style.display = 'none';
      
      if (!data || !data.ok) {
        showError(data?.error || 'Analysis failed');
        return;
      }
      
      document.getElementById('results').style.display = 'block';
      
      // Update score boxes
      updateScoreBox('exp', data.experience.score);
      updateScoreBox('expt', data.expertise.score);
      updateScoreBox('auth', data.authority.score);
      updateScoreBox('trust', data.trust.score);
      
      // Build signals list
      const allSignals = [];
      addSignals(allSignals, data.experience, 'Experience');
      addSignals(allSignals, data.expertise, 'Expertise');
      addSignals(allSignals, data.authority, 'Authority');
      addSignals(allSignals, data.trust, 'Trust');
      
      renderSignals(allSignals);
      renderRecommendations(data.recommendations || []);
    }
    
    function updateScoreBox(prefix, score) {
      const box = document.getElementById(prefix + 'Box');
      const scoreEl = document.getElementById(prefix + 'Score');
      
      scoreEl.textContent = score;
      box.className = 'eeat-box ' + getScoreClass(score);
    }
    
    function getScoreClass(score) {
      if (score >= 70) return 'good';
      if (score >= 40) return 'medium';
      return 'poor';
    }
    
    function addSignals(arr, component, name) {
      (component.signals || []).forEach(function(s) {
        arr.push({ text: s, component: name, found: true });
      });
    }
    
    function renderSignals(signals) {
      const container = document.getElementById('signalsList');
      
      if (signals.length === 0) {
        container.innerHTML = '<div class="empty">No signals detected</div>';
        return;
      }
      
      container.innerHTML = '<ul class="signal-list">' + 
        signals.map(function(s) {
          return '<li class="signal-item">' +
            '<span class="signal-icon check">✓</span>' +
            '<span class="signal-text">' + s.text + '</span>' +
            '<span class="rec-component ' + s.component + '">' + s.component + '</span>' +
            '</li>';
        }).join('') + 
        '</ul>';
    }
    
    function renderRecommendations(recs) {
      const container = document.getElementById('recsList');
      
      if (recs.length === 0) {
        container.innerHTML = '<div class="empty">No recommendations - great job!</div>';
        return;
      }
      
      container.innerHTML = recs.map(function(r) {
        return '<div class="rec-item">' +
          '<div class="rec-component ' + r.component + '">' + r.component + 
          '<span class="priority-badge priority-' + r.priority + '">' + r.priority + '</span></div>' +
          '<div class="rec-text">' + r.recommendation + '</div>' +
          '</div>';
      }).join('');
    }
    
    function showTab(tab) {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      event.target.classList.add('active');
      
      document.getElementById('signalsTab').style.display = tab === 'signals' ? 'block' : 'none';
      document.getElementById('recsTab').style.display = tab === 'recs' ? 'block' : 'none';
    }
    
    function handleError(err) {
      document.getElementById('loading').style.display = 'none';
      showError(err.message || 'An error occurred');
    }
    
    function showError(msg) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = msg;
    }
  </script>
</body>
</html>
