<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SerpifAI - Schema Generator</title>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --accent: #238636;
      --accent-hover: #2ea043;
      --text-primary: #c9d1d9;
      --text-secondary: #8b949e;
      --border: #30363d;
      --success: #238636;
      --warning: #d29922;
      --error: #f85149;
      --info: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      padding: 20px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 20px; }
    h2 { font-size: 18px; margin-bottom: 15px; }
    
    .section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
    
    .form-group { margin-bottom: 15px; }
    .form-label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent); }
    .form-textarea { min-height: 100px; resize: vertical; }
    
    .schema-types { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
    .schema-type {
      background: var(--bg-tertiary);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .schema-type:hover { border-color: var(--text-secondary); }
    .schema-type.active { border-color: var(--accent); background: rgba(35, 134, 54, 0.1); }
    .schema-type-icon { font-size: 24px; margin-bottom: 5px; }
    .schema-type-name { font-weight: 500; font-size: 13px; }
    
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    .output-section {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
    }
    .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .output-code {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 15px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-x: auto;
      max-height: 400px;
    }
    
    .faq-item {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 10px;
    }
    .faq-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .faq-remove { background: none; border: none; color: var(--error); cursor: pointer; font-size: 16px; }
    
    .review-stars { display: flex; gap: 5px; }
    .star { cursor: pointer; font-size: 24px; color: var(--text-secondary); }
    .star.active { color: #f1c40f; }
    
    .loading { text-align: center; padding: 40px; display: none; }
    .loading.active { display: block; }
    .message { padding: 12px 16px; border-radius: 6px; margin-bottom: 15px; display: none; }
    .message.success { display: block; background: rgba(35, 134, 54, 0.2); border: 1px solid var(--success); }
    .message.error { display: block; background: rgba(248, 81, 73, 0.2); border: 1px solid var(--error); }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 Schema Markup Generator</h1>
    <div id="message" class="message"></div>
    
    <div class="section">
      <h2>Select Schema Type</h2>
      <div class="schema-types">
        <div class="schema-type active" onclick="selectType('Article')" data-type="Article">
          <div class="schema-type-icon">📰</div>
          <div class="schema-type-name">Article</div>
        </div>
        <div class="schema-type" onclick="selectType('LocalBusiness')" data-type="LocalBusiness">
          <div class="schema-type-icon">🏪</div>
          <div class="schema-type-name">Local Business</div>
        </div>
        <div class="schema-type" onclick="selectType('Product')" data-type="Product">
          <div class="schema-type-icon">📦</div>
          <div class="schema-type-name">Product</div>
        </div>
        <div class="schema-type" onclick="selectType('FAQPage')" data-type="FAQPage">
          <div class="schema-type-icon">❓</div>
          <div class="schema-type-name">FAQ</div>
        </div>
        <div class="schema-type" onclick="selectType('HowTo')" data-type="HowTo">
          <div class="schema-type-icon">📝</div>
          <div class="schema-type-name">How-To</div>
        </div>
        <div class="schema-type" onclick="selectType('Review')" data-type="Review">
          <div class="schema-type-icon">⭐</div>
          <div class="schema-type-name">Review</div>
        </div>
        <div class="schema-type" onclick="selectType('Event')" data-type="Event">
          <div class="schema-type-icon">📅</div>
          <div class="schema-type-name">Event</div>
        </div>
        <div class="schema-type" onclick="selectType('Organization')" data-type="Organization">
          <div class="schema-type-icon">🏢</div>
          <div class="schema-type-name">Organization</div>
        </div>
      </div>
    </div>
    
    <div class="section" id="formSection">
      <!-- Dynamic form based on schema type -->
    </div>
    
    <div style="text-align:center;margin-bottom:20px;">
      <button class="btn btn-primary" onclick="generateSchema()">🔧 Generate Schema</button>
    </div>
    
    <div class="output-section" id="output" style="display:none;">
      <div class="output-header">
        <h2>Generated Schema</h2>
        <div>
          <button class="btn btn-secondary" onclick="copySchema()">📋 Copy</button>
          <button class="btn btn-secondary" onclick="validateSchema()">✅ Validate</button>
        </div>
      </div>
      <div class="output-code" id="schemaOutput"></div>
    </div>
  </div>

  <script>
    let selectedType = 'Article';
    let faqCount = 1;
    let stepCount = 1;
    
    const formTemplates = {
      Article: `
        <div class="form-group"><label class="form-label">Headline</label><input type="text" class="form-input" id="headline" placeholder="Article title"></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Author Name</label><input type="text" class="form-input" id="author" placeholder="Author name"></div>
          <div class="form-group"><label class="form-label">Publisher</label><input type="text" class="form-input" id="publisher" placeholder="Publisher/Site name"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Date Published</label><input type="date" class="form-input" id="datePublished"></div>
          <div class="form-group"><label class="form-label">Date Modified</label><input type="date" class="form-input" id="dateModified"></div>
        </div>
        <div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="description" placeholder="Article description"></textarea></div>
        <div class="form-group"><label class="form-label">Image URL</label><input type="text" class="form-input" id="image" placeholder="https://..."></div>`,
      
      LocalBusiness: `
        <div class="form-row">
          <div class="form-group"><label class="form-label">Business Name</label><input type="text" class="form-input" id="name" placeholder="Business name"></div>
          <div class="form-group"><label class="form-label">Phone</label><input type="text" class="form-input" id="phone" placeholder="+1-555-555-5555"></div>
        </div>
        <div class="form-group"><label class="form-label">Street Address</label><input type="text" class="form-input" id="street" placeholder="123 Main St"></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">City</label><input type="text" class="form-input" id="city"></div>
          <div class="form-group"><label class="form-label">State</label><input type="text" class="form-input" id="state"></div>
          <div class="form-group"><label class="form-label">Postal Code</label><input type="text" class="form-input" id="postal"></div>
        </div>
        <div class="form-group"><label class="form-label">Business Type</label><select class="form-select" id="bizType"><option>Restaurant</option><option>Store</option><option>ProfessionalService</option><option>MedicalBusiness</option><option>LegalService</option></select></div>`,
      
      Product: `
        <div class="form-group"><label class="form-label">Product Name</label><input type="text" class="form-input" id="name" placeholder="Product name"></div>
        <div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="description" placeholder="Product description"></textarea></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Price</label><input type="number" class="form-input" id="price" placeholder="29.99"></div>
          <div class="form-group"><label class="form-label">Currency</label><select class="form-select" id="currency"><option>USD</option><option>EUR</option><option>GBP</option></select></div>
        </div>
        <div class="form-group"><label class="form-label">SKU</label><input type="text" class="form-input" id="sku" placeholder="SKU-12345"></div>
        <div class="form-group"><label class="form-label">Image URL</label><input type="text" class="form-input" id="image" placeholder="https://..."></div>`,
      
      FAQPage: `<div id="faqList"><div class="faq-item"><div class="faq-header"><span>Q1</span></div><div class="form-group"><label class="form-label">Question</label><input type="text" class="form-input faq-q" placeholder="Question"></div><div class="form-group"><label class="form-label">Answer</label><textarea class="form-textarea faq-a" placeholder="Answer"></textarea></div></div></div><button class="btn btn-secondary" onclick="addFaq()">+ Add Question</button>`,
      
      HowTo: `<div class="form-group"><label class="form-label">Title</label><input type="text" class="form-input" id="name" placeholder="How to..."></div><div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="description"></textarea></div><div id="stepList"><div class="faq-item"><div class="faq-header"><span>Step 1</span></div><input type="text" class="form-input step-text" placeholder="Step description"></div></div><button class="btn btn-secondary" onclick="addStep()">+ Add Step</button>`,
      
      Review: `<div class="form-group"><label class="form-label">Item Reviewed</label><input type="text" class="form-input" id="itemName" placeholder="Product/Service name"></div><div class="form-group"><label class="form-label">Rating</label><div class="review-stars" id="stars">${[1,2,3,4,5].map(i=>`<span class="star" onclick="setRating(${i})">★</span>`).join('')}</div><input type="hidden" id="rating" value="5"></div><div class="form-group"><label class="form-label">Review Body</label><textarea class="form-textarea" id="reviewBody"></textarea></div><div class="form-group"><label class="form-label">Author</label><input type="text" class="form-input" id="author"></div>`,
      
      Event: `<div class="form-group"><label class="form-label">Event Name</label><input type="text" class="form-input" id="name"></div><div class="form-row"><div class="form-group"><label class="form-label">Start Date</label><input type="datetime-local" class="form-input" id="startDate"></div><div class="form-group"><label class="form-label">End Date</label><input type="datetime-local" class="form-input" id="endDate"></div></div><div class="form-group"><label class="form-label">Location Name</label><input type="text" class="form-input" id="location"></div><div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="description"></textarea></div>`,
      
      Organization: `<div class="form-group"><label class="form-label">Organization Name</label><input type="text" class="form-input" id="name"></div><div class="form-group"><label class="form-label">Website URL</label><input type="text" class="form-input" id="url" placeholder="https://..."></div><div class="form-group"><label class="form-label">Logo URL</label><input type="text" class="form-input" id="logo" placeholder="https://..."></div><div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="description"></textarea></div>`
    };
    
    function selectType(type) {
      selectedType = type;
      document.querySelectorAll('.schema-type').forEach(t => t.classList.remove('active'));
      document.querySelector(`.schema-type[data-type="${type}"]`).classList.add('active');
      document.getElementById('formSection').innerHTML = '<h2>' + type + ' Details</h2>' + formTemplates[type];
      document.getElementById('output').style.display = 'none';
      faqCount = 1; stepCount = 1;
    }
    
    function addFaq() { faqCount++; document.getElementById('faqList').innerHTML += `<div class="faq-item"><div class="faq-header"><span>Q${faqCount}</span><button class="faq-remove" onclick="this.parentElement.parentElement.remove()">×</button></div><div class="form-group"><label class="form-label">Question</label><input type="text" class="form-input faq-q"></div><div class="form-group"><label class="form-label">Answer</label><textarea class="form-textarea faq-a"></textarea></div></div>`; }
    
    function addStep() { stepCount++; document.getElementById('stepList').innerHTML += `<div class="faq-item"><div class="faq-header"><span>Step ${stepCount}</span><button class="faq-remove" onclick="this.parentElement.parentElement.remove()">×</button></div><input type="text" class="form-input step-text" placeholder="Step description"></div>`; }
    
    function setRating(n) { document.getElementById('rating').value = n; document.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('active', i < n)); }
    
    function generateSchema() {
      google.script.run.withSuccessHandler(result => {
        if (result.ok) { document.getElementById('schemaOutput').textContent = result.schema; document.getElementById('output').style.display = 'block'; }
        else showMessage(result.error, 'error');
      }).withFailureHandler(e => showMessage(e.message, 'error')).AI_generateSchema({ type: selectedType, data: collectFormData() });
    }
    
    function collectFormData() {
      const data = {};
      document.querySelectorAll('#formSection input, #formSection textarea, #formSection select').forEach(el => { if (el.id) data[el.id] = el.value; });
      if (selectedType === 'FAQPage') { data.faqs = Array.from(document.querySelectorAll('.faq-item')).map(item => ({ q: item.querySelector('.faq-q').value, a: item.querySelector('.faq-a').value })); }
      if (selectedType === 'HowTo') { data.steps = Array.from(document.querySelectorAll('.step-text')).map(el => el.value); }
      return data;
    }
    
    function copySchema() { navigator.clipboard.writeText(document.getElementById('schemaOutput').textContent); showMessage('Copied!', 'success'); }
    function validateSchema() { window.open('https://search.google.com/test/rich-results', '_blank'); }
    function showMessage(text, type) { const msg = document.getElementById('message'); msg.textContent = text; msg.className = 'message ' + type; setTimeout(() => msg.className = 'message', 3000); }
    
    selectType('Article');
  </script>
</body>
</html>
