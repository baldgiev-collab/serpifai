<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= UI_getStyles() ?>
  <style>
    .analysis-input {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .analysis-input input {
      flex: 1;
    }
    .score-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .score-value {
      font-size: 36px;
      font-weight: 600;
    }
    .score-label {
      font-size: 13px;
      opacity: 0.9;
    }
    .score-excellent { background: linear-gradient(135deg, #34A853, #4CAF50); color: white; }
    .score-good { background: linear-gradient(135deg, #FBBC05, #FFC107); color: white; }
    .score-poor { background: linear-gradient(135deg, #EA4335, #F44336); color: white; }
    
    .metric-section {
      margin-bottom: 24px;
    }
    .metric-section h3 {
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    .metric-card {
      background: var(--gray-50);
      border-radius: var(--radius);
      padding: 16px;
    }
    .metric-name {
      font-size: 13px;
      color: var(--gray-600);
      margin-bottom: 8px;
    }
    .metric-value {
      font-size: 20px;
      font-weight: 600;
    }
    .metric-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-left: 8px;
    }
    .status-pass { background: #E6F4EA; color: #1E8E3E; }
    .status-warn { background: #FEF7E0; color: #F9AB00; }
    .status-fail { background: #FCE8E6; color: #D93025; }
    
    .keyword-section {
      margin-top: 24px;
    }
    .keyword-input {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .keyword-stats {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }
    .keyword-stat {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .keyword-stat svg {
      color: var(--success);
    }
    .keyword-stat.missing svg {
      color: var(--danger);
    }
    
    .heading-structure {
      font-family: monospace;
      font-size: 13px;
      background: var(--gray-50);
      padding: 16px;
      border-radius: var(--radius);
      max-height: 200px;
      overflow-y: auto;
    }
    .h1-tag { color: var(--primary); font-weight: 600; }
    .h2-tag { color: var(--gray-700); margin-left: 16px; }
    .h3-tag { color: var(--gray-500); margin-left: 32px; }
    
    .recommendations-list {
      list-style: none;
    }
    .recommendation-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid var(--gray-200);
    }
    .rec-priority {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }
    .priority-high { background: #FCE8E6; color: #D93025; }
    .priority-medium { background: #FEF7E0; color: #F9AB00; }
    .priority-low { background: #E8F0FE; color: #1967D2; }
    .rec-content { flex: 1; }
    .rec-title { font-weight: 500; margin-bottom: 4px; }
    .rec-desc { font-size: 13px; color: var(--gray-600); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Content Analysis</h1>
    
    <div class="card">
      <div class="analysis-input">
        <input type="url" id="analyzeUrl" class="input" placeholder="https://example.com/page">
        <button onclick="analyzeUrl()" class="btn btn-primary">Analyze</button>
      </div>
      
      <div class="keyword-section">
        <div class="keyword-input">
          <input type="text" id="targetKeyword" class="input" placeholder="Target keyword (optional)">
        </div>
      </div>
    </div>
    
    <div id="loading" style="display: none; text-align: center; padding: 40px;">
      <div class="loading"></div>
      <p style="margin-top: 16px; color: var(--gray-500);">Analyzing content...</p>
    </div>
    
    <div id="results" style="display: none;">
      <div class="card" style="text-align: center;">
        <div id="scoreCircle" class="score-circle score-good">
          <div class="score-value" id="scoreValue">0</div>
          <div class="score-label">Content Score</div>
        </div>
      </div>
      
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Word Count</div>
          <div class="stat-value" id="wordCount">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Reading Level</div>
          <div class="stat-value" id="readingLevel">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Reading Time</div>
          <div class="stat-value" id="readingTime">0 min</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Images</div>
          <div class="stat-value" id="imageCount">0</div>
        </div>
      </div>
      
      <div class="card metric-section">
        <h3>Readability</h3>
        <div class="metric-grid">
          <div class="metric-card">
            <div class="metric-name">Flesch Reading Ease</div>
            <div class="metric-value" id="fleschEase">-</div>
          </div>
          <div class="metric-card">
            <div class="metric-name">Grade Level</div>
            <div class="metric-value" id="gradeLevel">-</div>
          </div>
          <div class="metric-card">
            <div class="metric-name">Avg Words/Sentence</div>
            <div class="metric-value" id="avgWords">-</div>
          </div>
        </div>
      </div>
      
      <div id="keywordAnalysis" class="card metric-section" style="display: none;">
        <h3>Keyword Analysis</h3>
        <div id="keywordStats" class="keyword-stats"></div>
      </div>
      
      <div class="card metric-section">
        <h3>Heading Structure</h3>
        <div id="headingStructure" class="heading-structure"></div>
      </div>
      
      <div class="card">
        <h3>Recommendations</h3>
        <ul id="recommendations" class="recommendations-list"></ul>
      </div>
    </div>
  </div>
  
  <script>
    function analyzeUrl() {
      const url = document.getElementById('analyzeUrl').value;
      if (!url) {
        alert('Please enter a URL');
        return;
      }
      
      const keyword = document.getElementById('targetKeyword').value;
      
      document.getElementById('loading').style.display = 'block';
      document.getElementById('results').style.display = 'none';
      
      google.script.run
        .withSuccessHandler(handleAnalysisResults)
        .withFailureHandler(handleError)
        .FT_analyzeContent({ url: url, keyword: keyword || null });
    }
    
    function handleAnalysisResults(data) {
      document.getElementById('loading').style.display = 'none';
      
      if (!data.ok) {
        alert('Error: ' + data.error);
        return;
      }
      
      document.getElementById('results').style.display = 'block';
      
      // Score
      const scoreCircle = document.getElementById('scoreCircle');
      scoreCircle.className = 'score-circle ' + (data.score >= 80 ? 'score-excellent' : data.score >= 50 ? 'score-good' : 'score-poor');
      document.getElementById('scoreValue').textContent = data.score;
      
      // Stats
      document.getElementById('wordCount').textContent = data.wordCount.toLocaleString();
      document.getElementById('readingLevel').textContent = data.readability?.level || '-';
      document.getElementById('readingTime').textContent = Math.ceil(data.wordCount / 200) + ' min';
      document.getElementById('imageCount').textContent = data.images?.count || 0;
      
      // Readability
      document.getElementById('fleschEase').textContent = data.readability?.ease || '-';
      document.getElementById('gradeLevel').textContent = data.readability?.grade || '-';
      document.getElementById('avgWords').textContent = data.readability?.avgWordsPerSentence || '-';
      
      // Keyword analysis
      if (data.keywordAnalysis) {
        document.getElementById('keywordAnalysis').style.display = 'block';
        const kw = data.keywordAnalysis;
        
        document.getElementById('keywordStats').innerHTML = `
          <div class="keyword-stat ${kw.inTitle ? '' : 'missing'}">
            ${kw.inTitle ? '✓' : '✗'} In Title
          </div>
          <div class="keyword-stat ${kw.inH1 ? '' : 'missing'}">
            ${kw.inH1 ? '✓' : '✗'} In H1
          </div>
          <div class="keyword-stat ${kw.inMeta ? '' : 'missing'}">
            ${kw.inMeta ? '✓' : '✗'} In Meta Description
          </div>
          <div class="keyword-stat ${kw.inFirstParagraph ? '' : 'missing'}">
            ${kw.inFirstParagraph ? '✓' : '✗'} In First Paragraph
          </div>
          <div class="keyword-stat">
            Density: ${kw.density}%
          </div>
          <div class="keyword-stat">
            Occurrences: ${kw.count}
          </div>
        `;
      } else {
        document.getElementById('keywordAnalysis').style.display = 'none';
      }
      
      // Headings
      const headings = data.headings;
      let headingHtml = '';
      if (headings.headings) {
        headings.headings.h1.forEach(h => headingHtml += `<div class="h1-tag">H1: ${h}</div>`);
        headings.headings.h2.forEach(h => headingHtml += `<div class="h2-tag">└ H2: ${h}</div>`);
        headings.headings.h3.forEach(h => headingHtml += `<div class="h3-tag">└── H3: ${h}</div>`);
      }
      document.getElementById('headingStructure').innerHTML = headingHtml || '<em>No headings found</em>';
      
      // Get recommendations
      google.script.run
        .withSuccessHandler(handleRecommendations)
        .FT_getContentRecommendations({ url: document.getElementById('analyzeUrl').value, keyword: document.getElementById('targetKeyword').value });
    }
    
    function handleRecommendations(data) {
      if (!data.ok || !data.recommendations) return;
      
      const list = document.getElementById('recommendations');
      list.innerHTML = data.recommendations.map(rec => `
        <li class="recommendation-item">
          <span class="rec-priority priority-${rec.priority}">${rec.priority.toUpperCase()}</span>
          <div class="rec-content">
            <div class="rec-title">${rec.title}</div>
            <div class="rec-desc">${rec.description}</div>
          </div>
        </li>
      `).join('');
    }
    
    function handleError(error) {
      document.getElementById('loading').style.display = 'none';
      alert('Error: ' + error.message);
    }
  </script>
</body>
</html>
