<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --primary: #4285f4;
      --success: #34a853;
      --warning: #fbbc04;
      --danger: #ea4335;
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --border: #e0e0e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Google Sans', Arial, sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
    .header { margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 500; }
    .subtitle { color: var(--muted); font-size: 14px; margin-top: 4px; }
    
    .card { background: var(--card); border-radius: 10px; padding: 20px; border: 1px solid var(--border); margin-bottom: 16px; }
    .card h3 { font-size: 16px; font-weight: 500; margin-bottom: 16px; }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    input[type="text"] { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
    input:focus { outline: none; border-color: var(--primary); }
    
    button { padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .btn-primary { background: var(--primary); color: white; border: none; }
    
    .status-row { display: flex; gap: 16px; margin-bottom: 20px; }
    .status-item { flex: 1; padding: 16px; border-radius: 8px; text-align: center; }
    .status-item.good { background: #e6f4ea; }
    .status-item.warning { background: #fef7e0; }
    .status-item.error { background: #fce8e6; }
    .status-icon { font-size: 24px; margin-bottom: 8px; }
    .status-label { font-size: 12px; color: var(--muted); }
    .status-value { font-size: 14px; font-weight: 500; margin-top: 4px; word-break: break-all; }
    
    .canonical-box { padding: 16px; background: var(--bg); border-radius: 8px; margin-bottom: 16px; }
    .canonical-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .canonical-value { font-size: 14px; font-family: monospace; word-break: break-all; }
    .canonical-value a { color: var(--primary); }
    
    .issue-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px; background: var(--bg); border-radius: 8px; margin-bottom: 8px; }
    .issue-item:last-child { margin-bottom: 0; }
    .issue-icon { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
    .issue-icon.critical { background: #fce8e6; color: var(--danger); }
    .issue-icon.warning { background: #fef7e0; color: #e37400; }
    .issue-icon.info { background: #e8f0fe; color: var(--primary); }
    .issue-title { font-weight: 500; margin-bottom: 2px; }
    .issue-desc { font-size: 13px; color: var(--muted); }
    
    .code-block { background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 12px; overflow-x: auto; margin-top: 12px; }
    
    .loading { text-align: center; padding: 60px; color: var(--muted); }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .empty { text-align: center; padding: 40px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="header">
    <h1>Canonical Checker</h1>
    <p class="subtitle">Validate canonical URL configuration</p>
  </div>
  
  <div class="card">
    <div class="form-group">
      <label>Page URL</label>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="urlInput" placeholder="Enter URL to check...">
        <button class="btn-primary" onclick="checkCanonical()">Check</button>
      </div>
    </div>
  </div>
  
  <div id="loading" class="loading" style="display: none;">
    <div class="spinner"></div>
    <p>Checking canonical...</p>
  </div>
  
  <div id="results" style="display: none;">
    <div class="status-row">
      <div class="status-item" id="statusItem">
        <div class="status-icon" id="statusIcon">✓</div>
        <div class="status-label">Canonical Status</div>
        <div class="status-value" id="statusValue">--</div>
      </div>
    </div>
    
    <div class="card">
      <h3>Canonical URLs</h3>
      <div class="canonical-box">
        <div class="canonical-label">HTML Canonical</div>
        <div class="canonical-value" id="htmlCanonical">--</div>
      </div>
      <div class="canonical-box">
        <div class="canonical-label">HTTP Header Canonical</div>
        <div class="canonical-value" id="headerCanonical">--</div>
      </div>
      <div class="canonical-box" style="border-left: 3px solid var(--primary);">
        <div class="canonical-label">Effective Canonical</div>
        <div class="canonical-value" id="effectiveCanonical">--</div>
      </div>
    </div>
    
    <div class="card" id="issuesCard">
      <h3>Issues & Recommendations</h3>
      <div id="issuesList"></div>
    </div>
    
    <div class="card" id="suggestionCard" style="display: none;">
      <h3>Suggested Canonical Tag</h3>
      <div class="code-block" id="suggestedTag"></div>
      <button class="btn-primary" style="margin-top: 12px;" onclick="copyTag()">Copy</button>
    </div>
  </div>
  
  <div id="empty" class="empty">
    <p>Enter a URL to check its canonical configuration</p>
  </div>
  
  <script>
    let suggestedTagCode = '';
    
    function checkCanonical() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) { alert('Please enter a URL'); return; }
      
      document.getElementById('empty').style.display = 'none';
      document.getElementById('results').style.display = 'none';
      document.getElementById('loading').style.display = 'block';
      
      google.script.run
        .withSuccessHandler(handleResult)
        .withFailureHandler(handleError)
        .FT_analyzeCanonical({ url: url });
    }
    
    function handleResult(data) {
      document.getElementById('loading').style.display = 'none';
      
      if (!data || !data.ok) {
        alert(data?.error || 'Check failed');
        document.getElementById('empty').style.display = 'block';
        return;
      }
      
      // Status
      const statusItem = document.getElementById('statusItem');
      const statusIcon = document.getElementById('statusIcon');
      const statusValue = document.getElementById('statusValue');
      
      const hasIssues = (data.issues || []).some(i => i.type === 'critical' || i.type === 'warning');
      const noCanonical = !data.canonical?.effective;
      
      if (noCanonical) {
        statusItem.className = 'status-item error';
        statusIcon.textContent = '✗';
        statusValue.textContent = 'No canonical tag found';
      } else if (hasIssues) {
        statusItem.className = 'status-item warning';
        statusIcon.textContent = '!';
        statusValue.textContent = 'Issues detected';
      } else {
        statusItem.className = 'status-item good';
        statusIcon.textContent = '✓';
        statusValue.textContent = data.isSelfReferencing ? 'Self-referencing' : 'Cross-page canonical';
      }
      
      // Canonical values
      document.getElementById('htmlCanonical').innerHTML = data.canonical?.html ? 
        '<a href="' + data.canonical.html + '" target="_blank">' + data.canonical.html + '</a>' : 
        '<span style="color: var(--muted)">Not set</span>';
      
      document.getElementById('headerCanonical').innerHTML = data.canonical?.header ?
        '<a href="' + data.canonical.header + '" target="_blank">' + data.canonical.header + '</a>' :
        '<span style="color: var(--muted)">Not set</span>';
      
      document.getElementById('effectiveCanonical').innerHTML = data.canonical?.effective ?
        '<a href="' + data.canonical.effective + '" target="_blank">' + data.canonical.effective + '</a>' :
        '<span style="color: var(--muted)">None</span>';
      
      // Issues
      renderIssues(data.issues || [], data.recommendations || []);
      
      // Suggestion
      if (noCanonical || hasIssues) {
        suggestedTagCode = '<link rel="canonical" href="' + data.url + '">';
        document.getElementById('suggestedTag').textContent = suggestedTagCode;
        document.getElementById('suggestionCard').style.display = 'block';
      } else {
        document.getElementById('suggestionCard').style.display = 'none';
      }
      
      document.getElementById('results').style.display = 'block';
    }
    
    function renderIssues(issues, recommendations) {
      const list = document.getElementById('issuesList');
      
      const allItems = issues.concat(recommendations.map(r => ({
        type: 'info',
        title: r.title,
        description: r.fix
      })));
      
      if (allItems.length === 0) {
        list.innerHTML = '<div class="empty" style="padding: 20px;">No issues found!</div>';
        return;
      }
      
      list.innerHTML = allItems.map(function(item) {
        const icon = item.type === 'critical' ? '!' : (item.type === 'warning' ? '△' : 'i');
        return '<div class="issue-item">' +
          '<div class="issue-icon ' + item.type + '">' + icon + '</div>' +
          '<div>' +
            '<div class="issue-title">' + item.title + '</div>' +
            '<div class="issue-desc">' + item.description + '</div>' +
          '</div>' +
          '</div>';
      }).join('');
    }
    
    function copyTag() {
      navigator.clipboard.writeText(suggestedTagCode).then(() => alert('Copied!'));
    }
    
    function handleError(err) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('empty').style.display = 'block';
      alert('Error: ' + (err.message || 'Unknown error'));
    }
  </script>
</body>
</html>
