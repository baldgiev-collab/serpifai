<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --primary: #4285f4;
      --success: #34a853;
      --warning: #fbbc04;
      --danger: #ea4335;
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --border: #e0e0e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Google Sans', Arial, sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
    .header { margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 500; }
    .subtitle { color: var(--muted); font-size: 14px; margin-top: 4px; }
    
    .card { background: var(--card); border-radius: 10px; padding: 20px; border: 1px solid var(--border); margin-bottom: 16px; }
    .card h3 { font-size: 16px; font-weight: 500; margin-bottom: 16px; }
    
    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .summary-item { background: var(--bg); padding: 16px; border-radius: 8px; text-align: center; }
    .summary-value { font-size: 28px; font-weight: 600; }
    .summary-value.primary { color: var(--primary); }
    .summary-value.success { color: var(--success); }
    .summary-value.warning { color: var(--warning); }
    .summary-value.danger { color: var(--danger); }
    .summary-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    input[type="text"] { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
    input:focus { outline: none; border-color: var(--primary); }
    
    button { padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .btn-primary { background: var(--primary); color: white; border: none; }
    .btn-secondary { background: white; color: var(--text); border: 1px solid var(--border); }
    
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; }
    td { font-size: 14px; }
    
    .status-badge { padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 500; }
    .status-badge.valid { background: #e6f4ea; color: var(--success); }
    .status-badge.redirect { background: #fef7e0; color: #e37400; }
    .status-badge.broken { background: #fce8e6; color: var(--danger); }
    
    .link-type { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: #e8f0fe; color: var(--primary); }
    
    .loading { text-align: center; padding: 60px; color: var(--muted); }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .empty { text-align: center; padding: 40px; color: var(--muted); }
    .scroll-box { max-height: 400px; overflow-y: auto; }
    
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
    .tab { padding: 12px 20px; background: none; border: none; cursor: pointer; color: var(--muted); font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Link Checker</h1>
    <p class="subtitle">Find and fix broken links on your website</p>
  </div>
  
  <div class="card">
    <div class="form-group">
      <label>Page URL</label>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="urlInput" placeholder="Enter URL to check links...">
        <button class="btn-primary" onclick="checkLinks()">Check Links</button>
      </div>
    </div>
  </div>
  
  <div id="loading" class="loading" style="display: none;">
    <div class="spinner"></div>
    <p>Checking links...</p>
  </div>
  
  <div id="results" style="display: none;">
    <div class="summary-grid">
      <div class="summary-item">
        <div class="summary-value primary" id="totalLinks">0</div>
        <div class="summary-label">Total Links</div>
      </div>
      <div class="summary-item">
        <div class="summary-value success" id="validLinks">0</div>
        <div class="summary-label">Valid</div>
      </div>
      <div class="summary-item">
        <div class="summary-value warning" id="redirectLinks">0</div>
        <div class="summary-label">Redirects</div>
      </div>
      <div class="summary-item">
        <div class="summary-value danger" id="brokenLinks">0</div>
        <div class="summary-label">Broken</div>
      </div>
    </div>
    
    <div class="tabs">
      <button class="tab active" onclick="showTab('all')">All Links</button>
      <button class="tab" onclick="showTab('broken')">Broken Only</button>
      <button class="tab" onclick="showTab('external')">External</button>
    </div>
    
    <div class="card">
      <div class="scroll-box">
        <table>
          <thead>
            <tr>
              <th>URL</th>
              <th>Type</th>
              <th>Status</th>
              <th>Code</th>
            </tr>
          </thead>
          <tbody id="linksTable"></tbody>
        </table>
      </div>
    </div>
  </div>
  
  <div id="empty" class="empty">
    <p>Enter a URL to check all links on the page</p>
  </div>
  
  <script>
    let allLinks = [];
    let currentFilter = 'all';
    
    function checkLinks() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) { alert('Please enter a URL'); return; }
      
      document.getElementById('empty').style.display = 'none';
      document.getElementById('results').style.display = 'none';
      document.getElementById('loading').style.display = 'block';
      
      google.script.run
        .withSuccessHandler(handleResult)
        .withFailureHandler(handleError)
        .FT_checkLinks({ url: url });
    }
    
    function handleResult(data) {
      document.getElementById('loading').style.display = 'none';
      
      if (!data || !data.ok) {
        alert(data?.error || 'Link check failed');
        document.getElementById('empty').style.display = 'block';
        return;
      }
      
      allLinks = data.links || [];
      
      // Update summary
      const total = allLinks.length;
      const valid = allLinks.filter(l => l.status === 'valid').length;
      const redirect = allLinks.filter(l => l.status === 'redirect').length;
      const broken = allLinks.filter(l => l.status === 'broken').length;
      
      document.getElementById('totalLinks').textContent = total;
      document.getElementById('validLinks').textContent = valid;
      document.getElementById('redirectLinks').textContent = redirect;
      document.getElementById('brokenLinks').textContent = broken;
      
      document.getElementById('results').style.display = 'block';
      renderLinks();
    }
    
    function showTab(filter) {
      currentFilter = filter;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      renderLinks();
    }
    
    function renderLinks() {
      let filtered = allLinks;
      
      if (currentFilter === 'broken') {
        filtered = allLinks.filter(l => l.status === 'broken');
      } else if (currentFilter === 'external') {
        filtered = allLinks.filter(l => l.type === 'external');
      }
      
      const tbody = document.getElementById('linksTable');
      
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No links found</td></tr>';
        return;
      }
      
      tbody.innerHTML = filtered.map(function(link) {
        const statusClass = link.status === 'valid' ? 'valid' : (link.status === 'redirect' ? 'redirect' : 'broken');
        const displayUrl = link.url.length > 60 ? link.url.substring(0, 60) + '...' : link.url;
        
        return '<tr>' +
          '<td><a href="' + link.url + '" target="_blank" title="' + link.url + '">' + displayUrl + '</a></td>' +
          '<td><span class="link-type">' + (link.type || 'internal') + '</span></td>' +
          '<td><span class="status-badge ' + statusClass + '">' + link.status + '</span></td>' +
          '<td>' + (link.statusCode || '--') + '</td>' +
          '</tr>';
      }).join('');
    }
    
    function handleError(err) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('empty').style.display = 'block';
      alert('Error: ' + (err.message || 'Unknown error'));
    }
  </script>
</body>
</html>
