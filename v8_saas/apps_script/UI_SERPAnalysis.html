<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SerpifAI - SERP Analysis</title>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --accent: #238636;
      --accent-hover: #2ea043;
      --text-primary: #c9d1d9;
      --text-secondary: #8b949e;
      --border: #30363d;
      --success: #238636;
      --warning: #d29922;
      --error: #f85149;
      --info: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      padding: 20px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 20px; }
    h2 { font-size: 18px; margin-bottom: 15px; }
    
    .section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .search-row { display: flex; gap: 10px; margin-bottom: 15px; }
    .search-input {
      flex: 1;
      padding: 12px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 14px;
    }
    .search-input:focus { outline: none; border-color: var(--accent); }
    
    .btn {
      padding: 12px 24px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { background: var(--text-secondary); cursor: not-allowed; }
    
    .filters { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
    .filter-group { display: flex; align-items: center; gap: 8px; }
    .filter-label { font-size: 13px; color: var(--text-secondary); }
    .filter-select {
      padding: 6px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 13px;
    }
    
    .results { display: none; }
    .results.active { display: block; }
    
    .serp-features {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .serp-feature {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--bg-tertiary);
      border-radius: 20px;
      font-size: 13px;
    }
    .serp-feature.active { background: rgba(35, 134, 54, 0.2); border: 1px solid var(--success); }
    
    .serp-list { list-style: none; }
    .serp-item {
      background: var(--bg-tertiary);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      gap: 15px;
    }
    
    .serp-position {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      flex-shrink: 0;
    }
    .serp-position.top3 { background: var(--success); }
    .serp-position.top10 { background: var(--info); }
    .serp-position.other { background: var(--bg-primary); border: 1px solid var(--border); }
    
    .serp-content { flex: 1; min-width: 0; }
    .serp-title {
      font-weight: 500;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .serp-title a { color: var(--info); text-decoration: none; }
    .serp-url {
      font-size: 12px;
      color: var(--success);
      margin-bottom: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .serp-snippet {
      font-size: 13px;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .serp-metrics {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12px;
      text-align: right;
    }
    .metric { color: var(--text-secondary); }
    .metric-value { color: var(--text-primary); font-weight: 500; }
    
    .analysis-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }
    .summary-card {
      background: var(--bg-tertiary);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }
    .summary-value { font-size: 24px; font-weight: bold; color: var(--accent); }
    .summary-label { font-size: 12px; color: var(--text-secondary); margin-top: 5px; }
    
    .loading { text-align: center; padding: 40px; display: none; }
    .loading.active { display: block; }
    
    .message {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }
    .message.error { display: block; background: rgba(248, 81, 73, 0.2); border: 1px solid var(--error); }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 SERP Analysis</h1>
    <div id="message" class="message"></div>
    
    <div class="section">
      <div class="search-row">
        <input type="text" class="search-input" id="keywordInput" placeholder="Enter keyword to analyze..." onkeypress="if(event.key==='Enter')analyzeSERP()">
        <button class="btn btn-primary" onclick="analyzeSERP()" id="analyzeBtn">🔍 Analyze</button>
      </div>
      <div class="filters">
        <div class="filter-group">
          <span class="filter-label">Country:</span>
          <select class="filter-select" id="filterCountry">
            <option value="us">United States</option>
            <option value="uk">United Kingdom</option>
            <option value="au">Australia</option>
            <option value="ca">Canada</option>
          </select>
        </div>
        <div class="filter-group">
          <span class="filter-label">Device:</span>
          <select class="filter-select" id="filterDevice">
            <option value="desktop">Desktop</option>
            <option value="mobile">Mobile</option>
          </select>
        </div>
      </div>
    </div>
    
    <div class="loading" id="loading"><p>🔄 Analyzing SERP...</p></div>
    
    <div class="results" id="results">
      <div class="analysis-summary">
        <div class="summary-card">
          <div class="summary-value" id="statResults">0</div>
          <div class="summary-label">Total Results</div>
        </div>
        <div class="summary-card">
          <div class="summary-value" id="statAvgDA">0</div>
          <div class="summary-label">Avg. Authority</div>
        </div>
        <div class="summary-card">
          <div class="summary-value" id="statAvgWords">0</div>
          <div class="summary-label">Avg. Content Length</div>
        </div>
        <div class="summary-card">
          <div class="summary-value" id="statFeatures">0</div>
          <div class="summary-label">SERP Features</div>
        </div>
      </div>
      
      <div class="section">
        <h2>SERP Features</h2>
        <div class="serp-features" id="serpFeatures"></div>
      </div>
      
      <h2>Organic Results</h2>
      <ul class="serp-list" id="serpList"></ul>
    </div>
  </div>

  <script>
    function analyzeSERP() {
      const keyword = document.getElementById('keywordInput').value.trim();
      if (!keyword) { showMessage('Enter a keyword', 'error'); return; }
      
      document.getElementById('loading').classList.add('active');
      document.getElementById('results').classList.remove('active');
      document.getElementById('analyzeBtn').disabled = true;
      
      const params = {
        keyword: keyword,
        country: document.getElementById('filterCountry').value,
        device: document.getElementById('filterDevice').value
      };
      
      google.script.run
        .withSuccessHandler(displayResults)
        .withFailureHandler(e => {
          document.getElementById('loading').classList.remove('active');
          document.getElementById('analyzeBtn').disabled = false;
          showMessage(e.message, 'error');
        })
        .FT_SERPER_analyzeSERP(params);
    }
    
    function displayResults(result) {
      document.getElementById('loading').classList.remove('active');
      document.getElementById('analyzeBtn').disabled = false;
      
      if (!result.ok) { showMessage(result.error, 'error'); return; }
      
      document.getElementById('results').classList.add('active');
      
      const data = result.data || {};
      const organic = data.organic || [];
      
      // Stats
      document.getElementById('statResults').textContent = organic.length;
      document.getElementById('statAvgDA').textContent = data.avgAuthority || 0;
      document.getElementById('statAvgWords').textContent = formatNumber(data.avgWordCount || 0);
      document.getElementById('statFeatures').textContent = (data.features || []).length;
      
      // SERP Features
      const allFeatures = ['Featured Snippet', 'People Also Ask', 'Knowledge Panel', 'Local Pack', 'Images', 'Videos', 'News', 'Shopping', 'Sitelinks'];
      const activeFeatures = data.features || [];
      
      document.getElementById('serpFeatures').innerHTML = allFeatures.map(f => {
        const isActive = activeFeatures.includes(f);
        return `<div class="serp-feature ${isActive ? 'active' : ''}">${isActive ? '✓' : '○'} ${f}</div>`;
      }).join('');
      
      // Organic results
      document.getElementById('serpList').innerHTML = organic.slice(0, 20).map((item, i) => {
        const pos = i + 1;
        const posClass = pos <= 3 ? 'top3' : pos <= 10 ? 'top10' : 'other';
        
        return `
          <li class="serp-item">
            <div class="serp-position ${posClass}">${pos}</div>
            <div class="serp-content">
              <div class="serp-title"><a href="${item.link}" target="_blank">${item.title}</a></div>
              <div class="serp-url">${item.displayLink || item.link}</div>
              <div class="serp-snippet">${item.snippet || ''}</div>
            </div>
            <div class="serp-metrics">
              <div class="metric">Authority: <span class="metric-value">${item.authority || '-'}</span></div>
              <div class="metric">Words: <span class="metric-value">${formatNumber(item.wordCount || 0)}</span></div>
            </div>
          </li>
        `;
      }).join('');
    }
    
    function formatNumber(n) {
      if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
      return n.toString();
    }
    
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
    }
  </script>
</body>
</html>
