<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SerpifAI - Reports</title>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --accent: #238636;
      --accent-hover: #2ea043;
      --text-primary: #c9d1d9;
      --text-secondary: #8b949e;
      --border: #30363d;
      --success: #238636;
      --warning: #d29922;
      --error: #f85149;
      --info: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      padding: 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 20px; }
    h2 { font-size: 18px; margin-bottom: 15px; }
    
    .section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
    
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }
    .stat-value { font-size: 32px; font-weight: bold; }
    .stat-value.green { color: var(--success); }
    .stat-value.blue { color: var(--info); }
    .stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 5px; }
    
    .report-card {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .report-info h3 { margin-bottom: 5px; }
    .report-date { font-size: 12px; color: var(--text-secondary); }
    .report-actions { display: flex; gap: 10px; }
    
    .distribution-chart { display: flex; height: 30px; border-radius: 4px; overflow: hidden; margin: 15px 0; }
    .dist-bar { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
    .dist-bar.top3 { background: var(--success); }
    .dist-bar.top10 { background: var(--info); }
    .dist-bar.top20 { background: var(--warning); }
    .dist-bar.beyond { background: var(--text-secondary); }
    
    .legend { display: flex; gap: 20px; margin-top: 10px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
    
    .kw-table { width: 100%; border-collapse: collapse; }
    .kw-table th { text-align: left; padding: 12px; background: var(--bg-tertiary); font-weight: 600; }
    .kw-table td { padding: 12px; border-top: 1px solid var(--border); }
    .kw-table tr:hover { background: rgba(255,255,255,0.02); }
    
    .change-up { color: var(--success); }
    .change-down { color: var(--error); }
    
    .rec-list { margin: 0; }
    .rec-item {
      display: flex;
      gap: 15px;
      padding: 15px;
      background: var(--bg-tertiary);
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .rec-priority {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .rec-priority.high { background: rgba(248, 81, 73, 0.2); color: var(--error); }
    .rec-priority.medium { background: rgba(210, 153, 34, 0.2); color: var(--warning); }
    .rec-content { flex: 1; }
    .rec-title { font-weight: 600; margin-bottom: 5px; }
    .rec-desc { font-size: 13px; color: var(--text-secondary); }
    
    .export-options { display: flex; gap: 10px; margin-top: 20px; }
    
    .loading { text-align: center; padding: 40px; display: none; }
    .loading.active { display: block; }
    .message { padding: 12px 16px; border-radius: 6px; margin-bottom: 15px; display: none; }
    .message.success { display: block; background: rgba(35, 134, 54, 0.2); border: 1px solid var(--success); }
    .message.error { display: block; background: rgba(248, 81, 73, 0.2); border: 1px solid var(--error); }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 SEO Reports</h1>
    <div id="message" class="message"></div>
    
    <div style="margin-bottom:20px;">
      <button class="btn btn-primary" onclick="generateReport()">📊 Generate New Report</button>
    </div>
    
    <div class="loading" id="loading"><p>🔄 Generating report...</p></div>
    
    <div id="reportContent" style="display:none;">
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-value" id="statKeywords">0</div>
          <div class="stat-label">Keywords Tracked</div>
        </div>
        <div class="stat-card">
          <div class="stat-value green" id="statTop3">0</div>
          <div class="stat-label">Top 3 Rankings</div>
        </div>
        <div class="stat-card">
          <div class="stat-value blue" id="statTop10">0</div>
          <div class="stat-label">Top 10 Rankings</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statScore">0%</div>
          <div class="stat-label">Overall Score</div>
        </div>
      </div>
      
      <div class="section">
        <h2>Ranking Distribution</h2>
        <div class="distribution-chart" id="distChart"></div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--success)"></div> Top 3</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--info)"></div> Top 4-10</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--warning)"></div> Top 11-20</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--text-secondary)"></div> Beyond 20</div>
        </div>
      </div>
      
      <div class="section">
        <h2>Top Keywords</h2>
        <table class="kw-table">
          <thead><tr><th>Keyword</th><th>Position</th><th>Volume</th><th>Change</th></tr></thead>
          <tbody id="keywordTable"></tbody>
        </table>
      </div>
      
      <div class="section">
        <h2>Recommendations</h2>
        <div class="rec-list" id="recList"></div>
      </div>
      
      <div class="export-options">
        <button class="btn btn-secondary" onclick="exportToSheet()">📄 Export to Sheet</button>
        <button class="btn btn-secondary" onclick="downloadHTML()">💾 Download HTML</button>
        <button class="btn btn-secondary" onclick="emailReport()">📧 Email Report</button>
      </div>
    </div>
    
    <div class="section">
      <h2>Recent Reports</h2>
      <div id="recentReports">
        <p style="color:var(--text-secondary);">No reports generated yet.</p>
      </div>
    </div>
  </div>

  <script>
    let currentReport = null;
    
    function generateReport() {
      document.getElementById('loading').classList.add('active');
      document.getElementById('reportContent').style.display = 'none';
      
      google.script.run
        .withSuccessHandler(displayReport)
        .withFailureHandler(e => {
          document.getElementById('loading').classList.remove('active');
          showMessage(e.message, 'error');
        })
        .DB_generateSEOReport({ projectId: 'default' });
    }
    
    function displayReport(result) {
      document.getElementById('loading').classList.remove('active');
      if (!result.ok) { showMessage(result.error, 'error'); return; }
      
      currentReport = result.report;
      document.getElementById('reportContent').style.display = 'block';
      
      const s = result.report.summary;
      document.getElementById('statKeywords').textContent = s.totalKeywords;
      document.getElementById('statTop3').textContent = s.top3;
      document.getElementById('statTop10').textContent = s.top10;
      document.getElementById('statScore').textContent = s.overallScore + '%';
      
      // Distribution chart
      const d = result.report.rankings.distribution;
      const total = d.top3 + d.top10 + d.top20 + d.beyond;
      document.getElementById('distChart').innerHTML = `
        <div class="dist-bar top3" style="width:${(d.top3/total)*100}%">${d.top3}</div>
        <div class="dist-bar top10" style="width:${(d.top10/total)*100}%">${d.top10}</div>
        <div class="dist-bar top20" style="width:${(d.top20/total)*100}%">${d.top20}</div>
        <div class="dist-bar beyond" style="width:${(d.beyond/total)*100}%">${d.beyond}</div>
      `;
      
      // Keywords table
      document.getElementById('keywordTable').innerHTML = result.report.rankings.topKeywords.map(kw => {
        const changeClass = kw.change > 0 ? 'change-up' : kw.change < 0 ? 'change-down' : '';
        const changeIcon = kw.change > 0 ? '↑' : kw.change < 0 ? '↓' : '−';
        return `<tr><td>${kw.keyword}</td><td>${kw.position}</td><td>${formatNumber(kw.volume)}</td><td class="${changeClass}">${changeIcon} ${Math.abs(kw.change)}</td></tr>`;
      }).join('');
      
      // Recommendations
      document.getElementById('recList').innerHTML = result.report.recommendations.map(rec => `
        <div class="rec-item">
          <span class="rec-priority ${rec.priority}">${rec.priority}</span>
          <div class="rec-content">
            <div class="rec-title">${rec.title}</div>
            <div class="rec-desc">${rec.description}</div>
          </div>
        </div>
      `).join('');
    }
    
    function exportToSheet() {
      if (!currentReport) return;
      google.script.run
        .withSuccessHandler(r => showMessage(r.ok ? 'Exported to sheet!' : r.error, r.ok ? 'success' : 'error'))
        .withFailureHandler(e => showMessage(e.message, 'error'))
        .DB_exportReportToSheet({ report: currentReport });
    }
    
    function downloadHTML() {
      if (!currentReport) return;
      google.script.run
        .withSuccessHandler(r => {
          if (r.ok) {
            const blob = new Blob([r.html], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'seo-report.html';
            a.click();
          }
        })
        .DB_exportReportAsHTML({ report: currentReport });
    }
    
    function emailReport() {
      const email = prompt('Enter email address:');
      if (!email || !currentReport) return;
      google.script.run
        .withSuccessHandler(r => showMessage(r.ok ? 'Report sent!' : r.error, r.ok ? 'success' : 'error'))
        .withFailureHandler(e => showMessage(e.message, 'error'))
        .DB_emailReport({ email: email, report: currentReport });
    }
    
    function formatNumber(n) {
      if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
      return n.toString();
    }
    
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
      setTimeout(() => msg.className = 'message', 3000);
    }
  </script>
</body>
</html>
