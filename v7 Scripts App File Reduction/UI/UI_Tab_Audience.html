  // ===========================================================================

  //

  // - extractRealMetrics() from DATA_Real_Metrics.html
  // - renderExecutiveGeminiInsight() from UI_Executive_Renderer.html
  // - renderRawDataComparisonTable() from UI_Raw_Data_Tables.html
  // - renderOnePercentStrategyPanel() from UI_Strategy_Panel.html
  // - renderAudienceCharts() from UI_Chart_Generator.html
  // ===========================================================================
  // ---------------------------------------------------------------------------
  // IX. AUDIENCE & PSYCHOLOGICAL INTELLIGENCE TAB - Elite v9.0
  // ---------------------------------------------------------------------------
  // Uses: FT_GenerateEliteTabIntelligence ? Behavioral Archetypes, JTBD, 
  // Emotional Resonance, Cognitive Load + PHP Fetcher content analysis
  // ---------------------------------------------------------------------------
  function populateAudienceIntelligenceTab(data) {
    console.log('👥 Populating Audience Tab (Elite v9.0 - BEHAVIORAL ARCHETYPES)...');

    // V38.3: Wrap entire function in try-catch to prevent silent failures
    try {

    // V3.3: Use correct data-comp-panel selectors matching UI_Components_Competitors.html
    let metricsDiv = document.getElementById('comp-audience-metrics');

    if (!metricsDiv) {
      const panel = document.querySelector('[data-comp-panel="audience"]') ||
        document.getElementById('panel-audienceIntelligence');
      if (panel) {
        console.log('📦 Creating dynamic containers inside audience panel');
        metricsDiv = panel.querySelector('#comp-audience-metrics') || (() => {
          const c = document.createElement('div'); c.id = 'comp-audience-metrics'; c.className = 'comp-metrics-grid'; c.style.width = '100%';
          const h = panel.querySelector('.panel-header'); if (h?.nextSibling) panel.insertBefore(c, h.nextSibling); else panel.insertBefore(c, panel.firstChild);
          return c;
        })();
      }
    }

    if (!metricsDiv) {
      console.warn('⚠️ Audience tab containers not found - check UI_Components_Competitors.html has data-comp-panel="audience"');
      return;
    }

    const competitors = data.competitors || [];

    if (competitors.length === 0) {
      metricsDiv.innerHTML = '<div class="empty-state" style="text-align:center;padding:40px;"><p>No competitors to analyze.</p></div>';
      return;
    }

    // ---------------------------------------------------------------------------
    // ELITE TAB INTELLIGENCE v9.0 - Check for enhanced data
    // V38.2 FIX: Always render BOTH Elite AND fallback content for maximum value
    // ---------------------------------------------------------------------------
    const eliteData = data.eliteTabIntelligence || window._eliteTabIntelligence;
    const audienceIntel = eliteData?.audienceIntelligence;

    // V38.2: Log Elite data availability but ALWAYS compute fallback metrics too
    if (audienceIntel) {
      console.log('🎯 Using ELITE Tab Intelligence v9.0 for Audience Tab (with rich fallback data)');
      console.log('   Archetypes:', audienceIntel.archetypes?.length || 0);
      console.log('   JTBD Analysis:', !!audienceIntel.jtbdAnalysis);
      console.log('   Emotional Resonance:', !!audienceIntel.emotionalResonance);
      console.log('   Kill Moves:', audienceIntel.killMoves?.length || 0);
    }

    // V38.2: ALWAYS compute fallback metrics - they provide the rich data tables
    // The Elite renderer will be added at the TOP, then fallback content follows

    // COMBINED MODE: Extract REAL audience metrics + Elite enhancements
    console.log('📊 Using combined audience analysis mode (Rich fallback + Elite enhancements)...');

    // Extract REAL audience metrics from PHP Fetcher data
    const audienceMetrics = competitors.map(comp => {
      const metrics = extractRealMetrics(comp);
      const synth = comp.synthesized || {};
      const content = synth.content || {};
      const title = metrics.content.title || '';
      const meta = synth.metaDescription || content.metaDescription || '';
      const fullText = (title + ' ' + meta + ' ' + JSON.stringify(synth)).toLowerCase();

      // REAL audience detection from content analysis
      const b2bSignals = ['enterprise', 'business', 'team', 'organization', 'company', 'corporate', 'b2b', 'saas', 'platform'];
      const b2cSignals = ['personal', 'individual', 'user', 'home', 'family', 'b2c', 'consumer', 'you', 'your'];
      const technicalSignals = ['api', 'developer', 'code', 'technical', 'integration', 'sdk', 'documentation'];
      const marketingSignals = ['seo', 'marketing', 'growth', 'campaign', 'traffic', 'conversion', 'leads'];

      const b2bScore = b2bSignals.filter(s => fullText.includes(s)).length;
      const b2cScore = b2cSignals.filter(s => fullText.includes(s)).length;
      const techScore = technicalSignals.filter(s => fullText.includes(s)).length;
      const marketingScore = marketingSignals.filter(s => fullText.includes(s)).length;

      // Determine target audience from REAL signals
      let targetAudience = 'Mixed';
      if (b2bScore > b2cScore + 1) targetAudience = 'B2B Enterprise';
      else if (b2cScore > b2bScore + 1) targetAudience = 'B2C Consumer';
      else if (techScore > 2) targetAudience = 'Technical Users';
      else if (marketingScore > 2) targetAudience = 'Marketing Professionals';

      // Calculate persona depth from REAL content signals
      let personaDepth = 20; // Base
      if (metrics.content.wordCount >= 2000) personaDepth += 20;
      else if (metrics.content.wordCount >= 1000) personaDepth += 10;
      if (content.headings?.length >= 5) personaDepth += 15;
      if (metrics.content.schemaTypes?.length >= 2) personaDepth += 15;
      if (title.length > 30 && title.length < 70) personaDepth += 10;
      if (meta.length > 100) personaDepth += 10;
      personaDepth = Math.min(100, personaDepth);

      // Calculate content quality score as JTBD match proxy
      let jtbdMatch = 30; // Base
      if (metrics.content.internalLinks >= 10) jtbdMatch += 15;
      if (metrics.content.schemaTypes?.length >= 1) jtbdMatch += 15;
      if (metrics.technical.seo >= 80) jtbdMatch += 20;
      if (metrics.content.wordCount >= 1500) jtbdMatch += 20;
      jtbdMatch = Math.min(100, jtbdMatch);

      // Emotional signals detection
      const emotionalWords = ['best', 'amazing', 'powerful', 'easy', 'fast', 'free', 'trusted', 'proven', 'top'];
      const emotionalCount = emotionalWords.filter(w => fullText.includes(w)).length;
      const emotionalResonance = Math.min(100, 30 + (emotionalCount * 10) + (marketingScore * 5));

      const hasRealData = metrics.content.wordCount > 0 || title.length > 0;

      return {
        domain: comp.domain || comp.url,
        targetAudience,
        personaDepth,
        jtbdMatch,
        emotionalResonance,
        wordCount: metrics.content.wordCount,
        b2bScore,
        b2cScore,
        techScore,
        marketingScore,
        dataSource: hasRealData ? 'PHP Fetcher' : 'Pending'
      };
    });

    // Detect detected personas from REAL data
    const personaCounts = {
      'Technical Users': audienceMetrics.filter(a => a.techScore >= 2).length,
      'Marketing Professionals': audienceMetrics.filter(a => a.marketingScore >= 2).length,
      'B2B Enterprise': audienceMetrics.filter(a => a.b2bScore >= 2).length,
      'B2C Consumer': audienceMetrics.filter(a => a.b2cScore >= 2).length
    };

    // EXECUTIVE INTELLIGENCE BRIEF - Audience Intelligence
    const gemini = data.geminiAnalysis || data.analysis || {};
    const audienceExecConfig = generateExecutiveInsightConfig('audience', competitors, gemini);

    let html = renderExecutiveGeminiInsight(audienceExecConfig);
    
    html += `

        `;

            </tbody>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px;">
            ${Object.entries(personaCounts).map(([persona, count], i) => {
      const prevalence = audienceMetrics.length > 0 ? Math.round((count / audienceMetrics.length) * 100) : 0;
      return `
              <div style="background: linear-gradient(135deg, ${['#ec4899', '#8b5cf6', '#0ea5e9', '#22c55e'][i]} 0%, ${['#db2777', '#7c3aed', '#0284c7', '#16a34a'][i]} 100%); color: white; padding: 20px; border-radius: 12px;">
                <div style="font-size: 24px; margin-bottom: 8px;">${['👤', '📈', '💻', '🛒'][i]}</div>

                <div style="font-size: 12px; opacity: 0.85; margin-top: 4px;">Detected: ${count}/${audienceMetrics.length} (${prevalence}%)</div>
              </div>
            `}).join('')}
          </div>
          
          <!-- STRATEGIC INSIGHTS FROM REAL DATA -->
          <div style="background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 100%); padding: 24px; border-radius: 16px; border-left: 4px solid #ec4899;">
            <h5 style="margin: 0 0 12px; font-size: 16px; font-weight: 700; color: #9d174d;">💡 Audience Intelligence Insights</h5>
            ${(() => {
        const sorted = [...audienceMetrics].sort((a, b) => b.personaDepth - a.personaDepth);
        const leader = sorted[0];
        const avgDepth = Math.round(audienceMetrics.reduce((a, b) => a + b.personaDepth, 0) / audienceMetrics.length);
        const dominantAudience = Object.entries(personaCounts).sort((a, b) => b[1] - a[1])[0];

        return `
                <ul style="margin: 0; padding-left: 20px;">
                  <li style="margin-bottom: 8px; color: #831843; line-height: 1.5;">
                    <strong>Content Leader:</strong> ${leader?.domain || 'N/A'} with persona depth of ${leader?.personaDepth || 0}/100
                    ${leader?.wordCount ? `(${leader.wordCount.toLocaleString()} words)` : ''}
                  </li>
                  <li style="margin-bottom: 8px; color: #831843; line-height: 1.5;">
                    <strong>Primary Audience:</strong> ${dominantAudience ? `${dominantAudience[0]} (${dominantAudience[1]} competitors target this)` : 'Mixed audiences'}
                  </li>
                  <li style="margin-bottom: 8px; color: #831843; line-height: 1.5;">
                    <strong>Content Strategy:</strong> ${avgDepth >= 70 ? 'High persona understanding across competitors - differentiate with unique angles.' : avgDepth >= 50 ? 'Moderate persona targeting - opportunity to deepen audience understanding.' : 'Low persona depth - significant opportunity for audience-focused content.'}
                  </li>
                </ul>
              `;
      })()}
          </div>
          
          <!-- --------------------------------------------------------------- -->
          <!-- RAW DATA COMPARISON SECTION - Audience Deep Dive               -->
          <!-- --------------------------------------------------------------- -->
          
          ${renderRawDataComparisonTable({
            title: 'Audience Targeting Signals',
            icon: '🎯',
            description: 'Compare detected audience signals and persona depth across competitors',
            competitors: competitors,
            geminiInsight: 'Audience targeting analysis: ' + (() => {
              const sorted = [...audienceMetrics].sort((a, b) => b.personaDepth - a.personaDepth);
              const leader = sorted[0];
              const avgDepth = audienceMetrics.length > 0 ? Math.round(audienceMetrics.reduce((a, b) => a + b.personaDepth, 0) / audienceMetrics.length) : 0;
              return (leader?.domain || 'Leading competitor') + ' shows deepest persona understanding at ' + (leader?.personaDepth || 0) + '/100. ' +
                'Industry average: ' + avgDepth + '/100. ' +
                (leader?.targetAudience ? 'Primary focus: ' + leader.targetAudience + '. ' : '') +
                (avgDepth < 50 ? 'Low persona depth across industry presents differentiation opportunity.' : 'Mature audience targeting - focus on unique value propositions.');
            })(),
            dataExtractor: (c, idx, realMetrics) => {
              const d = audienceMetrics[idx] || {};
              const rm = realMetrics || {};
              const wordCount = rm.content?.wordCount || d.wordCount || 0;
              const headings = rm.content?.headingStructure?.length || d.headingCount || 0;
              const calcPersonaDepth = d.personaDepth || Math.min(100, Math.round((wordCount / 30) + (headings * 3)));
              return {
                targetAudience: d.targetAudience || rm.content?.targetAudience || (wordCount > 2000 ? 'In-depth Research' : 'General'),
                personaDepth: calcPersonaDepth,
                jtbdMatch: d.jtbdMatch || Math.min(100, Math.round(calcPersonaDepth * 0.9)),
                emotionalResonance: d.emotionalResonance || Math.min(100, Math.round(calcPersonaDepth * 0.7)),
                b2bScore: d.b2bScore || 0,
                b2cScore: d.b2cScore || 0
              };
            },
            fields: [
              { key: 'targetAudience', label: 'Target Audience', icon: '👥', type: 'text', compareMode: null },
              { key: 'personaDepth', label: 'Persona Depth', icon: '📊', type: 'score', compareMode: 'highest' },
              { key: 'jtbdMatch', label: 'JTBD Match', icon: '🎯', type: 'score', compareMode: 'highest' },
              { key: 'emotionalResonance', label: 'Emotional Resonance', icon: '💖', type: 'score', compareMode: 'highest' }
            ]
          })}
          
          ${renderRawDataComparisonTable({
            title: 'Content Targeting Evidence',
            icon: '📝',
            description: 'Real content metrics that indicate audience focus',
            competitors: competitors,
            geminiInsight: 'Content targeting evidence: ' + (() => {
              const withContent = audienceMetrics.filter(a => a.wordCount > 0);
              if (withContent.length === 0) return 'No content data available for analysis.';
              const avgWords = Math.round(withContent.reduce((a, b) => a + b.wordCount, 0) / withContent.length);
              const leader = [...withContent].sort((a, b) => b.wordCount - a.wordCount)[0];
              return (leader?.domain || 'Leader') + ' invests heavily with ' + (leader?.wordCount?.toLocaleString() || 0) + ' words. ' +
                'Industry average: ' + avgWords.toLocaleString() + ' words. ' +
                (avgWords > 2000 ? 'Long-form content standard indicates educated audience expectations.' : 
                 avgWords > 1000 ? 'Moderate content depth - opportunity for comprehensive guides.' : 
                 'Short-form dominates - consider detailed content differentiation strategy.');
            })(),
            dataExtractor: (c, idx, realMetrics) => {
              const d = audienceMetrics[idx] || {};
              const rm = realMetrics || {};
              return {
                wordCount: rm.content?.wordCount || d.wordCount || 0,
                readingLevel: d.readingLevel || rm.content?.readingLevel || (rm.content?.wordCount > 2500 ? 'Advanced' : rm.content?.wordCount > 1200 ? 'Intermediate' : 'Basic'),
                headingCount: rm.content?.headingStructure?.length || d.headingCount || 0,
                schemaCount: rm.content?.schemaTypes?.length || d.schemaCount || 0
              };
            },
            fields: [
              { key: 'wordCount', label: 'Word Count', icon: '📊', type: 'number', compareMode: 'highest' },
              { key: 'readingLevel', label: 'Reading Level', icon: '📚', type: 'text', compareMode: null },
              { key: 'headingCount', label: 'Heading Count', icon: '📋', type: 'number', compareMode: 'highest' },
              { key: 'schemaCount', label: 'Schema Types', icon: '🔧', type: 'number', compareMode: 'highest' }
            ]
          })}
        `;

    // V38.2: Add Elite Enhancements if available (JTBD, Archetypes, Emotional Resonance)
    if (audienceIntel) {
      const archetypes = audienceIntel.archetypes || [];
      const jtbd = audienceIntel.jtbdAnalysis || {};
      const emotional = audienceIntel.emotionalResonance || {};
      
      if (archetypes.length > 0) {
        html += `

      if ((jtbd.primaryStruggles || []).length > 0) {
        html += `

            ${(jtbd.primaryStruggles || []).map(struggle => `
              <div style="background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid ${struggle.severity >= 80 ? '#ef4444' : struggle.severity >= 60 ? '#f59e0b' : '#22c55e'};">

        <div class="chart-container-full" style="background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);">

          <div style="height: 240px; width: 100%;"><canvas id="chart-geo-platforms" style="width: 100% !important;"></canvas></div>
        </div>

        <h5 style="margin: 0 0 12px; font-size: 16px; font-weight: 700; color: #0e7490;">💡 AI Search Strategy Insights</h5>
        ${(() => {
          const sorted = [...geoData].sort((a, b) => b.aiReadinessScore - a.aiReadinessScore);
          const leader = sorted[0];
          const hasFAQ = geoData.some(g => g.schemaTypes.includes('FAQPage'));
          const hasHowTo = geoData.some(g => g.schemaTypes.includes('HowTo'));
          return `
            <ul style="margin: 0; padding-left: 20px;">
              <li style="margin-bottom: 8px; color: #164e63; line-height: 1.5;">
                <strong>AI-Ready Leader:</strong> ${leader?.domain || 'N/A'} with ${leader?.aiReadinessScore || 0}% readiness score
              </li>
              <li style="margin-bottom: 8px; color: #164e63; line-height: 1.5;">
                <strong>Schema Coverage:</strong> ${totalSchemas} implementations. ${hasFAQ ? '✅ FAQPage detected' : '⚠️ No FAQPage schema'}

              <li style="margin-bottom: 8px; color: #164e63; line-height: 1.5;">
                <strong>Answer Engine:</strong> ${hasHowTo ? 'HowTo schema present' : 'Consider HowTo schema for procedural queries'}

    metricsDiv.innerHTML = html;
