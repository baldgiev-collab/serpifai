// Helper: Generate estimated top referrers based on backlink profile and domain context
function generateTopReferrers(totalBacklinks, avgDR, targetDomain) {
  // V10.2: Context-aware referrer estimation
  // For old cached data with zeros, we estimate based on avgDR or default
  let effectiveBacklinks = totalBacklinks || 0;
  let effectiveDR = avgDR || 35;
  
  // If no backlink data, estimate based on DR tier
  if (effectiveBacklinks <= 0) {
    console.log('[Elite Modals] generateTopReferrers: No backlinks data - generating estimates for', targetDomain);
    if (effectiveDR >= 70) effectiveBacklinks = 5000;
    else if (effectiveDR >= 50) effectiveBacklinks = 1500;
    else if (effectiveDR >= 30) effectiveBacklinks = 400;
    else effectiveBacklinks = 100;
  }
  
  // V10.2: Determine industry from domain name
  const domainLower = (targetDomain || '').toLowerCase();
  let industry = 'general';
  if (/tech|software|app|dev|code|api|cloud/.test(domainLower)) industry = 'tech';
  else if (/shop|store|buy|ecom|market|sale/.test(domainLower)) industry = 'ecommerce';
  else if (/finance|bank|invest|money|trading/.test(domainLower)) industry = 'finance';
  else if (/health|med|doctor|clinic|wellness/.test(domainLower)) industry = 'health';
  else if (/edu|learn|course|school|academy|train/.test(domainLower)) industry = 'education';
  else if (/blog|news|media|journal|magazine/.test(domainLower)) industry = 'media';
  
  // Industry-specific referrer templates
  const industryReferrers = {
    tech: [
      { domain: 'github.com', dr: 92, type: 'Repository', base: 0.015 },
      { domain: 'stackoverflow.com', dr: 91, type: 'QA', base: 0.012 },

    const EXCLUDE_PATTERNS = [

    topPages = topPages.filter(page => {
      const url = (page.url || '').toLowerCase();
      return !EXCLUDE_PATTERNS.some(pattern => pattern.test(url));

    if (topPages.length === 0) {

    // V10.2 FIX: Apply CTR model to calculate traffic for pages with 0 traffic
    const CTR_MODEL = { 1: 0.398, 2: 0.187, 3: 0.102, 4: 0.074, 5: 0.051, 6: 0.044, 7: 0.030, 8: 0.021, 9: 0.019, 10: 0.016 };
    // CRITICAL: Ensure we have a reasonable base traffic - use authority-based estimate if needed
    let baseMonthlyTraffic = data.organicTraffic || data.monthlyTraffic || 0;
    if (baseMonthlyTraffic <= 0) {
      // Estimate base traffic from authority score or default

    'CA': { name: 'Canada', flag: '🇨🇦' },

    'co': 'US', 'us': 'US',
    'uk': 'GB', 'co.uk': 'GB', 'eu': 'GB',
    'de': 'DE', 'fr': 'FR', 'es': 'ES', 'it': 'IT', 'nl': 'NL',
    'ca': 'CA', 'au': 'AU', 'in': 'IN', 'jp': 'JP', 'br': 'BR'
  };
  
  const primary = tldPrimary[tld] || 'US';
  
  // Generate distribution based on primary market
  const distributions = {
    'US': [
      { code: 'US', percent: 55 },
      { code: 'GB', percent: 12 },
      { code: 'CA', percent: 8 },
      { code: 'AU', percent: 6 },
      { code: 'IN', percent: 5 },
      { code: 'DE', percent: 4 }
    ],
    'GB': [
      { code: 'GB', percent: 50 },
      { code: 'US', percent: 18 },
      { code: 'AU', percent: 8 },
      { code: 'CA', percent: 6 },
      { code: 'DE', percent: 5 },
      { code: 'FR', percent: 4 }
    ],
    'DE': [
      { code: 'DE', percent: 55 },
      { code: 'AT', percent: 12 },
      { code: 'CH', percent: 10 },
      { code: 'NL', percent: 5 },
      { code: 'US', percent: 5 }

  return dist.map(d => ({

  }));
}

    // V10.0: CTR Model enrichment for keywords with zero values
    const CTR_CURVE = { 1: 0.398, 2: 0.187, 3: 0.102, 4: 0.074, 5: 0.051, 6: 0.044, 7: 0.030, 8: 0.021, 9: 0.019, 10: 0.016 };

      let volume = kw.volume || kw.sv || 0;

      let cpc = kw.cpc || 0;
      let difficulty = kw.difficulty || kw.kd || 0;
      let value = kw.value || 0;
      const position = kw.position || (idx + 1);
      const keyword = kw.keyword || kw.query || kw.term || '';
      
      // If volume is 0, estimate from keyword length
      if (volume === 0 || volume === undefined) {
        const wordCount = keyword.split(/\s+/).length;
        volume = wordCount <= 2 ? (2500 + Math.floor(Math.random() * 1500)) : 
                 wordCount <= 4 ? (800 + Math.floor(Math.random() * 600)) : 
                                  (150 + Math.floor(Math.random() * 300));
      }
      
      // If traffic is 0, calculate from position + volume
      if ((traffic === 0 || traffic === undefined) && position > 0 && position <= 10) {
        const ctr = CTR_CURVE[position] || 0.016;
        traffic = Math.round(volume * ctr);
      }
      
      // If difficulty is 0, estimate from position
      if (difficulty === 0 || difficulty === undefined) {
        difficulty = position <= 3 ? (35 + Math.floor(Math.random() * 25)) :
                     position <= 7 ? (25 + Math.floor(Math.random() * 20)) :
                                     (15 + Math.floor(Math.random() * 20));
      }
      
      // If CPC is 0, estimate from keyword patterns
      if (cpc === 0 || cpc === undefined) {
        const kwLower = keyword.toLowerCase();
        cpc = /buy|price|cost|shop|deal/.test(kwLower) ? (2.5 + Math.random() * 3) :
              /best|top|review|vs/.test(kwLower) ? (1.5 + Math.random() * 2) :
                                                    (0.8 + Math.random() * 1.5);
        cpc = Math.round(cpc * 100) / 100;
      }
      
      // Calculate value

      }
      
      return { ...kw, keyword, volume, traffic, cpc, difficulty, value, position };
    });

                  <span style="background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 500;">ELITE</span>
                </h2>
                <p style="margin: 0; font-size: 14px; opacity: 0.9;">
                  ${domain} • ${data.totalKeywords?.toLocaleString() || data.estimatedTotal?.toLocaleString() || 0} total keywords
                  ${isEstimated ? '<span style="background: rgba(255,255,255,0.2); margin-left: 8px; padding: 2px 8px; border-radius: 10px; font-size: 10px;">~ESTIMATED</span>' : ''}
                </p>
              </div>
              <button onclick="this.closest('#keyword-clustering-modal').remove()" style="background: rgba(255,255,255,0.15); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 20px;">×</button>
            </div>
          </div>
          
          <!-- Keyword Type Cards Grid - V9.5: Added scrolling -->
          <div style="padding: 20px 28px; background: #f8fafc; border-bottom: 1px solid #e5e7eb; max-height: 35vh; overflow-y: auto;">
            ${hasData ? `
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
              ${buildClusterCard('primary', enrichedBreakdown.primary, COLORS.primary)}
              ${buildClusterCard('semantic', enrichedBreakdown.semantic, COLORS.semantic)}
              ${buildClusterCard('longtail', enrichedBreakdown.longtail, COLORS.longtail)}
              ${buildClusterCard('secondary', enrichedBreakdown.secondary, COLORS.secondary)}
            </div>
            ` : `
            <div style="text-align: center; padding: 32px; color: #6b7280;">
              <div style="font-size: 48px; margin-bottom: 16px;">🔑</div>
              <div style="font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #374151;">Loading Keyword Data...</div>
              <div style="font-size: 13px; color: #9ca3af; max-width: 400px; margin: 0 auto;">
                Re-run competitor analysis to generate keyword intelligence.
              </div>
            </div>
            `}
          </div>
          
          <!-- Main Content: 2 Columns -->
          <div style="display: grid; grid-template-columns: 1.5fr 1fr; max-height: 45vh; overflow: hidden;">
            
            <!-- Left: Top Keywords Table -->
            <div style="border-right: 1px solid #e5e7eb; overflow-y: auto;">
              <div style="padding: 16px 24px 10px; position: sticky; top: 0; background: white; border-bottom: 1px solid #e5e7eb;">
                <h3 style="margin: 0; font-size: 15px; font-weight: 700; color: #1f2937;">📊 Top Performing Keywords</h3>
              </div>
              <table style="width: 100%; border-collapse: collapse; font-size: 12px;">
                <thead style="position: sticky; top: 42px; background: #f9fafb;">
                  <tr>
                    <th style="padding: 10px; text-align: left; font-size: 10px; color: #6b7280; text-transform: uppercase;">Keyword</th>
                    <th style="padding: 10px; text-align: center; font-size: 10px; color: #6b7280;">Pos</th>
                    <th style="padding: 10px; text-align: right; font-size: 10px; color: #6b7280;">Volume</th>
                    <th style="padding: 10px; text-align: right; font-size: 10px; color: #6b7280;">Traffic</th>
                    <th style="padding: 10px; text-align: center; font-size: 10px; color: #6b7280;">Intent</th>
                    <th style="padding: 10px; text-align: center; font-size: 10px; color: #6b7280;">KD</th>
                  </tr>
                </thead>
                <tbody>${topKwHtml}</tbody>
              </table>
            </div>
            
            <!-- Right: Intent & Position Distribution -->
            <div style="overflow-y: auto; padding: 20px 24px;">
              <h3 style="margin: 0 0 16px; font-size: 15px; font-weight: 700; color: #1f2937;">🎯 Search Intent Mix</h3>
              ${intentHtml || '<div style="color: #9ca3af; font-size: 13px;">No intent data available</div>'}
              
              <h3 style="margin: 24px 0 16px; font-size: 15px; font-weight: 700; color: #1f2937;">📈 Position Distribution</h3>
              <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
                ${posHtml || '<div style="color: #9ca3af; font-size: 13px;">No position data</div>'}
              </div>
              
              <!-- Clusters Summary -->
              ${clusters.length > 0 ? `
                <h3 style="margin: 24px 0 12px; font-size: 15px; font-weight: 700; color: #1f2937;">🔗 Topic Clusters</h3>
                <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                  ${clusters.slice(0, 6).map(c => `
                    <span style="background: #f3f4f6; border: 1px solid #e5e7eb; padding: 6px 12px; border-radius: 20px; font-size: 11px; color: #374151;">
                      ${c.name} <span style="color: #9ca3af;">(${(c.keywords || []).length})</span>
                    </span>
                  `).join('')}
                </div>
              ` : ''}
              
              <!-- V9.5: Force-Directed Mind Map Button - ALWAYS visible -->
              <button onclick="window._showMindMapView('${domain}')" style="margin-top: 20px; width: 100%; background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%); color: white; border: none; padding: 14px 18px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3); transition: all 0.3s ease;" onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 6px 20px rgba(124, 58, 237, 0.4)'" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 4px 15px rgba(124, 58, 237, 0.3)'">
                🗺️ Open KW Strategy Map
                <span style="background: rgba(255,255,255,0.2); padding: 3px 8px; border-radius: 6px; font-size: 11px;">Force-Directed</span>
              </button>
            </div>
          </div>
          
          <!-- Footer with Data Source -->
          <div style="padding: 14px 28px; background: #f8fafc; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center;">
            <div style="font-size: 11px; color: #64748b; display: flex; align-items: center; gap: 12px;">
              <span>${sourceIcon} Source: <span style="color: ${sourceColor}; font-weight: 600;">${dataSource}</span></span>
              ${isEstimated ? '<span style="background: #fef3c7; color: #92400e; padding: 2px 6px; border-radius: 4px; font-size: 9px;">ESTIMATED</span>' : '<span style="background: #dcfce7; color: #166534; padding: 2px 6px; border-radius: 4px; font-size: 9px;">VERIFIED</span>'}
              <span>Confidence: <span style="color: ${sourceColor}; font-weight: 600;">${confidencePercent}%</span></span>
            </div>
            <button onclick="exportKeywords('${domain}')" style="background: #7c3aed; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer;">
              📥 Export Keywords
            </button>
          </div>
        </div>
      </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    // V12.0: Store keywords for mind map with TYPE-BASED clustering
    // Breakdown keywords already have type information (primary/semantic/longtail/secondary)
    const typeMap = { primary: 0, semantic: 1, longtail: 2, secondary: 3 };
    
    let allKeywordsForMindMap = [];
    if (topKeywords.length > 0) {
      // Enrich topKeywords with type from position in breakdown
      allKeywordsForMindMap = topKeywords.map(kw => {
        let type = kw.type || '';
        if (!type) {
          // Check which breakdown category this keyword belongs to
          const kwText = (kw.keyword || kw.term || '').toLowerCase();
          if (enrichedBreakdown.primary.some(k => (k.keyword || k).toLowerCase() === kwText)) type = 'primary';
          else if (enrichedBreakdown.semantic.some(k => (k.keyword || k).toLowerCase() === kwText)) type = 'semantic';
          else if (enrichedBreakdown.longtail.some(k => (k.keyword || k).toLowerCase() === kwText)) type = 'longtail';
          else if (enrichedBreakdown.secondary.some(k => (k.keyword || k).toLowerCase() === kwText)) type = 'secondary';
        }
        return { ...kw, type };
      });
    } else {
      // Use breakdown keywords with their explicit types
      allKeywordsForMindMap = [
        ...enrichedBreakdown.primary.map(k => {
          const kw = typeof k === 'string' ? { keyword: k } : k;
          return { ...kw, type: 'primary', difficulty: kw.difficulty || kw.kd || 0, volume: kw.volume || kw.sv || 0, traffic: kw.traffic || 0 };
        }),
        ...enrichedBreakdown.semantic.map(k => {
          const kw = typeof k === 'string' ? { keyword: k } : k;
          return { ...kw, type: 'semantic', difficulty: kw.difficulty || kw.kd || 0, volume: kw.volume || kw.sv || 0, traffic: kw.traffic || 0 };
        }),
        ...enrichedBreakdown.longtail.map(k => {
          const kw = typeof k === 'string' ? { keyword: k } : k;
          return { ...kw, type: 'longtail', difficulty: kw.difficulty || kw.kd || 0, volume: kw.volume || kw.sv || 0, traffic: kw.traffic || 0 };
        }),
        ...enrichedBreakdown.secondary.map(k => {
          const kw = typeof k === 'string' ? { keyword: k } : k;
          return { ...kw, type: 'secondary', difficulty: kw.difficulty || kw.kd || 0, volume: kw.volume || kw.sv || 0, traffic: kw.traffic || 0 };
        })
      ];
    }
    
    window._mindMapKeywords = allKeywordsForMindMap.slice(0, 50);
    console.log(`[Keyword Clustering V12.0] Stored ${window._mindMapKeywords.length} keywords with type clustering for Mind Map`);
  } catch (e) {
    console.error('[Keyword Clustering Modal] Error:', e);
  }
};
