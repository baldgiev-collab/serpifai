/**
 * Generate strategic insight for a chart based on the data
 * @param {string} chartType - Type of chart (traffic, authority, backlinks, etc.)
 * @param {Array} competitors - Competitor data
 * @param {object} chartData - Processed chart data
 * @returns {string} HTML for the insight box
 */
function generateChartInsight(chartType, competitors, chartData) {
  if (!competitors || competitors.length === 0) return '';
  
  // Sort by relevant metric
  const sorted = [...competitors].sort((a, b) => {
    const pm_a = a.processedMetrics || {};
    const pm_b = b.processedMetrics || {};
    
    switch(chartType) {
      case 'traffic':
        return (pm_b.estimatedTraffic || 0) - (pm_a.estimatedTraffic || 0);
      case 'authority':
        return (pm_b.pageRank || 0) - (pm_a.pageRank || 0);
      case 'backlinks':
        return (pm_b.backlinks || pm_b.estimatedBacklinks || 0) - (pm_a.backlinks || pm_a.estimatedBacklinks || 0);
      case 'health':
        return (pm_b.seoScore || 0) - (pm_a.seoScore || 0);
      default:
        return 0;
    }
  });
  
  const leader = sorted[0];
  const leaderPm = leader.processedMetrics || {};
  const yourDomain = window.yourDomain || sorted[sorted.length - 1]?.domain || 'Your Domain';
  
  let insight = '';
  let actionItem = '';
  let icon = '💡';
  
  switch(chartType) {
    case 'traffic':
      const totalTraffic = competitors.reduce((sum, c) => sum + (c.processedMetrics?.estimatedTraffic || 0), 0);
      const leaderShare = totalTraffic > 0 ? Math.round((leaderPm.estimatedTraffic || 0) / totalTraffic * 100) : 0;
      insight = `<strong>${leader.domain}</strong> dominates with ${leaderShare}% of total organic traffic. Their PageRank of ${leaderPm.pageRank?.toFixed(1) || 'N/A'} drives significant search visibility.`;
      actionItem = `Focus on content velocity and high-intent keywords to close the traffic gap. Target ${Math.round((leaderPm.estimatedTraffic || 0) * 0.1)} monthly visits as a 6-month goal.`;
      icon = '🚦';
      break;
      
    case 'authority':
      const avgAuthority = competitors.reduce((sum, c) => sum + (c.processedMetrics?.pageRank || 0) * 10, 0) / competitors.length;
      insight = `<strong>${leader.domain}</strong> leads with PageRank ${leaderPm.pageRank?.toFixed(1) || 'N/A'} (Authority: ${Math.round((leaderPm.pageRank || 0) * 10)}). Market average authority is ${avgAuthority.toFixed(0)}.`;
      actionItem = `Build authority through high-quality backlinks from .edu and .gov domains. Target ${Math.round(leaderPm.organicKeywords * 0.3)} new ranking keywords in Q1.`;
      icon = '👑';
      break;
      
    case 'backlinks':
      const leaderBacklinks = leaderPm.backlinks || leaderPm.estimatedBacklinks || 0;
      const leaderRefDomains = leaderPm.refDomains || leaderPm.estimatedRefDomains || 0;
      const ratio = leaderRefDomains > 0 ? (leaderBacklinks / leaderRefDomains).toFixed(1) : 0;
      insight = `<strong>${leader.domain}</strong> has ${formatLargeNumber(leaderBacklinks)} backlinks from ${formatLargeNumber(leaderRefDomains)} referring domains (${ratio} links per domain).`;
      actionItem = `Prioritize link acquisition from unique domains. A healthy ratio is 10-20 links per domain. Consider HARO, guest posting, and digital PR campaigns.`;
      icon = '🔗';
      break;
      
    case 'health':
      const avgHealth = competitors.reduce((sum, c) => sum + (c.processedMetrics?.seoScore || 0), 0) / competitors.length;
      insight = `<strong>${leader.domain}</strong> leads in technical SEO with a ${leaderPm.seoScore || 0}% score. Market average is ${avgHealth.toFixed(0)}%. Performance score: ${leaderPm.performanceScore || 0}%.`;
      actionItem = `Quick wins: Optimize Core Web Vitals (LCP < 2.5s, FID < 100ms, CLS < 0.1). This can improve rankings by 15-20% in competitive SERPs.`;
      icon = '💪';
      break;
      
    case 'keywords':
      const leaderKeywords = leaderPm.organicKeywords || leaderPm.estimatedOrganicKeywords || 0;
      insight = `<strong>${leader.domain}</strong> ranks for ${formatLargeNumber(leaderKeywords)} organic keywords. Top 3 positions typically drive 60%+ of organic traffic.`;
      actionItem = `Focus on semantic keyword clusters. For every head term, target 10-15 long-tail variations. Use content hubs to dominate topical authority.`;
      icon = '🔑';
      break;
      
    case 'ai':
      insight = `AI visibility is the next frontier. Structured data, E-E-A-T signals, and FAQ schema increase AI citation probability by 40%.`;
      actionItem = `Implement FAQ, HowTo, and Organization schema. Create definitive, authoritative content that AI models will cite as sources.`;
      icon = '🤖';
      break;
      
    default:
      insight = 'Analyze the data above to identify strategic opportunities.';
      actionItem = 'Review competitor patterns and identify gaps in your strategy.';
  }
  
  return `
    <div style="margin-top: 16px; background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); padding: 16px; border-radius: 12px; border-left: 4px solid #0284c7;">
      <div style="display: flex; align-items: start; gap: 12px;">
        <span style="font-size: 24px;">${icon}</span>
        <div style="flex: 1;">
          <div style="font-size: 11px; font-weight: 600; color: #0369a1; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Strategic Insight</div>
          <p style="margin: 0 0 10px; font-size: 13px; line-height: 1.6; color: #334155;">${insight}</p>
          <div style="background: white; padding: 10px 12px; border-radius: 8px; font-size: 12px; color: #065f46; border: 1px solid #a7f3d0;">
            <strong>💡 Action:</strong> ${actionItem}
          </div>
        </div>
      </div>
    </div>
  `;
}

/**
 * Format large numbers for display
 */
function formatLargeNumber(num) {
  if (!num || isNaN(num)) return '0';
  if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
  if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
  return num.toString();
}

/**
 * Insert insight below a chart canvas
 */
function insertChartInsight(chartId, insightHtml) {
  const canvas = document.getElementById(chartId);
  if (!canvas) return;
  
  // Find or create insight container
  const existingInsight = canvas.parentElement.querySelector('.chart-insight');
  if (existingInsight) {
    existingInsight.innerHTML = insightHtml;
  } else {
    const insightDiv = document.createElement('div');
    insightDiv.className = 'chart-insight';
    insightDiv.innerHTML = insightHtml;
    canvas.parentElement.appendChild(insightDiv);
  }
}

  // Destroy existing overview charts
  Object.keys(window.overviewCharts).forEach(key => {
    if (window.overviewCharts[key]) {
      window.overviewCharts[key].destroy();
      delete window.overviewCharts[key];

  // Render 6 elite charts with insights
  renderTrafficDistributionChart(competitors);
  renderAuthorityKeywordsScatter(competitors);
  renderBacklinkProfileChart(competitors);

  renderKeywordRankingDistribution(competitors);
  renderAIVisibilityChart(competitors);
}

/**
 * 1. TRAFFIC DISTRIBUTION - Doughnut chart showing estimated organic traffic share
 */
function renderTrafficDistributionChart(competitors) {
  const ctx = document.getElementById('chart-overview-traffic');
  if (!ctx) return;
  
  // SAFE: Filter out invalid competitors and extract domains safely
  const validCompetitors = competitors.filter(c => c && c.domain);
  if (validCompetitors.length === 0) {
    console.warn('⚠️ No valid competitors with domains found');
    return;
  }
  
  const domains = validCompetitors.map(c => c.domain || 'Unknown');
  const trafficData = validCompetitors.map(comp => {
    const pm = comp.processedMetrics || {};
    
    // Priority 1: Use estimatedTraffic from processedMetrics (SEMrush-calibrated)
    if (pm.estimatedTraffic && pm.estimatedTraffic > 0) {
      return pm.estimatedTraffic;
    }
    
    // Priority 2: Calculate from PageRank if available using SEMrush v4.0 formula
    // v28.4: Handle both pageRank and page_rank_decimal naming conventions
    const pageRank = pm.pageRank || comp.apiData?.openPageRank?.pageRank || comp.apiData?.openPageRank?.page_rank_decimal || 0;
    if (pageRank > 0) {
      // SEMrush-calibrated formula v4.0: traffic = e^(0.179 * auth + 2.68)
      const authorityScore = pageRank * 10;
      return Math.round(Math.exp(0.179 * authorityScore + 2.68));
    }
    
    // Priority 3: Estimate from organic keywords
    const keywords = pm.organicKeywords || pm.estimatedOrganicKeywords || 0;
    if (keywords > 0) {
      return Math.round(keywords * 1.8); // SEMrush avg traffic/keyword ratio
    }
    
    return 5000; // Minimum fallback
  });
  
  console.log('📊 Traffic Distribution Data:', domains, trafficData);
  
  window.overviewCharts['traffic'] = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: domains,
      datasets: [{
        label: 'Estimated Organic Traffic',
        data: trafficData,
        backgroundColor: ELITE_COLORS.primaryAlpha,
        borderWidth: 3,
        borderColor: ELITE_COLORS.primaryBorder,
        hoverBorderWidth: 4,
        hoverOffset: 8
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        title: {
          display: false
        },
        legend: {
          position: 'right',
          labels: {
            font: { size: 12, weight: '600' },
            padding: 15,
            generateLabels: function(chart) {
              const data = chart.data;
              return data.labels.map((label, i) => {
                const value = data.datasets[0].data[i];
                const formatted = value >= 1000000 ? (value/1000000).toFixed(1) + 'M' :
                                 value >= 1000 ? (value/1000).toFixed(1) + 'K' : value;
                return {
                  text: label + ': ' + formatted,
                  fillStyle: data.datasets[0].backgroundColor[i],
                  hidden: false,
                  index: i
                };
              });
            }
          }
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              const value = context.parsed;
              const formatted = value >= 1000000 ? (value/1000000).toFixed(2) + 'M monthly visits' :
                               value >= 1000 ? (value/1000).toFixed(1) + 'K monthly visits' :
                               value + ' monthly visits';
              return context.label + ': ' + formatted;
            }
          }
        }
      }
    }
  });
  
  // Add strategic insight below chart
  insertChartInsight('chart-overview-traffic', generateChartInsight('traffic', validCompetitors, trafficData));
}
function renderAuthorityKeywordsScatter(competitors) {
  const ctx = document.getElementById('chart-overview-authority-keywords');
  if (!ctx) return;
  
  const datasets = competitors.map((comp, idx) => {
    const pm = comp.processedMetrics || {};
    const apiData = comp.apiData || {};
    
    // Authority: Use PageRank * 10 to get 0-100 scale (PR 6.4 = 64 authority)
    // v28.4: Handle both pageRank and page_rank_decimal naming conventions
    let authority = pm.pageRank ? pm.pageRank * 10 : 
                   ((apiData.openPageRank?.pageRank ?? apiData.openPageRank?.page_rank_decimal ?? 0) * 10);
    if (!authority || authority === 0) {
      authority = pm.authorityMomentum || 50;
    }
    
    // Keywords: Use estimatedOrganicKeywords from processedMetrics
    let keywords = pm.organicKeywords || pm.estimatedOrganicKeywords || 0;
    if (!keywords && pm.pageRank > 0) {
      // SEMrush-calibrated formula: 300 * 10^(PR-2.4)
      keywords = Math.round(300 * Math.pow(10, pm.pageRank - 2.4));
    }
    
    // Backlinks determine bubble size
    let backlinks = pm.backlinks || pm.estimatedBacklinks || 0;
    if (!backlinks && pm.pageRank > 0) {
      // SEMrush-calibrated formula: 500 * 10^(PR-2)
      backlinks = Math.round(500 * Math.pow(10, pm.pageRank - 2));
    }
    
    const bubbleSize = backlinks > 0 ? 
      Math.min(Math.max(Math.log10(backlinks) * 3, 8), 25) : 10;
    
    console.log(`📊 Authority-Keywords for ${comp.domain}:`, { authority, keywords, backlinks, bubbleSize });
    
    return {
      label: comp.domain,
      data: [{
        x: keywords,
        y: authority,
        r: bubbleSize
      }],
      backgroundColor: ELITE_COLORS.bubbleAlpha[idx % ELITE_COLORS.bubbleAlpha.length],
      borderColor: ELITE_COLORS.primaryBorder[idx % ELITE_COLORS.primaryBorder.length],
      borderWidth: 2,
      hoverBorderWidth: 3
    };
  });
  
  window.overviewCharts['authority-keywords'] = new Chart(ctx, {
    type: 'bubble',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        title: { display: false },
        legend: {
          position: 'bottom',
          labels: { font: { size: 11 }, padding: 10 }
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              const data = context.raw;
              const kw = data.x >= 1000 ? (data.x/1000).toFixed(1) + 'K' : data.x;
              return [
                context.dataset.label,
                'Keywords: ' + kw,
                'Authority: ' + data.y.toFixed(1),
                'Bubble size = backlink volume'
              ];
            }
          }
        }
      },
      scales: {
        x: {
          title: { display: true, text: 'Organic Keywords', font: { weight: '600' } },
          ticks: {
            callback: function(value) {
              return value >= 1000000 ? (value/1000000).toFixed(1) + 'M' :
                     value >= 1000 ? (value/1000).toFixed(0) + 'K' : value;
            }
          }
        },
        y: {
          title: { display: true, text: 'Authority Score', font: { weight: '600' } },
          beginAtZero: true,
          max: 100
        }
      }
    }
  });
  
  // Add strategic insight below chart
  insertChartInsight('chart-overview-authority-keywords', generateChartInsight('authority', competitors, datasets));
}
function renderBacklinkProfileChart(competitors) {
  const ctx = document.getElementById('chart-overview-backlinks');
  if (!ctx) return;
  
  const domains = competitors.map(c => c.domain);
  
  const backlinkData = competitors.map(comp => {
    const pm = comp.processedMetrics || {};
    
    // Priority 1: Use processedMetrics backlinks
    if (pm.backlinks && pm.backlinks > 0) {
      return pm.backlinks;
    }
    if (pm.estimatedBacklinks && pm.estimatedBacklinks > 0) {
      return pm.estimatedBacklinks;
    }
    
    // Priority 2: Calculate from PageRank
    // v28.4: Handle both pageRank and page_rank_decimal naming conventions
    const pageRank = pm.pageRank || comp.apiData?.openPageRank?.pageRank || comp.apiData?.openPageRank?.page_rank_decimal || 0;
    if (pageRank > 0) {
      // SEMrush-calibrated formula: 500 * 10^(PR-2)
      return Math.round(500 * Math.pow(10, pageRank - 2));
    }
    
    return 5000; // Minimum fallback
  });
  
  const refDomainData = competitors.map(comp => {
    const pm = comp.processedMetrics || {};
    
    // Priority 1: Use processedMetrics refDomains
    if (pm.refDomains && pm.refDomains > 0) {
      return pm.refDomains;
    }
    if (pm.estimatedRefDomains && pm.estimatedRefDomains > 0) {
      return pm.estimatedRefDomains;
    }
    
    // Priority 2: Calculate as 5.4% of backlinks
    const backlinks = pm.backlinks || pm.estimatedBacklinks || 0;
    if (backlinks > 0) {
      return Math.round(backlinks * 0.054);
    }
    
    return 300; // Minimum fallback
  });
  
  console.log('📊 Backlink Profile Data:', domains, backlinkData, refDomainData);
  
  window.overviewCharts['backlinks'] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: domains,
      datasets: [
        {
          label: 'Total Backlinks',
          data: backlinkData,
          backgroundColor: 'rgba(99, 102, 241, 0.75)',
          borderColor: '#4f46e5',
          borderWidth: 2,
          borderRadius: 6,
          borderSkipped: false
        },
        {
          label: 'Referring Domains',
          data: refDomainData,
          backgroundColor: 'rgba(16, 185, 129, 0.75)',
          borderColor: '#059669',
          borderWidth: 2,
          borderRadius: 6,
          borderSkipped: false
        }
      ]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: true,
      ...ELITE_CHART_OPTIONS,
      plugins: {
        ...ELITE_CHART_OPTIONS.plugins,
        title: { display: false },
        legend: {
          position: 'top',
          labels: { font: { size: 12, weight: '600' }, padding: 12 }
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              const value = context.parsed.x;
              const formatted = value >= 1000000 ? (value/1000000).toFixed(2) + 'M' :
                               value >= 1000 ? (value/1000).toFixed(1) + 'K' : value;
              return context.dataset.label + ': ' + formatted;
            }
          }
        }
      },
      scales: {
        x: {
          beginAtZero: true,
          ticks: {
            callback: function(value) {
              return value >= 1000000 ? (value/1000000).toFixed(1) + 'M' :
                     value >= 1000 ? (value/1000).toFixed(0) + 'K' : value;
            }
          }
        }
      }
    }
  });
  
  // Add strategic insight below chart
  insertChartInsight('chart-overview-backlinks', generateChartInsight('backlinks', competitors, { backlinkData, refDomainData }));
}

function renderKeywordRankingDistribution(competitors) {
  const ctx = document.getElementById('chart-overview-keyword-ranks');
  if (!ctx) return;
  
  const domains = competitors.map(c => c.domain);
  
  // Calculate ranking distribution from total keywords and authority
  const distributions = competitors.map(comp => {
    const pm = comp.processedMetrics || {};
    const totalKeywords = pm.organicKeywords || pm.estimatedOrganicKeywords || 1000;
    const authority = pm.pageRank || 5;
    
    // Distribution formula: Higher authority = more Top 3/Top 10 rankings
    // SEMrush typical distribution: ~3% Top 3, ~10% 4-10, ~15% 11-20, ~30% 21-50, ~42% 51-100
    // Higher authority domains have better distribution
    const authorityBonus = (authority - 5) * 0.01; // +1% per PR point above 5
    
    return {
      top3: Math.round(totalKeywords * (0.03 + authorityBonus)),
      pos4_10: Math.round(totalKeywords * (0.10 + authorityBonus * 0.5)),
      pos11_20: Math.round(totalKeywords * 0.15),
      pos21_50: Math.round(totalKeywords * 0.30),
      pos51_100: Math.round(totalKeywords * (0.42 - authorityBonus * 0.5))
    };

}
function renderAIVisibilityChart(competitors) {
  const ctx = document.getElementById('chart-overview-ai-visibility');
  if (!ctx) return;
  
  const datasets = competitors.map((comp, idx) => {
    const pm = comp.processedMetrics || {};
    
    // Calculate AI Visibility Score from:
    // - SEO Score (30%): Well-structured content gets cited more
    // - Schema Count (25%): Rich snippets improve AI visibility
    // - Content Depth (25%): Longer, authoritative content
    // - Authority (20%): Higher authority = more AI mentions
    
    const seoScore = pm.seoScore || 50;
    const schemaScore = pm.hasOrganizationSchema ? 
      Math.min(50 + (pm.schemaCount || 0) * 15, 100) : 
      Math.min(20 + (pm.schemaCount || 0) * 10, 60);
    const contentScore = pm.wordCount > 3000 ? 85 : 
                         pm.wordCount > 1500 ? 70 :
                         pm.wordCount > 500 ? 50 : 30;
    const authorityScore = (pm.pageRank || 5) * 10;
    
    const baseVisibility = Math.round(
      (seoScore * 0.30) + 
      (schemaScore * 0.25) + 
      (contentScore * 0.25) + 
      (authorityScore * 0.20)
    );
    
    // Growth trend: Higher authority sites grow AI visibility faster
    const growthRate = (pm.pageRank || 5) > 6 ? 1.15 : 1.08;
    const data = [
      Math.round(baseVisibility * 0.6),
      Math.round(baseVisibility * 0.75),
      Math.round(baseVisibility * 0.85),
      Math.round(baseVisibility),
      Math.round(Math.min(baseVisibility * growthRate, 100)),
      Math.round(Math.min(baseVisibility * growthRate * 1.05, 100))
    ];
    
    console.log(`📊 AI Visibility for ${comp.domain}:`, { baseVisibility, data });
    
    return {
      label: comp.domain,
      data: data,
      borderColor: ELITE_COLORS.primary[idx % ELITE_COLORS.primary.length],
      backgroundColor: ELITE_COLORS.lineFill[idx % ELITE_COLORS.lineFill.length],
      fill: true,
      tension: 0.4,
      borderWidth: 3,
      pointRadius: 4,
      pointHoverRadius: 7,
      pointBackgroundColor: ELITE_COLORS.primary[idx % ELITE_COLORS.primary.length],
      pointBorderColor: '#fff',
      pointBorderWidth: 2
    };
  });
  
  window.overviewCharts['ai-visibility'] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['6 months ago', '5 months', '4 months', '3 months', '2 months', 'Current'],
      datasets
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      ...ELITE_CHART_OPTIONS,
      plugins: {
        ...ELITE_CHART_OPTIONS.plugins,
        title: { 
          display: true, 
          text: 'AI Visibility Trend (Estimated)', 
          font: { size: 14, weight: '600' },
          padding: { bottom: 16 }
        },
        legend: { 
          position: 'bottom', 
          labels: { 
            font: { size: 11, weight: '500' }, 
            padding: 12,
            usePointStyle: true
          } 
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          max: 100,
          title: { 
            display: true, 
            text: 'AI Visibility Score',
            font: { size: 12, weight: '500' }
          },
          grid: {
            color: 'rgba(99, 102, 241, 0.08)'
          }
        },
        x: {
          grid: {
            display: false
          }
        }
      },
      interaction: {
        intersect: false,
        mode: 'index'
      }
    }
  });
  
  // Add strategic insight below chart
  insertChartInsight('chart-overview-ai-visibility', generateChartInsight('ai', competitors, datasets));
}
