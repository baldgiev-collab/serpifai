/**

        </div>
        <span class="elite-insight-badge">HIGH IMPACT</span>
      </div>
      <div class="elite-insight-body">
  `;

  killMoves.forEach((move, index) => {
    const priority = move.urgency || move.priority || 'High';
    const priorityClass = priority === 'Critical' ? 'priority-critical' : priority === 'High' ? 'priority-high' : 'priority-medium';

    html += `
      <div class="kill-move-item animate-fade-in stagger-${index + 1}">
        <div class="kill-move-header">
          <span class="kill-move-priority ${priorityClass}">${priority}</span>

        </div>
        <div class="kill-move-description">
          <h4>${translateToPlainEnglish(move.killMove || move.move || move.action || 'Strategic Move')}</h4>
          <p>${translateToPlainEnglish(move.hiddenVulnerability || move.rationale || move.plainEnglish || '')}</p>
        </div>
    `;

    if (move.theirApparentStrength) {
      html += `
        <div class="strength-vs-vulnerability">
          <div class="svv-item apparent-strength">
            <span class="svv-label">🛡️ Their Claimed Strength:</span>
            <span class="svv-value">${translateToPlainEnglish(move.theirApparentStrength)}</span>
          </div>
          <div class="svv-item hidden-vulnerability">
            <span class="svv-label">🎯 Hidden Vulnerability:</span>
            <span class="svv-value">${translateToPlainEnglish(move.hiddenVulnerability || 'Not identified')}</span>
          </div>
        </div>
      `;
    }

    if (move.entityBasedAttack) {
      html += `
        <div class="entity-seo-strategy">
          <div class="entity-seo-title">🎯 Entity-Based SEO Battle Plan</div>
          <div class="entity-attack-description">${translateToPlainEnglish(move.entityBasedAttack)}</div>
        </div>

    }

    if (move.preEmptiveFrame) {
      html += `
        <div class="preemptive-frame">
          <div class="frame-label">🔄 Pre-emptive Framing Strategy:</div>
          <div class="frame-content">${translateToPlainEnglish(move.preEmptiveFrame)}</div>
        </div>
      `;
    }

    if (move.expectedImpact || move.impact) {
      html += `
        <div class="kill-move-impact">
          <span class="impact-icon">📈</span>
          <span class="impact-text"><strong>Expected Impact:</strong> ${translateToPlainEnglish(move.expectedImpact || move.impact)}</span>
        </div>
      `;
    }

    if (move.implementation) {
      const impl = Array.isArray(move.implementation) ? move.implementation : [move.implementation];
      html += `
        <div class="kill-move-implementation">
          <div class="impl-title">📋 How to Execute:</div>

    html += '</div>';

  return html;
}

    html += `
      <div class="threats-section">
        <h4 class="section-label">⚠️ Critical Threats to Address</h4>

          ${threats.map(threat => {

            return `

            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  const opportunities = executiveBrief.strategicOpportunities || executiveBrief.opportunities || [];
  if (opportunities.length > 0) {
    html += `
      <div class="opportunities-section">

          </div>
        </div>
        <span class="elite-insight-badge">STRATEGIC MOAT</span>
      </div>
      <div class="elite-insight-body">
  `;

  if (moatData.proposedTool) {
    html += `
      <div class="moat-section proposed-tool-section">
        <h4 class="section-label">🛠️ Proposed Proprietary Tool</h4>
        <div class="proposed-tool-card">
          <h5 class="tool-name">${moatData.proposedTool}</h5>

          ${moatData.leadCapture ? `<div class="tool-leads"><span class="leads-label">📥 Lead Generation:</span><p>${translateToPlainEnglish(moatData.leadCapture)}</p></div>` : ''}
          ${moatData.competitiveAdvantage ? `<div class="tool-advantage"><span class="advantage-label">🛡️ Competitive Advantage:</span><p>${translateToPlainEnglish(moatData.competitiveAdvantage)}</p></div>` : ''}
        </div>
      </div>
    `;
  }

  if (moatData.talentVelocityIndex) {
    const tvi = moatData.talentVelocityIndex;
    html += `
      <div class="moat-section tvi-section">
        <h4 class="section-label">📊 Talent Velocity Index™</h4>
        <p class="section-description">Proprietary metric measuring how fast a company can convert talent investment into product velocity</p>
        <div class="tvi-display">
          <div class="tvi-score">${tvi.score || 'N/A'}</div>
          <div class="tvi-breakdown">
            <div class="tvi-item"><span>Engineering Velocity:</span> ${tvi.engineeringVelocity || 'N/A'}</div>
            <div class="tvi-item"><span>Talent Acquisition Rate:</span> ${tvi.talentAcquisitionRate || 'N/A'}</div>
            <div class="tvi-item"><span>Product Iteration Speed:</span> ${tvi.productIterationSpeed || 'N/A'}</div>
          </div>
        </div>
      </div>
    `;
  }

  if (moatData.recommendations && moatData.recommendations.length > 0) {
    html += `
      <div class="moat-section recommendations-section">
        <h4 class="section-label">🛡️ Moat Building Strategies</h4>
        <div class="moat-recommendations">
          ${moatData.recommendations.map((rec, i) => `
            <div class="moat-rec-item">
              <div class="moat-rec-icon">${i + 1}</div>
              <div class="moat-rec-content">
                <h5>${rec.strategy || rec}</h5>
                ${rec.description ? `<p>${translateToPlainEnglish(rec.description)}</p>` : ''}
                ${rec.timeframe ? `<span class="moat-timeframe">⏱️ ${rec.timeframe}</span>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  html += '</div></div>';
  return html;
}

/**
 * Render Competitive Roadmap Timeline
 */
function renderCompetitiveRoadmap(roadmap) {
  if (!roadmap || !roadmap.phases) return '';

  let html = `
    <div class="elite-insight-card roadmap-card animate-slide-up stagger-5">
      <div class="elite-insight-header">
        <div class="elite-insight-header-left">
          <div class="elite-insight-icon">🗺️</div>
          <div>
            <h3 class="elite-insight-title">Competitive Domination Roadmap</h3>
            <p class="elite-insight-subtitle">Phased Strategy for Market Leadership</p>
          </div>
        </div>
        <span class="elite-insight-badge">ROADMAP</span>
      </div>
      <div class="elite-insight-body">
        <div class="roadmap-timeline">
  `;

  const phases = roadmap.phases || [];

  phases.forEach((phase, index) => {
    const phaseIcon = index === 0 ? '🚀' : index === 1 ? '📈' : '👑';
    const phaseTitle = phase.phase || phase.title || `Phase ${index + 1}`;
    const actions = phase.keyActions || phase.actions || [];
    const outcomes = phase.expectedOutcomes || (phase.expectedOutcome ? [phase.expectedOutcome] : []);

    html += `
      <div class="roadmap-phase">
        <div class="roadmap-phase-header">
          <span class="phase-icon">${phaseIcon}</span>
          <h4 class="roadmap-phase-title">${phaseTitle}</h4>
          ${phase.timeline ? `<span class="phase-timeline">${phase.timeline}</span>` : ''}
        </div>
        ${phase.objectives && phase.objectives.length > 0 ? `
          <div class="phase-objectives">
            <span class="objectives-label">🎯 Objectives:</span>
            <ul class="objectives-list">${phase.objectives.map(obj => `<li>${translateToPlainEnglish(obj)}</li>`).join('')}</ul>
          </div>
        ` : ''}
        ${phase.goal ? `<p class="phase-goal">${translateToPlainEnglish(phase.goal)}</p>` : ''}
        ${actions.length > 0 ? `<ul class="roadmap-list">${actions.map(action => `<li>${translateToPlainEnglish(action)}</li>`).join('')}</ul>` : ''}
        ${outcomes.length > 0 ? `
          <div class="phase-outcome">
            <span class="outcome-label">📈 Expected Outcomes:</span>
            <ul class="outcome-list">${outcomes.map(outcome => `<li>${translateToPlainEnglish(outcome)}</li>`).join('')}</ul>
          </div>
        ` : ''}
      </div>
    `;
  });

  html += '</div></div></div>';
  return html;
}
