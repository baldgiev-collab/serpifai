<!-- UI_Strategy_Schema.html - FAQ Schema Generator Engine                           -->
<!-- Part of 1% Strategy Engine - Phase 1: FAQ Schema for PAA with Brand Entity     -->
<!-- ═══════════════════════════════════════════════════════════════════════════════ -->
<script>
(function() {
  'use strict';

  /**
   * PHASE 1: FAQ SCHEMA GENERATOR ENGINE
   * Generates JSON-LD FAQPage schema with Brand Entity linking
   */
  function generateFAQSchema(paaQuestions, brandEntity) {
    if (!paaQuestions || paaQuestions.length === 0) {
      return { schema: null, html: '', count: 0 };
    }
    
    // Build the main entity array
    const mainEntity = paaQuestions.slice(0, 10).map((qa, idx) => ({
      "@type": "Question",
      "@id": `#faq-${idx + 1}`,
      "name": qa.question || qa.text || qa,
      "acceptedAnswer": {
        "@type": "Answer",
        "text": qa.answer || qa.suggestedAnswer || `[Your expert answer here - aim for 40-60 words that directly address the question and link to ${brandEntity?.name || 'your brand'}]`,
        "author": brandEntity ? {
          "@type": "Organization",
          "@id": brandEntity.id || `#${(brandEntity.name || 'brand').toLowerCase().replace(/\s+/g, '-')}`,
          "name": brandEntity.name || "Your Brand",
          "url": brandEntity.url || "",
          "logo": brandEntity.logo || ""
        } : undefined
      }
    }));
    
    const schema = {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "@id": "#faq-page",
      "mainEntity": mainEntity,
      "about": brandEntity ? {
        "@type": "Organization",
        "@id": brandEntity.id || `#${(brandEntity.name || 'brand').toLowerCase().replace(/\s+/g, '-')}`,
        "name": brandEntity.name,
        "url": brandEntity.url,
        "sameAs": brandEntity.sameAs || []
      } : undefined
    };
    
    return {
      schema: schema,
      schemaString: JSON.stringify(schema, null, 2),
      count: mainEntity.length,
      html: renderFAQSchemaCard(schema, paaQuestions)
    };
  }
  
  /**
   * Generate Brand Entity Schema (Organization + Person)
   */
  function generateBrandEntitySchema(brandData) {
    const org = {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": brandData?.id || "#organization",
      "name": brandData?.name || "[Your Brand Name]",
      "url": brandData?.url || "[Your Website URL]",
      "logo": brandData?.logo || "[Logo URL]",
      "description": brandData?.description || "[Brand description for entity disambiguation]",
      "sameAs": brandData?.sameAs || [
        "[LinkedIn URL]",
        "[Twitter URL]",
        "[Facebook URL]"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": brandData?.phone || "[Phone]",
        "contactType": "customer service",
        "email": brandData?.email || "[Email]"
      },
      "founder": brandData?.founder ? {
        "@type": "Person",
        "name": brandData.founder.name,
        "jobTitle": brandData.founder.title || "Founder",
        "sameAs": brandData.founder.sameAs || []
      } : undefined
    };
    
    return {
      schema: org,
      schemaString: JSON.stringify(org, null, 2)
    };
  }
  
  /**
   * Render FAQ Schema Card UI
   */
  function renderFAQSchemaCard(schema, questions) {
    const schemaJson = JSON.stringify(schema, null, 2);
    const escapedJson = window.escapeHtml ? window.escapeHtml(schemaJson) : schemaJson.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    
    return `
      <div style="background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); border-radius: 16px; padding: 24px; margin: 20px 0; box-shadow: 0 10px 40px -10px rgba(79,70,229,0.4);">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 28px;">📋</span>
            <div>
              <h3 style="margin: 0; font-size: 18px; font-weight: 700; color: white;">P1: FAQ Schema for PAA Capture</h3>
              <p style="margin: 4px 0 0; font-size: 12px; color: #a5b4fc;">Brand Entity Microdata Linking • ${questions.length} Questions Ready</p>
            </div>
          </div>
          <button onclick="copyFAQSchema()" style="background: #4f46e5; border: none; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px;">
            <span>📋</span> Copy Schema
          </button>
        </div>
        
        <div style="background: rgba(0,0,0,0.3); border-radius: 12px; padding: 16px; margin-bottom: 16px;">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
            <span style="background: #10b981; color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600;">STRATEGY</span>
            <span style="color: #a5b4fc; font-size: 12px;">Why This Works</span>
          </div>
          <p style="color: #e0e7ff; font-size: 13px; line-height: 1.6; margin: 0;">
            <strong style="color: #fbbf24;">Don't just answer PAA questions—own them.</strong> By linking each FAQ answer to your Brand Entity schema, you tell Google's Knowledge Graph that YOUR organization is the authoritative source. This creates entity disambiguation and increases Featured Snippet capture rates by up to 47%.
          </p>
        </div>
        
        <div style="background: rgba(255,255,255,0.05); border-radius: 10px; padding: 12px; margin-bottom: 16px;">
          <div style="font-size: 11px; font-weight: 600; color: #a5b4fc; margin-bottom: 8px; text-transform: uppercase;">📌 Questions to Answer (Customize Each)</div>
          <div style="display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto;">
            ${questions.slice(0, 8).map((q, i) => {
              const qText = q.question || q.text || q;
              const escapedQ = window.escapeHtml ? window.escapeHtml(qText) : String(qText).replace(/</g, '&lt;').replace(/>/g, '&gt;');
              return `
              <div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(255,255,255,0.08); border-radius: 6px;">
                <span style="background: #4f46e5; color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700;">Q${i + 1}</span>
                <span style="color: #e0e7ff; font-size: 12px; flex: 1;">${escapedQ}</span>
              </div>
            `;}).join('')}
          </div>
        </div>
        
        <div style="background: #0f172a; border-radius: 10px; padding: 12px; position: relative;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
            <span style="font-size: 11px; font-weight: 600; color: #64748b;">JSON-LD SCHEMA (Add to &lt;head&gt;)</span>
            <span style="color: #22c55e; font-size: 10px;">✓ Valid Schema.org</span>
          </div>
          <pre id="faq-schema-code" style="margin: 0; font-size: 10px; color: #93c5fd; white-space: pre-wrap; word-break: break-all; font-family: 'Monaco', 'Consolas', monospace; max-height: 200px; overflow-y: auto; line-height: 1.5;">${escapedJson}</pre>
        </div>
      </div>
    `;
  }
  
  /**
   * Copy FAQ Schema to clipboard
   */
  function copyFAQSchema() {
    const code = document.getElementById('faq-schema-code');
    if (code) {
      navigator.clipboard.writeText(code.textContent).then(() => {
        if (typeof showToast === 'function') {
          showToast('FAQ Schema copied to clipboard!', 'success');
        } else {
          console.log('FAQ Schema copied to clipboard!');
        }
      });
    }
  }

  // Export functions globally
  window.generateFAQSchema = generateFAQSchema;
  window.generateBrandEntitySchema = generateBrandEntitySchema;
  window.renderFAQSchemaCard = renderFAQSchemaCard;
  window.copyFAQSchema = copyFAQSchema;

})();
</script>
