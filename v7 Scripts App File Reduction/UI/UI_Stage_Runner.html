<!--
  UI_Stage_Runner.html
  Workflow Stage Execution & Results Display
  Part of Elite Modular Architecture - Phase 11
  V7.25 FIX: ELITE Command Canvas with embedded renderer fallback
  
  Provides:
  - window.runStage() - Execute a workflow stage
  - window.displayStageResults() - Display stage output
  - window.isStageRunning - Flag to detect active stage execution
  - window.renderUnifiedStage1Results - Fallback renderer (V7.25)
  
  Dependencies:
  - CORE_Form_Data.html (for collectFormData)
  - UI_Core_Utils.html (for showToast, setActiveTab, showStageInSidebar, updateStageStatus)
  - UI_Stage1_Renderer.html (for renderUnifiedStage1Results - primary)
  - UI_Chart_Generator.html (for generateStage1Charts)
-->
<script>
  console.log('🚀 UI_Stage_Runner.html V7.25 loading...');
  
  // V7.25: Ensure renderUnifiedStage1Results is available as fallback
  // This will be overwritten by UI_Stage1_Renderer.html if it loads successfully
  if (typeof window.renderUnifiedStage1Results !== 'function') {
    console.log('🔧 V7.25: Installing fallback renderUnifiedStage1Results');
    window.renderUnifiedStage1Results = function(reportText, jsonData) {
      console.log('🔧 V7.25: Fallback renderUnifiedStage1Results executing');
      // Delegate to renderDirectFallback if defined, otherwise store for later
      if (typeof window._renderDirectFallback === 'function') {
        window._renderDirectFallback({ report: reportText, json: jsonData });
      } else {
        // Store for later rendering
        window._pendingStage1Render = { report: reportText, json: jsonData };
        console.log('📦 V7.25: Stored pending Stage 1 render data');
      }
    };
  }
  
  // V7.9 FIX: Global state to track running stages (prevents concurrent hydration)
  window.stageRunningState = window.stageRunningState || {
    isRunning: false,
    stageNum: null,
    startedAt: null
  };

  /**
   * Run a workflow stage via Apps Script backend
   * @param {number} stageNum - Stage number (1-5)
   * @param {HTMLElement} buttonEl - The run button element
   */
  window.runStage = function(stageNum, buttonEl) {
    if (typeof google === 'undefined' || !google.script?.run) {
      window.showToast?.('Local preview: cannot run workflow on Apps Script.');
      return;
    }

    // ============================================================================
    // MANDATORY VALIDATION: Project and Model MUST be selected
    // ============================================================================
    const projectSelect = document.getElementById('projectSelect');
    const geminiModelSelect = document.getElementById('geminiModelSelect');
    const projectName = projectSelect?.value;

    if (!projectName || projectName.trim() === '') {
      console.warn('❌ No project selected');
      window.showToast?.('❌ MANDATORY: Select a project from the dropdown menu first!');
      projectSelect?.focus();
      return;
    }

    const selectedModel = geminiModelSelect?.value || null;
    if (!selectedModel || selectedModel.trim() === '') {
      console.warn('❌ No AI model selected');
      window.showToast?.('❌ MANDATORY: Select an AI model from the dropdown menu first!');
      geminiModelSelect?.focus();
      return;
    }

    // Validate model is Gemini 2.5 or Gemini 3 (latest generations)
    const isValidModel = selectedModel.startsWith('gemini-2.5') || selectedModel.startsWith('gemini-3');
    if (!isValidModel) {
      console.warn('⚠️ Legacy model selected:', selectedModel);
      window.showToast?.('⚠️ WARNING: Please select a Gemini 2.5 or Gemini 3 model (latest generation).');
      geminiModelSelect?.focus();
      return;
    }
    
    // V7.9 FIX: Mark stage as running (prevents auto-hydration from triggering)
    window.stageRunningState = {
      isRunning: true,
      stageNum: stageNum,
      startedAt: Date.now()
    };
    console.log('🔒 Stage ' + stageNum + ' marked as RUNNING');

    console.log('✅ MANDATORY checks passed');
    console.log('   📁 Project:', projectName);
    console.log('   🤖 Model:', selectedModel);

    // ========================================================================
    // V7.1 ULTRA-MINIMAL PAYLOAD: Absolute minimum to prevent HTTP 400
    // Only pass essential IDs - server will handle everything else
    // ========================================================================
    
    // ULTRA-MINIMAL: Only the absolute essentials
    const ultraMinimalPayload = {
      stageNum: stageNum,
      projectId: projectName,
      model: selectedModel,
      _fetchCompetitorDataFromMySQL: true
    };
    
    // Log and validate payload size
    const payloadStr = JSON.stringify(ultraMinimalPayload);
    const payloadSize = payloadStr.length;
    
    console.log('========================================');
    console.log('🔬 V7.1 ULTRA-MINIMAL PAYLOAD DIAGNOSTIC');
    console.log('========================================');
    console.log('📦 Payload size:', payloadSize, 'bytes (', (payloadSize / 1024).toFixed(2), 'KB)');
    console.log('📄 Payload content:', payloadStr);
    console.log('========================================');
    
    // SAFETY CHECK: If somehow still too large, abort
    if (payloadSize > 50000) { // 50KB max
      console.error('🚨 CRITICAL: Payload too large even after stripping!');
      console.error('   Size:', (payloadSize / 1024).toFixed(2), 'KB');
      window.showToast?.('❌ Payload too large. Please contact support.');
      return;
    }

    // Update button state
    buttonEl.classList.add('running');
    buttonEl.textContent = '⏳ Running...';
    buttonEl.disabled = true;

    window.showToast?.(`Running Stage ${stageNum}...`);

    // ========================================================================
    // V7 FIX: 60-SECOND TIMEOUT for hung requests
    // ========================================================================
    let requestCompleted = false;
    const timeoutId = setTimeout(() => {
      if (!requestCompleted) {
        console.error('⏱️ TIMEOUT: Stage ' + stageNum + ' request exceeded 60 seconds');
        buttonEl.classList.remove('running');
        buttonEl.textContent = `▶ Run Stage ${stageNum}`;
        buttonEl.disabled = false;
        window.showTimeoutError?.(stageNum, projectName);
      }
    }, 60000); // 60 seconds

    // Call backend with MINIMAL payload
    google.script.run
      .withSuccessHandler(function(result) {
        requestCompleted = true;
        clearTimeout(timeoutId);
        console.log('✅ Backend response received');
        
        // V7.9 FIX: Clear running state on success
        window.stageRunningState = { isRunning: false, stageNum: null, startedAt: null };
        console.log('🔓 Stage ' + stageNum + ' marked as COMPLETE');

        console.log('   success:', result?.success);
        console.log('   projectId:', result?.projectId);
        console.log('   stage:', result?.stage);

        buttonEl.classList.remove('running');
        buttonEl.textContent = `▶ Run Stage ${stageNum}`;
        buttonEl.disabled = false;

        if (result.success) {
          console.log('✅ Stage ' + stageNum + ' completed successfully');
          window.showToast?.(`Stage ${stageNum} complete! Loading results...`);

          // Auto-switch to results tab FIRST
          window.setActiveTab?.('results');

          // Activate the specific stage results
          document.querySelectorAll('.results-tab-btn').forEach(b => b.classList.remove('active'));
          const targetTab = document.querySelector(`[data-results-stage="${stageNum}"]`);
          if (targetTab) targetTab.classList.add('active');

          document.querySelectorAll('.results-panel').forEach(p => p.classList.remove('active'));
          const targetPanel = document.querySelector(`[data-results-panel="${stageNum}"]`);
          if (targetPanel) targetPanel.classList.add('active');

          // Highlight submenu item
          document.querySelectorAll('.nav-subbtn').forEach(b => b.classList.remove('active'));
          const targetSubBtn = document.querySelector(`.nav-subbtn[data-stage="${stageNum}"]`);
          if (targetSubBtn) targetSubBtn.classList.add('active');

          // ================================================================
          // V7.10 SIMPLIFIED: Use ORACLE_STATE cache first, then hydrate
          // This eliminates waiting for MySQL - data is available immediately
          // ================================================================
          const hydrateProjectId = result.projectId || projectName;
          
          if (stageNum === 1) {
            console.log('💎 V7.10 SIMPLIFIED: Rendering Stage 1...');
            console.log('   Project:', hydrateProjectId);
            
            // Hide placeholder immediately
            const placeholder = document.getElementById('stage1-placeholder');
            if (placeholder) placeholder.style.display = 'none';
            
            // Show container
            const container = document.getElementById('stage1-unified-container');
            if (container) {
              container.style.display = 'block';
            }
            
            // V7.10: Check if ORACLE_STATE has cached data first
            const cachedResult = window.ORACLE_STATE?.stage1_results;
            if (cachedResult && (cachedResult.json || cachedResult.report)) {
              console.log('✅ V7.10: Using ORACLE_STATE cache - no MySQL needed!');
              console.log('   Report length:', cachedResult.report?.length || 0);
              console.log('   JSON keys:', cachedResult.json ? Object.keys(cachedResult.json).join(', ') : 'none');
              
              // Render immediately from cache
              if (typeof window.renderUnifiedStage1Results === 'function') {
                window.renderUnifiedStage1Results(cachedResult.report || '', cachedResult.json || {});
              }
              
              // Generate charts if available
              if (cachedResult.json?.dashboardCharts && typeof window.generateStage1Charts === 'function') {
                window.generateStage1Charts(cachedResult.json);
              }
              
              window.showToast?.('💎 Strategic intelligence loaded!');
            } else {
              // V7.11: No cache - use EXTENDED retry mode since stage just completed
              // Data is definitely being saved now, just may need more time
              console.log('📡 V7.11: No cache, starting EXTENDED hydration...');
              container.innerHTML = `
                <div class="hydration-loading" style="padding: 48px; text-align: center;">
                  <div class="pulse-loader" style="width: 60px; height: 60px; margin: 0 auto 16px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); animation: pulse 1.5s infinite;"></div>
                  <p style="color: #6b7280; font-size: 14px;">📡 Loading results from database...</p>
                </div>
              `;
              // V7.11: Use extended mode and forceAfterComplete flag
              window.hydrateStage1FromDatabase?.(hydrateProjectId, 0, { extended: true, forceAfterComplete: true });
            }
          } else {
            // For stages 2-5, use the lightweight response approach
            setTimeout(() => {
              window.displayStageResults?.(stageNum, result);
              window.showStageInSidebar?.(stageNum);
              window.updateStageStatus?.(stageNum, 'completed');
            }, 300);
          }
            
          // UNLOCK NEXT STAGE: When a stage completes, unlock the next one
          if (stageNum < 5) {
            const nextStage = stageNum + 1;
            window.updateStageLock?.(nextStage, false);
            console.log(`🔓 Stage ${nextStage} unlocked!`);
            window.showToast?.(`Stage ${nextStage} is now available!`);
          }
        } else {
          console.error('❌ Stage ' + stageNum + ' failed:', result.error || 'Unknown error');
          window.showToast?.(`⚠️ Stage ${stageNum} failed: ${result.error || 'Unknown error'}`);
        }
      })
      .withFailureHandler(function(error) {
        requestCompleted = true;
        clearTimeout(timeoutId);
        
        // V7.9 FIX: Clear running state on failure
        window.stageRunningState = { isRunning: false, stageNum: null, startedAt: null };
        console.log('🔓 Stage ' + stageNum + ' marked as FAILED (cleared running state)');
        
        // ========================================================================
        // V7 ENHANCED ERROR DIAGNOSTIC
        // ========================================================================
        console.error('❌ Backend call failed:', error);
        console.error('   Error type:', typeof error);
        console.error('   Error message:', error?.message || error?.toString?.() || String(error));
        
        // Check if this is an HTTP 400 (payload too large)
        const errorStr = String(error);
        if (errorStr.includes('400') || errorStr.includes('HTTP 400')) {
          console.error('🚨 HTTP 400 DETECTED - Payload may still be too large!');
          console.error('   Light payload size was: ' + (payloadSize / 1024).toFixed(2) + ' KB');
          console.error('   This should NOT happen with shredded payload.');
          console.error('   Possible causes:');
          console.error('   1. Apps Script deployment not refreshed');
          console.error('   2. Browser cache serving old sidebar');
          console.error('   3. Another component adding data to payload');
          window.showToast?.('🚨 HTTP 400: Please refresh the sidebar (Ctrl+Shift+R) and try again');
        } else {
          window.showToast?.('⚠️ Unable to process request: ' + error);
        }

        buttonEl.classList.remove('running');
        buttonEl.textContent = `▶ Run Stage ${stageNum}`;
        buttonEl.disabled = false;
      })
      .runWorkflowStage(ultraMinimalPayload);
  };

  /**
   * Display stage results in the Results tab
   * @param {number} stageNum - Stage number
   * @param {Object} result - Result object from backend
   */
  window.displayStageResults = function(stageNum, result) {
    console.log('=== 🔍 STAGE 1 RAW DATA DIAGNOSTIC ===');
    console.log('📦 Full result object:', JSON.stringify(result, null, 2).substring(0, 2000));
    console.log('📋 Result keys:', Object.keys(result));
    console.log('📊 result.success:', result.success);
    console.log('📊 result.json exists?', !!result.json);
    console.log('📊 result.report exists?', !!result.report, 'length:', result.report?.length || 0);
    console.log('📊 result.data exists?', !!result.data);
    console.log('📊 result.data keys:', result.data ? Object.keys(result.data) : 'N/A');
    
    // V7 FIX: Check container exists
    const containerCheck = document.getElementById('stage1-unified-container');
    console.log('🎯 Container #stage1-unified-container exists?', !!containerCheck);
    if (!containerCheck) {
      console.error('❌ CRITICAL: Container #stage1-unified-container NOT FOUND in DOM!');
      console.log('   Available elements with stage1:', document.querySelectorAll('[id*="stage1"]').length);
    }

    try {
      // Update timestamp
      const timestamp = new Date(result.timestamp || Date.now()).toLocaleString();
      const timestampEl = document.getElementById(`stage${stageNum}-timestamp`);
      if (timestampEl) timestampEl.textContent = timestamp;
      
      // ========================================================================
      // V7 FIX: IMMEDIATELY hide placeholder and show container on success
      // ========================================================================
      if (stageNum === 1) {
        const container = document.getElementById('stage1-unified-container');
        const placeholder = container?.querySelector('.report-placeholder-unified');
        if (placeholder) {
          placeholder.style.display = 'none';
          console.log('✅ Placeholder hidden');
        }
        // Also show the export button
        const exportBtn = document.getElementById('export-stage1-btn');
        if (exportBtn) exportBtn.style.display = 'inline-flex';
        
        // Store in ORACLE_STATE for tab injection
        window.ORACLE_STATE = window.ORACLE_STATE || {};
        window.ORACLE_STATE.stage1_results = result;
        window.ORACLE_STATE.currentJobToken = result.job_token || result.jobToken || '';
        window.ORACLE_STATE.projectId = result.projectId || '';
        console.log('✅ Stage 1 results stored in ORACLE_STATE');
        console.log('   Token:', window.ORACLE_STATE.currentJobToken);
        
        // V11.0 FORENSIC DATA BRIDGE: Cache bridge data for Stage 2 auto-population
        if (result.forensicBridge) {
          window.ORACLE_STATE.forensicBridge = result.forensicBridge;
          console.log('🔗 Forensic Bridge cached to ORACLE_STATE');
          console.log('   Fields:', Object.keys(result.forensicBridge.autoPopulation || {}).join(', '));
          
          // Dispatch event for UI_Stage2_Bridge.html
          document.dispatchEvent(new CustomEvent('stage1Complete', {
            detail: { forensicBridge: result.forensicBridge }
          }));
        }
      }

      // ========================================================================
      // V7 ELITE: VISUAL RECOVERY - Force container visible
      // ========================================================================
      const stage1Container = document.getElementById('stage1-unified-container');
      if (stage1Container) {
        stage1Container.style.display = 'block';
        stage1Container.style.visibility = 'visible';
        stage1Container.style.opacity = '1';
        stage1Container.classList.remove('hidden');
        console.log('✅ Force-enabled #stage1-unified-container visibility');
      }

      // ========================================================================
      // V7 ELITE EXTRACTION: Handle ALL possible response structures
      // Priority: result.report > result.analysis_text > result.data.report
      // ========================================================================
      let reportText = '';
      
      // Priority 1: Direct report property (V7 format)
      if (result.report && typeof result.report === 'string' && result.report.length > 50) {
        reportText = result.report;
        console.log('✅ Report from result.report:', reportText.length, 'chars');
      }
      // Priority 2: analysis_text (Elite column name)
      else if (result.analysis_text && typeof result.analysis_text === 'string' && result.analysis_text.length > 50) {
        reportText = result.analysis_text;
        console.log('✅ Report from result.analysis_text:', reportText.length, 'chars');
      }
      // Priority 3: Nested in data (legacy format)
      else if (result.data?.report && typeof result.data.report === 'string' && result.data.report.length > 50) {
        reportText = result.data.report;
        console.log('✅ Report from result.data.report:', reportText.length, 'chars');
      }
      // Priority 4: analysis_text in data
      else if (result.data?.analysis_text && typeof result.data.analysis_text === 'string') {
        reportText = result.data.analysis_text;
        console.log('✅ Report from result.data.analysis_text:', reportText.length, 'chars');
      }
      // Priority 5: fullResponse fallback
      else if (result.fullResponse && typeof result.fullResponse === 'string') {
        reportText = result.fullResponse;
        console.log('✅ Report from result.fullResponse:', reportText.length, 'chars');
      }
      else if (result.data?.fullResponse && typeof result.data.fullResponse === 'string') {
        reportText = result.data.fullResponse;
        console.log('✅ Report from result.data.fullResponse:', reportText.length, 'chars');
      }
      // Priority 6: Generate report from JSON if no text report
      else if (result.json || result.data?.json) {
        const jsonSrc = result.json || result.data.json;
        console.log('⚠️ No report text, generating from JSON...');
        reportText = window.generateReportFromJSON?.(jsonSrc) || 
          '## 📊 Stage 1 Analysis Complete\n\nYour strategic analysis has been processed. See the charts below for visualizations.';
      }
      else {
        console.warn('⚠️ No report text found in any expected location');
        console.log('   Checked: result.report, result.analysis_text, result.data.report');
        reportText = '## ⚠️ Report Generation Notice\n\nThe AI response was received but no narrative report was included. Charts may still be available below.';
      }
      
      console.log('📄 Final reportText preview:', reportText.substring(0, 300));

      // ========================================================================
      // V7 ELITE JSON EXTRACTION: Handle ALL possible response structures
      // Priority: result.json > result.analysis_json > result.data.json
      // ========================================================================
      let jsonData = null;
      
      // Priority 1: Direct json property (V7 format)
      if (result.json && typeof result.json === 'object') {
        jsonData = result.json;
        console.log('✅ JSON from result.json, keys:', Object.keys(jsonData).join(', '));
      }
      // Priority 2: analysis_json (Elite column name)
      else if (result.analysis_json && typeof result.analysis_json === 'object') {
        jsonData = result.analysis_json;
        console.log('✅ JSON from result.analysis_json, keys:', Object.keys(jsonData).join(', '));
      }
      // Priority 3: Nested in data (legacy format)
      else if (result.data?.json && typeof result.data.json === 'object') {
        jsonData = result.data.json;
        console.log('✅ JSON from result.data.json, keys:', Object.keys(jsonData).join(', '));
      }
      // Priority 3: dashboardCharts at root
      else if (result.dashboardCharts && typeof result.dashboardCharts === 'object') {
        jsonData = { dashboardCharts: result.dashboardCharts };
        console.log('✅ JSON from result.dashboardCharts');
      }
      // Priority 4: dashboardCharts in data
      else if (result.data?.dashboardCharts) {
        jsonData = { dashboardCharts: result.data.dashboardCharts };
        console.log('✅ JSON from result.data.dashboardCharts');
      }
      // Fallback: Empty structure
      else {
        jsonData = { dashboardCharts: {} };
        console.warn('⚠️ No JSON data found, using empty structure');
        console.log('   Checked: result.json, result.data.json, result.dashboardCharts, result.data.dashboardCharts');
      }
      
      // Ensure dashboardCharts exists
      if (!jsonData.dashboardCharts) {
        jsonData.dashboardCharts = {};
      }
      
      console.log('📊 dashboardCharts keys:', Object.keys(jsonData.dashboardCharts).join(', ') || 'EMPTY');

      console.log('Report text preview:', reportText.substring(0, 200));
      console.log('JSON data keys:', Object.keys(jsonData));
      console.log('dashboardCharts keys:', jsonData.dashboardCharts ? Object.keys(jsonData.dashboardCharts) : 'N/A');

      // Render unified layout for Stage 1
      if (stageNum == 1) {
        console.log('✅ Stage 1 - Attempting to render...');
        
        // V7.12: Ensure container is visible before rendering
        const container = document.getElementById('stage1-unified-container');
        if (container) {
          container.style.display = 'block';
          container.style.visibility = 'visible';
          container.style.opacity = '1';
          container.classList.remove('hidden');
          
          // Hide placeholder if it exists
          const placeholder = container.querySelector('.report-placeholder-unified');
          if (placeholder) placeholder.style.display = 'none';
        }
        
        if (typeof window.renderUnifiedStage1Results === 'function') {
          window.renderUnifiedStage1Results(reportText, jsonData);
          console.log('✅ renderUnifiedStage1Results completed');
        } else {
          console.warn('⚠️ renderUnifiedStage1Results not available - using enhanced fallback');
          // V7.12: Enhanced fallback with better formatting
          if (container) {
            const chartKeys = jsonData?.dashboardCharts ? Object.keys(jsonData.dashboardCharts) : [];
            const reportHtml = (reportText || '')
              .replace(/\n\n/g, '</p><p style="margin-bottom:12px;">')
              .replace(/##\s+(.+)/g, '</p><h3 style="color:#312e81;margin:20px 0 12px;font-size:18px;">$1</h3><p>')
              .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
              .replace(/\*(.+?)\*/g, '<em>$1</em>');
            
            container.innerHTML = `
              <div style="padding: 24px;">
                <div style="background: linear-gradient(135deg, #dbeafe 0%, #ede9fe 100%); padding: 20px; border-radius: 12px; margin-bottom: 24px; border: 1px solid #c7d2fe;">
                  <h2 style="margin: 0 0 8px; color: #312e81; display: flex; align-items: center; gap: 12px;">
                    <span style="font-size: 28px;">✅</span> Stage 1 Analysis Complete
                  </h2>
                  <p style="margin: 0; color: #4338ca;">Strategic intelligence processed successfully</p>
                </div>
                
                ${chartKeys.length > 0 ? `
                <div style="background: #f0fdf4; padding: 16px 20px; border-radius: 12px; margin-bottom: 16px; border: 1px solid #bbf7d0;">
                  <h4 style="margin: 0 0 8px; color: #166534; font-size: 14px;">📊 Available Visualizations (${chartKeys.length})</h4>
                  <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                    ${chartKeys.map(k => `<span style="background: #dcfce7; color: #166534; padding: 4px 12px; border-radius: 20px; font-size: 12px;">${k}</span>`).join('')}
                  </div>
                </div>
                ` : ''}
                
                <div style="background: white; padding: 24px; border-radius: 12px; border: 1px solid #e2e8f0; max-height: 600px; overflow-y: auto;">
                  <h3 style="margin: 0 0 16px; color: #475569; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px;">📝 Strategic Analysis Report</h3>
                  <div style="color: #334155; line-height: 1.7; font-size: 14px;">
                    <p>${reportHtml || '<span style="color:#94a3b8;">Report content loading...</span>'}</p>
                  </div>
                </div>
              </div>
            `;
            console.log('✅ V7.12: Enhanced fallback render complete');
          }
        }
      } else {
        // For other stages, use standard display
        const reportEl = document.getElementById(`stage${stageNum}-report`);
        if (reportEl) {
          const cleanedReport = window.cleanReportForDisplay?.(reportText) || reportText;
          reportEl.innerHTML = window.formatMarkdownReport?.(cleanedReport) || cleanedReport;
        }
        console.log('ℹ️ Not Stage 1 - using standard display');
      }
    } catch (err) {
      console.error('❌ Error displaying stage results:', err);
      window.showToast?.('⚠️ Error displaying results: ' + err.message);
      
      // Emergency fallback
      const container = document.getElementById('stage1-unified-container');
      if (container && stageNum == 1) {
        container.innerHTML = `
          <div style="padding: 24px; background: #fee2e2; border-radius: 12px; margin: 16px;">
            <h3 style="color: #b91c1c;">❌ Display Error</h3>
            <p>Error: ${err.message}</p>
            <pre style="font-size: 12px; background: white; padding: 12px; border-radius: 8px;">${JSON.stringify(result, null, 2).substring(0, 2000)}</pre>
          </div>
        `;
      }
    }
  };

  /**
   * ═══════════════════════════════════════════════════════════════════════════
   * V7 FIX: TIMEOUT ERROR HANDLER
   * Shows user-friendly error when request exceeds 60 seconds
   * ═══════════════════════════════════════════════════════════════════════════
   */
  window.showTimeoutError = function(stageNum, projectId) {
    console.error('⏱️ Timeout error for Stage ' + stageNum + ', Project: ' + projectId);
    
    // Show toast
    window.showToast?.('⏱️ Request timed out after 60 seconds. Server may still be processing...');
    
    // Create modal with recovery options
    const modal = document.createElement('div');

              num: parseInt(match[1]),
              title: match[2].trim(),
              finding: match[3].trim(),
              edge: match[4].trim(),
              impact: match[5].trim()
            });
          }
          return insights;
        }
        
        // V7.20: Generate Command Canvas HTML with glassmorphism

                ${hasChart ? `
                  <div class="fc-chart-stage" id="chart-stage-${sectionNum}">
                    ${chartConfig.isMindMap ? `
                      <div id="${chartConfig.canvasId}" style="width: 100%; height: 400px;"></div>

                ${insights.length > 0 ? `
                  <div class="fc-insight-cards">
                    ${insights.map(insight => `
                      <div class="fc-insight-card">
                        <div class="fc-insight-card-header">

            }
          }, 150);
        }
        
        // V7.25: Also trigger D3 mind map if available
        if (typeof window.createInteractivePillarMindMap === 'function') {
          setTimeout(() => {
            const pillars = result.json?.contentPillars || result.json?.dashboardCharts?.strategicContentPillarsChart || [];
            if (pillars.length > 0) {

              window.createInteractivePillarMindMap(result.json);
            }
          }, 300);
        }
        
        window.showToast?.('✅ Stage 1 Command Canvas loaded!');
      }
      
      // V7.25: Enhanced section parser with multiple pattern support
      function parseReportIntoSections(report) {
        if (!report || report.length < 50) return [];
        
        const sections = [];
        
        // Try multiple patterns for section detection
        const patterns = [
          /SECTION\s+(\d+):\s*([A-Z][^\n]+)/gi,
          /##\s+(\d+)\.\s*([^\n]+)/gi,
          /\*\*SECTION\s+(\d+):\s*([^*]+)\*\*/gi,
          /(?:^|\n)(\d+)\.\s+([A-Z][A-Za-z\s&-]+)(?:\n|$)/gm
        ];
        
        for (const pattern of patterns) {
          const matches = [...report.matchAll(pattern)];
          if (matches.length >= 5) { // Need at least 5 sections to consider valid
            for (let i = 0; i < matches.length; i++) {
              const match = matches[i];
              const start = match.index;
              const end = matches[i + 1]?.index || report.length;
              const content = report.substring(start, end).trim();
              
              // Extract sage verdict (first strategic-sounding sentence)
              const sagePatterns = [
                /(?:insight|finding|key|critical|strategic)[^.]*?([^.]{50,200})\.?/i,
                /(?:reveals?|shows?|indicates?)[^.]*?([^.]{50,200})\.?/i,
                /"([^"]{50,200})"/i
              ];
              let sage = 'Strategic analysis for ' + match[2].trim();
              for (const sp of sagePatterns) {
                const sm = content.match(sp);
                if (sm) {
                  sage = sm[1].trim();
                  break;
                }
              }
              
              sections.push({
                num: parseInt(match[1]),
                title: match[2].trim().replace(/[*_]/g, ''),
                content: content,
                sage: sage
              });
            }
            break; // Use first successful pattern
          }
        }
        
        // Fallback: split by double newlines if no sections found
        if (sections.length === 0 && report.length > 200) {
          const paragraphs = report.split(/\n\n+/).filter(p => p.trim().length > 50);
          paragraphs.slice(0, 14).forEach((para, idx) => {
            const titleMatch = para.match(/^(?:#+\s*)?([^\n]{10,60})/);
            sections.push({
              num: idx + 1,
              title: titleMatch ? titleMatch[1].replace(/[#*_]/g, '').trim() : `Section ${idx + 1}`,
              content: para,
              sage: para.substring(0, 150).replace(/[#*_\n]/g, ' ').trim() + '...'
            });
          });
        }
        
        return sections;
      }
      
      // V7.25: Format section content with markdown-like styling
      function formatSectionContent(content) {
        return (content || '')
          .replace(/\n\n/g, '</p><p style="margin-bottom:12px;">')
          .replace(/##\s+(.+)/g, '</p><h3 style="color:#F8FAFC;margin:20px 0 12px;">$1</h3><p>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>')
          .replace(/- (.+)/g, '<li style="margin-left:16px;margin-bottom:4px;">$1</li>');
      }
      
      // V7.25: Expose renderDirectFallback globally for the fallback renderer
      window._renderDirectFallback = renderDirectFallback;
      
      // V7.25: Check for pending render from fallback
      if (window._pendingStage1Render) {
        console.log('🔄 V7.25: Processing pending Stage 1 render...');
        renderDirectFallback(window._pendingStage1Render);
        delete window._pendingStage1Render;

      // Start rendering
      tryRender();
      
      // Populate form fields from JSON
      if (result.json && typeof window.populateFormFieldsFromResponse === 'function') {

      // Generate D3.js visualizations if dashboardCharts exists

        console.log('📊 Generating D3.js visualizations...');
        window.generateStage1Charts(result.json);
      }
      
      window.showToast?.('💎 Strategic intelligence loaded successfully!');
    }
    
    // Show "no results" UI
