  /**
   * V7.22: Parse Elite Strategic Insights from section content
   * Attempts JSON block first, falls back to regex parsing of markdown
   * @param {string} content - Section markdown content
   * @param {number} sectionNum - Section number (1-14)
   * @returns {Array} Array of insight objects with id, type, finding, edge, impact
   */
  window.parseEliteInsights = function(content, sectionNum) {
    const insights = [];
    
    if (!content || typeof content !== 'string') {
      console.warn('⚠️ parseEliteInsights: Invalid content for section', sectionNum);
      return window.getDefaultEliteInsights(sectionNum);
    }
    
    // ─────────────────────────────────────────────────────────────────────────
    // STRATEGY 1: Try JSON block extraction first (most reliable)
    // ─────────────────────────────────────────────────────────────────────────
    const jsonBlockRegex = /```json\s*(\{[\s\S]*?"sectionInsights"[\s\S]*?\})\s*```/;
    const jsonMatch = content.match(jsonBlockRegex);
    
    if (jsonMatch) {
      try {
        const data = JSON.parse(jsonMatch[1]);
        if (data.sectionInsights?.insights && Array.isArray(data.sectionInsights.insights)) {
          console.log('✅ Parsed elite insights from JSON block for section', sectionNum);
          return data.sectionInsights.insights.slice(0, 3).map((insight, idx) => ({
            id: insight.id || idx + 1,
            type: insight.type || 'strategic_opportunity',
            finding: insight.finding || '',
            edge: insight.competitiveEdge || insight.edge || '',
            impact: insight.impact || '',
            priority: insight.priority || 'high',
            timeframe: insight.timeframe || '30-day'
          }));
        }
      } catch (e) {
        console.warn('⚠️ JSON parse failed for section', sectionNum, '- trying regex fallback');
      }
    }
    
    // ─────────────────────────────────────────────────────────────────────────
    // STRATEGY 2: Parse markdown insight blocks with regex
    // ─────────────────────────────────────────────────────────────────────────
    
    // Pattern 1: Full 3-line insight format (Finding/Competitive Edge/Actionable Impact)
    const fullInsightRegex = /🎯\s*INSIGHT\s*#?(\d+)[:\s]*([^\n\r]*)\s*\n[-•]\s*(?:Finding|Discovery)[:\s]*([^\n\r]+)\s*\n[-•]\s*(?:Competitive\s*Edge|Edge|First-Mover|Competitive\s*Advantage)[:\s]*([^\n\r]+)\s*\n[-•]\s*(?:Actionable\s*Impact|Impact|Result)[:\s]*([^\n\r]+)/gi;
    
    let match;
    while ((match = fullInsightRegex.exec(content)) !== null) {
      insights.push({
        id: parseInt(match[1]) || insights.length + 1,
        type: cleanInsightType(match[2]),
        finding: cleanText(match[3]),
        edge: cleanText(match[4]),
        impact: cleanText(match[5]),
        priority: detectPriority(match[5]),
        timeframe: detectTimeframe(match[5])
      });
    }
    
    if (insights.length >= 3) {
      console.log('✅ Parsed', insights.length, 'elite insights from markdown for section', sectionNum);
      return insights.slice(0, 3);
    }
    
    // ─────────────────────────────────────────────────────────────────────────
    // STRATEGY 3: Simpler pattern for partial matches
    // ─────────────────────────────────────────────────────────────────────────
    const simpleInsightRegex = /(?:🎯|INSIGHT|##)\s*(?:INSIGHT\s*)?#?(\d+)[:\s]*([^\n\r]{10,80})/gi;
    
    while ((match = simpleInsightRegex.exec(content)) !== null && insights.length < 3) {
      // Check if this insight ID already captured
      const id = parseInt(match[1]) || insights.length + 1;
      if (!insights.find(i => i.id === id)) {
        insights.push({
          id: id,
          type: cleanInsightType(match[2]),
          finding: cleanText(match[2]),
          edge: 'Competitive advantage identified',
          impact: 'Strategic impact to be quantified',
          priority: 'high',
          timeframe: '30-day'
        });
      }
    }
    
    // ─────────────────────────────────────────────────────────────────────────
    // FALLBACK: Use defaults if insufficient insights found
    // ─────────────────────────────────────────────────────────────────────────
    if (insights.length < 3) {
      console.warn('⚠️ Only found', insights.length, 'insights for section', sectionNum, '- using defaults');
      return window.getDefaultEliteInsights(sectionNum);
    }
    
    return insights.slice(0, 3);
  };

  /**
   * Clean insight type text
   */
  function cleanInsightType(rawType) {
    if (!rawType) return 'Market Intelligence';
    const cleaned = rawType.replace(/\*\*/g, '').replace(/\[|\]/g, '').trim();
    
    // Map to standard types
    const typeMap = {
      'pain': 'Pain Point Analysis',
      'monetization': 'Pain Point Monetization',
      'emotional': 'Emotional Resonance',
      'aspiration': 'Aspiration Mapping',
      'gap': 'Competitive Gap',
      'job': 'JTBD Discovery',
      'underserved': 'Underserved Job',
      'switching': 'Switching Cost',
      'blind spot': 'Blind Spot Exploitation',
      'kill move': 'Kill Move Execution',
      'market': 'Market Intelligence',
      'opportunity': 'Strategic Opportunity',
      'risk': 'Risk Mitigation',
      'content': 'Content Strategy',
      'brand': 'Brand Positioning',
      'moat': 'Strategic Moat',
      'aeo': 'AEO Optimization',
      'citation': 'Citation Strategy',
      'asset': 'Asset Valuation',
      'brittleness': 'Algorithmic Risk',
      'semantic': 'Semantic DNA',
      'entity': 'Entity Gap',
      'imperative': 'Strategic Imperative',
      'cross-stage': 'Cross-Stage Pattern'
    };
    
    for (const [key, value] of Object.entries(typeMap)) {
      if (cleaned.toLowerCase().includes(key)) {
        return value;
      }
    }
    
    return cleaned.length > 5 && cleaned.length < 50 ? cleaned : 'Market Intelligence';
  }

  /**
   * Clean and normalize text content
   */
  function cleanText(text) {
    if (!text) return '';
    return text
      .replace(/\*\*/g, '')
      .replace(/\[|\]/g, '')
      .replace(/\${[^}]+}/g, '[Data Point]') // Replace unresolved variables
      .replace(/\s+/g, ' ')
      .trim();
  }

  /**
   * Detect priority from impact text
   */
  function detectPriority(text) {
    if (!text) return 'high';
    const lower = text.toLowerCase();
    if (lower.includes('critical') || lower.includes('immediate') || lower.includes('urgent')) return 'critical';
    if (lower.includes('high') || lower.includes('significant')) return 'high';
    if (lower.includes('medium') || lower.includes('moderate')) return 'medium';
    return 'high';
  }

  /**
   * Detect timeframe from impact text
   */
  function detectTimeframe(text) {
    if (!text) return '30-day';
    const lower = text.toLowerCase();
    if (lower.includes('immediate') || lower.includes('today') || lower.includes('now')) return 'immediate';
    if (lower.includes('90') || lower.includes('quarter')) return '90-day';
    if (lower.includes('30') || lower.includes('month')) return '30-day';
    return '30-day';
  }

  /**
   * V7.22: Render Elite Insight Card with 3 strategic insights
   * @param {Array} insights - Array of insight objects
   * @param {number} sectionNum - Section number (1-14)
   * @returns {string} HTML string for insight card
   */
  window.renderEliteInsightCard = function(insights, sectionNum) {
    // Use defaults if no insights provided
    if (!insights || insights.length === 0) {
      insights = window.getDefaultEliteInsights(sectionNum);
    }
    
    // Limit to 3 insights
    const displayInsights = insights.slice(0, 3);
    
    // Generate insight items HTML
    const insightHTML = displayInsights.map((insight, idx) => {
      const priorityClass = insight.priority || 'high';
      const typeLabel = formatTypeLabel(insight.type);
      const timeframeBadge = formatTimeframeBadge(insight.timeframe);
      
      return `
        <div class="elite-insight-item" data-priority="${priorityClass}" data-insight-id="${insight.id || idx + 1}">
          <div class="insight-header">
            <span class="insight-number">${idx + 1}</span>
            <span class="insight-type">${typeLabel}</span>
            ${timeframeBadge}
          </div>
          <p class="insight-finding">${escapeHtml(insight.finding)}</p>
          <div class="insight-meta">
            <div class="insight-edge">
              <span class="meta-icon">🏆</span>
              <span class="meta-text">${escapeHtml(insight.edge)}</span>
            </div>
            <div class="insight-impact">
              <span class="meta-icon">📈</span>
              <span class="meta-text">${escapeHtml(insight.impact)}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
    
    // Return complete card HTML
    return `
      <div class="elite-insights-card" data-section="${sectionNum}">
        <div class="insights-header">
          <span class="insights-icon">🧠</span>
          <span class="insights-title">Elite Strategic Intelligence</span>
          <span class="insights-badge">${displayInsights.length} Insights</span>
        </div>
        <div class="insights-grid">
          ${insightHTML}
        </div>
      </div>
    `;
  };

  /**
   * Format insight type as display label
   */
  function formatTypeLabel(type) {
    if (!type) return 'Strategic Insight';
    // Convert snake_case to Title Case
    return type
      .replace(/_/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  /**
   * Format timeframe as badge HTML
   */
  function formatTimeframeBadge(timeframe) {
    const badges = {
      'immediate': '<span class="timeframe-badge urgent">⚡ Immediate</span>',
      '30-day': '<span class="timeframe-badge month">📅 30-Day</span>',
      '90-day': '<span class="timeframe-badge quarter">📊 90-Day</span>'
    };
    return badges[timeframe] || badges['30-day'];
  }

  /**
   * Escape HTML special characters
   */
  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  /**
   * Comprehensive test of elite insights parsing across all sections
   * Validates acceptance criteria and provides diagnostic output
   * @param {Object} data - Stage 1 data with sections array
   * @returns {Object} Test results with pass/fail status and details
   */
  window.testEliteInsightsParsing = function(data) {
    console.group('🧪 Elite Insights Parsing Test');
    
    const results = {
      passed: 0,
      failed: 0,
      warnings: 0,
      sections: [],
      acceptanceCriteria: {
        allSectionsHave3Insights: false,
        allInsightsHaveQuantifiedImpact: false,
        noRepeatingContent: false
      }
    };
    
    const sections = data?.sections || [];
    const allInsights = [];
    
    sections.forEach((section, idx) => {
      const sectionNum = idx + 1;
      const sectionResult = {
        section: sectionNum,
        title: section.title || `Section ${sectionNum}`,
        status: 'unknown',
        insightCount: 0,
        hasQuantifiedImpact: false,
        parseMethod: 'none',
        issues: []
      };
      
      // Attempt parsing
      let insights = [];
      if (section.eliteInsights?.length) {
        insights = section.eliteInsights;
        sectionResult.parseMethod = 'pre-parsed';
      } else if (section.content && window.parseEliteInsights) {
        insights = window.parseEliteInsights(section.content, sectionNum);
        sectionResult.parseMethod = 'runtime-parsed';
      } else {
        insights = window.getDefaultEliteInsights?.(sectionNum) || [];
        sectionResult.parseMethod = 'fallback';
      }
      
      sectionResult.insightCount = insights.length;
      
      // Check for 3+ insights
      if (insights.length >= 3) {
        sectionResult.status = 'pass';
        results.passed++;
      } else {
        sectionResult.status = 'fail';
        sectionResult.issues.push(`Only ${insights.length} insights (need 3)`);
        results.failed++;
      }
      
      // Check for quantified impact (numbers in findings)
      const hasNumbers = insights.some(i => 
        /\d+%|\d+x|\$\d+|\d+\s*(day|week|month|hour|million|billion|thousand)/i.test(
          (i.finding || '') + (i.impact || '')
        )
      );
      sectionResult.hasQuantifiedImpact = hasNumbers;
      if (!hasNumbers) {
        sectionResult.issues.push('No quantified metrics found');
        results.warnings++;
      }
      
      // Track all insights for uniqueness check
      insights.forEach(i => {
        allInsights.push({
          section: sectionNum,
          finding: i.finding,
          hash: (i.finding || '').toLowerCase().trim().slice(0, 50)
        });
      });
      
      results.sections.push(sectionResult);
    });
    
    // Check acceptance criteria
    results.acceptanceCriteria.allSectionsHave3Insights = results.failed === 0;
    results.acceptanceCriteria.allInsightsHaveQuantifiedImpact = 
      results.sections.filter(s => s.hasQuantifiedImpact).length >= 10;
    
    // Check for duplicates
    const hashes = allInsights.map(i => i.hash);
    const uniqueHashes = new Set(hashes);
    results.acceptanceCriteria.noRepeatingContent = uniqueHashes.size === hashes.length;
    
    // Log results
    console.log('📊 Results Summary:');
    console.log(`  ✅ Passed: ${results.passed}/${sections.length} sections`);
    console.log(`  ❌ Failed: ${results.failed}/${sections.length} sections`);
    console.log(`  ⚠️ Warnings: ${results.warnings}`);
    console.table(results.sections.map(s => ({
      Section: s.section,
      Title: s.title.slice(0, 30),
      Status: s.status === 'pass' ? '✅' : '❌',
      Insights: s.insightCount,
      Quantified: s.hasQuantifiedImpact ? '✅' : '⚠️',
      Method: s.parseMethod
    })));
    
    console.log('📋 Acceptance Criteria:');
    Object.entries(results.acceptanceCriteria).forEach(([key, value]) => {
      console.log(`  ${value ? '✅' : '❌'} ${key}: ${value}`);
    });
    
    console.groupEnd();
    
    return results;
  };
