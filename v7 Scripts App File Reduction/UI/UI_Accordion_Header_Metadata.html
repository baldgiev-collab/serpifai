<!--
  UI_Accordion_Header_Metadata.html
  ACCORDION HEADER METADATA v1.0
  
  Shows word count, reading time, section count in collapsed state
-->
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   TASK 23: ACCORDION HEADER METADATA
   ═══════════════════════════════════════════════════════════════════════════ */

.forensic-meta {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.forensic-meta-item {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  font-size: 0.75rem;
  color: var(--cmd-muted-text);
}

.forensic-meta-icon {
  font-size: 0.875rem;
  opacity: 0.7;
}

.forensic-meta-value {
  font-weight: 600;
}

/* Hide on mobile */
@media (max-width: 600px) {
  .forensic-meta {
    display: none;
  }
}
</style>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   METADATA CALCULATOR
   ═══════════════════════════════════════════════════════════════════════════ */

const AccordionMetadata = {
  
  /**
   * Calculate metadata from markdown content
   */
  calculate(markdown) {
    if (!markdown) {
      return { wordCount: 0, readingTime: '< 1 min', sectionCount: 0 };
    }
    
    // Word count
    const words = markdown.trim().split(/\s+/).filter(w => w.length > 0);
    const wordCount = words.length;
    
    // Reading time (avg 200 wpm)
    const minutes = Math.ceil(wordCount / 200);
    const readingTime = minutes <= 1 ? '< 1 min' : `${minutes} min`;
    
    // Section count (## headers)
    const sections = (markdown.match(/^##\s/gm) || []).length;
    
    return { wordCount, readingTime, sectionCount: sections };
  },
  
  /**
   * Render metadata HTML
   */
  render(markdown) {
    const { wordCount, readingTime, sectionCount } = this.calculate(markdown);
    
    return `
      <div class="forensic-meta">
        <span class="forensic-meta-item">
          <span class="forensic-meta-icon">📝</span>
          <span class="forensic-meta-value">${wordCount.toLocaleString()}</span> words
        </span>
        <span class="forensic-meta-item">
          <span class="forensic-meta-icon">⏱️</span>
          <span class="forensic-meta-value">${readingTime}</span> read
        </span>
        <span class="forensic-meta-item">
          <span class="forensic-meta-icon">📑</span>
          <span class="forensic-meta-value">${sectionCount}</span> sections
        </span>
      </div>
    `;
  }
};

if (typeof window !== 'undefined') {
  window.AccordionMetadata = AccordionMetadata;
}
</script>
