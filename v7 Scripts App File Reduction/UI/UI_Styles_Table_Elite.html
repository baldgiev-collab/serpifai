<!--
  ═══════════════════════════════════════════════════════════════════════════
  UI_Styles_Table_Elite.html
  FORENSIC UPGRADE v7.1 — Zero-Scroll Tables & WCAG Header Contrast
  
  PURPOSE: Enforce table-layout: fixed across ALL tables to eliminate 
           horizontal scroll. Implement WCAG AA contrast (4.5:1 minimum)
           for header text across all 4 themes.
  
  TASKS IMPLEMENTED:
    - UI-1: Zero-Scroll Table Optimization
    - UI-2: Header Contrast Fix
  
  DATE: 2026-01-18
  ═══════════════════════════════════════════════════════════════════════════
-->
<style>
  /* ═══════════════════════════════════════════════════════════════════════════
     UI-1: ZERO-SCROLL TABLE OPTIMIZATION
     Forces ALL tables to respect container width with no horizontal overflow
     ═══════════════════════════════════════════════════════════════════════════ */
  
  /* ============================================================
     1. GLOBAL TABLE RESET — table-layout: fixed enforcement
     ============================================================ */
  .elite-data-table,
  .forensic-table,
  .strategy-table,
  .comp-table,
  .evidence-table,
  .metrics-table,
  .opportunity-table,
  .keyword-table,
  .backlink-table,
  .technical-table,
  .content-table,
  .authority-table,
  .brand-table,
  .scoring-table,
  .conversion-table,
  .audience-table,
  .category-table,
  .overview-table,
  .dashboard-table {
    table-layout: fixed !important;
    width: 100% !important;
    border-collapse: collapse;
  }
  
  /* ============================================================
     2. CELL TEXT WRAPPING — Prevent overflow
     ============================================================ */
  .elite-data-table td,
  .elite-data-table th,
  .forensic-table td,
  .forensic-table th,
  .strategy-table td,
  .strategy-table th,
  .comp-table td,
  .comp-table th,
  table[class*="table"] td,
  table[class*="table"] th {
    word-wrap: break-word !important;
    overflow-wrap: break-word !important;
    hyphens: auto;
    max-width: 0; /* Forces cells to respect table-layout: fixed */
    padding: 10px 12px;
    vertical-align: top;
  }
  
  /* ============================================================
     3. TABLE CONTAINER — Max height with vertical scroll only
     ============================================================ */
  .elite-table-wrapper,
  .forensic-table-container,
  .strategy-table-wrapper,
  .table-scroll-container,
  [class*="table-wrapper"],
  [class*="table-container"] {
    overflow-x: hidden !important;
    overflow-y: auto;
    max-height: 450px;
    border-radius: var(--radius-md, 12px);
    background: var(--surface, #ffffff);
    border: 1px solid var(--border-subtle, #e5e7eb);
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  
  /* ============================================================
     4. STICKY HEADER — Always visible while scrolling
     ============================================================ */
  .elite-data-table thead,
  .forensic-table thead,
  .strategy-table thead,
  .comp-table thead,
  table[class*="table"] thead {
    position: sticky;
    top: 0;
    z-index: 10;
  }
  
  .elite-data-table thead th,
  .forensic-table thead th,
  .strategy-table thead th,
  .comp-table thead th,
  table[class*="table"] thead th {
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(135deg, var(--brand-primary, #4f45e3) 0%, var(--brand-accent, #8b5cf6) 100%);
  }
  
  /* ============================================================
     5. COLUMN WIDTH DISTRIBUTION — First column wider
     ============================================================ */
  .elite-data-table th:first-child,
  .elite-data-table td:first-child,
  .forensic-table th:first-child,
  .forensic-table td:first-child,
  .strategy-table th:first-child,
  .strategy-table td:first-child {
    width: 28%;
  }
  
  /* Numeric columns - centered and narrower */
  .elite-data-table th.numeric,
  .elite-data-table td.numeric,
  .forensic-table th.numeric,
  .forensic-table td.numeric {
    width: 12%;
    text-align: center;
  }
  
  /* ============================================================
     6. RESPONSIVE BREAKPOINTS — Mobile optimization
     ============================================================ */
  @media (max-width: 768px) {
    .elite-table-wrapper,
    .forensic-table-container,
    [class*="table-wrapper"] {
      max-height: 350px;
    }
    
    .elite-data-table td,
    .elite-data-table th,
    .forensic-table td,
    .forensic-table th {
      padding: 8px 10px;
      font-size: 12px;
    }
    
    .elite-data-table th:first-child,
    .elite-data-table td:first-child {
      width: 35%;
    }
  }
  
  @media (max-width: 480px) {
    .elite-table-wrapper,
    .forensic-table-container,
    [class*="table-wrapper"] {
      max-height: 280px;
    }
    
    .elite-data-table td,
    .elite-data-table th {
      padding: 6px 8px;
      font-size: 11px;
    }
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     UI-2: HEADER CONTRAST FIX — WCAG AA Compliance (4.5:1 minimum)
     Ensures header text is readable across all 4 themes
     ═══════════════════════════════════════════════════════════════════════════ */
  
  /* ============================================================
     1. CSS CUSTOM PROPERTIES — Theme-aware header tokens
     ============================================================ */
  :root {
    /* LIGHT theme header tokens */
    --header-text-primary: #1e293b;      /* Slate 800 — 13.5:1 on white */
    --header-text-secondary: #334155;    /* Slate 700 — 9.0:1 on white */
    --header-bg-primary: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    --header-bg-text: #ffffff;           /* White on gradient — 7.0:1+ */
    --table-header-bg: linear-gradient(135deg, #4f46e5 0%, #8b5cf6 100%);
    --table-header-text: #ffffff;
    --table-header-border: #6366f1;
  }
  
  /* DARK theme header tokens */
  [data-theme="dark"] {
    --header-text-primary: #f1f5f9;      /* Slate 100 — 15.0:1 on dark */
    --header-text-secondary: #e2e8f0;    /* Slate 200 — 12.8:1 on dark */
    --header-bg-primary: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
    --header-bg-text: #ffffff;
    --table-header-bg: linear-gradient(135deg, rgba(79, 70, 229, 0.9) 0%, rgba(6, 182, 212, 0.9) 100%);
    --table-header-text: #ffffff;
    --table-header-border: #6366f1;
  }
  
  /* AURORA theme header tokens */
  [data-theme="aurora"] {
    --header-text-primary: #ccfbf1;      /* Teal 100 — 14.2:1 on dark */
    --header-text-secondary: #5eead4;    /* Teal 300 — 10.5:1 on dark */
    --header-bg-primary: linear-gradient(135deg, #0d9488 0%, #10b981 100%);
    --header-bg-text: #ffffff;
    --table-header-bg: linear-gradient(135deg, rgba(13, 148, 136, 0.9) 0%, rgba(16, 185, 129, 0.9) 100%);
    --table-header-text: #ffffff;
    --table-header-border: #14b8a6;
  }
  
  /* NEON theme header tokens */
  [data-theme="neon"] {
    --header-text-primary: #18181b;      /* Zinc 900 — 17.0:1 on light */
    --header-text-secondary: #3f3f46;    /* Zinc 700 — 10.0:1 on light */
    --header-bg-primary: linear-gradient(135deg, #f59e0b 0%, #d946ef 100%);
    --header-bg-text: #18181b;           /* Dark text on neon — 6.5:1 */
    --table-header-bg: linear-gradient(135deg, #f59e0b 0%, #d946ef 100%);
    --table-header-text: #18181b;
    --table-header-border: #fbbf24;
  }
  
  /* ============================================================
     2. TABLE HEADER STYLES — Apply contrast tokens
     ============================================================ */
  .elite-data-table th,
  .forensic-table th,
  .strategy-table th,
  .comp-table th,
  .evidence-table th,
  .metrics-table th,
  table[class*="table"] th {
    background: var(--table-header-bg) !important;
    color: var(--table-header-text) !important;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 2px solid var(--table-header-border);
    text-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
  
  /* ============================================================
     3. FIRST COLUMN HEADER — Extra emphasis
     ============================================================ */
  .elite-data-table th:first-child,
  .forensic-table th:first-child,
  .strategy-table th:first-child {
    font-weight: 700;
    border-right: 1px solid rgba(255,255,255,0.2);
  }
  
  /* ============================================================
     4. CARD/SECTION HEADERS — Apply contrast tokens
     ============================================================ */
  .section-header,
  .card-header,
  .panel-header,
  .bento-header,
  .metric-header {
    color: var(--header-text-primary);
    font-weight: 600;
  }
  
  .section-header h2,
  .section-header h3,
  .card-header h2,
  .card-header h3,
  .bento-header h2,
  .bento-header h3 {
    color: var(--header-text-primary);
    margin: 0;
  }
  
  .section-header .subtitle,
  .card-header .subtitle {
    color: var(--header-text-secondary);
    font-weight: 400;
  }
  
  /* ============================================================
     5. ACCESSIBILITY FOCUS STATES
     ============================================================ */
  .elite-data-table th:focus,
  .forensic-table th:focus,
  table[class*="table"] th:focus {
    outline: 2px solid var(--brand-amber, #f59e0b);
    outline-offset: -2px;
  }
  
  /* ============================================================
     6. HIGH CONTRAST MODE — For vision impaired users
     ============================================================ */
  @media (prefers-contrast: high) {
    :root {
      --header-text-primary: #000000;
      --table-header-text: #ffffff;
    }
    
    [data-theme="dark"],
    [data-theme="aurora"],
    [data-theme="neon"] {
      --header-text-primary: #ffffff;
    }
    
    .elite-data-table th,
    .forensic-table th {
      border: 2px solid currentColor;
    }
  }
  
  /* ═══════════════════════════════════════════════════════════════════════════
     NOTARIZATION BADGE — For Blue Ocean "Search Notary" branding
     ═══════════════════════════════════════════════════════════════════════════ */
  
  .notarization-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: linear-gradient(135deg, #059669 0%, #047857 100%);
    color: #ffffff;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-radius: 4px;
    box-shadow: 0 2px 4px rgba(5, 150, 105, 0.3);
  }
  
  .notarization-badge::before {
    content: "✓";
    font-size: 11px;
  }
  
  .notarization-badge.semantic {
    background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
    box-shadow: 0 2px 4px rgba(124, 58, 237, 0.3);
  }
  
  .notarization-badge.algorithmic {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    box-shadow: 0 2px 4px rgba(37, 99, 235, 0.3);
  }
  
  .notarization-badge.trust-ledger {
    background: linear-gradient(135deg, #0891b2 0%, #0e7490 100%);
    box-shadow: 0 2px 4px rgba(8, 145, 178, 0.3);
  }
  
  /* Evidence Certification Timestamp */
  .evidence-timestamp {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--text-muted);
    background: var(--surface-soft);
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid var(--border-subtle);
  }
  
  .evidence-timestamp::before {
    content: "🔒";
    font-size: 10px;
  }
  
  .evidence-timestamp .timestamp {
    font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
    font-size: 9px;
  }
  
  /* ═══════════════════════════════════════════════════════════════════════════
     V7.14: LIGHT THEME TABLE FIX — Prevent text overlap/invisibility
     ═══════════════════════════════════════════════════════════════════════════ */
  
  /* Ensure section-body tables have proper contrast in light theme */
  [data-theme="light"] .section-body .elite-table-wrapper,
  .theme-light .section-body .elite-table-wrapper {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }
  
  [data-theme="light"] .section-body .elite-data-table th,
  .theme-light .section-body .elite-data-table th {
    background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%) !important;
    color: #ffffff !important;
  }
  
  [data-theme="light"] .section-body .elite-data-table td,
  .theme-light .section-body .elite-data-table td {
    background: #ffffff;
    color: #1f2937 !important;
    border-bottom: 1px solid #e5e7eb;
  }
  
  [data-theme="light"] .section-body .elite-data-table tbody tr:nth-child(even) td,
  .theme-light .section-body .elite-data-table tbody tr:nth-child(even) td {
    background: #f9fafb;
  }
  
  [data-theme="light"] .section-body .elite-data-table tbody tr:hover td,
  .theme-light .section-body .elite-data-table tbody tr:hover td {
    background: #eef2ff;
  }
  
  /* Fix section-text-content overlap issues */
  .section-text-content {
    position: relative;
    z-index: 1;
    overflow-wrap: break-word;
    word-wrap: break-word;
  }
  
  .section-body {
    overflow: auto;
    max-height: none; /* Allow content to expand */
  }
  
  /* Ensure tables inside section-body don't overflow */
  .section-body .elite-table-wrapper {
    margin: 16px 0;
    overflow-x: auto;
    overflow-y: visible;
  }
  
  /* Fix score badges for light theme */
  [data-theme="light"] .score-badge.critical,
  .theme-light .score-badge.critical {
    background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
    color: #ffffff;
  }
  
  [data-theme="light"] .score-badge.high,
  .theme-light .score-badge.high {
    background: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
    color: #ffffff;
  }
  
  [data-theme="light"] .score-badge.medium,
  .theme-light .score-badge.medium {
    background: linear-gradient(135deg, #ca8a04 0%, #eab308 100%);
    color: #1f2937;
  }
  
  [data-theme="light"] .score-badge.low,
  .theme-light .score-badge.low {
    background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%);
    color: #ffffff;
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     V7.20 PHASE 5: CONSISTENT SECTION STYLING (Task 26)
     Ensures all 14 sections have uniform visual treatment
     ═══════════════════════════════════════════════════════════════════════════ */
  
  .stage1-section {
    margin-bottom: 32px;
    padding: 24px;
    background: var(--card-bg, #ffffff);
    border-radius: 12px;
    border: 1px solid var(--border-color, #e5e7eb);
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
  
  .stage1-section:hover {
    box-shadow: 0 6px 24px rgba(0,0,0,0.1);
    transform: translateY(-2px);
  }
  
  .stage1-section h3,
  .stage1-section .section-heading {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text-primary, #1f2937);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .stage1-section .section-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, var(--brand-primary, #4f46e5) 0%, var(--brand-accent, #8b5cf6) 100%);
    color: #ffffff;
    border-radius: 50%;
    font-size: 0.85rem;
    font-weight: 700;
  }
  
  /* ═══════════════════════════════════════════════════════════════════════════
   * V7.21 ELITE PHASE 3: PILLAR DEPTH INDICATOR BADGE
   * Shows 6×5×6 structure validation status for Section 6
   * ═══════════════════════════════════════════════════════════════════════════ */
  
  .pillar-depth-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: auto;
    padding: 4px 10px;
    border-radius: 16px;
    font-size: 0.75rem;
    font-weight: 600;
    font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    cursor: help;
    transition: all 0.2s ease;
  }
  
  .pillar-depth-badge .badge-icon {
    font-size: 0.85rem;
  }
  
  .pillar-depth-badge .badge-text {
    letter-spacing: 0.5px;
  }
  
  .pillar-depth-badge .funnel-indicator {
    font-size: 0.75rem;
    margin-left: 2px;
  }
  
  /* Complete: 6×5×6 achieved */
  .pillar-badge-complete {
    background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
    color: #166534;
    border: 1px solid #86efac;
    box-shadow: 0 2px 8px rgba(34, 197, 94, 0.15);
  }
  
  .pillar-badge-complete:hover {
    background: linear-gradient(135deg, #bbf7d0 0%, #86efac 100%);
    transform: scale(1.05);
  }
  
  /* Partial: 5+ pillars but not complete */
  .pillar-badge-partial {
    background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
    color: #92400e;
    border: 1px solid #fcd34d;
    box-shadow: 0 2px 8px rgba(245, 158, 11, 0.15);
  }
  
  .pillar-badge-partial:hover {
    background: linear-gradient(135deg, #fde68a 0%, #fcd34d 100%);
    transform: scale(1.05);
  }
  
  /* Incomplete: Less than 5 pillars */
  .pillar-badge-incomplete {
    background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
    color: #991b1b;
    border: 1px solid #fca5a5;
    box-shadow: 0 2px 8px rgba(239, 68, 68, 0.15);
  }
  
  .pillar-badge-incomplete:hover {
    background: linear-gradient(135deg, #fecaca 0%, #fca5a5 100%);
    transform: scale(1.05);
  }

  .stage1-section table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
  }
  
  /* Section highlight animation for scroll-to */
  .stage1-section.section-highlight {
    animation: sectionPulse 1.5s ease-out;
  }
  
  @keyframes sectionPulse {
    0% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.4); }
    50% { box-shadow: 0 0 0 12px rgba(79, 70, 229, 0); }
    100% { box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
  }
  
  /* Dark theme section styling */
  [data-theme="dark"] .stage1-section {
    background: var(--card-bg, #1e293b);
    border-color: var(--border-color, #334155);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  
  [data-theme="dark"] .stage1-section:hover {
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
  }
  
  /* ═══════════════════════════════════════════════════════════════════════════
     V7.20 PHASE 5: SECTION SUMMARY CARD STYLING (Task 25)
     Key takeaways and CTA at bottom of each section
     ═══════════════════════════════════════════════════════════════════════════ */
  
  .section-summary-card {
    margin-top: 20px;
    padding: 16px 20px;
    background: linear-gradient(135deg, rgba(79, 70, 229, 0.08) 0%, rgba(139, 92, 246, 0.05) 100%);
    border-radius: 10px;
    border: 1px solid rgba(79, 70, 229, 0.2);
    border-left: 4px solid var(--brand-primary, #4f46e5);
  }
  
  .section-summary-card .summary-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  
  .section-summary-card .summary-icon {
    font-size: 1.1rem;
  }
  
  .section-summary-card .summary-title {
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary, #6b7280);
  }
  
  .section-summary-card .summary-takeaways {
    list-style: none;
    padding: 0;
    margin: 0 0 16px 0;
  }
  
  .section-summary-card .summary-takeaways li {
    position: relative;
    padding: 6px 0 6px 20px;
    font-size: 0.9rem;
    color: var(--text-primary, #374151);
    line-height: 1.5;
  }
  
  .section-summary-card .summary-takeaways li::before {
    content: '→';
    position: absolute;
    left: 0;
    color: var(--brand-primary, #4f46e5);
    font-weight: 600;
  }
  
  /* ═══════════════════════════════════════════════════════════════════════════
     V7.21 PHASE 6 (Task 36): STRATEGIC INSIGHT COMPONENT
     Replaces non-functional CTA buttons with Gemini strategic insights
     ═══════════════════════════════════════════════════════════════════════════ */
  
  .strategic-insight {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    margin-top: 12px;
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(6, 182, 212, 0.05) 100%);
    border-radius: 8px;
    border-left: 3px solid #10b981;
  }
  
  .strategic-insight .insight-icon {
    font-size: 1.2rem;
    flex-shrink: 0;
    line-height: 1.4;
  }
  
  .strategic-insight .insight-text {
    font-size: 0.9rem;
    line-height: 1.6;
    color: var(--text-primary, #374151);
    font-style: italic;
    margin: 0;
  }
  
  /* Dark theme strategic insight */
  [data-theme="dark"] .strategic-insight {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(6, 182, 212, 0.1) 100%);
    border-left-color: #10b981;
  }
  
  [data-theme="dark"] .strategic-insight .insight-text {
    color: var(--text-primary, #e2e8f0);
  }
  
  /* Aurora theme strategic insight */
  [data-theme="aurora"] .strategic-insight {
    background: linear-gradient(135deg, rgba(6, 182, 212, 0.15) 0%, rgba(13, 148, 136, 0.1) 100%);
    border-left-color: #06b6d4;
  }
  
  [data-theme="aurora"] .strategic-insight .insight-text {
    color: var(--text-primary, #ccfbf1);
  }
  
  /* Neon theme strategic insight */
  [data-theme="neon"] .strategic-insight {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.12) 0%, rgba(245, 158, 11, 0.08) 100%);
