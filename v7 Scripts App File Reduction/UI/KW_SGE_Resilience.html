<!-- ═══════════════════════════════════════════════════════════════════════════
     KW_SGE_Resilience.html - SGE/AIO Survival Keyword Generator
     Contains: generateSGEResilienceKWs
     ═══════════════════════════════════════════════════════════════════════════ -->
<script>
  /**
   * MODULE 2: SGE/AIO SURVIVAL - 30 AI-Resilient Informational Clusters
   * UI Category: "🛡️ SGE/AIO Survival"
   * Target: Terms that survive AI Overview click-theft
   * Focus: Interactive tools, personalized experiences, gated content
   */
  function generateSGEResilienceKWs(comp, gemini, niche, templates, globalKeywordSet, compIndex) {
    const keywords = [];
    const TARGET_COUNT = 30;
    const kwIntel = gemini.keywordIntelligence || {};
    const domain = comp.domain || '';
    const cleanDomain = domain.replace(/^www\./, '');
    const moat = analyzeCompetitorMoat(comp, gemini);

    // ═══════════════════════════════════════════════════════════════════════════
    // PRIORITY 0: Check ORGANIZED DATA first (from FT_OracleDataOrganizer)
    // PAA questions are PERFECT for SGE survival (tool/experience based)
    // ═══════════════════════════════════════════════════════════════════════════
    const organizedData = window._organizedData || window._eliteTabIntelligence?.organizedData || [];
    const organizedComp = organizedData.find?.(o => 
      (o.domain || '').replace(/^www\./, '') === cleanDomain || o.domain === domain
    );
    const organizedRawData = organizedComp?.tabData?.keywordStrategy?.rawData || {};
    const kwRawData = window._kwStrategyRawData || {};
    
    // ═══════════════════════════════════════════════════════════════════════════
    // V8.5: ALSO CHECK keywordProfile from Step 2.5 (keyword-based PAA/Related)
    // ═══════════════════════════════════════════════════════════════════════════
    const kwProfile = comp.keywordProfile || {};
    const kwProfilePAA = (kwProfile.peopleAlsoAsk || []).map(q => 
      typeof q === 'string' ? { question: q } : q
    );
    const kwProfileRelated = (kwProfile.relatedSearches || []).map(q => 
      typeof q === 'string' ? { query: q } : q
    );
    
    // V73 FIX: Also check apiData.serper for PAA/related (from DB_COMP_Main transformation)
    const apiDataSerper = comp.apiData?.serper || {};
    
    const keywordSignals = comp.keywordProfile || comp.keywordSignals || comp.synthesized?.seo || {};
    let paaQuestions = organizedRawData.paaQuestions || 
                       keywordSignals.peopleAlsoAsk || 
                       apiDataSerper.peopleAlsoAsk ||
                       comp.stages?.serper?.data?.peopleAlsoAsk || 
                       comp.synthesized?.seo?.peopleAlsoAsk ||
                       kwProfilePAA || [];
    let relatedSearches = organizedRawData.keywords || organizedRawData.relatedSearches || 
                          keywordSignals.relatedSearches || 
                          apiDataSerper.relatedSearches ||
                          comp.stages?.serper?.data?.relatedSearches || 
                          comp.synthesized?.seo?.relatedSearches ||
                          kwProfileRelated || [];
    
    // Fallback to global data if empty
    if (paaQuestions.length === 0 && kwRawData.allPAA?.length > 0) paaQuestions = kwRawData.allPAA;
    if (relatedSearches.length === 0 && kwRawData.allRelated?.length > 0) relatedSearches = kwRawData.allRelated;
    
    // V73 FIX: Also use apiData.serper organic titles as fallback source
    const apiOrganic = apiDataSerper.organic || [];
    
    // ORACLE DATA: Extract H2/H3 headings as keyword sources
    const oracleData = comp.stages?.oracleFetcher?.data || comp.synthesized?.website || {};
    const oracleH2 = oracleData.h2 || comp.synthesized?.website?.h2 || [];
    const oracleH3 = oracleData.h3 || comp.synthesized?.website?.h3 || [];
    
    // V12.0 FIX: Extract SERP titles to prevent undefined error
    // V73 FIX: Also check apiData.serper.organic
    const serpData = comp.stages?.serper?.data || comp.synthesized?.seo || {};
    const serpTitles = serpData.organic?.map(o => o.title || '') || 
                       apiOrganic.map(o => o.title || '') ||
                       serpData.titles || 
                       organizedRawData.serpTitles || [];

    console.log(`   🛡️ SGE for ${domain}: PAA=${paaQuestions.length}, Related=${relatedSearches.length}, SERP=${serpTitles.length}, Oracle H2=${oracleH2.length}, H3=${oracleH3.length}`);

    // SGE Resilience = Lower AIO risk (3-5)
    const calculateAIOScore = () => 3; // Static base value (low risk)

    const calculateClashScore = () => 5; // Static base value (medium)

    const generatePlainEnglishDesc = (clash) => {
      if (clash >= 7) return 'SGE Fortress: Requires unique data + interactive widget to defend';
      if (clash <= 4) return 'Tool Opportunity: Build calculator/comparison tool to own this SERP';
      return 'Experience Gap: Create personalized journey to survive AI Overview';
    };

    // PRIORITY 0A: PAA Questions - Perfect for SGE survival (require tools/experiences)
    paaQuestions.forEach(paa => {
      if (keywords.length >= TARGET_COUNT) return;
      const question = (typeof paa === 'string' ? paa : paa.question || paa.title || '').toLowerCase().trim();
      if (!globalKeywordSet.has(question) && question.length > 10) {
        globalKeywordSet.add(question);
        const clashScore = calculateClashScore();
        const aioRisk = calculateAIOScore();
        keywords.push({
          keyword: question,
          intent: 'Informational',
          difficulty: 0, // Real difficulty requires API data
          volume: 0, // Real volume requires API data
          ui_cat: 'sge',
          clash: clashScore,
          aio_risk: aioRisk,
          x: 45 + (compIndex * 5),
          y: 5, // Static base value
          mass: 10, // Static base value
          moat_type: 'Content',
          source: 'serper_paa',
          competitor: domain,
          tip: generateTip(question, clashScore, aioRisk, 'Content', 'Build interactive tool to answer this question')
        });
      }
    });

    // PRIORITY 0B: Related searches with "how", "what", "best" = tool opportunities
    relatedSearches.forEach(rs => {
      if (keywords.length >= TARGET_COUNT) return;
      const query = (typeof rs === 'string' ? rs : rs.query || rs).toLowerCase().trim();
      if (!globalKeywordSet.has(query) && query.length > 5 && /how|what|best|compare|vs|tool|calculator/i.test(query)) {
        globalKeywordSet.add(query);
        const clashScore = calculateClashScore();
        const aioRisk = calculateAIOScore();
        keywords.push({
          keyword: query,
          intent: 'Transactional',
          difficulty: 0, // Real difficulty requires API data
          volume: 0, // Real volume requires API data
          ui_cat: 'sge',
          clash: clashScore,
          aio_risk: aioRisk,
          x: 48 + (compIndex * 5),
          y: 5, // Static base value
          mass: 10, // Static base value
          moat_type: 'Content',
          source: 'serper_related',
          competitor: domain,
          tip: generateTip(query, clashScore, aioRisk, 'Content', 'Build interactive tool with proprietary data')
        });
      }
    });

    // Priority 1: Extract tool/interactive keywords from Gemini
    const interactiveKWs = kwIntel.transactionalKeywords?.topKeywords || [];
    interactiveKWs.slice(0, 8).forEach(kw => {
      if (keywords.length >= TARGET_COUNT) return;
      const kwText = (kw.keyword || kw).toLowerCase().trim();
      if (!globalKeywordSet.has(kwText) && kwText.length > 3) {
        globalKeywordSet.add(kwText);
        const clashScore = calculateClashScore();
        const aioRisk = calculateAIOScore();
        keywords.push({
          keyword: kwText,
          intent: 'Transactional',
          difficulty: 0, // Real difficulty requires API data
          volume: 0, // Real volume requires API data
          ui_cat: 'sge',
          clash: clashScore,
          aio_risk: aioRisk,
          x: 50 + (compIndex * 5),
          y: 5, // Static base value
          mass: 10, // Static base value
          moat_type: 'Content',
          source: 'gemini',
          competitor: domain,
          tip: generateTip(kwText, clashScore, aioRisk, 'Content', 'Build interactive tool with proprietary data')
        });
      }
    });

    // PRIORITY 2: Oracle H3 headings (long-form content signals - great for SGE survival)
    oracleH3.forEach(h3 => {
      if (keywords.length >= TARGET_COUNT) return;
      const kwText = (typeof h3 === 'string' ? h3 : h3.text || '').toLowerCase().trim();
      if (!globalKeywordSet.has(kwText) && kwText.length > 5 && kwText.length < 100) {
        globalKeywordSet.add(kwText);
        const clashScore = calculateClashScore();
        const aioRisk = calculateAIOScore();
        keywords.push({
          keyword: kwText,
          intent: 'Informational',
          difficulty: 0, // Real difficulty requires API data
          volume: 0, // Real volume requires API data
          ui_cat: 'sge',
          clash: clashScore,
          aio_risk: aioRisk,
          x: 45 + (compIndex * 5),
          y: 5, // Static base value
          mass: 10, // Static base value
          moat_type: 'Content',
          source: 'oracle_h3',
          competitor: domain,
          tip: generateTip(kwText, clashScore, aioRisk, 'Content', 'Build interactive tool with proprietary data')
        });
      }
    });

    // FALLBACK ONLY: Fill with templates if still below target
    // V12.0 FIX: Mark template keywords clearly and log warning with diagnostic info
    if (keywords.length < TARGET_COUNT) {
      const realDataCount = keywords.length;
      const templateCount = TARGET_COUNT - keywords.length;
      
      console.log('═══════════════════════════════════════════════════════');
      console.log(`⚠️ SGE ${domain}: INSUFFICIENT REAL DATA`);
      console.log('═══════════════════════════════════════════════════════');
      console.log(`   Real keywords: ${realDataCount}/${TARGET_COUNT}`);
      console.log(`   PAA Questions available: ${paaQuestions.length}`);
      console.log(`   Related Searches available: ${relatedSearches.length}`);
      console.log(`   SERP Titles available: ${serpTitles.length}`);
      console.log(`   Oracle H2 available: ${oracleH2.length}`);
      console.log(`   Oracle H3 available: ${oracleH3.length}`);
      console.log('───────────────────────────────────────────────────────');
      console.log(`   Using ${templateCount} template-based keywords to fill gaps`);
      console.log('═══════════════════════════════════════════════════════');
      
      // Generate competitor-specific keyword variants for SGE survival
      const domainName = cleanDomain.split('.')[0];
      const competitorTemplates = [
        `${domainName} calculator`,
        `${domainName} tool`,
        `${domainName} roi calculator`,
        `${domainName} comparison tool`,
        `${niche} calculator ${domainName}`,
        `${domainName} analyzer`,
        `${domainName} audit tool`,
        `how to use ${domainName}`,
        `${domainName} workflow`,
        `${domainName} automation`,
        `${domainName} dashboard`,
        `${domainName} reporting`,
        `${domainName} templates`,
        `${domainName} best practices`,
        `${domainName} optimization`
      ];
      
      competitorTemplates.forEach(kwText => {
        if (keywords.length >= TARGET_COUNT) return;
        const normalizedKw = kwText.toLowerCase().trim();
        if (!globalKeywordSet.has(normalizedKw) && normalizedKw.length > 3) {
          globalKeywordSet.add(normalizedKw);
          const clashScore = calculateClashScore();
          const aioRisk = calculateAIOScore();
          keywords.push({
            keyword: normalizedKw,
            intent: 'Transactional',
            difficulty: 0, // Real difficulty requires API data
            volume: 0, // Real volume requires API data
            ui_cat: 'sge',
            clash: clashScore,
            aio_risk: aioRisk,
            x: 45 + (compIndex * 6),
            y: 5, // Static base value
            mass: 10, // Static base value
            moat_type: 'Content',
            source: 'template_fallback',  // V12.0: Clearly marked as template
            _isTemplate: true,  // V12.0: Flag for UI to style differently
            competitor: domain,
            tip: generateTip(normalizedKw, clashScore, aioRisk, 'Content', 'Build interactive tool with proprietary data')
          });
        }
      });
      
      templates.forEach(template => {
        if (keywords.length >= TARGET_COUNT) return;
        const kwText = template.replace('{niche}', niche).toLowerCase().trim();
        if (!globalKeywordSet.has(kwText) && kwText.length > 3) {
          globalKeywordSet.add(kwText);
          const clashScore = calculateClashScore();
          const aioRisk = calculateAIOScore();
          keywords.push({
            keyword: kwText,
            intent: 'Transactional',
            difficulty: 0, // Real difficulty requires API data
            volume: 0, // Real volume requires API data
            ui_cat: 'sge',
            clash: clashScore,
            aio_risk: aioRisk,
            x: 45 + (compIndex * 6),
            y: 5, // Static base value
            mass: 10, // Static base value
            moat_type: 'Content',
            source: 'template_fallback',  // V12.0: Clearly marked as template
            _isTemplate: true,  // V12.0: Flag for UI to style differently
            competitor: domain,
            tip: generateTip(kwText, clashScore, aioRisk, 'Content', 'Proprietary data + gated experience')
          });
        }
      });
    }

    // V12.0: Enhanced logging with real data percentage
    const realDataKeywords = keywords.filter(k => !k._isTemplate && !['template', 'template_fallback', 'competitor_variant'].includes(k.source));
    const realDataPercent = Math.round((realDataKeywords.length / keywords.length) * 100);
    console.log(`   ✅ SGE ${domain}: Generated ${keywords.length} keywords (${realDataKeywords.length} real data = ${realDataPercent}%)`);
    
    return keywords;
  }
  window.generateSGEResilienceKWs = generateSGEResilienceKWs;
</script>
