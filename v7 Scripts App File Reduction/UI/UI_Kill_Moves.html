<script>
(function() {
  'use strict';

  /**
   * V38: Strategic Kill Moves Library for expansion
   * Used to generate additional kill moves when fewer than 4 are provided
   */
  const STRATEGIC_KILL_MOVES_LIBRARY = [
    {
      killMove: 'Content Velocity Blitz - Publish 3x faster than leader',
      vulnerability: 'Content production lag',
      expectedImpact: 'Capture freshness signals and dominate featured snippets within 90 days',
      priority: 'HIGH'
    },
    {
      killMove: 'Topic Authority Moat - Own 25 pillar topics',
      vulnerability: 'Fragmented topic coverage',
      expectedImpact: 'Build semantic authority that prevents new entrants for 12+ months',
      priority: 'HIGH'
    },
    {
      killMove: 'E-E-A-T Signal Amplification - Add expert credentials to every page',
      vulnerability: 'Anonymous/corporate content',
      expectedImpact: 'Improve trust signals and YMYL rankings by 15-30%',
      priority: 'MEDIUM'
    },
    {
      killMove: 'Long-tail Domination - Target 500+ low-competition keywords',

      expectedImpact: 'Capture compound traffic growth of 10-15% monthly',
      priority: 'MEDIUM'
    },
    {
      killMove: 'Zero-Click Optimization - Own PAA and Featured Snippets',

      priority: 'HIGH'
    },
    {
      killMove: 'Conversion Rate Superiority - Outconvert at every funnel stage',
      vulnerability: 'Generic landing pages',
      expectedImpact: 'Generate 2x revenue from same traffic through UX optimization',
      priority: 'CRITICAL'
    },
    {
      killMove: 'Brand Entity Fortification - Build Knowledge Graph presence',
      vulnerability: 'Weak brand identity signals',
      expectedImpact: 'Trigger branded SERP features and improve CTR by 20-40%',
      priority: 'MEDIUM'
    },
    {
      killMove: 'Backlink Arbitrage - Acquire links competitors missed',
      vulnerability: 'Untapped link opportunities',
      expectedImpact: 'Close authority gap 40% faster than organic link building',
      priority: 'HIGH'
    },
    {
      killMove: 'AI-Ready Content Structuring - Optimize for LLM citation',
      vulnerability: 'Unstructured narrative content',
      expectedImpact: 'Capture 25%+ of AI overview citations in your niche',
      priority: 'CRITICAL'
    },
    {
      killMove: 'User Intent Mapping - Match content format to journey stage',
      vulnerability: 'Single content type strategy',
      expectedImpact: 'Reduce bounce rate 30% and increase pages/session by 50%',
      priority: 'HIGH'
    }
  ];

  /**
   * V38: Expand kill moves to minimum 4-6 if fewer are provided
   * @param {Array} killMoves - Original kill moves from Gemini/analysis
   * @returns {Array} Expanded kill moves array with 4-6 items minimum
   */
  function expandKillMovesToMinimum(killMoves) {
    const expanded = [...(killMoves || [])];
    
    // Target 4-6 kill moves
    const targetCount = Math.max(4, Math.min(6, Math.max(4, expanded.length)));
    
    if (expanded.length >= targetCount) {
      return expanded.slice(0, 6); // Cap at 6
    }
    
    // Shuffle library and add unique ones
    const shuffled = [...STRATEGIC_KILL_MOVES_LIBRARY].sort(() => Math.random() - 0.5);
    
    for (const libraryMove of shuffled) {
      if (expanded.length >= targetCount) break;
      
      // Check if similar move already exists (by kill move text similarity)
      const isDuplicate = expanded.some(m => {
        const existingText = (m.killMove || m.action || '').toLowerCase();
        const newText = libraryMove.killMove.toLowerCase();
        // Check for word overlap
        const existingWords = existingText.split(/\s+/);
        const newWords = newText.split(/\s+/);
        const overlap = existingWords.filter(w => newWords.includes(w) && w.length > 4).length;
        return overlap >= 2;
      });
      
      if (!isDuplicate) {
        expanded.push({
          ...libraryMove,
          targetCompetitor: 'Market Leaders'
        });
      }
    }
    
    // Ensure we have at least 4
    while (expanded.length < 4) {
      const randomMove = STRATEGIC_KILL_MOVES_LIBRARY[Math.floor(Math.random() * STRATEGIC_KILL_MOVES_LIBRARY.length)];
      expanded.push({
        ...randomMove,
        targetCompetitor: 'All Competitors'
      });
    }
    
    return expanded.slice(0, 6); // Return max 6
  }

  /**
   * Build Kill Moves section HTML
   * V38: Enhanced to ensure 4-6 kill moves minimum with strategic expansion
   * @param {Array} killMoves - Array of kill move objects
   * @returns {string} HTML string
   */
  function buildKillMovesHTML(killMoves) {
    // V38: Expand to 4-6 kill moves if fewer provided
    const expandedKillMoves = expandKillMovesToMinimum(killMoves);
    
    if (!expandedKillMoves || expandedKillMoves.length === 0) return '';
    
    console.log(`⚔️ [V38] Building Kill Moves: ${killMoves?.length || 0} original → ${expandedKillMoves.length} expanded`);

    let html = `
            <div style="background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); color: white; padding: 32px; border-radius: 16px; margin-bottom: 24px; box-shadow: 0 8px 24px rgba(30,27,75,0.3);">
              <h4 style="margin: 0 0 24px; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 12px;">
                <span style="font-size: 28px;">⚔️</span>
                Kill Moves - Market Capture Strategies
                <span style="font-size: 12px; font-weight: 400; opacity: 0.7; margin-left: auto;">${expandedKillMoves.length} Strategic Actions</span>
              </h4>
              <div style="display: grid; gap: 16px;">
          `;

    // V38: Priority badge colors
    const priorityColors = {
      'CRITICAL': '#ef4444',
      'HIGH': '#f59e0b',
      'MEDIUM': '#10b981',
      'LOW': '#6b7280'
    };

    expandedKillMoves.forEach((move, idx) => {
      const priority = move.priority || (idx < 2 ? 'HIGH' : 'MEDIUM');
      const priorityColor = priorityColors[priority] || '#6b7280';
      
      html += `
              <div style="background: rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; backdrop-filter: blur(10px); border-left: 4px solid ${priorityColor};">
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
                  <span style="font-size: 24px; font-weight: 700; opacity: 0.6;">#${idx + 1}</span>
                  <span style="font-weight: 600; font-size: 16px; flex: 1;">${move.killMove || move.action || 'Strategic Move'}</span>
                  <span style="font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: ${priorityColor}; text-transform: uppercase;">${priority}</span>
                </div>
                <div style="font-size: 13px; opacity: 0.8; margin-bottom: 8px;">Target: <strong>${move.targetCompetitor || move.target || 'Market'}</strong></div>
                ${move.vulnerability ? `<div style="font-size: 13px; opacity: 0.8; margin-bottom: 8px;">🎯 Exploits: ${move.vulnerability}</div>` : ''}
                ${move.expectedImpact || move.estimatedImpact ? `<div style="font-size: 13px; color: #a5f3fc; margin-top: 8px;"><strong>💥 Expected Impact:</strong> ${move.expectedImpact || move.estimatedImpact}</div>` : ''}
              </div>
            `;
    });

    html += `</div></div>`;
    return html;
  }

  /**
   * Build Elite Category Insights Display (NEW v6 format)
   * Works with structured categories array from Gemini 2.0
   * @param {Array} categories - Array of 15 elite intelligence categories
   * @param {Array} competitors - Competitor data for leaderboard
   */
  function buildEliteCategoryInsightsDisplay(categories, competitors) {
    let html = '';

    console.log('🎨 Building ELITE category insights display...');
    console.log('   Categories count:', categories ? categories.length : 0);
    console.log('   Competitors count:', competitors ? competitors.length : 0);

    if (!categories || !Array.isArray(categories) || categories.length === 0) {
      console.warn('⚠️ No categories to display');
      return '<div style="padding: 40px; text-align: center; color: #666;">No category data available.</div>';
    }

    // Header section
    html += `
      <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 32px; border-radius: 16px; margin-bottom: 24px;">
        <h3 style="margin: 0 0 12px; font-size: 24px; font-weight: 700;">🎯 Elite Strategic Intelligence</h3>
        <p style="margin: 0; opacity: 0.9; font-size: 14px;">Comprehensive analysis across ${categories.length} strategic dimensions</p>
      </div>
    `;

    // Category cards grid
    html += `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px;">`;

    const categoryIcons = {
      'Market Position': '📊',
      'Brand Strategy': '🎨',
      'Technical SEO': '⚙️',
      'Content Strategy': '📝',
      'Keyword Strategy': '🔑',
      'Content Production': '🔧',
      'Conversion Optimization': '🎯',
      'User Experience': '✨',
      'Link Building': '🔗',
      'Local SEO': '📍',
      'Social Media': '📱',
      'Analytics': '📈',
      'Technology Stack': '💻',
      'Paid Search': '💰',
      'Content Distribution': '📡'
    };

    const categoryColors = [
      { bg: '#dbeafe', accent: '#3b82f6', text: '#1e40af' },
      { bg: '#fce7f3', accent: '#ec4899', text: '#9d174d' },
      { bg: '#fef3c7', accent: '#f59e0b', text: '#92400e' },
      { bg: '#dcfce7', accent: '#22c55e', text: '#166534' },
      { bg: '#e0e7ff', accent: '#6366f1', text: '#3730a3' },
      { bg: '#cffafe', accent: '#06b6d4', text: '#155e75' },
      { bg: '#fee2e2', accent: '#ef4444', text: '#991b1b' },
      { bg: '#f3e8ff', accent: '#a855f7', text: '#6b21a8' }
    ];

    categories.forEach((category, idx) => {
      const colors = categoryColors[idx % categoryColors.length];
      const icon = categoryIcons[category.name] || '📌';
      const name = category.name || `Category ${idx + 1}`;

      html += `
        <div style="background: ${colors.bg}; padding: 24px; border-radius: 16px; border-left: 4px solid ${colors.accent};">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
            <span style="font-size: 28px;">${icon}</span>
            <h4 style="margin: 0; font-size: 16px; font-weight: 700; color: ${colors.text};">${name}</h4>
          </div>
      `;

      // Strategic Summary
      if (category.strategicSummary) {
        html += `<p style="margin: 0 0 16px; font-size: 14px; line-height: 1.7; color: #374151;">${category.strategicSummary}</p>`;
      }

      // Key Findings
      if (category.keyFindings && category.keyFindings.length > 0) {
        html += `
          <div style="margin-bottom: 16px;">
            <div style="font-size: 11px; font-weight: 700; color: ${colors.text}; margin-bottom: 8px; text-transform: uppercase;">Key Findings</div>
            <ul style="margin: 0; padding-left: 16px; font-size: 13px; color: #4b5563;">
        `;
        category.keyFindings.slice(0, 3).forEach(finding => {
          html += `<li style="margin-bottom: 4px;">${finding}</li>`;
        });
        html += `</ul></div>`;
      }

      // Recommendations
      if (category.actionableRecommendations && category.actionableRecommendations.length > 0) {
        html += `
          <div style="background: white; padding: 12px; border-radius: 10px;">
            <div style="font-size: 11px; font-weight: 700; color: #059669; margin-bottom: 8px;">🎯 TOP ACTION</div>
            <p style="margin: 0; font-size: 13px; color: #374151;">${category.actionableRecommendations[0]}</p>
          </div>
        `;
      }

      html += `</div>`;
    });

    html += `</div>`;
    return html;
  }

  /**
   * Format number for display (fallback if not available globally)
   * @param {number} num - Number to format
   * @returns {string} Formatted number
   */
  function formatNumberLocal(num) {
    if (window.formatNumber) return window.formatNumber(num);
    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
    return num.toString();
  }

  // Export functions globally
  window.buildKillMovesHTML = buildKillMovesHTML;
  window.buildEliteCategoryInsightsDisplay = buildEliteCategoryInsightsDisplay;

})();
</script>
