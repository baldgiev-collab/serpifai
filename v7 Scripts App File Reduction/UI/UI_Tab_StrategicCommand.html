<script>

  /**

  /**
   * Render Emotional Debt Heatmap Card for Content Intelligence tab
   * @param {Object} emotionalData - Result from auditEmotionalResonance()

   */
  function renderEmotionalDebtCard(emotionalData, domain) {
    if (!emotionalData) {

    const score = emotionalData.emotionalDebtScore || 0;
    const factors = emotionalData.frictionFactors || {};
    
    // Score ring color
    const scoreColor = score >= 60 ? '#ef4444' : score >= 40 ? '#f59e0b' : '#22c55e';

    const tonePosition = 50 + (toneValence / 2); // Convert -100..100 to 0..100
    
    // High friction paragraph
    const worstParagraph = emotionalData.evidence?.worstParagraph || '';
    const jargonExamples = emotionalData.evidence?.jargonExamples || [];

    return `

        <div class="emotional-header">
          <div class="emotional-title">
            <span style="font-size: 24px;">💔</span>
            <span>Emotional Debt</span>
          </div>
          <div class="emotional-score-ring">
            <svg viewBox="0 0 80 80">
              <circle fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6" cx="40" cy="40" r="35"/>
              <circle fill="none" stroke="${scoreColor}" stroke-width="6" cx="40" cy="40" r="35"
                      stroke-linecap="round"
                      stroke-dasharray="${circumference}"
                      stroke-dashoffset="${dashOffset}"

            <div class="emotional-score-value" style="color: ${scoreColor}">${score}</div>

        </div>
        
        <div class="friction-heatmap">
          ${_renderFrictionCell('Jargon Density', factors.jargon)}

            <div class="emotional-tone-marker" style="left: ${tonePosition}%"></div>
          </div>

            <span>Neutral</span>
            <span>Positive</span>

        </div>
        
        ${worstParagraph ? `
        <div class="friction-evidence">
          <div class="friction-evidence-header">
            <span class="friction-evidence-title">⚠️ Highest Friction Paragraph</span>
            <span class="friction-evidence-badge">AI View Flagged</span>

          <div class="friction-evidence-text">
            ${_highlightFrictionInText(worstParagraph, jargonExamples)}
          </div>
          
          ${jargonExamples.length > 0 ? `
          <div class="jargon-examples">
            <span style="font-size: 10px; opacity: 0.6; margin-right: 4px;">Jargon:</span>
            ${jargonExamples.slice(0, 6).map(j => `<span class="jargon-tag">${j}</span>`).join('')}
          </div>
          ` : ''}
        </div>
        ` : ''}
        
        ${recommendations.length > 0 ? `
        <div class="friction-recommendations">
          <div class="friction-rec-title">
            <span>💡</span>
            Friction Reduction Actions

              <div class="friction-rec-priority ${rec.priority}"></div>

            🛡️ View Evidence
          </button>
        </div>
      </div>
    `;
  }

  /**
   * Render individual friction cell for heatmap
   * @private
   */
  function _renderFrictionCell(title, factorData) {
    if (!factorData) {
      return `<div class="friction-cell low"><div class="friction-cell-header"><span class="friction-cell-title">${title}</span><span class="friction-cell-score">N/A</span></div></div>`;
    }
    
    const level = (factorData.label || 'Low').toLowerCase();
    const score = factorData.score || 0;
    const impact = factorData.impact || '';
    
    return `
      <div class="friction-cell ${level}">
        <div class="friction-cell-header">
          <span class="friction-cell-title">${title}</span>
          <span class="friction-cell-score">${score}%</span>
        </div>
        <div class="friction-cell-impact">${impact}</div>
      </div>
    `;
  }

  /**
   * Highlight jargon and friction in text
   * @private
   */
  function _highlightFrictionInText(text, jargonWords) {
    let result = _escapeHtmlForCard(text);
    
    // Highlight jargon words
    jargonWords.forEach(word => {
      const regex = new RegExp(`\\b(${word})\\b`, 'gi');
      result = result.replace(regex, '<span class="highlight-jargon">$1</span>');
    });
    
    // Highlight passive voice patterns
    const passivePatterns = /\b(is|are|was|were|been)\s+(\w+ed)\b/gi;
    result = result.replace(passivePatterns, '<span class="highlight-passive">$1 $2</span>');
    
    return result;
  }

  /**
   * Escape HTML for safe display
   * @private
   */
  function _escapeHtmlForCard(text) {
    if (!text) return '';
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .substring(0, 500);
  }

  /**
   * Render mini network preview
   * @private
   */
  function _renderMiniNetwork(nodes, links) {
    if (!nodes.length) return '<div style="opacity: 0.5; text-align: center;">No network data</div>';
    
    // Generate simple SVG preview
    const width = 240;
    const height = 160;
    const centerX = width / 2;
    const centerY = height / 2;
    
    // Position nodes in a circle
    const angleStep = (2 * Math.PI) / nodes.length;
    const radius = Math.min(width, height) / 3;
    
    const nodePositions = nodes.map((node, i) => ({
      ...node,
      x: centerX + Math.cos(angleStep * i) * radius,
      y: centerY + Math.sin(angleStep * i) * radius
    }));
    
    // Create SVG
    let svg = `<svg width="${width}" height="${height}" style="overflow: visible;">`;
    
    // Draw links
    links.forEach(link => {
      const source = nodePositions.find(n => n.id === link.source);
      const target = nodePositions.find(n => n.id === link.target);
      if (source && target) {
        svg += `<line x1="${source.x}" y1="${source.y}" x2="${target.x}" y2="${target.y}" 
                       stroke="rgba(255,255,255,0.2)" stroke-width="1"/>`;
      }
    });
    
    // Draw nodes
    nodePositions.forEach(node => {
      const size = Math.min(15, 5 + node.strength * 2);
      svg += `<circle cx="${node.x}" cy="${node.y}" r="${size}" fill="${node.color || '#3b82f6'}" opacity="0.8"/>`;
      svg += `<text x="${node.x}" y="${node.y + size + 10}" fill="white" font-size="8" text-anchor="middle" opacity="0.7">
                ${(node.label || '').substring(0, 10)}
              </text>`;
    });
    
    svg += '</svg>';
    return svg;
  }
  
  /**
   * Get entity color based on strength
   * @private
   */
  function _getEntityColor(count) {
    if (count > 4) return '#ef4444';
    if (count > 2) return '#f59e0b';
    return '#22c55e';
  }
