// Store chart instances globally

/**
 * Main render function for Elite Competitor Dashboard
 * This is the primary entry point called by the application
 */
function renderEliteCompetitorDashboard(data, containerId, options = {}) {
  const container = document.getElementById(containerId);
  if (!container) {
    console.error('❌ Elite Dashboard container not found:', containerId);
    return;
  }

  console.log('🚀 Rendering Elite Competitor Dashboard...');
  
  // Inject Elite styles if not already injected
  if (typeof injectEliteStyles === 'function') {
    injectEliteStyles();
  }

  // Clear existing content
  container.innerHTML = '';
  
  // Create main dashboard structure
  const dashboardWrapper = document.createElement('div');
  dashboardWrapper.className = 'elite-competitor-dashboard';
  dashboardWrapper.id = 'elite-dashboard-wrapper';
  
  // Build dashboard HTML
  let html = `
    <div class="elite-dashboard-header" style="margin-bottom: 32px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h1 style="margin: 0; font-size: 28px; font-weight: 900; color: #0f172a; letter-spacing: -0.02em;">
            📊 Competitive Intelligence Dashboard
          </h1>
          <p style="margin: 8px 0 0; color: #64748b; font-size: 14px;">
            Board-ready analysis powered by real data + AI insights
          </p>
        </div>
        <div style="display: flex; gap: 12px;">
          <span style="padding: 8px 16px; background: linear-gradient(135deg, #059669, #10b981); color: white; border-radius: 20px; font-size: 11px; font-weight: 700;">
            ELITE v4.0
          </span>
          <span style="padding: 8px 16px; background: #f1f5f9; color: #475569; border-radius: 20px; font-size: 11px; font-weight: 600;">
            ${new Date().toLocaleDateString()}
          </span>
        </div>
      </div>
    </div>
  `;
  
  // Add Executive Summary if data available
  if (data.executiveSummary || data.efficiency) {
    html += `<div id="elite-executive-section"></div>`;
  }
  
  // Add Strategic sections container
  html += `<div id="elite-strategic-section"></div>`;
  
  // Add Tab content container
  html += `<div id="elite-tab-content"></div>`;
  
  // Add Forensics container
  html += `<div id="elite-forensics-section"></div>`;
  
  // Add data source footer
  html += `
    <div class="elite-footer" style="margin-top: 40px; padding: 20px; background: linear-gradient(135deg, #f8fafc, #f1f5f9); border-radius: 16px; text-align: center;">
      <div style="font-size: 11px; color: #64748b;">
        <span>📡 Data Source: ${data.dataSource || 'Real Data + Forensic Analysis'}</span>
        <span style="margin: 0 16px;">|</span>
        <span>Generated: ${data.generatedAt || new Date().toISOString()}</span>
        <span style="margin: 0 16px;">|</span>
        <span>Confidence: ${data.confidence || 'High'}</span>
      </div>
    </div>
  `;
  
  dashboardWrapper.innerHTML = html;
  container.appendChild(dashboardWrapper);
  
  // Render sub-components
  renderDashboardComponents(data, options);
  
  console.log('✅ Elite Competitor Dashboard rendered successfully');
}

/**
 * Render all dashboard components
 * v30.0 FIX: Restored V6 Elite overlays (JTBD, Loss Leader, Emotional Debt, etc.)

  // Render Executive Summary
  if (typeof renderExecutiveSummaryBanner === 'function' && data.executiveSummary) {

    if (execContainer) {

    }
  }
  
  // Render Efficiency Analysis
  if (typeof renderEfficiencyAnalysis === 'function' && data.efficiency) {
    const execContainer = document.getElementById('elite-executive-section');
    if (execContainer) {
      execContainer.innerHTML += renderEfficiencyAnalysis(data.efficiency);
    }
  }
  
  // Render Strategic sections (Kill Moves, Opportunities, etc.)
  const strategicContainer = document.getElementById('elite-strategic-section');
  if (strategicContainer) {
    let strategicHtml = '';
    
    // ═══════════════════════════════════════════════════════════════════
    // 1. KILL MOVES - Entity-Based SEO Strategy
    // ═══════════════════════════════════════════════════════════════════
    if (typeof renderEliteKillMoves === 'function' && data.killMoves && data.killMoves.length > 0) {
      strategicHtml += renderEliteKillMoves(data.killMoves);
    }
    
    // ═══════════════════════════════════════════════════════════════════
    // 2. STRATEGIC OPPORTUNITIES (pass full executiveBrief!)
    // v30.0 FIX: V7 was passing data.opportunities, V6 passes executiveBrief
    // ═══════════════════════════════════════════════════════════════════
    if (typeof renderEliteOpportunities === 'function' && data.executiveBrief) {
      strategicHtml += renderEliteOpportunities(data.executiveBrief);
    }
    
    // ═══════════════════════════════════════════════════════════════════
    // 3. JOBS-TO-BE-DONE (JTBD) OVERLAY - V6 Elite Feature
    // ═══════════════════════════════════════════════════════════════════
    if (typeof renderJobsToBeDone === 'function' && data.executiveBrief?.jobsToBeDone) {
      strategicHtml += renderJobsToBeDone(data.executiveBrief.jobsToBeDone);
    }
    
    // ═══════════════════════════════════════════════════════════════════
    // 4. LOSS LEADER ANALYSIS - V6 Elite Feature
    // ═══════════════════════════════════════════════════════════════════
    if (typeof renderLossLeaderAnalysis === 'function' && data.executiveBrief?.lossLeaderAnalysis) {
      strategicHtml += renderLossLeaderAnalysis(data.executiveBrief.lossLeaderAnalysis);
    }
    
    // ═══════════════════════════════════════════════════════════════════
    // 5. EMOTIONAL DEBT AUDIT - V6 Elite Feature
    // ═══════════════════════════════════════════════════════════════════
    if (typeof renderEmotionalDebtAudit === 'function' && data.executiveBrief?.emotionalDebtAudit) {
      strategicHtml += renderEmotionalDebtAudit(data.executiveBrief.emotionalDebtAudit);
    }
    
    // ═══════════════════════════════════════════════════════════════════
    // 6. TIME-TO-VALUE COMPARISON - V6 Elite Feature
    // ═══════════════════════════════════════════════════════════════════
    if (typeof renderTimeToValue === 'function' && data.executiveBrief?.timeToValueComparison) {
      strategicHtml += renderTimeToValue(data.executiveBrief.timeToValueComparison);
    }
    
    // ═══════════════════════════════════════════════════════════════════
    // 7. PROGRAMMATIC SEO MOAT - V6 Elite Feature
    // ═══════════════════════════════════════════════════════════════════
    if (typeof renderProgrammaticMoat === 'function' && data.executiveBrief?.programmaticMoat) {
      strategicHtml += renderProgrammaticMoat(data.executiveBrief.programmaticMoat);
    }
    if (typeof renderProgrammaticSEOMoat === 'function' && data.executiveBrief?.programmaticSEOMoat) {
      strategicHtml += renderProgrammaticSEOMoat(data.executiveBrief.programmaticSEOMoat);
    }
    
    // ═══════════════════════════════════════════════════════════════════
    // 8. COMPETITIVE ROADMAP
    // ═══════════════════════════════════════════════════════════════════
    if (typeof renderCompetitiveRoadmap === 'function') {
      if (data.roadmap) {
        strategicHtml += renderCompetitiveRoadmap(data.roadmap);
      } else if (data.executiveBrief?.prioritizedRoadmap) {
        strategicHtml += renderCompetitiveRoadmap({ phases: data.executiveBrief.prioritizedRoadmap });
      }
    }
    
    strategicContainer.innerHTML = strategicHtml;
  }
  
  // Render Forensics if available
  if (typeof renderDeepDiveForensics === 'function' && data.forensics) {
    renderDeepDiveForensics(data.forensics, 'elite-forensics-section');
  }
}

/**
 * Render a specific Elite tab
 */
function renderEliteTab(tabId, data, containerId) {
  const tabRenderers = {
    'overview': renderOverviewDashboardElite,
    'market': renderMarketIntelligenceElite,
    'brand': renderBrandPositionElite,
    'technical': renderTechnicalSeoElite,
    'content': renderContentIntelElite,
    'keywords': renderKeywordStrategyElite,
    'authority': renderAuthorityElite,
    'performance': renderPerformanceElite,
    'opportunities': renderOpportunitiesElite
  };
  
  const renderer = tabRenderers[tabId];
  if (renderer && typeof renderer === 'function') {
    renderer(data, containerId);
  } else {
    console.warn(`⚠️ No Elite renderer found for tab: ${tabId}`);
  }
}

/**
 * Render Gemini Insights section
 */
function renderEliteGeminiInsights(data, containerId) {
  const container = document.getElementById(containerId);
  if (!container || !data) return;
  
  // Use the strategic insight renderer
  if (typeof renderSectionStrategicInsight === 'function') {
    container.innerHTML = renderSectionStrategicInsight(data, 'AI Analysis');
  }
}

/**
 * Cleanup function to destroy all chart instances
 */
function cleanupEliteCharts() {
  if (window.eliteChartInstances) {
    Object.keys(window.eliteChartInstances).forEach(key => {
      if (window.eliteChartInstances[key] && typeof window.eliteChartInstances[key].destroy === 'function') {
        window.eliteChartInstances[key].destroy();
      }
    });
    window.eliteChartInstances = {};
  }
  console.log('🧹 Elite charts cleaned up');
}

// Export functions to global scope
window.renderEliteCompetitorDashboard = renderEliteCompetitorDashboard;
window.renderEliteTab = renderEliteTab;
window.renderEliteGeminiInsights = renderEliteGeminiInsights;
window.cleanupEliteCharts = cleanupEliteCharts;

console.log('✅ ELITE Competitor Renderer v4.0 (Modular) loaded');
