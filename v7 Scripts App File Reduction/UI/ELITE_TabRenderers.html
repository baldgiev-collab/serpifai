  container.innerHTML = html;
}

          <div class="quick-win-card">
            <div class="win-header"><span class="win-type type-${w.type?.toLowerCase() || 'general'}">${w.type}</span><span class="win-area">${w.area}</span></div>
            <div class="win-details">
              <p class="win-opportunity">${w.opportunity}</p>

        `).join('')}

    <div class="elite-gap-analysis">
      <h3 class="elite-subsection-title">🔍 Gap Analysis by Category</h3>
