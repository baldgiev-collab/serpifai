/**
 * Helper: Render Semantic Entity Map body content
 * Separated to avoid nested template literal issues
 */
function renderSemanticEntityMapBody(data) {
  const triplets = data?.strategicAudit?.semanticTriplets?.triplets || [];
  const topicClusters = data?.strategicAudit?.semanticTriplets?.topicClusters || [];
  const confidence = data?.strategicAudit?.semanticTriplets?.confidence || 0;
  
  if (triplets.length === 0) {
    return '<div class="pending-analysis">Semantic analysis pending... <span class="pending-spinner">⏳</span></div>';
  }
  
  let html = `
    <div class="entity-map-summary" style="display: flex; gap: 16px; margin-bottom: 16px;">
      <div class="entity-stat" style="flex: 1; text-align: center; padding: 12px; background: rgba(139, 92, 246, 0.1); border-radius: 8px;">
        <div style="font-size: 24px; font-weight: 700; color: #8b5cf6;">${triplets.length}</div>
        <div style="font-size: 11px; color: #9ca3af;">Entity Relationships</div>
      </div>
      <div class="entity-stat" style="flex: 1; text-align: center; padding: 12px; background: rgba(59, 130, 246, 0.1); border-radius: 8px;">
        <div style="font-size: 24px; font-weight: 700; color: #3b82f6;">${topicClusters.length}</div>
        <div style="font-size: 11px; color: #9ca3af;">Topic Clusters</div>
      </div>
      <div class="entity-stat" style="flex: 1; text-align: center; padding: 12px; background: rgba(16, 185, 129, 0.1); border-radius: 8px;">
        <div style="font-size: 24px; font-weight: 700; color: #10b981;">${confidence}%</div>
        <div style="font-size: 11px; color: #9ca3af;">Confidence</div>
      </div>
    </div>
    
    <div class="triplet-list" style="max-height: 200px; overflow-y: auto;">
  `;
  
  triplets.slice(0, 6).forEach(t => {
    html += `
      <div class="triplet-row" style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom: 6px; font-size: 13px;">
        <span class="entity subject" style="color: #f59e0b; font-weight: 600;">${t.subject || t[0] || ''}</span>
        <span class="relation" style="color: #6b7280; font-style: italic;">→ ${t.predicate || t[1] || ''} →</span>
        <span class="entity object" style="color: #3b82f6; font-weight: 600;">${t.object || t[2] || ''}</span>
      </div>
    `;
  });
  
  if (triplets.length > 6) {
    html += `<div style="text-align: center; color: #6b7280; font-size: 12px; padding: 8px;">+${triplets.length - 6} more relationships...</div>`;
  }
  
  html += '</div>';
  return html;
}
