<script>

  /**

  window.openCompetitorIntelligenceTab = function() {
    // Activate the Competitor Intelligence nav button
    const navButtons = document.querySelectorAll('.nav-subbtn');
    navButtons.forEach(btn => {

  /**
   * ═══════════════════════════════════════════════════════════════════════════
   * v31.3 DATA NORMALIZER - Ensures V6 Elite features work in V7
   * Mirrors PHP competitor_handler.php v30.1 normalization
   * v31.3: Added SERP data normalization (PAA, Related Searches, Organic)
   * ═══════════════════════════════════════════════════════════════════════════
   */
  function normalizeCompetitorData(data) {
    if (!data) return data;
    
    console.log('🔄 [v31.3] Normalizing competitor data for UI compatibility...');
    
    // 1. GEMINI ANALYSIS → ANALYSIS (UI expects "analysis" not "geminiAnalysis")
    if (data.geminiAnalysis && !data.analysis) {
      data.analysis = data.geminiAnalysis;
      console.log('   ✅ Created analysis from geminiAnalysis');
    }
    
    // 2. SURFACE EXECUTIVE BRIEF TO TOP LEVEL
    const execBrief = data.geminiAnalysis?.executiveBrief || data.analysis?.executiveBrief;
    if (execBrief && !data.executiveBrief) {
      data.executiveBrief = execBrief;
      console.log('   ✅ Surfaced executiveBrief to top level - keys:', Object.keys(execBrief));
    }
    
    // 3. SURFACE KILL MOVES TO TOP LEVEL
    const killMoves = data.geminiAnalysis?.killMoves || data.analysis?.killMoves;
    if (killMoves && Array.isArray(killMoves) && !data.killMoves) {
      data.killMoves = killMoves;
      console.log('   ✅ Surfaced killMoves to top level - count:', killMoves.length);
    }
    
    // 4. SURFACE ESTIMATED METRICS
    const estMetrics = data.geminiAnalysis?.estimatedMetrics || data.analysis?.estimatedMetrics;
    if (estMetrics && Array.isArray(estMetrics) && !data.estimatedMetrics) {
      data.estimatedMetrics = estMetrics;
      console.log('   ✅ Surfaced estimatedMetrics to top level - count:', estMetrics.length);
    }
    
    // 5. SURFACE MARKET INTELLIGENCE
    const marketIntel = data.geminiAnalysis?.marketIntelligence || data.analysis?.marketIntelligence;
    if (marketIntel && !data.marketIntelligence) {
      data.marketIntelligence = marketIntel;
      console.log('   ✅ Surfaced marketIntelligence to top level');
    }
    
    // 6. SURFACE KEYWORD INTELLIGENCE
    const keywordIntel = data.geminiAnalysis?.keywordIntelligence || data.analysis?.keywordIntelligence;
    if (keywordIntel && !data.keywordIntelligence) {
      data.keywordIntelligence = keywordIntel;
      console.log('   ✅ Surfaced keywordIntelligence to top level');
    }
    
    // 7. SURFACE CATEGORIES
    const categories = data.geminiAnalysis?.categories || data.analysis?.categories;
    if (categories && Array.isArray(categories) && !data.categories) {
      data.categories = categories;
      console.log('   ✅ Surfaced categories to top level - count:', categories.length);
    }
    
    // 8. SURFACE COMPETITOR RANKINGS
    const rankings = data.geminiAnalysis?.competitorRankings || data.analysis?.competitorRankings;
    if (rankings && Array.isArray(rankings) && !data.competitorRankings) {
      data.competitorRankings = rankings;
      console.log('   ✅ Surfaced competitorRankings to top level - count:', rankings.length);
    }
    
    // 9. TRANSFORM rawData → competitors array
    if ((!data.competitors || data.competitors.length === 0) && data.rawData && typeof data.rawData === 'object') {
      console.log('   🔄 competitorsArray missing, transforming from rawData...');
      const competitorsArray = [];
      Object.entries(data.rawData).forEach(([domain, compData]) => {
        if (typeof compData === 'object' && !compData._trimmed) {
          compData.domain = compData.domain || domain;
          competitorsArray.push(compData);
        }
      });
      if (competitorsArray.length > 0) {
        data.competitors = competitorsArray;
        console.log('   ✅ Transformed', competitorsArray.length, 'competitors from rawData');
      }
    }
    
    // 10. USE competitorsArray if competitors is empty
    if ((!data.competitors || data.competitors.length === 0) && data.competitorsArray && data.competitorsArray.length > 0) {
      data.competitors = data.competitorsArray;
      console.log('   ✅ Used competitorsArray as competitors - count:', data.competitors.length);
    }
    
    // 11. MERGE GEMINI ESTIMATED METRICS INTO COMPETITORS
    if (data.estimatedMetrics && Array.isArray(data.estimatedMetrics) && data.competitors && data.competitors.length > 0) {
      const metricsMap = {};
      data.estimatedMetrics.forEach(metric => {
        const domain = (metric.domain || '').toLowerCase();
        if (domain) metricsMap[domain] = metric;
      });
      
      let mergedCount = 0;
      data.competitors.forEach(comp => {
        const compDomain = (comp.domain || '').toLowerCase();
        const geminiMetrics = metricsMap[compDomain];
        if (geminiMetrics) {
          comp.processedMetrics = comp.processedMetrics || {};
          if (geminiMetrics.organicTraffic) {
            comp.processedMetrics.geminiTraffic = geminiMetrics.organicTraffic;
            comp.processedMetrics.estimatedTraffic = geminiMetrics.organicTraffic;
          }
          if (geminiMetrics.organicKeywords) {
            comp.processedMetrics.geminiKeywords = geminiMetrics.organicKeywords;
            comp.processedMetrics.estimatedKeywords = geminiMetrics.organicKeywords;
          }
          if (geminiMetrics.backlinks) {
            comp.processedMetrics.geminiBacklinks = geminiMetrics.backlinks;
          }
          if (geminiMetrics.authorityScore) {
            comp.processedMetrics.geminiAuthority = geminiMetrics.authorityScore;
          }
          if (geminiMetrics.siteType) {
            comp.processedMetrics.siteType = geminiMetrics.siteType;
          }
          mergedCount++;
        }
      });
      if (mergedCount > 0) {
        console.log('   ✅ Merged Gemini estimated metrics into', mergedCount, 'competitors');
      }
    }
    
    // ═══════════════════════════════════════════════════════════════════════════
    // v31.3 FIX: NORMALIZE SERP DATA FOR EACH COMPETITOR
    // The data is in synthesized.serpFeatures but UI expects it in apiData.serper
    // Also surface PAA and Related Searches from all possible locations
    // ═══════════════════════════════════════════════════════════════════════════
    if (data.competitors && data.competitors.length > 0) {
      let serpNormalizedCount = 0;
      data.competitors.forEach(comp => {
        // Ensure apiData.serper structure exists
        if (!comp.apiData) comp.apiData = {};
        if (!comp.apiData.serper) comp.apiData.serper = {};
        
        // SOURCE 1: synthesized.serpFeatures (Gemini-generated)
        const serpFeatures = comp.synthesized?.serpFeatures || {};
        
        // SOURCE 2: synthesized.seo (PAA from keyword profiles)
        const seoData = comp.synthesized?.seo || {};
        
        // SOURCE 3: stages.serper.data (direct API response)
        const stagesSerper = comp.stages?.serper?.data || {};
        
        // MERGE PAA from all sources (dedupe by question)
        const allPAA = [];
        const seenQuestions = new Set();
        
        [serpFeatures.peopleAlsoAsk, seoData.peopleAlsoAsk, stagesSerper.peopleAlsoAsk, comp.apiData.serper.peopleAlsoAsk].forEach(paaSource => {
          if (Array.isArray(paaSource)) {
            paaSource.forEach(paa => {
              const q = paa?.question || paa;
              if (q && !seenQuestions.has(q.toLowerCase())) {
                seenQuestions.add(q.toLowerCase());
                allPAA.push(typeof paa === 'string' ? { question: paa } : paa);
              }
            });
          }
        });
        
        // MERGE Related Searches from all sources
        const allRelated = [];
        const seenRelated = new Set();
        
        [serpFeatures.relatedSearches, seoData.relatedSearches, stagesSerper.relatedSearches, comp.apiData.serper.relatedSearches].forEach(relSource => {
          if (Array.isArray(relSource)) {
            relSource.forEach(rel => {
              const q = rel?.query || rel;
              if (q && !seenRelated.has(q.toLowerCase())) {
                seenRelated.add(q.toLowerCase());
                allRelated.push(typeof rel === 'string' ? { query: rel } : rel);
              }
            });
          }
        });
        
        // MERGE Organic results
        const allOrganic = stagesSerper.organic || comp.apiData.serper.organic || seoData.organic || [];
        
        // Apply normalized SERP data
        if (allPAA.length > 0) {
          comp.apiData.serper.peopleAlsoAsk = allPAA;
          // Also update synthesized for consistency
          if (!comp.synthesized) comp.synthesized = {};
          if (!comp.synthesized.seo) comp.synthesized.seo = {};
          comp.synthesized.seo.peopleAlsoAsk = allPAA;
        }
        
        if (allRelated.length > 0) {
          comp.apiData.serper.relatedSearches = allRelated;
          if (!comp.synthesized) comp.synthesized = {};
          if (!comp.synthesized.seo) comp.synthesized.seo = {};
          comp.synthesized.seo.relatedSearches = allRelated;
        }
        
        if (allOrganic.length > 0) {
          comp.apiData.serper.organic = allOrganic;
        }
        
        // Also ensure stages.serper.data is populated for legacy code
        if (!comp.stages) comp.stages = {};
        if (!comp.stages.serper) comp.stages.serper = { success: true, data: {} };
        comp.stages.serper.data.peopleAlsoAsk = allPAA;
        comp.stages.serper.data.relatedSearches = allRelated;
        comp.stages.serper.data.organic = allOrganic;
        
        if (allPAA.length > 0 || allRelated.length > 0) {
          serpNormalizedCount++;
        }
      });
      
      if (serpNormalizedCount > 0) {
        console.log('   ✅ [v31.3] Normalized SERP data for', serpNormalizedCount, 'competitors');
      }
    }
    
    console.log('🔄 [v31.3] Normalization complete. Final structure:');
    console.log('   - competitors:', data.competitors?.length || 0);
    console.log('   - analysis:', !!data.analysis);
    console.log('   - executiveBrief:', !!data.executiveBrief);
    console.log('   - killMoves:', data.killMoves?.length || 0);
    console.log('   - estimatedMetrics:', data.estimatedMetrics?.length || 0);
    
    return data;
  }

  /**
   * Initialize competitor tab switching functionality
   */
  window.initializeCompetitorTabs = function() {
    console.log('🔄 Initializing competitor tab switching...');

    // CRITICAL: Prevent duplicate event listener registration
    if (window._tabsInitialized) {
      console.log('⚠️ Tabs already initialized, skipping duplicate registration');
      return;
    }
    window._tabsInitialized = true;

    // Get all tab buttons and panels
    const tabButtons = document.querySelectorAll('.comp-tab-btn');
    const tabPanels = document.querySelectorAll('.comp-tab-panel');

    if (!tabButtons.length || !tabPanels.length) {
      console.error('❌ Tab buttons or panels not found');
      return;
    }

    // Add click handler to each button
    tabButtons.forEach(button => {
      button.addEventListener('click', function () {
        const tabId = this.getAttribute('data-comp-tab');
        if (!tabId) return;

        console.log(`🔄 Switching to tab: ${tabId}`);

        // Remove active class from all buttons
        tabButtons.forEach(btn => btn.classList.remove('active'));

        // Add active class to clicked button
        this.classList.add('active');

        // Hide all panels
        tabPanels.forEach(panel => {
          panel.classList.remove('active');
          panel.style.display = 'none';
        });

        // Show selected panel
        const targetPanel = document.querySelector(`.comp-tab-panel[data-comp-panel="${tabId}"]`);
        if (targetPanel) {
          targetPanel.classList.add('active');
          targetPanel.style.display = 'block';
          console.log(`✅ Activated tab panel: ${tabId}`);

          // CRITICAL FIX: Re-render charts after tab becomes visible
          // Charts need visible parent to calculate dimensions
          setTimeout(() => {
            console.log(`🔄 Refreshing charts for tab: ${tabId}`);
            window.refreshChartsForTab(tabId);
          }, 100);
        } else {
          console.error(`❌ Tab panel not found for: ${tabId}`);
        }
      });
    });

    // Activate first tab (Overview)
    const firstPanel = document.querySelector('.comp-tab-panel[data-comp-panel="overview"]');
    if (firstPanel) {
      firstPanel.style.display = 'block';
    }

    // Hide all other panels initially
    tabPanels.forEach((panel, index) => {
      if (index > 0) {
        panel.style.display = 'none';
      }
    });

    console.log('✅ Tab switching initialized');
  };

  /**
   * CRITICAL: Refresh charts when tab becomes visible
   * Charts rendered while parent is display:none have zero dimensions
   * This function triggers re-render after tab visibility change
   */
  window.refreshChartsForTab = function(tabId) {
    console.log('🔄 refreshChartsForTab called for:', tabId);

    // Get cached competitor data
    const cachedData = window._lastCompetitorData;
    if (!cachedData || !cachedData.competitors) {
      console.warn('⚠️ No cached competitor data for chart refresh');
      return;
    }

    const competitors = cachedData.competitors;

    // Map tab IDs to their render functions
    const tabRenderMap = {
      'content': () => {
        // Skip chart rendering if Elite mode is active (no canvas elements exist)
        const eliteData = cachedData.eliteTabIntelligence || window._eliteTabIntelligence;
        if (eliteData?.contentStrategy) {
          console.log('📊 Content tab using Elite mode - no canvas charts to refresh');
          return;
        }
        // Only render charts if canvas elements exist (fallback mode)
        const chartCanvas = document.getElementById('chart-content-depth');
        if (!chartCanvas) {
          console.log('📊 Content charts not available (Elite mode active)');
          return;
        }
        console.log('📊 Re-rendering Content Intelligence charts...');
        if (typeof renderContentIntelligenceCharts === 'function') {
          renderContentIntelligenceCharts(competitors);
        }
      },
      'technical': () => {
        console.log('📊 Re-rendering Technical SEO charts...');
        if (typeof renderTechnicalSEOCharts === 'function') {
          const calculateRAGReadiness = window.calculateRAGReadiness || ((c) => ({ score: 50 }));
          renderTechnicalSEOCharts(competitors, calculateRAGReadiness);
        }
      },
      'keywords': () => {
        console.log('📊 Re-rendering Keyword Strategy charts...');
        if (typeof renderKeywordStrategyCharts === 'function') {
          renderKeywordStrategyCharts(competitors, null);
        }
      },
      'conversion': () => {
        console.log('📊 Re-rendering Conversion charts...');
        if (typeof renderConversionCharts === 'function') {
          const conversionData = competitors.map(c => ({
            domain: c.domain,
            funnelScore: c.processedMetrics?.funnelScore || 50,
            landingPersuasion: c.processedMetrics?.landingPersuasion || 50,
            revenueModel: c.processedMetrics?.revenueModel || 'Unknown'
          }));
          renderConversionCharts(conversionData);
        }
      },
      'distribution': () => {
        console.log('📊 Re-rendering Distribution charts...');
        if (typeof renderDistributionCharts === 'function') {
          const distData = competitors.map(c => ({
            domain: c.domain,
            pageRank: c.apiData?.openPageRank?.pageRank ?? c.apiData?.openPageRank?.page_rank_decimal ?? c.processedMetrics?.domainAuthority ?? 0,
            domainAuthority: c.processedMetrics?.domainAuthority || 50,
            serpResults: (c.apiData?.serper?.organic || []).length,
            serpVisibility: c.processedMetrics?.serpVisibility || 50,
            externalLinks: c.processedMetrics?.externalLinks || 0
          }));
          renderDistributionCharts(distData);
        }
      },
      'audience': () => {
        console.log('📊 Re-rendering Audience charts...');
        if (typeof renderAudienceCharts === 'function') {
          const audienceMetrics = competitors.map(c => ({
            domain: c.domain,
            personaDepth: c.processedMetrics?.personaDepth || 50,
            emotionalResonance: c.processedMetrics?.emotionalResonance || 50,
            jtbdMatch: c.processedMetrics?.jtbdMatch || 50,
            wordCount: getWebsiteData(c).wordCount || 0,  // v28.7: Use helper
            b2bScore: c.processedMetrics?.b2bScore || 3
          }));
          renderAudienceCharts(audienceMetrics);
        }
      },
      'geo': () => {
        console.log('📊 Re-rendering GEO/AEO charts...');
        if (typeof renderGeoAeoCharts === 'function') {
          const geoData = competitors.map(c => ({
            domain: c.domain,
            aiReadinessScore: c.processedMetrics?.aiReadinessScore || 50,
            schemaCount: (getWebsiteData(c).schemaTypes || []).length,  // v28.7: Use helper
            answerAuthority: c.processedMetrics?.answerAuthority || 50,
            factualIntegrity: c.processedMetrics?.factualIntegrity || 50,
            paaCount: (c.apiData?.serper?.peopleAlsoAsk || []).length
          }));
          renderGeoAeoCharts(geoData);
        }
      },
      'authority': () => {
        console.log('📊 Re-rendering Authority charts...');
        if (typeof renderAuthorityCharts === 'function') {
          const authorityData = competitors.map(c => ({
            domain: c.domain,
            pageRank: c.apiData?.openPageRank?.pageRank ?? c.apiData?.openPageRank?.page_rank_decimal ?? 0,
            topicalRelevance: c.processedMetrics?.topicalRelevance || 50,
            internalLinks: c.processedMetrics?.internalLinks || 10,
            externalLinks: c.processedMetrics?.externalLinks || 5
          }));
          renderAuthorityCharts(authorityData);
        }
      },
      'performance': () => {
        console.log('📊 Re-rendering Performance charts...');
        if (typeof renderPredictiveCharts === 'function') {
          const perfData = competitors.map(c => ({
            domain: c.domain,
            performance: c.apiData?.pageSpeed?.scores?.performance || c.processedMetrics?.performanceScore || 50,
            seo: c.apiData?.pageSpeed?.scores?.seo || c.processedMetrics?.seoScore || 50,
            accessibility: c.apiData?.pageSpeed?.scores?.accessibility || 50,
            bestPractices: c.apiData?.pageSpeed?.scores?.bestPractices || 50,
            pageRank: c.apiData?.openPageRank?.pageRank ?? c.apiData?.openPageRank?.page_rank_decimal ?? 0
          }));
          renderPredictiveCharts(perfData);
        }
      },
      'opportunity': () => {
        console.log('📊 Re-rendering Strategic Opportunity charts...');
        if (typeof renderStrategicCharts === 'function') {
          const strategicData = competitors.map(c => ({
            domain: c.domain,
            moatStrength: c.processedMetrics?.moatStrength || 50,
            opportunityScore: c.processedMetrics?.opportunityScore || 50,
            performance: c.apiData?.pageSpeed?.scores?.performance || 50,
            wordCount: c.synthesized?.website?.wordCount || 0,
            schemaCount: (c.synthesized?.website?.schemaTypes || []).length,
            entryPoints: c.processedMetrics?.entryPoints || 5
          }));
          renderStrategicCharts(strategicData);
        }
      },
      'scoring': () => {
        console.log('📊 Re-rendering Scoring Engine charts...');
        if (typeof renderScoringCharts === 'function') {
          const scoringData = competitors.map(c => ({
            domain: c.domain,
            overall: c.processedMetrics?.overallScore || c.processedMetrics?.competitorScore || 50,
            technical: c.processedMetrics?.technicalScore || c.processedMetrics?.siteHealth || 50,
            authority: c.processedMetrics?.authorityScore || 50,
            content: c.processedMetrics?.contentScore || 50,
            brand: c.processedMetrics?.brandScore || 50,
            visibility: c.processedMetrics?.visibilityScore || 50
          }));
          renderScoringCharts(scoringData);
        }
      }
    };

    // Execute the render function for this tab
    if (tabRenderMap[tabId]) {
      tabRenderMap[tabId]();
    } else {
      console.log('ℹ️ No chart refresh needed for tab:', tabId);
    }
  };

  console.log('✅ COMP_Tab_Render.html loaded');
  console.log('   Exposed: openCompetitorIntelligenceTab, renderCompetitorIntelligence');
  console.log('   Exposed: initializeCompetitorTabs, refreshChartsForTab');
</script>
