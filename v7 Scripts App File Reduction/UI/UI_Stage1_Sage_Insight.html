<!--
  UI_Stage1_Sage_Insight.html
  SAGE-ARCHITECT INSIGHT RENDERER v1.0
  
  Parses Gemini response for 1-line executive verdict
  Truncates to 150 chars, adds "Read more" link
-->
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   TASK 9: SAGE-ARCHITECT INSIGHT RENDERER
   ═══════════════════════════════════════════════════════════════════════════ */

const SageInsightRenderer = {
  
  MAX_LENGTH: 150,
  
  /**
   * Extract executive summary from Gemini response
   * Priority: ## Strategic Verdict > First **bold** sentence > First sentence
   */
  extractInsight(geminiText) {
    if (!geminiText || typeof geminiText !== 'string') {
      return 'Strategic analysis pending...';
    }
    
    // Priority 1: Look for ## Strategic Verdict section
    const verdictMatch = geminiText.match(/##\s*Strategic\s*Verdict[:\s]*\n+([^\n#]+)/i);
    if (verdictMatch) {
      return this.truncate(verdictMatch[1].trim());
    }
    
    // Priority 2: Look for ## Executive Summary
    const execMatch = geminiText.match(/##\s*Executive\s*Summary[:\s]*\n+([^\n#]+)/i);
    if (execMatch) {
      return this.truncate(execMatch[1].trim());
    }
    
    // Priority 3: First **bold** sentence
    const boldMatch = geminiText.match(/\*\*([^*]+)\*\*/);
    if (boldMatch && boldMatch[1].length > 20) {
      return this.truncate(boldMatch[1].trim());
    }
    
    // Priority 4: First meaningful sentence (skip headers)
    const lines = geminiText.split('\n').filter(l => 
      l.trim() && !l.startsWith('#') && !l.startsWith('-') && l.length > 30
    );
    if (lines.length > 0) {
      return this.truncate(lines[0].replace(/\*\*/g, '').trim());
    }
    
    return 'Strategic analysis complete. Expand for details.';
  },
  
  /**
   * Truncate text to MAX_LENGTH with ellipsis
   */
  truncate(text) {
    if (text.length <= this.MAX_LENGTH) return text;
    
    // Cut at word boundary
    const truncated = text.substring(0, this.MAX_LENGTH);
    const lastSpace = truncated.lastIndexOf(' ');
    
    return (lastSpace > 100 ? truncated.substring(0, lastSpace) : truncated) + '...';
  },
  
  /**
   * Render insight HTML with optional "Read more" link
   */
  render(geminiText, accordionId) {
    const insight = this.extractInsight(geminiText);
    const needsExpand = geminiText && geminiText.length > this.MAX_LENGTH;
    
    let html = `<p class="hero-insight">${insight}`;
    
    if (needsExpand && accordionId) {
      html += `<span class="hero-insight-expand" onclick="toggleAccordion(document.getElementById('${accordionId}'))">Read more →</span>`;
    }
    
    html += '</p>';
    return html;
  }
};

// Export for use
if (typeof window !== 'undefined') {
  window.SageInsightRenderer = SageInsightRenderer;
}
</script>
