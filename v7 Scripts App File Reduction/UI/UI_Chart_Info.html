<script>
/**
 * UI_Chart_Info.html
 * Chart info modal with elite strategic insights
 * Extracted from UI_Scripts_App.html for modularization
 */

/**
 * Show chart info modal with ELITE STRATEGIC INSIGHTS
 */
window.showChartInfo = function (canvasId, chartTitle) {
  console.log('📊 Showing info for:', canvasId, chartTitle);

  // ENHANCED: Multi-method chart instance retrieval
  const canvas = document.getElementById(canvasId);
  let chartInstance = null;

  // Method 1: Try canvas mapping
  const instanceKey = window.canvasToInstanceMap ? window.canvasToInstanceMap[canvasId] : null;
  if (instanceKey && window.chartInstances && window.chartInstances[instanceKey]) {
    chartInstance = window.chartInstances[instanceKey];
    console.log('✅ Found via mapping:', instanceKey);
  }

  // Method 2: Try Chart.js getChart() if available
  if (!chartInstance && canvas && typeof Chart !== 'undefined' && Chart.getChart) {
    chartInstance = Chart.getChart(canvas);
    if (chartInstance) console.log('✅ Found via Chart.getChart()');
  }

  // Method 3: Search all chartInstances for matching canvas
  if (!chartInstance && window.chartInstances) {
    for (const key of Object.keys(window.chartInstances)) {
      const inst = window.chartInstances[key];
      if (inst && inst.canvas && inst.canvas.id === canvasId) {
        chartInstance = inst;
        console.log('✅ Found via instance search:', key);
        break;
      }
    }
  }

  console.log('📊 Chart instance for info:', chartInstance ? 'FOUND' : 'NOT FOUND');

  // Extract REAL data from chart
  let dataPoints = 0;
  let avgValue = 0;
  let maxValue = 0;
  let minValue = Infinity;
  let chartType = 'Unknown';
  let totalDatasets = 0;
  let dataLabels = [];
  let datasetLabels = [];
  let allValues = [];
  let topItems = [];
  let bottomItems = [];

  if (chartInstance && chartInstance.data) {
    chartType = chartInstance.config.type || 'Unknown';
    totalDatasets = chartInstance.data.datasets ? chartInstance.data.datasets.length : 0;
    dataLabels = chartInstance.data.labels || [];

    // Extract dataset labels
    if (chartInstance.data.datasets) {
      datasetLabels = chartInstance.data.datasets.map(d => d.label || 'Data').filter(l => l);
    }

    // Calculate metrics from datasets - support ALL data formats
    if (chartInstance.data.datasets && chartInstance.data.datasets.length > 0) {
      chartInstance.data.datasets.forEach((dataset, datasetIdx) => {
        if (dataset.data) {
          dataset.data.forEach((val, idx) => {
            let numVal = null;
            // Handle numeric values
            if (typeof val === 'number') {
              numVal = val;
            }
            // Handle bubble/scatter/range chart format {x, y, r} or [start, end]
            else if (Array.isArray(val)) {
              numVal = val[1] - val[0]; // Range charts (gantt)
            }
            else if (typeof val === 'object' && val !== null) {
              if (val.y !== undefined) numVal = val.y;
              else if (val.r !== undefined) numVal = val.r;
              else if (val.x !== undefined) numVal = val.x;
            }

            if (numVal !== null && !isNaN(numVal)) {
              allValues.push({
                value: numVal,
                label: dataLabels[idx] || `Item ${idx + 1}`,
                dataset: dataset.label || `Dataset ${datasetIdx + 1}`
              });
            }
          });
        }
      });

      dataPoints = allValues.length;
      if (dataPoints > 0) {
        const numericValues = allValues.map(v => v.value);
        avgValue = numericValues.reduce((a, b) => a + b, 0) / dataPoints;
        maxValue = Math.max(...numericValues);
        minValue = Math.min(...numericValues);

        // Get top 3 and bottom 3 items
        const sorted = [...allValues].sort((a, b) => b.value - a.value);
        topItems = sorted.slice(0, 3);
        bottomItems = sorted.slice(-3).reverse();
      }
    }
  }

  // Prevent Infinity for minValue
  if (minValue === Infinity) minValue = 0;

  // Calculate advanced metrics
  const variance = maxValue - minValue;
  const variancePercent = maxValue > 0 ? ((variance / maxValue) * 100).toFixed(1) : 0;
  const confidence = dataPoints > 8 ? 97 : dataPoints > 5 ? 92 : dataPoints > 2 ? 85 : 75;
  const dataQuality = dataPoints > 10 ? 'Enterprise-Grade' : dataPoints > 5 ? 'High Quality' : dataPoints > 2 ? 'Actionable' : 'Preliminary';

  // ELITE Strategic Insights based on chart type AND specific chart
  let strategicInsight = '';
  let actionableItems = [];
  let keyMetrics = [];

  // Chart-specific elite insights
  const chartInsights = {
    'chart-emotional-pains': {
      insight: `Customer pain point analysis reveals ${topItems.length > 0 ? `"${topItems[0].label}" as the dominant frustration with intensity ${topItems[0].value.toFixed(1)}/10` : 'critical friction points'}. ${variancePercent > 40 ? 'High variance indicates diverse customer segments with distinct pain profiles.' : 'Consistent pain levels suggest systemic issues requiring unified solutions.'}`,
      actions: ['Create targeted messaging addressing top pain points', 'Develop solution narratives for each frustration tier', 'Prioritize product features that eliminate high-intensity pains'],
      metrics: [
        { name: 'Pain Intensity Score', tracking: 'Track via monthly customer surveys (1-10 scale). Calculate weighted average across all pain points. Monitor trend over 90 days. Tools: Typeform, SurveyMonkey, or Google Forms with automated reporting.' },
        { name: 'Customer Segment Coverage', tracking: 'Measure % of identified customer segments addressed by solutions. Track monthly via CRM segmentation analysis. Target: 80%+ coverage of high-value segments. Tools: HubSpot, Salesforce custom reports.' },
        { name: 'Resolution Priority Index', tracking: 'Score each pain point by (Frequency × Intensity × Business Impact). Update bi-weekly based on support tickets and sales feedback. Prioritize top 20% for immediate action. Tools: Intercom, Zendesk analytics.' }
      ]
    },
    'chart-hidden-desires': {
      insight: `Aspiration mapping uncovers ${topItems.length > 0 ? `"${topItems[0].label}" as the strongest desire (${topItems[0].value.toFixed(1)}/10)` : 'powerful emotional drivers'}. ${avgValue > 7 ? 'High aspiration intensity indicates strong purchase motivation potential.' : 'Moderate aspirations suggest need for vision elevation in messaging.'}`,
      actions: ['Build aspirational brand positioning around top desires', 'Create transformation stories showcasing desire fulfillment', 'Align product benefits with emotional aspiration triggers'],
      metrics: [
        { name: 'Aspiration Intensity', tracking: 'Measure emotional pull strength via A/B testing messaging variations. Track conversion lift on aspiration-focused vs feature-focused content. Monitor weekly. Tools: Optimizely, VWO, or Google Optimize.' },
        { name: 'Emotional Resonance Score', tracking: 'Calculate engagement rate on transformation stories vs product content. Track time-on-page, scroll depth, and social shares. Update daily via GA4 custom events. Target: 2.5x+ engagement vs baseline.' },
        { name: 'Transformation Potential', tracking: 'Score by (Desire Strength × Market Size × Solution Fit). Quarterly assessment based on customer interviews and competitive analysis. Tools: Gong.io call analysis, customer success surveys.' }
      ]
    },
    'chart-mindset-shifts': {
      insight: `Mindset transformation analysis identifies ${dataLabels.length} cognitive shifts required. ${variancePercent > 30 ? 'Varying shift difficulties indicate need for staged education approach.' : 'Consistent shift requirements enable unified persuasion strategy.'}`,
      actions: ['Design content journey for each mindset transition', 'Create belief-shifting case studies and proof points', 'Build progressive disclosure funnel for complex shifts'],
      metrics: [
        { name: 'Shift Complexity Score', tracking: 'Assess each mindset shift on 1-5 difficulty scale based on research resistance, belief entrenchment, and required education. Review monthly via customer interviews. Tools: Calendly + Zoom call analysis.' },
        { name: 'Educational Content Depth', tracking: 'Track content consumption depth: avg articles read per visitor, video completion rates, whitepaper downloads. Monitor via GA4 engagement events. Target: 3.5+ content pieces per converting visitor.' },
        { name: 'Conversion Readiness', tracking: 'Calculate % of leads completing education milestones before purchase. Track via marketing automation lead scoring. Optimize content sequence for 80%+ milestone completion. Tools: Marketo, Pardot, ActiveCampaign.' }
      ]
    },
    'chart-jtbd-impact': {
      insight: `Jobs-to-be-Done framework reveals ${topItems.length > 0 ? `"${topItems[0].label}" as highest-impact job (${topItems[0].value.toFixed(1)}/10)` : 'key functional and emotional jobs'}. This drives ${avgValue > 7 ? '85%+ of purchase decisions' : 'significant but not dominant decision factors'}.`,
      actions: ['Reframe value proposition around top JTBD', 'Create job-specific landing pages and campaigns', 'Develop outcome-based pricing aligned with job value'],
      metrics: [
        { name: 'Job Priority Score', tracking: 'Score each job by (Frequency × Urgency × Budget Allocation). Survey customers monthly about job importance. Weight by revenue potential. Update CRM fields to track job-based segmentation.' },
        { name: 'Decision Influence Weight', tracking: 'Measure % of closed-won deals where specific JTBD was primary motivator. Track via sales call analysis and win/loss interviews. Tools: Chorus.ai, Gong.io transcription + sentiment analysis.' },
        { name: 'Value Perception Index', tracking: 'Calculate (Perceived Value / Price) ratio per job type. Monthly surveys asking willingness-to-pay for each job outcome. Target: 3x+ value perception vs competition. Tools: Conjoint analysis, Van Westendorp pricing.' }
      ]
    },
    'chart-competitor-gaps': {
      insight: `Competitive gap analysis exposes ${topItems.length > 0 ? `critical opportunity in "${topItems[0].label}" (gap score: ${topItems[0].value.toFixed(1)})` : 'exploitable market whitespace'}. ${maxValue > 7 ? 'Major differentiation potential identified.' : 'Incremental positioning opportunities available.'}`,
      actions: ['Launch targeted campaigns highlighting gap areas', 'Develop unique capabilities in low-competition zones', 'Create comparison content positioning against competitor weaknesses'],

        { name: 'Competitive Gap Size', tracking: 'Measure feature/capability gap vs top 3 competitors using weighted scoring matrix. Update monthly via competitive intelligence tools. Track gap closure velocity. Tools: Crayon.co, Klue, or manual competitor audits.' },
        { name: 'Market Opportunity Score', tracking: 'Calculate (Gap Size × Market Demand × Our Capability). Score 1-10 per gap area. Prioritize gaps with score 7+. Quarterly reassessment. Tools: G2 reviews, Capterra comparison data, customer surveys.' },

    },
    'chart-format-usage': {

      actions: ['Double down investment in top-performing formats', 'Test hybrid formats combining top performers', 'Reallocate resources from underperforming content types'],
      metrics: [
        { name: 'Format Efficiency Score', tracking: 'Calculate (Conversions / Production Hours) per format type. Track weekly via content performance dashboard. Benchmark against historical averages. Target: 15%+ efficiency improvement quarterly. Tools: Google Analytics + internal time tracking.' },
        { name: 'Engagement Multiplier', tracking: 'Measure avg engagement (time + interactions) per format vs baseline. Track daily via GA4 custom metrics. Top formats should show 2-3x baseline engagement. Tools: Hotjar heatmaps, GA4 engagement rate by format.' },
        { name: 'Production ROI', tracking: 'Calculate (Revenue Attributed / Total Production Cost) per format. Monthly financial analysis. Prioritize formats with 5x+ ROI. Track CAC by acquisition format. Tools: HubSpot attribution + finance dashboard.' }

      ]
    },
    'chart-priority-matrix': {
      insight: `Priority matrix analysis reveals optimal resource allocation across ${dataLabels.length} focus areas. ${maxValue > 80 ? 'Clear priority leaders enable focused execution.' : 'Balanced priorities require careful resource orchestration.'}`,
      actions: ['Allocate 70% resources to top 2 priorities', 'Create milestone checkpoints for each priority track', 'Establish clear ownership and accountability per area'],

        { name: 'Priority Weight Score', tracking: 'Score each priority by (Strategic Impact × Resource Efficiency × Market Timing). Recalculate monthly in leadership meetings. Shift resources when scores change >20%. Tools: Weighted scoring spreadsheet, OKR tracking platform (Lattice, Perdoo).' },
        { name: 'Resource Efficiency Index', tracking: 'Measure (Outcomes Achieved / Hours Invested) per priority area. Track weekly via project management data. Benchmark against company averages. Tools: Asana/Monday.com time tracking + outcome metrics dashboard.' },
        { name: 'Execution Velocity Potential', tracking: 'Track average time-to-completion for initiatives per priority area. Calculate cycle time reduction over quarters. Target: 20%+ velocity improvement per area annually. Tools: Jira cycle time reports, sprint velocity charts.' }
      ]
    },
    'chart-opportunity-gaps': {
      insight: `Market opportunity analysis plots ${totalDatasets} strategic positions. ${topItems.length > 0 ? `Highest opportunity: ${topItems[0].label}` : 'Multiple viable market positions identified'} for expansion.`,
      actions: ['Prioritize low-competition, high-demand quadrant', 'Develop entry strategies for each opportunity zone', 'Create competitive moat around captured territories'],
      metrics: [
        { name: 'Opportunity Score', tracking: 'Calculate (Market Size × Growth Rate × Accessibility) for each gap. Score 1-100. Prioritize opportunities >70. Update quarterly with market research. Tools: IBISWorld, Statista, industry analyst reports (Gartner, Forrester).' },
        { name: 'Market Accessibility', tracking: 'Assess barriers to entry: regulations, capital requirements, technical complexity (1-5 scale). Track time-to-market for new opportunity tests. Target: <90 days for market validation. Tools: Competitor analysis, customer development interviews.' },
        { name: 'Competitive Intensity', tracking: 'Monitor # of competitors entering each opportunity gap monthly. Track competitor funding announcements and feature releases. Alert when intensity increases >25%. Tools: Crunchbase alerts, Crayon.co competitive intelligence, Google Alerts.' }
      ]
    },
    'chart-tactical-roadmap': {
      insight: `90-day tactical roadmap spans ${dataLabels.length} strategic initiatives. ${topItems.length > 0 ? `First priority: ${topItems[0].label} (${topItems[0].value} days)` : 'Phased execution plan'} designed for maximum impact velocity.`,
      actions: ['Execute Phase 1 foundation items in first 30 days', 'Build momentum with quick wins before major projects', 'Establish weekly progress checkpoints and adjustments'],
      metrics: [
        { name: 'Execution Velocity', tracking: 'Measure initiatives completed per sprint/week vs planned. Track % of tasks completed on-time. Weekly dashboard review. Target: 85%+ on-time completion rate. Tools: Monday.com timeline view, Asana project dashboards, burndown charts.' },

      ]
    },
    'chart-impact-matrix': {
      insight: `Effort vs Impact matrix positions ${dataPoints} initiatives. ${topItems.length > 0 ? `Top opportunity: ${topItems[0].dataset} quadrant` : 'Clear prioritization framework'} for resource optimization.`,
      actions: ['Execute all Quick Wins within 2 weeks', 'Schedule Major Projects with proper resource allocation', 'Deprioritize or eliminate Avoid quadrant items'],
      metrics: [
        { name: 'Quick Win Count', tracking: 'Identify initiatives in High Impact + Low Effort quadrant. Target: Complete 5-7 quick wins per month. Track completion rate weekly. Celebrate wins publicly to build momentum. Tools: Project board filtered by quadrant, weekly standup reviews.' },
        { name: 'Impact Potential Score', tracking: 'Score each initiative by (Expected Outcome × Reach × Strategic Alignment) on 1-10 scale. Recalculate monthly as new data emerges. Focus on initiatives scoring 7+. Tools: Impact estimation workshop, leadership scoring rubric.' },
        { name: 'Resource Efficiency Ratio', tracking: 'Calculate (Total Impact Delivered / Total Hours Invested) across all initiatives. Benchmark by quadrant. Quick Wins should show 3-5x efficiency vs Major Projects. Track monthly. Tools: Time tracking + outcome metrics dashboard.' }
      ]
    },
    'chart-resource-allocation': {
      insight: `Resource allocation strategy distributes ${totalDatasets} budget categories across ${dataLabels.length} phases. ${avgValue.toFixed(0)}% average allocation per category ensures balanced growth investment.`,
      actions: ['Front-load content investment in Foundation phase', 'Scale paid advertising in Growth and Scale phases', 'Maintain consistent analytics investment throughout'],
      metrics: [
        { name: 'Budget Efficiency Score', tracking: 'Measure (Results / Budget Spent) per category per phase. Track monthly budget burn rate vs plan. Adjust allocations when efficiency drops below 0.8x target. Tools: Financial dashboard, category-specific ROI tracking, monthly budget reviews.' },
        { name: 'Phase Transition Readiness', tracking: 'Define criteria for phase transitions (traffic, conversions, CAC, etc.). Track % of criteria met monthly. Transition to next phase when 80%+ criteria achieved. Tools: Phase gate checklist, KPI dashboards, leadership review meetings.' },
        { name: 'ROI Projection Index', tracking: 'Calculate projected ROI for each investment category based on historical performance + market benchmarks. Update quarterly with actual vs projected analysis. Target: 3-5x blended ROI by Scale phase. Tools: Financial modeling spreadsheet, attribution analysis, cohort LTV tracking.' }
      ]
    }
  };

  // Get chart-specific insights or generate dynamic ones
  const specificInsight = chartInsights[canvasId];
  if (specificInsight) {
    strategicInsight = specificInsight.insight;
    actionableItems = specificInsight.actions;
    keyMetrics = specificInsight.metrics;
  } else {
    // Dynamic insight based on chart type
    switch (chartType.toLowerCase()) {
      case 'bar':
        strategicInsight = `Comparative analysis across ${dataLabels.length} categories reveals ${topItems[0] ? `"${topItems[0].label}" as the leader (${topItems[0].value.toFixed(1)})` : 'clear performance hierarchy'}. ${variancePercent > 50 ? 'High differentiation enables targeted strategy.' : 'Consistent performance across categories.'}`;

                  onmouseout="this.querySelector('.metric-tooltip').style.display='none'">ⓘ
                  <div class="metric-tooltip" style="display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:220px;padding:12px;background:#1f2937;color:white;border-radius:10px;font-size:11px;font-weight:500;text-align:left;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,0.3);line-height:1.5;">

              </div>
              <div style="font-size:32px;font-weight:900;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">${confidence}%</div>
              <div style="font-size:11px;color:#6b7280;margin-top:6px;font-weight:600;">${dataQuality}</div>
            </div>
            <div style="text-align:center;padding:20px 16px;background:white;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,0.06);border:1px solid #e5e7eb;position:relative;">
              <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;">
                <span style="font-size:10px;font-weight:800;color:#9ca3af;text-transform:uppercase;letter-spacing:0.1em;">DATA POINTS</span>
                <span class="metric-info-icon" style="cursor:help;font-size:12px;color:#9ca3af;position:relative;" 
                  onmouseover="this.querySelector('.metric-tooltip').style.display='block'" 
                  onmouseout="this.querySelector('.metric-tooltip').style.display='none'">ⓘ
                  <div class="metric-tooltip" style="display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:220px;padding:12px;background:#1f2937;color:white;border-radius:10px;font-size:11px;font-weight:500;text-align:left;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,0.3);line-height:1.5;">
                    <strong style="color:#34d399;">Data Points</strong><br>
                    Total number of individual data values extracted from the chart.<br><br>
                    Includes all values from all datasets (bars, points, segments, etc.)
                    <div style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid #1f2937;"></div>
                  </div>
                </span>
              </div>
              <div style="font-size:32px;font-weight:900;color:#10b981;">${dataPoints}</div>
              <div style="font-size:11px;color:#6b7280;margin-top:6px;font-weight:600;">${totalDatasets} Dataset${totalDatasets !== 1 ? 's' : ''}</div>
            </div>
            <div style="text-align:center;padding:20px 16px;background:white;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,0.06);border:1px solid #e5e7eb;position:relative;">
              <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;">
                <span style="font-size:10px;font-weight:800;color:#9ca3af;text-transform:uppercase;letter-spacing:0.1em;">AVERAGE</span>
                <span class="metric-info-icon" style="cursor:help;font-size:12px;color:#9ca3af;position:relative;" 
                  onmouseover="this.querySelector('.metric-tooltip').style.display='block'" 
                  onmouseout="this.querySelector('.metric-tooltip').style.display='none'">ⓘ
                  <div class="metric-tooltip" style="display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:220px;padding:12px;background:#1f2937;color:white;border-radius:10px;font-size:11px;font-weight:500;text-align:left;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,0.3);line-height:1.5;">
                    <strong style="color:#fbbf24;">Mean Value</strong><br>
                    Arithmetic average of all data points:<br><br>
                    <code style="background:#374151;padding:2px 6px;border-radius:4px;">Sum ÷ Count</code><br>
                    = ${allValues.length > 0 ? allValues.map(v => v.value).reduce((a, b) => a + b, 0).toFixed(1) : 0} ÷ ${dataPoints}
                    <div style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid #1f2937;"></div>
                  </div>
                </span>
              </div>
              <div style="font-size:32px;font-weight:900;color:#f59e0b;">${avgValue.toFixed(1)}</div>
              <div style="font-size:11px;color:#6b7280;margin-top:6px;font-weight:600;">Mean Value</div>
            </div>
            <div style="text-align:center;padding:20px 16px;background:white;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,0.06);border:1px solid #e5e7eb;position:relative;">
              <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;">
                <span style="font-size:10px;font-weight:800;color:#9ca3af;text-transform:uppercase;letter-spacing:0.1em;">VARIANCE</span>
                <span class="metric-info-icon" style="cursor:help;font-size:12px;color:#9ca3af;position:relative;" 
                  onmouseover="this.querySelector('.metric-tooltip').style.display='block'" 
                  onmouseout="this.querySelector('.metric-tooltip').style.display='none'">ⓘ
                  <div class="metric-tooltip" style="display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:240px;padding:12px;background:#1f2937;color:white;border-radius:10px;font-size:11px;font-weight:500;text-align:left;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,0.3);line-height:1.5;">
                    <strong style="color:#a78bfa;">Variance %</strong><br>
                    Data spread as % of max value:<br><br>
                    <code style="background:#374151;padding:2px 6px;border-radius:4px;">(Max - Min) ÷ Max × 100</code><br>
                    = (${maxValue.toFixed(1)} - ${minValue.toFixed(1)}) ÷ ${maxValue.toFixed(1)} × 100<br><br>
                    Higher % = more diverse data
                    <div style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid #1f2937;"></div>
                  </div>
                </span>
              </div>
              <div style="font-size:32px;font-weight:900;color:#8b5cf6;">${variancePercent}%</div>
              <div style="font-size:11px;color:#6b7280;margin-top:6px;font-weight:600;">${minValue.toFixed(1)} - ${maxValue.toFixed(1)}</div>
            </div>
          </div>
          
          <!-- Top/Bottom Performers -->
          ${topItems.length > 0 ? `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;">
            <div style="padding:20px;background:linear-gradient(135deg,#f0fdf4,#ffffff);border-radius:16px;border:1px solid rgba(34,197,94,0.2);">
              <div style="font-size:11px;font-weight:800;color:#16a34a;margin-bottom:14px;text-transform:uppercase;letter-spacing:0.1em;display:flex;align-items:center;gap:8px;">
                🏆 TOP PERFORMERS
                <span title="Ranked by highest value (descending). These items show the strongest performance and should be prioritized for investment and replication." style="cursor:help;font-size:14px;color:#16a34a;background:rgba(34,197,94,0.15);width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;">?</span>
              </div>
              ${topItems.map((item, i) => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;${i < topItems.length - 1 ? 'border-bottom:1px solid rgba(34,197,94,0.1);' : ''}">
                  <span style="font-size:13px;color:#374151;font-weight:600;" title="Rank #${i + 1} - This item demonstrates ${i === 0 ? 'exceptional' : i === 1 ? 'strong' : 'solid'} performance based on the metric being analyzed">${i + 1}. ${item.label}</span>
                  <span style="font-size:14px;font-weight:800;color:#16a34a;" title="Performance Score: ${item.value.toFixed(1)} - ${i === 0 ? 'Top performer' : i === 1 ? 'Second best' : 'Third best'}">${item.value.toFixed(1)}</span>
                </div>
              `).join('')}
            </div>
            <div style="padding:20px;background:linear-gradient(135deg,#fef2f2,#ffffff);border-radius:16px;border:1px solid rgba(239,68,68,0.2);">
              <div style="font-size:11px;font-weight:800;color:#dc2626;margin-bottom:14px;text-transform:uppercase;letter-spacing:0.1em;display:flex;align-items:center;gap:8px;">
                📉 IMPROVEMENT AREAS
                <span title="Ranked by lowest value (ascending). These items require immediate attention, optimization, or strategic pivots to improve performance." style="cursor:help;font-size:14px;color:#dc2626;background:rgba(239,68,68,0.15);width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;">?</span>
              </div>
              ${bottomItems.map((item, i) => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;${i < bottomItems.length - 1 ? 'border-bottom:1px solid rgba(239,68,68,0.1);' : ''}">
                  <span style="font-size:13px;color:#374151;font-weight:600;" title="Priority #${i + 1} for improvement - This item needs ${i === 0 ? 'urgent' : i === 1 ? 'high-priority' : 'focused'} attention to address underperformance">${i + 1}. ${item.label}</span>
                  <span style="font-size:14px;font-weight:800;color:#dc2626;" title="Performance Score: ${item.value.toFixed(1)} - ${i === 0 ? 'Lowest performer' : i === 1 ? 'Second lowest' : 'Third lowest'}">${item.value.toFixed(1)}</span>
                </div>
              `).join('')}
            </div>
          </div>
          ` : ''}
          
          <!-- Actionable Recommendations -->
          <div style="padding:24px;background:linear-gradient(135deg,#fef3c7,#fffbeb);border-radius:16px;margin-bottom:24px;border:1px solid rgba(245,158,11,0.3);">
            <div style="font-size:11px;font-weight:800;color:#b45309;margin-bottom:16px;text-transform:uppercase;letter-spacing:0.1em;">🎯 ACTIONABLE NEXT STEPS</div>
            <div style="display:flex;flex-direction:column;gap:12px;">
              ${actionableItems.map((item, i) => `
                <div style="display:flex;align-items:flex-start;gap:12px;">
                  <div style="min-width:28px;height:28px;background:linear-gradient(135deg,#f59e0b,#d97706);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:800;">${i + 1}</div>
                  <span style="font-size:14px;color:#374151;line-height:1.6;padding-top:4px;">${item}</span>
                </div>
              `).join('')}
            </div>
          </div>
          
          <!-- Key Metrics Footer -->
          <div style="padding:24px;background:#f8fafc;border-radius:16px;border:1px solid #e5e7eb;">
            <div style="font-size:11px;font-weight:800;color:#6b7280;margin-bottom:18px;text-transform:uppercase;letter-spacing:0.1em;display:flex;align-items:center;gap:8px;">
              📈 KEY METRICS TO TRACK
              <span title="These metrics are specifically chosen for this chart type and provide actionable tracking guidance with recommended tools and frequency." style="cursor:help;font-size:14px;color:#6b7280;background:#e5e7eb;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;">?</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:16px;">
              ${keyMetrics.map((metric, i) => {
    // Handle both string and object formats for backwards compatibility
    const metricName = typeof metric === 'object' ? metric.name : metric;
    const metricTracking = typeof metric === 'object' ? metric.tracking : '';

    return `
                  <div style="padding:16px;background:white;border-radius:12px;border:1px solid #e5e7eb;transition:all 0.2s ease;" onmouseover="this.style.borderColor='#3b82f6';this.style.boxShadow='0 4px 12px rgba(59,130,246,0.15)';" onmouseout="this.style.borderColor='#e5e7eb';this.style.boxShadow='none';">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${metricTracking ? '10px' : '0'};">
                      <div style="display:flex;align-items:center;gap:10px;">
                        <span style="min-width:24px;height:24px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:800;">${i + 1}</span>
                        <span style="font-size:14px;font-weight:700;color:#111827;">${metricName}</span>
                      </div>
                      ${metricTracking ? `<span style="font-size:11px;color:#6b7280;font-weight:600;padding:4px 10px;background:#f3f4f6;border-radius:12px;">📊 HOW TO TRACK</span>` : ''}
                    </div>
                    ${metricTracking ? `
                      <div style="font-size:13px;color:#4b5563;line-height:1.7;padding-left:34px;border-left:3px solid #e5e7eb;margin-left:12px;padding-top:4px;">
                        ${metricTracking}
                      </div>
                    ` : ''}
                  </div>
                `;
  }).join('')}
              <div style="padding:12px 16px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:12px;display:flex;align-items:center;justify-content:space-between;">
                <span style="font-size:12px;font-weight:700;color:white;">Chart Type</span>
                <span style="font-size:13px;font-weight:800;color:white;text-transform:uppercase;letter-spacing:0.05em;">${chartType}</span>
              </div>
            </div>
          </div>
        </div>
      `;

  // Add keyframe animations if not already added
  if (!document.getElementById('chart-info-animations')) {
    const style = document.createElement('style');
    style.id = 'chart-info-animations';
    style.textContent = `
          @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
          }
          @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
          }
          @keyframes fadeInKW {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
          }
          .kw-row-stream {
            transition: background 0.2s, transform 0.1s;
          }
          .kw-row-stream:hover {
            background: rgba(255,255,255,0.12) !important;
            transform: translateX(2px);
          }
        `;
    document.head.appendChild(style);
  }

  document.body.appendChild(modal);

  // Close on background click
  modal.addEventListener('click', function (e) {
    if (e.target === modal) {
      modal.remove();
    }
  });
};
</script>
