<script>
  // @ts-nocheck
  (function() {
    'use strict';
    console.log('?? UI_Scripts_App.html Initialization IIFE starting...');
    console.log('   All modules loaded via includes - wiring events only');

    // ---------------------------------------------------------------------------
    // DOM ELEMENT REFERENCES (Local scope for event wiring)
    // ---------------------------------------------------------------------------
    const projectSelect = document.getElementById('projectSelect');
    const newProjectBtn = document.getElementById('newProjectBtn');
    const renameProjectBtn = document.getElementById('renameProjectBtn');
    const deleteProjectBtn = document.getElementById('deleteProjectBtn');
    const saveProjectBtn = document.getElementById('saveProjectBtn');
    const saveProjectBtnTop = document.getElementById('saveProjectBtnTop');
    const themeBtns = document.querySelectorAll('.btn-theme');

    // ---------------------------------------------------------------------------
    // EVENT WIRING: Project Management Buttons
    // ---------------------------------------------------------------------------
    if (newProjectBtn) newProjectBtn.addEventListener('click', () => window.doNewProject?.());
    if (renameProjectBtn) renameProjectBtn.addEventListener('click', () => window.doRenameProject?.());
    if (deleteProjectBtn) deleteProjectBtn.addEventListener('click', () => window.doDeleteProject?.());
    
    if (projectSelect) {
      projectSelect.addEventListener('change', () => window.loadProject?.(projectSelect.value));
    }

    // ---------------------------------------------------------------------------
    // EVENT WIRING: Save Buttons (Both sidebar and top bar)
    // ---------------------------------------------------------------------------
    function handleSaveProject() {
      const nameInput = document.getElementById('projectNameInput');
      const selectEl = document.getElementById('projectSelect');
      const projectName = (nameInput?.value.trim()) || (selectEl?.value.trim());

      if (!projectName) {
        window.showToast?.('?? Please name your project first');
        nameInput?.focus();
        return;
      }

      window.showToast?.('?? Saving project...');
      const formData = window.collectFormData?.() || {};

      if (typeof google !== 'undefined' && google.script?.run) {
        google.script.run
          .withSuccessHandler(function(result) {
            if (result?.ok) {
              window.showToast?.('? Project "' + projectName + '" saved!');
              const statusEl = document.getElementById('saveStatus');
              if (statusEl) statusEl.textContent = '? Saved at ' + new Date().toLocaleTimeString();
              window.refreshProjectList?.();
              window.refreshCreditDisplay?.();
            } else {
              window.showToast?.('? Save failed: ' + (result?.error || 'Unknown error'));
            }
          })
          .withFailureHandler(function(error) {
            window.showToast?.('? Error: ' + error.message);
          })
          .saveProject(projectName, formData);
      } else {
        window.showToast?.('? Save unavailable in preview mode');
      }
    }

    if (saveProjectBtn) saveProjectBtn.addEventListener('click', handleSaveProject);
    if (saveProjectBtnTop) saveProjectBtnTop.addEventListener('click', handleSaveProject);

    // ---------------------------------------------------------------------------
    // EVENT WIRING: Theme Buttons
    // ---------------------------------------------------------------------------
    themeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        window.switchTheme?.(btn.getAttribute('data-theme-target'));
      });
    });

    // ---------------------------------------------------------------------------
    // INITIALIZATION SEQUENCE
    // ---------------------------------------------------------------------------
    console.log('🚀 Running initialization sequence...');

    // 0. Wire up navigation handlers (CRITICAL - enables tab clicks)
    window.initNavigationHandlers?.();

    // 1. Initialize workflow menu collapse
    window.initWorkflowMenuCollapse?.();

    // 2. Initialize auto-save system
    window.initAutoSave?.();

    // 3. Initialize Gemini model dropdown
    window.initGeminiModelSelect?.();
    
    // 4. Load Gemini models
    window.loadGeminiModels?.();

    // 5. Refresh project list and set initial tab
    window.refreshProjectList?.();
    window.setActiveTab?.('workflow');
    
    // 6. STATE AMNESIA FIX: Recover jobToken from localStorage on page load
    console.log('🔄 Checking for recoverable job token...');
    if (typeof window.ORACLE_STATE_recoverJobToken === 'function') {
      const recoveredToken = window.ORACLE_STATE_recoverJobToken();
      if (recoveredToken) {
        console.log('✅ Job token recovered from localStorage:', recoveredToken);
        
        // LAYER 12: Auto-trigger async rehydration if token exists but no data
        if (typeof window.ORACLE_triggerAutoRehydration === 'function') {
          console.log('🛰️ Triggering Layer 12 Async Rehydration...');
          window.ORACLE_triggerAutoRehydration();
        }
      }
    }

    // 7. Safety check: Ensure at least one tab is visible
    setTimeout(function() {
      const visibleTabs = document.querySelectorAll('.tab.active');
      if (visibleTabs.length === 0) {
        console.warn('?? No active tabs detected, forcing workflow tab visible');
        const workflowTab = document.getElementById('tab-workflow');
        if (workflowTab) {
          workflowTab.classList.add('active');
          workflowTab.style.display = 'block';
        }
      }
    }, 100);

    // 7. Check for Settings hash
    if (window.location.hash === '#settings') {
      window.setActiveTab?.('settings');
      window.location.hash = '';
    }

    console.log('? UI_Scripts_App.html Initialization complete');
  })();
</script>

  /**
   * Copy UI Payload JSON to Clipboard
   * Used by Task 4 UI Payload Export section
   */
  window.copyUIPayloadJSON = function () {
    const jsonEl = document.getElementById('ui-payload-json');
    if (!jsonEl) {
      console.warn('?? UI Payload JSON element not found');
      return;
    }

    const jsonText = jsonEl.textContent || jsonEl.innerText;

    // Modern clipboard API
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(jsonText)
        .then(() => {
          console.log('?? UI Payload JSON copied to clipboard');
          // Visual feedback
          const btn = event.target;
          const originalText = btn.innerHTML;
          btn.innerHTML = '? Copied!';
          btn.style.background = 'linear-gradient(135deg, #16a34a, #15803d)';
          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
          }, 2000);
        })
        .catch(err => {
          console.error('? Failed to copy:', err);
          fallbackCopyToClipboard(jsonText);
        });
    } else {
      fallbackCopyToClipboard(jsonText);
    }
  };

  /**
   * Fallback clipboard copy for older browsers
   */
  function fallbackCopyToClipboard(text) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.left = '-9999px';
    document.body.appendChild(textarea);
    textarea.select();
    try {
      document.execCommand('copy');
      console.log('?? UI Payload JSON copied (fallback method)');
    } catch (err) {
      console.error('? Fallback copy failed:', err);
    }
    document.body.removeChild(textarea);
  }

            `;
        keyInsights.forEach(insight => {
          insightsHtml += `<li style="margin-bottom: 8px; font-size: 14px; line-height: 1.6;">${insight}</li>`;
        });
        insightsHtml += `</ul></div>`;
      }

      // Add recommendations
      if (recommendations && recommendations.length > 0) {
        insightsHtml += `
              <div style="margin-top: 16px;">
                <h5 style="margin: 0 0 8px; font-size: 14px; font-weight: 600; color: #666;">? Recommendations</h5>
                <ol style="margin: 0; padding-left: 20px; color: #555;">
            `;
        recommendations.forEach(rec => {
          insightsHtml += `<li style="margin-bottom: 8px; font-size: 14px; line-height: 1.6;">${rec}</li>`;
        });
        insightsHtml += `</ol></div>`;
      }

      insightsHtml += `</div>`;
    });

    if (!insightsHtml) {
      insightsHtml = `
            <div style="padding: 40px; text-align: center; color: #666;">
              <div style="font-size: 48px; margin-bottom: 16px;">??</div>
              <p style="font-size: 16px; margin: 0;">Category insights will appear here once analysis is complete.</p>
            </div>
          `;
    }

    // Update DOM
    insightsDiv.innerHTML = insightsHtml;
    console.log(`   ? ${tabId} tab populated`);
  }
