<style>

</style>

<script>
  // Global evidence storage for current session
  window.currentEvidenceMap = window.currentEvidenceMap || {};
  window.currentCompetitors = window.currentCompetitors || [];
  
  // Loading state for evidence fetching
  let _auditTrailFetchInProgress = false;

  /**
   * Open the AEO Audit Trail Modal
   * Shows evidence for all AEO-related metrics
   * 
   * v24.0: Uses ORACLE_STATE first, then falls back to database pointer fetch
   * v24.1: Added Diagnostic Shield with jobToken recovery
   */
  function openAEOAuditTrail() {
    console.log('[AuditTrail] Opening AEO evidence modal...');
    
    // ═══════════════════════════════════════════════════════════════════════════
    // FIX #4: DIAGNOSTIC SHIELD - Ensure jobToken is available before proceeding
    // ═══════════════════════════════════════════════════════════════════════════
    if (!window.ORACLE_STATE?.jobToken) {
      console.log('[AuditTrail] No jobToken in ORACLE_STATE, attempting recovery...');
      attemptJobTokenRecovery();
    }
    
    // PRIORITY 1: Check ORACLE_STATE (global memory)
    let competitors = getCompetitorsFromOracleState();
    
    // PRIORITY 2: Fallback to legacy window.currentCompetitors
    if (!competitors || competitors.length === 0) {
      competitors = window.currentCompetitors || window.competitorData?.competitors || [];
      console.log('[AuditTrail] ORACLE_STATE empty, trying legacy sources');
    }
    
    // If still empty, show diagnostic and attempt database pointer fetch
    if (!competitors || competitors.length === 0) {
      console.warn('[AuditTrail] No competitor data in memory');
      showAuditTrailDiagnostic();
      
      // Attempt to fetch evidence from database using pointer
      attemptEvidencePointerFetch();
      return;
    }
    
    console.log(`[AuditTrail] Found ${competitors.length} competitors in state`);
    
    // Build modal content
    const modalHtml = buildAEOAuditTrailContent(competitors);
    
    // Create or update overlay
    showAuditTrailModal(modalHtml);
  }
  
  /**
   * FIX #4: Attempt to recover jobToken from multiple sources
   * Called when ORACLE_STATE.jobToken is null
   * 
   * PRIORITY 1: Check window.ORACLE_STATE
   * PRIORITY 2: Check localStorage
   * PRIORITY 3: Call google.script.run.recoverJobToken
   */
  function attemptJobTokenRecovery() {
    console.log('[AuditTrail] ═══════════════════════════════════════════════════');
    console.log('[AuditTrail] FIX #4: DIAGNOSTIC SHIELD - Token Recovery');
    console.log('[AuditTrail] ═══════════════════════════════════════════════════');
    
    window.ORACLE_STATE = window.ORACLE_STATE || { competitors: {}, evidencePointers: {} };
    
    // ═══════════════════════════════════════════════════════════════════════════
    // PRIORITY 1: Check ORACLE_STATE.jobToken (may already exist)
    // ═══════════════════════════════════════════════════════════════════════════
    if (window.ORACLE_STATE.jobToken) {
      console.log(`[AuditTrail] ✅ PRIORITY 1: Token already in ORACLE_STATE: ${window.ORACLE_STATE.jobToken}`);
      return true;
    }
    
    // ═══════════════════════════════════════════════════════════════════════════
    // PRIORITY 2: localStorage cache (survives page refresh)
    // ═══════════════════════════════════════════════════════════════════════════
    const cachedToken = localStorage.getItem('ORACLE_lastJobToken') || localStorage.getItem('oracle_last_token');
    const cachedTime = localStorage.getItem('ORACLE_lastJobTime');
    
    if (cachedToken) {
      // Check if token is recent (less than 2 hours old)
      const cacheAge = cachedTime ? Date.now() - new Date(cachedTime).getTime() : Infinity;
      const twoHours = 2 * 60 * 60 * 1000;
      
      if (cacheAge < twoHours) {
        window.ORACLE_STATE.jobToken = cachedToken;
        console.log(`[AuditTrail] ✅ PRIORITY 2: Recovered from localStorage: ${cachedToken}`);
        console.log(`[AuditTrail]    Age: ${Math.round(cacheAge / 60000)} minutes`);
        return true;
      } else {
        console.log(`[AuditTrail] ⚠️ PRIORITY 2: Cached token expired (${Math.round(cacheAge / 60000)}min old)`);
      }
    } else {
      console.log('[AuditTrail] ⚠️ PRIORITY 2: No token in localStorage');
    }
    
    // ═══════════════════════════════════════════════════════════════════════════
    // PRIORITY 3: Query server for recent job (FIX #3 SQL query)
    // ═══════════════════════════════════════════════════════════════════════════
    const projectIdInput = document.getElementById('projectId') || 
                           document.getElementById('projectSelect') ||
                           document.querySelector('[name="projectId"]');
    const projectId = projectIdInput?.value || localStorage.getItem('ORACLE_projectId');
    
    if (projectId && typeof google !== 'undefined' && google.script?.run) {
      console.log(`[AuditTrail] 🔍 PRIORITY 3: Server recovery for project: ${projectId}`);
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success && result.jobToken) {
            window.ORACLE_STATE.jobToken = result.jobToken;
            localStorage.setItem('ORACLE_lastJobToken', result.jobToken);
            localStorage.setItem('oracle_last_token', result.jobToken);
            localStorage.setItem('ORACLE_lastJobTime', new Date().toISOString());
            console.log(`[AuditTrail] ✅ PRIORITY 3 SUCCESS: ${result.jobToken} (source: ${result.source})`);
            
            // If we recovered, try opening the modal again
            console.log('[AuditTrail] Re-opening modal with recovered token...');
            setTimeout(() => openAEOAuditTrail(), 100);
          } else {
            console.warn(`[AuditTrail] ❌ PRIORITY 3 FAILED: ${result.error || 'Unknown error'}`);
            console.log('[AuditTrail] Recovery attempts:', result.recoveryAttempts);
            showNoTokenError();
          }
        })
        .withFailureHandler(function(err) {
          console.error('[AuditTrail] ❌ Server token recovery error:', err);
          showNoTokenError();
        })
        .recoverJobToken(projectId);
      
      return false; // Async - will callback
    }
    
    console.error('[AuditTrail] ❌ ALL 3 PRIORITIES FAILED - No job token available');
    return false;
  }
  
  /**
   * Show "No job token available" error only after all 3 recovery attempts fail
   */
  function showNoTokenError() {
    const errorHtml = `
      <div style="padding: 40px; text-align: center;">
        <div style="font-size: 48px; margin-bottom: 16px;">🔒</div>
        <h3 style="color: #ef4444; margin-bottom: 8px;">No Job Token Available</h3>
        <p style="color: #6b7280;">All 3 recovery attempts failed:</p>
        <ul style="text-align: left; max-width: 400px; margin: 16px auto; color: #9ca3af;">
          <li>✗ ORACLE_STATE (in-memory)</li>
          <li>✗ localStorage (cached token)</li>
          <li>✗ MySQL job_registry (server query)</li>
        </ul>
        <p style="color: #f59e0b; margin-top: 16px;">Please run an analysis first.</p>
      </div>
    `;
    showAuditTrailModal(errorHtml);
  }
  
  /**
   * Get competitors from ORACLE_STATE
   * @returns {Array} Array of competitor objects
   */
  function getCompetitorsFromOracleState() {
    if (!window.ORACLE_STATE?.competitors) {
      console.log('[AuditTrail] ORACLE_STATE not initialized');
      return [];
    }
    
    const domains = Object.keys(window.ORACLE_STATE.competitors);
    if (domains.length === 0) {
      console.log('[AuditTrail] ORACLE_STATE.competitors is empty');
      return [];
    }
    
    // Convert ORACLE_STATE map to array
    return domains.map(domain => ({
      domain: domain,
      ...window.ORACLE_STATE.competitors[domain]
    }));
  }
  
  /**
   * Show diagnostic info when no data is available
   * ENHANCED: Shows Last MySQL Sync and Data Size
   */
  function showAuditTrailDiagnostic() {
    const oracleState = window.ORACLE_STATE || {};
    const diagnosticInfo = {
      oracleStateVersion: oracleState.version || 'N/A',
      oracleJobToken: oracleState.jobToken || 'null',
      oracleCompetitorCount: Object.keys(oracleState.competitors || {}).length,
      oracleStateKeys: Object.keys(oracleState.competitors || {}),
      legacyCompetitorsCount: (window.currentCompetitors || []).length,
      competitorDataExists: !!window.competitorData,
      lastMySQLSync: oracleState._lastMySQLSync || 'Unknown',
      totalDataSize: oracleState._totalDataSize || 0
    };
    
    console.log('[AuditTrail DEBUG]', diagnosticInfo);
    
    // Show loading modal with diagnostic
    const diagnosticHtml = `
      <div class="audit-trail-modal">
        <div class="audit-modal-header">
          <h2>
            <span class="icon">⚠️</span>
            Loading Evidence...
          </h2>
          <button class="audit-modal-close" onclick="closeAuditTrailModal()">✕</button>
        </div>
        <div class="audit-modal-body" style="text-align: center; padding: 40px;">
          <div class="audit-loading-spinner" id="audit-loading-spinner" style="margin-bottom: 20px;">
            <div style="width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #f59e0b; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
          </div>
          <p style="margin-bottom: 24px; opacity: 0.8;">Fetching evidence from database...</p>
          
          <div style="background: rgba(0,0,0,0.3); border-radius: 10px; padding: 16px; text-align: left; font-size: 12px; font-family: monospace;">
            <div style="color: #f59e0b; margin-bottom: 8px;">[DEBUG] Diagnostic Info:</div>
            <div>ORACLE_STATE.version: ${diagnosticInfo.oracleStateVersion}</div>
            <div>ORACLE_STATE.jobToken: ${diagnosticInfo.oracleJobToken}</div>
            <div>ORACLE_STATE.competitors: ${diagnosticInfo.oracleCompetitorCount} domains</div>
            <div>Domains: [${diagnosticInfo.oracleStateKeys.join(', ') || 'none'}]</div>
            <div>Legacy currentCompetitors: ${diagnosticInfo.legacyCompetitorsCount}</div>
            <div>window.competitorData exists: ${diagnosticInfo.competitorDataExists}</div>
            <div style="margin-top: 8px; color: #22c55e;">Last MySQL Sync: ${diagnosticInfo.lastMySQLSync}</div>
            <div style="color: #22c55e;">Data Size: ${formatBytes(diagnosticInfo.totalDataSize)}</div>
          </div>
          
          <button onclick="closeAuditTrailModal(); ORACLE_STATE_debug?.();" 
                  style="margin-top: 20px; background: rgba(255,255,255,0.1); border: none; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer;">
            Close & Log Debug
          </button>
        </div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    `;
    
    showAuditTrailModal(diagnosticHtml, true);
  }
  
  /**
   * Format bytes to human-readable size
   */
  function formatBytes(bytes) {
    if (!bytes || bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
  }
  
  /**
   * THIN UI: Attempt to fetch evidence from database using on-demand strategy
   * Fetches competitors ONE AT A TIME to avoid 3.6MB channel crash
   */
  function attemptEvidencePointerFetch() {
    if (_auditTrailFetchInProgress) {
      console.log('[AuditTrail] Fetch already in progress');
      return;
    }
    
    const jobToken = window.ORACLE_STATE?.jobToken;
    if (!jobToken) {
      console.warn('[AuditTrail] No jobToken available for database fetch');
      updateAuditTrailError('No job token available. Run an analysis first.');
      return;
    }
    
    console.log('[AuditTrail] ═══════════════════════════════════════════════════');
    console.log('[AuditTrail] THIN UI: Starting on-demand evidence fetch');
    console.log('[AuditTrail] jobToken:', jobToken);
    console.log('[AuditTrail] ═══════════════════════════════════════════════════');
    
    _auditTrailFetchInProgress = true;
    
    // Fetch minimal evidence data from database
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(result) {
          _auditTrailFetchInProgress = false;
          onEvidenceFetchComplete(result);
        })
        .withFailureHandler(function(error) {
          _auditTrailFetchInProgress = false;
          console.error('[AuditTrail] Evidence fetch failed:', error);
          updateAuditTrailError('Failed to fetch evidence: ' + (error.message || error));
        })
        .getForensicEvidenceLight(jobToken);
    } else {
      _auditTrailFetchInProgress = false;
      console.error('[AuditTrail] google.script.run not available');
      updateAuditTrailError('Script bridge not available');
    }
  }
  
  /**
   * Handle evidence fetch completion - THIN UI version
   * Detects fetchMode: 'on_demand' and triggers per-competitor fetching
   */
  function onEvidenceFetchComplete(result) {
    console.log('[AuditTrail] Evidence fetch complete:', result);
    
    if (!result || !result.success) {
      updateAuditTrailError(result?.message || 'No evidence data returned');
      return;
    }
    
    // THIN UI: Check if we need to fetch competitors on-demand
    if (result.fetchMode === 'on_demand' && Array.isArray(result.competitors)) {
      console.log('[AuditTrail] ═══════════════════════════════════════════════════');
      console.log('[AuditTrail] THIN UI: On-demand mode detected');
      console.log('[AuditTrail] Competitors to fetch:', result.competitors.length);
      console.table(result.competitors);
      console.log('[AuditTrail] ═══════════════════════════════════════════════════');
      
      // Update MySQL sync metadata
      window.ORACLE_STATE._lastMySQLSync = new Date().toISOString();
      window.ORACLE_STATE._totalDataSize = 0;
      
      // Start fetching competitors one at a time
      fetchCompetitorsSequentially(result.competitors, result.jobToken);
      return;
    }
    
    // Legacy: Store fetched data in ORACLE_STATE (full payload mode)
    if (Array.isArray(result.competitors)) {
      result.competitors.forEach(comp => {
        if (comp.domain && typeof window.ORACLE_STATE_setCompetitor === 'function') {
          window.ORACLE_STATE_setCompetitor(comp.domain, comp, comp.resultId);
        }
      });
    }
    
    // Rebuild modal with real data
    const competitors = getCompetitorsFromOracleState();
    if (competitors.length > 0) {
      const modalHtml = buildAEOAuditTrailContent(competitors);
      showAuditTrailModal(modalHtml);
    } else {
      updateAuditTrailError('Evidence data parsed but no competitors found');
    }
  }
  
  /**
   * THIN UI: Fetch competitors one at a time to avoid channel crash
   * Shows progress as each competitor loads (~500KB per fetch)
   */
  async function fetchCompetitorsSequentially(competitorList, jobToken) {
    const total = competitorList.length;
    let loaded = 0;
    let totalBytes = 0;
    
    console.log('[AuditTrail] Starting sequential fetch of', total, 'competitors');
    
    for (const compInfo of competitorList) {
      const domain = compInfo.domain || compInfo.competitor_domain;
      if (!domain) continue;
      
      // Update progress in modal
      updateFetchProgress(loaded + 1, total, domain);
      
      try {
        const competitorData = await fetchSingleCompetitor(jobToken, domain);
        
        if (competitorData && competitorData.success) {
          // Track data size
          const dataSize = JSON.stringify(competitorData.data || {}).length;
          totalBytes += dataSize;
          
          console.log(`[AuditTrail] ✓ Loaded ${domain} (${formatBytes(dataSize)})`);
          
          // Store in ORACLE_STATE
          if (typeof window.ORACLE_STATE_setCompetitor === 'function') {
            window.ORACLE_STATE_setCompetitor(domain, competitorData.data, competitorData.resultId);
          } else {
            window.ORACLE_STATE.competitors[domain] = competitorData.data;
          }
          
          loaded++;
        } else {
          console.warn(`[AuditTrail] ✗ Failed to load ${domain}:`, competitorData?.message);
        }
      } catch (error) {
        console.error(`[AuditTrail] Error fetching ${domain}:`, error);
      }
    }
    
    // Update metadata
    window.ORACLE_STATE._totalDataSize = totalBytes;
    window.ORACLE_STATE._lastMySQLSync = new Date().toISOString();
    
    console.log('[AuditTrail] ═══════════════════════════════════════════════════');
    console.log('[AuditTrail] THIN UI: Fetch complete');
    console.log('[AuditTrail] Loaded:', loaded, '/', total, 'competitors');
    console.log('[AuditTrail] Total data:', formatBytes(totalBytes));
    console.log('[AuditTrail] ═══════════════════════════════════════════════════');
    
    // Rebuild modal with real data
    const competitors = getCompetitorsFromOracleState();
    if (competitors.length > 0) {
      const modalHtml = buildAEOAuditTrailContent(competitors);
      showAuditTrailModal(modalHtml);
    } else {
      updateAuditTrailError(`Loaded ${loaded}/${total} but no valid data found`);
    }
  }
  
  /**
   * Fetch a single competitor's data from database
   * Returns Promise that resolves with competitor data (~500KB)
   */
  function fetchSingleCompetitor(jobToken, domain) {
    return new Promise((resolve, reject) => {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .fetchCompetitorAnalysis(jobToken, domain);
      } else {
        reject(new Error('google.script.run not available'));
      }
    });
  }

  /**
   * Format headings for evidence display
   */
  function formatHeadingsForEvidence(h2Tags, h3Tags) {
    const h2 = Array.isArray(h2Tags) ? h2Tags : (h2Tags ? [h2Tags] : []);
    const h3 = Array.isArray(h3Tags) ? h3Tags : (h3Tags ? [h3Tags] : []);
    
    let output = '/* H2 Headings */\n';
    if (h2.length > 0) {
      h2.forEach((h, i) => {
        const isQuestion = /^(what|why|how|when|where|who|which|can|should|does|do|is|are|will)\s/i.test(h) || h.includes('?');
        output += `${i + 1}. "${h}" ${isQuestion ? '← QUESTION FORMAT ✓' : ''}\n`;
      });
    } else {
      output += 'No H2 headings detected\n';
    }
    
    output += '\n/* H3 Headings */\n';
    if (h3.length > 0) {
      h3.slice(0, 10).forEach((h, i) => {
        const isQuestion = /^(what|why|how|when|where|who|which|can|should|does|do|is|are|will)\s/i.test(h) || h.includes('?');
        output += `${i + 1}. "${h}" ${isQuestion ? '← QUESTION FORMAT ✓' : ''}\n`;
      });
      if (h3.length > 10) {
        output += `... and ${h3.length - 10} more\n`;
      }
    } else {
      output += 'No H3 headings detected\n';
    }
    
    return output;
  }
  
  /**
   * Format schema for evidence display
   */
  function formatSchemaForEvidence(schemaTypes) {
    const types = Array.isArray(schemaTypes) ? schemaTypes : [];
    
    if (types.length === 0) {
      return '/* No JSON-LD Schema Detected */\n\n❌ This page has no structured data markup.\nAI crawlers will have difficulty understanding the content context.';
    }
    
    let output = '/* Detected Schema.org Types */\n\n';
    types.forEach((type, i) => {
      const isAEOBonus = ['FAQPage', 'HowTo', 'Organization', 'LocalBusiness'].includes(type);
      output += `${i + 1}. @type: "${type}"`;
      if (isAEOBonus) {
        if (type === 'FAQPage') output += ' → +15 AEO points';
        else if (type === 'HowTo') output += ' → +15 AEO points';
        else if (['Organization', 'LocalBusiness'].includes(type)) output += ' → +10 AEO points';
      }
      output += '\n';
    });
    
    return output;
  }
  
  /**
   * Copy evidence to clipboard
   */
  function copyEvidenceToClipboard(btn) {
    const codeBlock = btn.closest('.source-code-viewer').querySelector('.source-code-content');
    if (codeBlock) {
      navigator.clipboard.writeText(codeBlock.textContent)
        .then(() => {
          const originalText = btn.textContent;
          btn.textContent = '✅ Copied!';
          setTimeout(() => btn.textContent = originalText, 2000);
        })
        .catch(err => console.error('Copy failed:', err));
    }
  }
