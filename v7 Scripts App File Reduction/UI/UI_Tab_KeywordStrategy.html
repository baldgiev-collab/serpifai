<script>
  // @ts-nocheck

  /**
   * ---------------------------------------------------------------------------
   * KEYWORD STRATEGY TAB - ELITE STRATEGIC v6.0
   * ---------------------------------------------------------------------------
   */
  window.populateKeywordStrategyTab =   function populateKeywordStrategyTab(data) {
    console.log('?? Populating Keyword Strategy Tab (Elite Strategic v6.0 - 4-Phase Architecture)...');

    // ---------------------------------------------------------------------------
    // PHASE 1: DATA INGESTION & VALIDATION GATE
    // ---------------------------------------------------------------------------
    console.log('?? PHASE 1: Data Ingestion & Validation Gate');

    // V6.1: Use correct data-comp-panel selectors matching UI_Components_Competitors.html
    let metricsDiv = document.getElementById('comp-keywords-metrics') ||
      document.getElementById('comp-keyword-metrics');
    let insightsDiv = document.getElementById('comp-keywords-insights') ||
      document.getElementById('comp-keyword-insights');

    // If static containers don't exist, find/create inside panel
    if (!metricsDiv || !insightsDiv) {
      const panel = document.querySelector('[data-comp-panel="keywords"]') ||
        document.getElementById('panel-keywordStrategy');
      if (panel) {
        console.log('?? Creating dynamic containers inside keywords panel');
        if (!metricsDiv) {
          metricsDiv = panel.querySelector('#comp-keywords-metrics') || (() => {
            const c = document.createElement('div'); c.id = 'comp-keywords-metrics'; c.className = 'comp-metrics-grid'; c.style.width = '100%';
            const h = panel.querySelector('.panel-header'); if (h?.nextSibling) panel.insertBefore(c, h.nextSibling); else panel.insertBefore(c, panel.firstChild);
            return c;
          })();
        }
        if (!insightsDiv) {
          insightsDiv = panel.querySelector('#comp-keywords-insights') || (() => {
            const c = document.createElement('div'); c.id = 'comp-keywords-insights'; c.className = 'comp-insights'; c.style.width = '100%'; c.style.marginTop = '24px';
            panel.appendChild(c); return c;
          })();
        }
      }
    }

    if (!metricsDiv || !insightsDiv) {
      console.warn('?? Keyword Strategy tab containers not found - check UI_Components_Competitors.html has data-comp-panel="keywords"');
      return;
    }

    // ---------------------------------------------------------------------------
    // PHASE 1A: PHP FETCHER INGESTION - Parse JSON/CSV and map to Topical Score
    // ---------------------------------------------------------------------------
    const competitors = data.competitors || [];
    const gemini = data.geminiAnalysis || data.analysis || {};
    const yourDomain = data.yourDomain || data.metadata?.yourDomain || 'Your Site';

    // Ingestion Status Tracking
    const ingestionStatus = {
      phpFetcher: { success: false, count: 0, error: null },
      serperAPI: { success: false, count: 0, error: null },
      openPageRank: { success: false, count: 0, error: null },
      pageSpeedAPI: { success: false, count: 0, error: null },
      geminiAI: { success: false, count: 0, error: null }
    };

    // Parse PHP Fetcher data for each competitor
    const fetcherDataMap = {};
    competitors.forEach(comp => {
      const stages = comp.stages || {};
      const synthesized = comp.synthesized || {};
      const apiData = comp.apiData || {};
      const snapshot = comp.snapshot || {};
      
      // CRITICAL FIX: Check multiple data sources for PHP Fetcher data
      // Priority: stages.phpFetcher > synthesized.website > snapshot.metadata
      const phpFetcher = stages.phpFetcher?.data || comp.phpFetcher || {};
      const websiteData = synthesized.website || snapshot.metadata || {};
      
      // Check if we have real data from any source
      const hasPhpData = phpFetcher && Object.keys(phpFetcher).length > 0;
      const hasSynthesizedData = websiteData && (websiteData.wordCount > 0 || websiteData.title);
      
      if (hasPhpData || hasSynthesizedData) {
        fetcherDataMap[comp.domain] = {
          topicalScore: calculateTopicalScore(phpFetcher, comp),
          contentMetrics: phpFetcher.metadata || websiteData || {},
          headings: phpFetcher.headings || { h2: synthesized.website?.h2 || [], h3: synthesized.website?.h3 || [] },
          links: phpFetcher.links || [],
          schema: phpFetcher.schema || websiteData.schemaTypes || [],
          wordCount: phpFetcher.metadata?.wordCount || websiteData.wordCount || 0
        };
        ingestionStatus.phpFetcher.count++;
      }
    });
    ingestionStatus.phpFetcher.success = ingestionStatus.phpFetcher.count > 0;

    // PHASE 1B: API DATA SYNC - Connect free API metrics
    // CRITICAL FIX: Check both stages AND apiData for API results
    competitors.forEach(comp => {
      const stages = comp.stages || {};
      const apiData = comp.apiData || {};
      const synthesized = comp.synthesized || {};
      
      // Check Serper data from stages OR apiData
      const hasSerper = (stages.serper?.data?.organic?.length > 0) || 
                        (apiData.serper?.organic?.length > 0) ||
                        (synthesized.seo?.organic?.length > 0);
      if (hasSerper) ingestionStatus.serperAPI.count++;
      
      // Check OpenPageRank from stages OR apiData
      const hasPageRank = stages.openPageRank?.data?.page_rank_decimal || 
                          apiData.openPageRank?.page_rank_decimal ||
                          synthesized.authority?.pageRank > 0;
      if (hasPageRank) ingestionStatus.openPageRank.count++;
      
      // Check PageSpeed from stages OR apiData
      const hasPageSpeed = stages.pageSpeed?.data?.performanceScore ||
                           stages.pageSpeed?.data?.scores?.performance ||
                           apiData.pageSpeed?.scores?.performance ||
                           synthesized.technical?.performanceScore > 0;
      if (hasPageSpeed) ingestionStatus.pageSpeedAPI.count++;
    });
    ingestionStatus.serperAPI.success = ingestionStatus.serperAPI.count > 0;
    ingestionStatus.openPageRank.success = ingestionStatus.openPageRank.count > 0;
    ingestionStatus.pageSpeedAPI.success = ingestionStatus.pageSpeedAPI.count > 0;

    // Check Gemini data availability
    const keywordOpportunities = gemini.keywordOpportunities || {};
    const quickWins = keywordOpportunities.quickWins || [];
    const longTailGems = keywordOpportunities.longTailGems || [];
    const contentGaps = keywordOpportunities.contentGaps || gemini.contentGaps || [];

    // V6.0: Extract Elite Keyword Intelligence from Gemini
    const kwIntel = gemini.keywordIntelligence || {};
    const primaryKWs = kwIntel.primaryKeywords || {};
    const secondaryKWs = kwIntel.secondaryKeywords || {};
    const semanticKWs = kwIntel.semanticKeywords || {};
    const longTailKWs = kwIntel.longTailKeywords || {};
    const gapAnalysis = kwIntel.keywordGapAnalysis || {};
    const intentDist = kwIntel.intentDistribution || {};
    const stratRecs = kwIntel.strategicRecommendations || {};

    ingestionStatus.geminiAI.success = Object.keys(kwIntel).length > 0 || quickWins.length > 0;
    ingestionStatus.geminiAI.count = (primaryKWs.topKeywords?.length || 0) +
      (secondaryKWs.clusters?.length || 0) +
      (longTailKWs.quickWins?.length || 0);

    // ---------------------------------------------------------------------------
    // VALIDATION GATE - Check if Phase 1 data is sufficient
    // ---------------------------------------------------------------------------
    const phase1Success = ingestionStatus.phpFetcher.success ||
      ingestionStatus.serperAPI.success ||
      ingestionStatus.geminiAI.success;

    console.log('   ?? Ingestion Status:', JSON.stringify(ingestionStatus));
    console.log('   ? Phase 1 Validation:', phase1Success ? 'PASSED' : 'FAILED - Pivoting to Phase 2');

    // ---------------------------------------------------------------------------
    // PHASE 2: FAIL-SAFE DEEP RESEARCH & FORENSIC MAPPING
    // ---------------------------------------------------------------------------
    let forensicKeywordMatrix = [];
    let phase2Activated = false;

    if (!phase1Success || competitors.length === 0) {
      console.log('?? PHASE 2: Fail-Safe Deep Research Activated');
      phase2Activated = true;

      // Generate forensic keyword matrix from available signals
      forensicKeywordMatrix = generateForensicKeywordMatrix(competitors, gemini, yourDomain);
    }

    // V6.0: Extract Gemini Estimated Metrics for fallback
    const geminiEstimatedMetrics = gemini.estimatedMetrics || [];
    const estimatedMetricsMap = {};
    geminiEstimatedMetrics.forEach(m => {
      if (m.domain) {
        estimatedMetricsMap[m.domain.replace(/^www\./, '')] = m;
      }
    });

    if (competitors.length === 0 && !phase2Activated) {
      metricsDiv.innerHTML = '<div class="empty-state" style="text-align:center;padding:40px;"><p>No competitors to analyze.</p></div>';
      return;
    }

    // -------------------------------------------------------------------
    // EXTRACT ALL SERP DATA FROM ALL SOURCES + ORGANIZED DATA PRIORITY
    // -------------------------------------------------------------------
    let allPAA = [];
    let allRelated = [];
    let allOrganic = [];
    let allSerpFeatures = { featuredSnippets: 0, knowledgePanels: 0, localPacks: 0, imagePacks: 0, videoPacks: 0, sitelinks: 0 };
    
    // NEW: Check organized data from FT_OracleDataOrganizer first
    const organizedData = data?.organizedData || 
                          data?.eliteTabIntelligence?.organizedData ||
                          window._organizedData ||
                          window._eliteTabIntelligence?.organizedData;
    if (organizedData && organizedData.length > 0) {
      console.log('?? Found organized data, extracting PAA/keywords from rawData...');
      organizedData.forEach(comp => {
        const rawData = comp?.tabData?.keywordStrategy?.rawData;
        if (rawData) {
          if (rawData.paaQuestions?.length > 0) {
            allPAA = allPAA.concat(rawData.paaQuestions);
            console.log(`   ? Added ${rawData.paaQuestions.length} PAA from ${comp.domain}`);
          }
          if (rawData.keywords?.length > 0) {
            allRelated = allRelated.concat(rawData.keywords);
            console.log(`   ? Added ${rawData.keywords.length} keywords from ${comp.domain}`);
          }
          if (rawData.serpResults?.length > 0) {
            allOrganic = allOrganic.concat(rawData.serpResults);
          }
        }
      });
    }

    // V5.0: GENERATE PAA FROM GEMINI KEYWORD INTELLIGENCE (if Serper empty)
    // Build PAA-style questions from primaryKWs and gapAnalysis
    const geminiGeneratedPAA = [];
    if (primaryKWs.topKeywords?.length > 0) {
      primaryKWs.topKeywords.forEach(kw => {
        if (kw.keyword) {
          geminiGeneratedPAA.push({
            question: `What is the best ${kw.keyword}?`,
            source: 'Gemini AI',
            intent: kw.intent || 'Commercial'
          });
          geminiGeneratedPAA.push({
            question: `How does ${kw.keyword} work?`,
            source: 'Gemini AI',
            intent: 'Informational'
          });
        }
      });
    }
    if (gapAnalysis.criticalGaps?.length > 0) {
      gapAnalysis.criticalGaps.forEach(gap => {
        if (gap.keyword) {
          geminiGeneratedPAA.push({
            question: `What are the alternatives to ${gap.keyword}?`,
            source: 'Gemini AI',
            intent: 'Commercial'
          });
        }
      });
    }

    // V5.0: GENERATE RELATED SEARCHES FROM GEMINI CLUSTERS
    const geminiGeneratedRelated = [];
    if (secondaryKWs.clusters?.length > 0) {
      secondaryKWs.clusters.forEach(cluster => {
        if (cluster.keywords) {
          cluster.keywords.forEach(kw => {
            geminiGeneratedRelated.push({ query: kw, source: 'Gemini AI' });
          });
        }
      });
    }
    if (semanticKWs.entityClusters?.length > 0) {
      semanticKWs.entityClusters.forEach(entity => {
        if (entity.relatedTerms) {
          entity.relatedTerms.forEach(term => {
            geminiGeneratedRelated.push({ query: term, source: 'Gemini AI' });
          });
        }
      });
    }
    if (longTailKWs.quickWins?.length > 0) {
      longTailKWs.quickWins.forEach(kw => {
        if (kw.keyword) geminiGeneratedRelated.push({ query: kw.keyword, source: 'Gemini AI' });
      });
    }

    const kwData = competitors.map((comp, index) => {
      const metrics = extractRealMetrics(comp);
      const stages = comp.stages || {};
      const pm = comp.processedMetrics || {};
      const apiData = comp.apiData || {};
      const synthesized = comp.synthesized || {};
      const compDomain = (comp.domain || '').replace(/^www\./, '');

      // V5.0: Get Gemini estimates for this competitor
      const geminiEst = estimatedMetricsMap[compDomain] || {};

      // Get Serper data from multiple locations (priority: stages > apiData > synthesized)
      const serper = stages.serper?.data || apiData.serper || synthesized.seo || {};
      const opr = stages.openPageRank?.data || apiData.openPageRank || synthesized.authority || {};

      // -------------------------------------------------------------------
      // CRITICAL FIX: Check organized data for this competitor's raw SERP data
      // -------------------------------------------------------------------
      const organizedComp = organizedData?.find(o => 
        (o.domain || '').replace(/^www\./, '') === compDomain ||
        o.domain === comp.domain
      );
      const organizedRawData = organizedComp?.tabData?.keywordStrategy?.rawData || {};
      
      // Extract REAL keyword data - prioritize organized data, then stages, then apiData
      const organic = organizedRawData.serpResults || serper.organic || [];
      const peopleAlsoAsk = organizedRawData.paaQuestions || serper.peopleAlsoAsk || [];
      const relatedSearches = organizedRawData.keywords || serper.relatedSearches || [];
      const featuredSnippet = serper.answerBox || serper.featuredSnippet || organizedRawData.featuredSnippet || null;
      const knowledgeGraph = serper.knowledgeGraph || organizedRawData.knowledgeGraph || null;
      const sitelinks = serper.sitelinks?.inline || serper.sitelinks?.expanded || organizedRawData.sitelinks || [];

      // -------------------------------------------------------------------
      // V8.5 FIX: ALSO CHECK keywordProfile from Step 2.5 orchestrator data
      // This contains PAA/Related from keyword-based searches (not site:domain)
      // -------------------------------------------------------------------
      const kwProfile = comp.keywordProfile || {};
      const kwProfilePAA = (kwProfile.peopleAlsoAsk || []).map(q => 
        typeof q === 'string' ? { question: q, source: 'Serper API (keyword)' } : q
      );
      const kwProfileRelated = (kwProfile.relatedSearches || []).map(q => 
        typeof q === 'string' ? { query: q, source: 'Serper API (keyword)' } : q
      );

      // Collect all data for analysis - INCREASED LIMITS from 4 to 15 per competitor
      if (peopleAlsoAsk.length > 0) allPAA = allPAA.concat(peopleAlsoAsk.slice(0, 15));
      if (kwProfilePAA.length > 0) allPAA = allPAA.concat(kwProfilePAA.slice(0, 10));
      if (relatedSearches.length > 0) allRelated = allRelated.concat(relatedSearches.slice(0, 15));
      if (kwProfileRelated.length > 0) allRelated = allRelated.concat(kwProfileRelated.slice(0, 10));
      if (organic.length > 0) allOrganic = allOrganic.concat(organic.slice(0, 10).map(o => ({ ...o, domain: comp.domain })));

      // Count SERP features (include Gemini estimates as fallback)
      if (featuredSnippet) allSerpFeatures.featuredSnippets++;
      else if (geminiEst.authorityScore >= 50) allSerpFeatures.featuredSnippets++; // High authority often has snippets
      if (knowledgeGraph) allSerpFeatures.knowledgePanels++;
      if (sitelinks.length > 0) allSerpFeatures.sitelinks++;
      else if (geminiEst.authorityScore >= 45) allSerpFeatures.sitelinks++; // High authority domains usually have sitelinks

      // V5.0: Use Gemini estimates as primary source for Est. Keywords
      // Priority: Gemini > processedMetrics > 0
      const estKeywords = geminiEst.organicKeywords || pm.estimatedKeywords || pm.geminiEstimates?.totalKeywords || 0;
      const domainAuthority = geminiEst.authorityScore || opr.page_rank_decimal || pm.domainAuthority || 0;
      const serpResults = organic.length || (organizedRawData.serpResults?.length || 0) || 10;
      const paaCount = peopleAlsoAsk.length;
      const relatedCount = relatedSearches.length;

      // V5.0: Estimate traffic from Gemini
      const estTraffic = geminiEst.organicTraffic || pm.estimatedTraffic || 0;

      // Calculate KEYWORD DIFFICULTY (0-100 based on competition signals)
      let difficulty = 30; // Base
      if (domainAuthority >= 70) difficulty += 40;
      else if (domainAuthority >= 50) difficulty += 30;
      else if (domainAuthority >= 30) difficulty += 20;
      else if (domainAuthority >= 10) difficulty += 10;
      if (estKeywords >= 100000) difficulty += 25;
      else if (estKeywords >= 50000) difficulty += 20;
      else if (estKeywords >= 10000) difficulty += 10;
      if (serpResults >= 8) difficulty += 5;
      difficulty = Math.min(100, difficulty);

      // Classify SEARCH INTENT from content signals + Gemini data
      // Use Gemini intentDistribution if available
      const competitorIntent = intentDist.competitorIntents?.find(c =>
        (c.domain || '').replace(/^www\./, '') === compDomain
      );
      const contentText = (metrics.content.title + ' ' + (metrics.content.description || '')).toLowerCase();
      let primaryIntent = competitorIntent?.dominantIntent || 'Informational';
      if (!competitorIntent) {
        if (/buy|price|cost|cheap|discount|deal|shop|order|purchase|cart/i.test(contentText)) primaryIntent = 'Transactional';
        else if (/best|top|vs|compare|review|alternative/i.test(contentText)) primaryIntent = 'Commercial';
        else if (/login|sign.?in|account|dashboard|support|contact/i.test(contentText)) primaryIntent = 'Navigational';
      }

      // Calculate overall keyword score (enhanced with Gemini data)
      let kwScore = 30; // Base higher since we have Gemini data
      if (estKeywords >= 100000) kwScore += 30;
      else if (estKeywords >= 50000) kwScore += 25;
      else if (estKeywords >= 10000) kwScore += 18;
      else if (estKeywords >= 1000) kwScore += 10;
      if (serpResults >= 10) kwScore += 15;
      else if (serpResults >= 5) kwScore += 8;
      if (domainAuthority >= 60) kwScore += 15;
      else if (domainAuthority >= 40) kwScore += 10;
      else if (domainAuthority >= 20) kwScore += 5;
      kwScore = Math.min(100, kwScore);

      // V5.0: Determine data source - prioritize what we actually have
      const hasOrganizedData = Object.keys(organizedRawData).length > 0;
      const hasSerperData = organic.length > 0 || paaCount > 0 || relatedCount > 0;
      const hasGeminiData = estKeywords > 0 || geminiEst.authorityScore > 0;
      let dataSource = 'Pending';
      if (hasOrganizedData) dataSource = 'Serper API'; // Organized data came from Serper
      else if (hasSerperData && hasGeminiData) dataSource = 'Serper + Gemini';
      else if (hasGeminiData) dataSource = 'Gemini AI';
      else if (hasSerperData) dataSource = 'Serper API';

      return {
        domain: comp.domain,
        estKeywords,
        estTraffic,
        serpResults,
        paaCount,
        relatedCount,
        difficulty,
        primaryIntent,
        kwScore,
        domainAuthority,
        hasOrganizedData,
        hasSerperData,
        hasGeminiData,
        dataSource,
        hasFeaturedSnippet: !!featuredSnippet || geminiEst.authorityScore >= 50,
        hasSitelinks: sitelinks.length > 0 || geminiEst.authorityScore >= 45,
        organic,
        peopleAlsoAsk,
        relatedSearches,
        geminiEst
      };
    });

    // V5.0: USE GEMINI FALLBACK FOR PAA AND RELATED IF SERPER IS EMPTY
    if (allPAA.length === 0 && geminiGeneratedPAA.length > 0) {
      allPAA = geminiGeneratedPAA.slice(0, 12);
      console.log('?? Using Gemini-generated PAA questions:', allPAA.length);
    }
    if (allRelated.length === 0 && geminiGeneratedRelated.length > 0) {
      allRelated = geminiGeneratedRelated.slice(0, 20);
      console.log('?? Using Gemini-generated Related Searches:', allRelated.length);
    }

    // V5.0: If still no PAA, generate from primary keywords
    if (allPAA.length === 0 && primaryKWs.topKeywords?.length > 0) {
      const paaFromPrimary = [];
      primaryKWs.topKeywords.slice(0, 4).forEach(kw => {
        if (kw.keyword) {
          paaFromPrimary.push({ question: `What is ${kw.keyword}?`, source: 'Gemini AI', intent: 'Informational' });
          paaFromPrimary.push({ question: `How to choose the best ${kw.keyword}?`, source: 'Gemini AI', intent: 'Commercial' });
          paaFromPrimary.push({ question: `Why is ${kw.keyword} important?`, source: 'Gemini AI', intent: 'Informational' });
        }
      });
      allPAA = paaFromPrimary;
    }

    // V5.0: If still no related, generate from gap analysis
    if (allRelated.length === 0 && gapAnalysis.criticalGaps?.length > 0) {
      const relatedFromGaps = gapAnalysis.criticalGaps.slice(0, 10).map(g => ({
        query: g.keyword,
        source: 'Gemini AI'
      }));
      allRelated = relatedFromGaps;
    }

    // ---------------------------------------------------------------------------
    // STORE RAW DATA GLOBALLY FOR ACCESS IN MODALS AND OTHER TABS
    // ---------------------------------------------------------------------------
    window._kwStrategyRawData = {
      allPAA: allPAA,
      allRelated: allRelated,
      allOrganic: allOrganic,
      allSerpFeatures: allSerpFeatures,
      kwData: kwData,
      geminiGeneratedPAA: geminiGeneratedPAA,
      geminiGeneratedRelated: geminiGeneratedRelated,
      paaSource: allPAA.length > 0 && allPAA[0]?.source !== 'Gemini AI' ? 'Serper API' : 'Gemini AI',
      organicSource: allOrganic.length > 0 ? 'Serper API' : 'No Data'
    };
    console.log('?? Stored raw KW Strategy data globally:', {
      paa: allPAA.length,
      related: allRelated.length,
      organic: allOrganic.length,
      serpFeatures: allSerpFeatures
    });

    // ---------------------------------------------------------------------------
    // PHASE 3: KEYWORD COMPARISON MATRIX (Competitor A vs B vs Us)
    // ---------------------------------------------------------------------------
    console.log('?? PHASE 3: Building Keyword Comparison Matrix');

    const comparisonMatrix = buildKeywordComparisonMatrix(kwData, primaryKWs, gapAnalysis, yourDomain);
    console.log('   ? Comparison Matrix:', comparisonMatrix.length, 'keyword groups');

    // ---------------------------------------------------------------------------
    // PHASE 4: UI DATA PAYLOAD (JSON with ui_cluster_id + aio_risk_factor)
    // ---------------------------------------------------------------------------
    console.log('?? PHASE 4: Generating UI Payload with AIO Risk Factors');

    const uiPayload = generateKWStrategyUIPayload(kwData, comparisonMatrix, primaryKWs,
      secondaryKWs, semanticKWs, longTailKWs,
      gapAnalysis, gemini);

    // Store UI payload for external access
    window.kwStrategyPayload = uiPayload;
    console.log('   ? UI Payload generated:', Object.keys(uiPayload).length, 'sections');
    console.log('   ?? Stored in window.kwStrategyPayload for dashboard access');

    // ---------------------------------------------------------------------------
    // PHASE 4B: GENERATE 90-KW FORENSIC MATRIX FOR BENTO GRID
    // Always generate this matrix to feed the 4-module grid (Money/SGE/Tail/LLM)
    // ---------------------------------------------------------------------------
    console.log('?? PHASE 4B: Generating 90-KW Forensic Matrix for Bento Grid...');
    const forensicMatrix = generateForensicKeywordMatrix(competitors, gemini, yourDomain);

    // Store globally for grid rendering
    window.forensicMatrix = forensicMatrix;

    // Build reservoir format for renderForensicGrid compatibility
    const forensicReservoir = buildForensicReservoir(forensicMatrix);
    window.forensicKeywordReservoir = forensicReservoir;

    console.log('   ? Forensic Matrix:', forensicMatrix.length, 'competitors');
    console.log('   ?? Stored in window.forensicMatrix for Bento Grid access');
    console.log('   ?? Reservoir stats:', forensicReservoir.stats);

    // Trigger immediate grid rendering
    setTimeout(() => {
      if (typeof window.renderForensicGridFromMatrix === 'function') {
        window.renderForensicGridFromMatrix(forensicMatrix);
      } else if (typeof window.renderForensicGrid === 'function') {
        window.renderForensicGrid(forensicReservoir);
      }
    }, 100);

    // -------------------------------------------------------------------
    // BUILD STRATEGIC KEYWORD DASHBOARD HTML v6.0 (4-Phase Architecture)
    // -------------------------------------------------------------------

    // V6.0: Calculate totals from enhanced data
    const totalEstKeywords = kwData.reduce((sum, k) => sum + (k.estKeywords || 0), 0);
    const avgDifficultyCalc = Math.round(kwData.reduce((s, k) => s + k.difficulty, 0) / kwData.length);
    const paaSource = allPAA.length > 0 && allPAA[0]?.source === 'Gemini AI' ? 'Gemini AI' : 'Serper API';
    const relatedSource = allRelated.length > 0 && allRelated[0]?.source === 'Gemini AI' ? 'Gemini AI' : 'Serper API';

    // Phase indicator for UI
    const activePhases = [
      phase1Success ? 'Phase 1: Data Ingestion ?' : null,
      phase2Activated ? 'Phase 2: Forensic Research ?' : null,
      comparisonMatrix.length > 0 ? 'Phase 3: Comparison Matrix ?' : null,
      Object.keys(uiPayload).length > 0 ? 'Phase 4: UI Payload ?' : null
    ].filter(Boolean);

    // Generate executive insight for keyword strategy
    const kwExecConfig = {
      title: 'Keyword Strategy Executive Brief',
      icon: '??',
      executiveSummary: `Keyword analysis across ${competitors.length} competitors reveals ${totalEstKeywords > 50000 ? 'highly competitive' : totalEstKeywords > 20000 ? 'moderately competitive' : 'developing'} market. Average keyword difficulty: ${avgDifficultyCalc || 50}/100. ${allPAA.length} PAA opportunities and ${allRelated.length} topic clusters identified.`,
      ceoInsight: `Keyword investment should focus on ${avgDifficultyCalc > 60 ? 'defensible long-tail positions with commercial intent' : 'quick-win opportunities while building topical authority'}. Expected traffic growth: ${avgDifficultyCalc > 60 ? '15-25%' : '30-50%'} in 6 months.`,
      cmoInsight: `Content gap analysis shows ${contentGaps.length || 'multiple'} untapped keyword clusters. Recommend ${phase2Activated ? 'forensic deep research' : 'targeted content expansion'} to capture market share.`,
      ctoInsight: `Technical SEO requirements: Schema markup for ${allPAA.length} FAQ opportunities, structured content for AI citation. RAG-ready content architecture essential.`,
      strategicImperative: `Build keyword moat through systematic content coverage of ${allRelated.length} topic clusters before competitors dominate AI training data.`,
      investmentPriority: avgDifficultyCalc > 60 ? 'High' : 'Medium',
