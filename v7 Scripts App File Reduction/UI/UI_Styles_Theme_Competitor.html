<!--
  ═══════════════════════════════════════════════════════════════════════════
  UI_Styles_Theme_Competitor.html
  Competitor Intelligence Tab Styles
  
  PURPOSE: CSS for competitor analysis UI - tabs, metrics, charts, tables
  
  DEPENDENCIES: UI_Styles_Theme_Core.html (CSS variables)
  
  PROVIDES:
    - Competitor intelligence wrapper & header
    - Competitor tabs & tab panels
    - Metrics grid & cards
    - Comparison tables
    - Chart containers (compact & large)
    - Insights section
    - Loading & error states
    - Overview cards & heatmaps
  ═══════════════════════════════════════════════════════════════════════════
-->
<style>
  /* =================================== */
  /* COMPETITOR INTELLIGENCE STYLES
  /* =================================== */
  .competitor-intelligence-wrapper{
    display: flex;
    flex-direction: column;
    height: 100%;
    max-height: 100vh;
    overflow: hidden;
  }

  .competitor-intelligence-header{
    padding: 16px 20px;
    background: linear-gradient(135deg, var(--brand-primary), var(--brand-accent));
    color: #fff;
    border-bottom: 1px solid var(--border-subtle);
    flex-shrink: 0;
  }

  .competitor-intelligence-header h2{
    margin: 0 0 4px 0;
    font-size: 20px;
    font-weight: 700;
  }

  .competitor-intelligence-header p{
    margin: 0;
    font-size: 13px;
    opacity: 0.9;
  }

  .competitor-intelligence-tabs{
    display: flex;
    gap: 4px;
    padding: 12px 16px;
    background: var(--surface-elevated);
    border-bottom: 2px solid var(--border-subtle);
    overflow-x: auto;
    overflow-y: hidden;
    flex-shrink: 0;
    scrollbar-width: thin;
  }

  .competitor-intelligence-tabs::-webkit-scrollbar{
    height: 6px;
  }

  .competitor-intelligence-tabs::-webkit-scrollbar-thumb{
    background: var(--border-strong);
    border-radius: 3px;
  }

  .competitor-tab-btn{
    padding: 8px 16px;
    background: var(--surface);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    cursor: pointer;
    transition: all var(--transition-fast);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .competitor-tab-btn:hover{
    background: var(--surface-soft);
    border-color: var(--brand-primary);
    color: var(--text-primary);
  }

  .competitor-tab-btn.active{
    background: linear-gradient(135deg, var(--brand-primary), var(--brand-accent));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(79,69,227,0.3);
  }

  .competitor-intelligence-content{
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 20px;
    scroll-behavior: smooth;
  }

  .competitor-tab-panel{
    display: none;
  }

  .competitor-tab-panel.active{
    display: block;
    animation: tabFadeIn 300ms ease-out;
  }

  @keyframes tabFadeIn{
    from{
      opacity: 0;
      transform: translateY(10px);
    }
    to{
      opacity: 1;
      transform: translateY(0);
    }
  }

  .competitor-section{
    background: var(--surface-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 20px;
    margin-bottom: 20px;
  }

  .competitor-section h3{
    margin: 0 0 16px 0;
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .competitor-section-icon{
    font-size: 24px;
  }

  .competitor-metrics-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }

  .competitor-metric-card{
    background: var(--surface);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 16px;
    transition: all var(--transition-fast);
  }

  .competitor-metric-card:hover{
    border-color: var(--brand-primary);
    box-shadow: var(--shadow-soft);
    transform: translateY(-2px);
  }

  .competitor-metric-label{
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .competitor-metric-value{
    font-size: 24px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .competitor-metric-change{
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .competitor-metric-change.positive{
    color: var(--accent-success, var(--brand-emerald));
  }

  .competitor-metric-change.negative{
    color: var(--accent-danger, #ef4444);
  }

  .competitor-comparison-table{
    width: 100%;
    border-collapse: collapse;
    margin-top: 16px;
  }

  .competitor-comparison-table th{
    background: var(--surface-soft);
    padding: 12px;
    text-align: left;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-primary);
    border-bottom: 2px solid var(--border-strong);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .competitor-comparison-table td{
    padding: 12px;
    font-size: 13px;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border-subtle);
  }

  .competitor-comparison-table tr:hover{
    background: var(--surface-soft);
  }

  .competitor-name-cell{
    font-weight: 600;
    color: var(--text-primary);
  }

  .competitor-rank-badge{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--brand-primary), var(--brand-accent));
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    margin-right: 8px;
  }

  .competitor-rank-badge.rank-1{
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
  }

  .competitor-rank-badge.rank-2{
    background: linear-gradient(135deg, #94a3b8, #64748b);
  }

  .competitor-rank-badge.rank-3{
    background: linear-gradient(135deg, #fb923c, #ea580c);
  }

  .competitor-chart-container{
    background: var(--surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 12px;
    margin-top: 12px;
    min-height: 180px;
    max-height: 250px;
  }

  .competitor-chart-container h4{
    margin: 0 0 10px 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    text-align: center;
  }

  .competitor-chart-container canvas{
    width: 100% !important;
    height: auto !important;
    min-height: 150px !important;
    max-height: 220px !important;
  }

  /* Compact chart containers for competitor analysis */
  .comp-chart-container{
    background: var(--surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 16px;
    margin: 8px;
    flex: 1 1 calc(50% - 24px);
    min-width: 400px;
    min-height: 350px;
    max-height: 450px;
  }

  .comp-chart-container canvas{
    width: 100% !important;
    height: auto !important;
    min-height: 280px !important;
    max-height: 380px !important;
  }

  .comp-chart-container-large{
    background: var(--surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 20px;
    margin: 8px;
    flex: 1 1 100%;
    min-width: 100%;
    min-height: 400px;
    max-height: 550px;
  }

  .comp-chart-container-large canvas{
    width: 100% !important;
    height: auto !important;
    min-height: 340px !important;
    max-height: 480px !important;
  }

  .comp-charts-row{
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 16px;
    justify-content: stretch;
  }

  .competitor-insights{
    background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(79,69,227,0.1));
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 20px;
    margin-top: 20px;
  }

  .competitor-insights h4{
    margin: 0 0 12px 0;
    font-size: 16px;
    font-weight: 700;
    color: var(--brand-emerald);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .competitor-insight-item{
    padding: 12px 0;
    border-bottom: 1px solid var(--border-subtle);
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .competitor-insight-item:last-child{
    border-bottom: none;
  }

  .competitor-loading{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    gap: 20px;
  }

  .competitor-loading-spinner{
    width: 60px;
    height: 60px;
    border: 4px solid var(--border-subtle);
    border-top-color: var(--brand-primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  .competitor-loading-text{
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .competitor-loading-subtext{
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    max-width: 400px;
  }

  .competitor-progress-bar{
    width: 300px;
    height: 8px;
    background: var(--surface-soft);
    border-radius: 999px;
    overflow: hidden;
  }

  .competitor-progress-fill{
    height: 100%;
    background: linear-gradient(90deg, var(--brand-primary), var(--brand-emerald));
    border-radius: 999px;
    transition: width 0.3s ease;
  }

  .competitor-error{
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 10px;
    padding: 20px;
    margin: 20px 0;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .competitor-error-icon{
    font-size: 24px;
    color: var(--accent-danger, #ef4444);
  }

  .competitor-error-content{
    flex: 1;
  }

  .competitor-error-title{
    font-size: 16px;
    font-weight: 700;
    color: var(--accent-danger, #ef4444);
    margin: 0 0 8px 0;
  }

  .competitor-error-message{
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  /* Overview Tab Specific Styles */
  .competitor-overview-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }

  .competitor-overview-card{
    background: var(--surface-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 20px;
    transition: all var(--transition-fast);
  }

  .competitor-overview-card:hover{
    border-color: var(--brand-primary);
    box-shadow: var(--shadow-strong);
    transform: translateY(-3px);
  }

  .competitor-overview-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .competitor-overview-title{
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .competitor-overview-icon{
    font-size: 28px;
    opacity: 0.7;
  }

  .competitor-overview-stats{
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .competitor-overview-stat{
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }

  .competitor-overview-stat-label{
    color: var(--text-muted);
  }

  .competitor-overview-stat-value{
    font-weight: 700;
    color: var(--text-primary);
  }

  /* Heatmap Styles */
  .competitor-heatmap{
    margin-top: 20px;
  }

  .competitor-heatmap-row{
    display: grid;
    grid-template-columns: 150px repeat(auto-fit, minmax(80px, 1fr));
    gap: 4px;
    margin-bottom: 4px;
  }

  .competitor-heatmap-cell{
    padding: 12px 8px;
    text-align: center;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    transition: all var(--transition-fast);
  }

  .competitor-heatmap-cell.label{
    background: var(--surface-soft);
    color: var(--text-primary);
    font-weight: 700;
    text-align: left;
  }

  .competitor-heatmap-cell.score{
    background: var(--surface-elevated);
    color: var(--text-secondary);
    cursor: pointer;
  }

  .competitor-heatmap-cell.score:hover{
    transform: scale(1.05);
    box-shadow: var(--shadow-soft);
  }

  .competitor-heatmap-cell.high{
    background: linear-gradient(135deg, rgba(16,185,129,0.8), rgba(16,185,129,0.6));
    color: #fff;
  }

  .competitor-heatmap-cell.medium{
    background: linear-gradient(135deg, rgba(245,158,11,0.8), rgba(245,158,11,0.6));
    color: #fff;
  }

  .competitor-heatmap-cell.low{
    background: linear-gradient(135deg, rgba(239,68,68,0.8), rgba(239,68,68,0.6));
    color: #fff;
  }
</style>
