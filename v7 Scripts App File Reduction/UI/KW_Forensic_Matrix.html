  /**
   * PHASE 1 HELPER: Calculate Topical Score from PHP Fetcher data
   * Maps site-wide URLs to their current "Topical Score"
   */
  function calculateTopicalScore(fetcherData, comp) {
    let score = 0;
    const metadata = fetcherData.metadata || {};
    const headings = fetcherData.headings || {};
    const schema = fetcherData.schema || [];

    // Word count contribution (max 30 points)
    const wordCount = metadata.wordCount || 0;
    if (wordCount >= 3000) score += 30;
    else if (wordCount >= 2000) score += 25;
    else if (wordCount >= 1000) score += 18;
    else if (wordCount >= 500) score += 10;

    // Heading structure contribution (max 25 points)
    const h1Count = headings.h1?.length || 0;
    const h2Count = headings.h2?.length || 0;
    const h3Count = headings.h3?.length || 0;
    if (h1Count === 1) score += 8; // Single H1 is ideal
    if (h2Count >= 5) score += 10;
    else if (h2Count >= 3) score += 7;
    if (h3Count >= 5) score += 7;

    // Schema markup contribution (max 25 points)
    const schemaTypes = Array.isArray(schema) ? schema.length : Object.keys(schema).length;
    if (schemaTypes >= 5) score += 25;
    else if (schemaTypes >= 3) score += 18;
    else if (schemaTypes >= 1) score += 10;

    // Internal linking contribution (max 20 points)
    const internalLinks = fetcherData.links?.filter(l => l.internal)?.length || 0;
    if (internalLinks >= 20) score += 20;
    else if (internalLinks >= 10) score += 15;
    else if (internalLinks >= 5) score += 8;

    return Math.min(100, score);
  }
  window.calculateTopicalScore = calculateTopicalScore;

  /**
   * PHASE 1: DIAGNOSTIC DATA INGESTION (Fail-Safe)
   * Checks for null, repeated, or placeholder values (e.g., 50/50)
   * Returns apiFailure: true if Gemini Deep Research fallback is needed
   */
  function runDataDiagnostic(competitors, gemini) {
    console.log('🔍 PHASE 1: Running Diagnostic Data Ingestion...');

    let nullCount = 0;
    let placeholderCount = 0;
    let repeatedCount = 0;
    let serpDataFound = 0;
    let paaDataFound = 0;
    const seenValues = new Set();

    // ═══════════════════════════════════════════════════════════════════════════
    // CRITICAL: Check organized data for real SERP data first
    // ═══════════════════════════════════════════════════════════════════════════
    const organizedData = window._organizedData || window._eliteTabIntelligence?.organizedData || [];
    const kwRawData = window._kwStrategyRawData || {};
    
    if (organizedData && organizedData.length > 0) {
      organizedData.forEach(comp => {
        const rawData = comp?.tabData?.keywordStrategy?.rawData || {};
        if (rawData.paaQuestions?.length > 0) paaDataFound += rawData.paaQuestions.length;
        if (rawData.serpResults?.length > 0) serpDataFound += rawData.serpResults.length;
      });
    }
    
    // Also check global KW strategy data
    if (kwRawData.allPAA?.length > 0) paaDataFound += kwRawData.allPAA.length;
    if (kwRawData.allOrganic?.length > 0) serpDataFound += kwRawData.allOrganic.length;

    competitors.slice(0, 5).forEach(comp => {
      const pm = comp.processedMetrics || {};
      const serper = comp.apiData?.serper || comp.stages?.serper?.data || {};

      // Check for SERP data in competitor stages
      if (serper.peopleAlsoAsk?.length > 0) paaDataFound += serper.peopleAlsoAsk.length;
      if (serper.organic?.length > 0) serpDataFound += serper.organic.length;

      // Check for null values
      if (!pm.geminiEstimates?.monthlyTraffic && !pm.estimatedTraffic) nullCount++;
      if (!pm.domainAuthority && !pm.geminiEstimates?.authorityScore) nullCount++;

      // Check for placeholder values (50/50, 0, etc.)
      const traffic = pm.geminiEstimates?.monthlyTraffic || pm.estimatedTraffic || 0;
      const auth = pm.domainAuthority || pm.geminiEstimates?.authorityScore || 0;
      if (traffic === 50000 || traffic === 0) placeholderCount++;
      if (auth === 50 || auth === 0) placeholderCount++;

      // Check for repeated values
      const key = `${traffic}-${auth}`;
      if (seenValues.has(key)) repeatedCount++;
      seenValues.add(key);
    });

    // API failure = NO SERP data AND NO PAA data AND high null/placeholder counts
    // If we have organized data with PAA/SERP, that's not an API failure
    const hasSerpData = serpDataFound > 0 || paaDataFound > 0;
    const apiFailure = !hasSerpData && (nullCount > 2 || placeholderCount > 3 || repeatedCount > 2);

    console.log(`   📊 Diagnostic Results: Nulls=${nullCount}, Placeholders=${placeholderCount}, Repeated=${repeatedCount}`);
    console.log(`   📊 SERP Data: ${serpDataFound} organic results, ${paaDataFound} PAA questions`);
    console.log(`   ${apiFailure ? '⚠️ API FAILURE DETECTED' : '✅ Data Quality OK'}`);

    return {
      apiFailure,
      nullCount,
      placeholderCount,
      repeatedCount,
      serpDataFound,
      paaDataFound,
      hasSerpData,
      diagnosis: apiFailure ? 'Triggering Gemini Deep Research fallback' : 'Data ingestion successful'
    };
  }
  window.runDataDiagnostic = runDataDiagnostic;
