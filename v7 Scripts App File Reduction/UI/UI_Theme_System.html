/* ═══════════════════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════════════════ */
body,
body *:not(.no-transition) {
  transition: 
    background-color 0.25s ease,
    border-color 0.25s ease,

<script>
/**
 * ═══════════════════════════════════════════════════════════════════════════
 * SERPIFAI THEME SYSTEM v7.1
 * Complete theme management with persistence and chart integration
 * ═══════════════════════════════════════════════════════════════════════════
 */
(function() {
  'use strict';
  
  const STORAGE_KEY = 'serpifai-theme';
  const DEFAULT_THEME = 'light';
  const VALID_THEMES = ['light', 'dark', 'aurora', 'neon'];
  
  // Theme metadata for UI
  const THEME_META = {
    light: {
      name: 'Light',
      icon: '☀️',
      description: 'Professional & Clean',
      chartColors: ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4']
    },
    dark: {
      name: 'Dark',
      icon: '🌙',
      description: 'Sophisticated Depth',
      chartColors: ['#06b6d4', '#34d399', '#fbbf24', '#f87171', '#a78bfa', '#38bdf8']
    },
    aurora: {
      name: 'Aurora',
      icon: '🌌',
      description: 'Organic High-Tech',
      chartColors: ['#10b981', '#06b6d4', '#fcd34d', '#f472b6', '#818cf8', '#2dd4bf']
    },
    neon: {
      name: 'Neon',
      icon: '⚡',
      description: 'Aggressive Forensic',
      chartColors: ['#f59e0b', '#84cc16', '#f43f5e', '#a78bfa', '#fb923c', '#22d3ee']
    }
  };
  
  /**
   * Initialize theme system on page load
   * Applies saved theme before first paint to prevent flash
   */
  function initThemeSystem() {
    // Add loading class to prevent transition flash
    document.body.classList.add('theme-loading');
    
    // Get saved theme or detect system preference
    const savedTheme = localStorage.getItem(STORAGE_KEY);
    let theme = savedTheme;
    
    if (!theme || !VALID_THEMES.includes(theme)) {
      // Check system preference
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        theme = 'dark';
      } else {
        theme = DEFAULT_THEME;
      }
    }
    
    // Apply theme immediately
    applyTheme(theme, false);
    
    // Remove loading class after a small delay to enable transitions
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        document.body.classList.remove('theme-loading');
      });
    });
    
    // Listen for system theme changes
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if (!localStorage.getItem(STORAGE_KEY)) {
          applyTheme(e.matches ? 'dark' : 'light', true);
        }
      });
    }
    
    console.log('🎨 Theme system initialized:', theme);
  }
  
  /**
   * Apply a theme to the document
   * @param {string} theme - Theme name
   * @param {boolean} save - Whether to persist to localStorage
   */
  function applyTheme(theme, save = true) {
    if (!VALID_THEMES.includes(theme)) {
      console.warn('Invalid theme:', theme);
      theme = DEFAULT_THEME;
    }
    
    // Apply to both html and body for maximum compatibility
    document.documentElement.setAttribute('data-theme', theme);
    document.body.setAttribute('data-theme', theme);
    
    // Update toggle buttons
    document.querySelectorAll('.theme-toggle-btn, .btn-theme').forEach(btn => {
      const target = btn.getAttribute('data-theme-target') || btn.getAttribute('data-theme');
      btn.classList.toggle('active', target === theme);
    });
    
    // Persist to localStorage
    if (save) {
      localStorage.setItem(STORAGE_KEY, theme);
    }
    
    // Dispatch custom event for chart recoloring
    window.dispatchEvent(new CustomEvent('themechange', { 
      detail: { 
        theme: theme,
        meta: THEME_META[theme]
      }
    }));
    
    // Update Chart.js defaults if available
    if (window.Chart) {
      updateChartTheme(theme);
    }
    
    console.log('🎨 Theme applied:', theme);
  }
  
  /**
   * Update Chart.js global defaults for the current theme
   * @param {string} theme - Current theme name
   */
  function updateChartTheme(theme) {
    const meta = THEME_META[theme];
    const style = getComputedStyle(document.body);
    
    // Update Chart.js defaults
    Chart.defaults.color = style.getPropertyValue('--chart-axis').trim() || '#64748b';
    Chart.defaults.borderColor = style.getPropertyValue('--chart-grid').trim() || '#e2e8f0';
    
    if (Chart.defaults.plugins && Chart.defaults.plugins.legend) {
      Chart.defaults.plugins.legend.labels.color = style.getPropertyValue('--text-secondary').trim();
    }
    
    // Update all existing charts
    Chart.helpers.each(Chart.instances, (chart) => {
      if (chart && chart.options) {
        // Update scales
        if (chart.options.scales) {
          Object.values(chart.options.scales).forEach(scale => {
            if (scale.grid) {
              scale.grid.color = style.getPropertyValue('--chart-grid').trim();
            }
            if (scale.ticks) {
              scale.ticks.color = style.getPropertyValue('--chart-axis').trim();
            }
          });
        }
        
        // Trigger redraw
        chart.update('none');
      }
    });
  }
  
  /**
   * Get the current theme
   * @returns {string} Current theme name
   */
  function getCurrentTheme() {
    return document.body.getAttribute('data-theme') || 
           localStorage.getItem(STORAGE_KEY) || 
           DEFAULT_THEME;
  }
  
  /**
   * Get theme metadata
   * @param {string} theme - Theme name (optional, defaults to current)
   * @returns {object} Theme metadata
   */
  function getThemeMeta(theme) {
    theme = theme || getCurrentTheme();
    return THEME_META[theme] || THEME_META[DEFAULT_THEME];
  }
  
  /**
   * Get chart colors for current theme
   * @returns {string[]} Array of hex color codes
   */
  function getChartColors() {
    const theme = getCurrentTheme();
    return THEME_META[theme]?.chartColors || THEME_META.light.chartColors;
  }
  
  /**
   * Cycle to the next theme
   */
  function cycleTheme() {
    const current = getCurrentTheme();
    const currentIndex = VALID_THEMES.indexOf(current);
    const nextIndex = (currentIndex + 1) % VALID_THEMES.length;
    applyTheme(VALID_THEMES[nextIndex]);
  }
  
  /**
   * Render theme toggle buttons
   * @param {string} containerId - ID of container element
   * @param {object} options - Configuration options
   */
  function renderThemeToggle(containerId, options = {}) {
    const container = document.getElementById(containerId);
    if (!container) return;
    
    const compact = options.compact || false;
    const showLabels = options.showLabels !== false;
    const currentTheme = getCurrentTheme();
    
    let html = `<div class="theme-toggle-container${compact ? ' compact' : ''}">`;
    
    VALID_THEMES.forEach(theme => {
      const meta = THEME_META[theme];
      const isActive = theme === currentTheme;
      html += `
        <button 
          class="theme-toggle-btn${isActive ? ' active' : ''}" 
          data-theme-target="${theme}"
          title="${meta.description}"
        >
          <span class="theme-icon">${meta.icon}</span>
          ${showLabels ? `<span class="theme-label">${meta.name}</span>` : ''}
        </button>
      `;
    });
    
    html += '</div>';
    container.innerHTML = html;
    
    // Attach click handlers
    container.querySelectorAll('.theme-toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        applyTheme(btn.getAttribute('data-theme-target'));
      });
    });
  }
  
  // ═══════════════════════════════════════════════════════════════════════════
  // PUBLIC API
  // ═══════════════════════════════════════════════════════════════════════════
  
  // Override existing switchTheme with enhanced version
  window.switchTheme = applyTheme;
  
  // Expose additional utilities
  window.ThemeSystem = {
    init: initThemeSystem,
    apply: applyTheme,
    get: getCurrentTheme,
    getMeta: getThemeMeta,
    getChartColors: getChartColors,
    cycle: cycleTheme,
    render: renderThemeToggle,
    themes: VALID_THEMES,
    meta: THEME_META
  };
  
  // Initialize on DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initThemeSystem);
  } else {
    initThemeSystem();
  }
  
  // Also run immediately for earliest possible application
  // (handles script in <head> before body exists)
  if (document.body) {
    const savedTheme = localStorage.getItem(STORAGE_KEY);
    if (savedTheme && VALID_THEMES.includes(savedTheme)) {
      document.body.setAttribute('data-theme', savedTheme);
    }
  }
  
})();
</script>
