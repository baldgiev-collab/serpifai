<!--
  UI_Metrics_Calculator.html
  HERO METRICS CALCULATOR v2.0
  
  Extract/calculate hero metrics from Gemini JSON or section content
  Metrics: Cite-ability, Janitor Ratio, Moat Valuation
-->
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   TASK 12: METRIC CALCULATION FUNCTIONS
   ═══════════════════════════════════════════════════════════════════════════ */

const MetricsCalculator = {
  
  /**
   * V2.0: Calculate hero metrics from section content OR JSON data
   * Extracts scores from text patterns when structured data unavailable
   */
  calculateHeroMetrics(content, sectionNum) {
    // Try to get from global analysis data first
    const globalData = window._stage1AnalysisData?.dashboardCharts || {};
    
    // Extract metrics from content patterns
    const citeability = this.extractCiteability(content, globalData);
    const janitor = this.extractJanitorRatio(content, globalData);
    const moat = this.extractMoatValue(content, globalData);
    
    return {
      citeability,
      janitor,
      moat
    };
  },
  
  /**
   * Extract Cite-ability from content or global data
   */
  extractCiteability(content, globalData) {
    // Check global data first
    if (globalData.citeabilityScore) {
      const score = parseFloat(globalData.citeabilityScore);
      return { value: score.toFixed(2), trend: score >= 0.7 ? 'positive' : 'neutral' };
    }
    
    // Extract from content patterns like "Score: 8/10" or "85%"
    const patterns = [
      /cite[\-\s]?ability[:\s]+(\d+(?:\.\d+)?)/i,
      /aeo[:\s]+(\d+(?:\.\d+)?)/i,
      /citation\s+score[:\s]+(\d+(?:\.\d+)?)/i,
      /(\d+)\/10/,
      /score[:\s]+(\d+(?:\.\d+)?)/i
    ];
    
    for (const pattern of patterns) {
      const match = content?.match(pattern);
      if (match) {
        let score = parseFloat(match[1]);
        if (score > 1 && score <= 10) score = score / 10; // Normalize /10 scores
        if (score > 10) score = score / 100; // Normalize percentages
        return { value: score.toFixed(2), trend: score >= 0.7 ? 'positive' : 'neutral' };
      }
    }
    
    // Default: Calculate based on content quality indicators
    const hasStructuredMarkers = (content?.match(/\|/g) || []).length > 5;
    const hasBoldText = (content?.match(/\*\*/g) || []).length > 3;
    const hasNumberedItems = (content?.match(/^\d+\./gm) || []).length > 3;
    
    const impliedScore = (hasStructuredMarkers ? 0.3 : 0) + (hasBoldText ? 0.3 : 0) + (hasNumberedItems ? 0.3 : 0);
    return { value: impliedScore.toFixed(2), trend: impliedScore >= 0.6 ? 'positive' : 'neutral' };
  },
  
  /**
   * Extract Janitor Ratio from content or global data
   */
  extractJanitorRatio(content, globalData) {
    if (globalData.janitorRatio) {
      const ratio = parseFloat(globalData.janitorRatio);
      return { value: `${Math.round(ratio)}%`, trend: ratio > 40 ? 'negative' : 'positive' };
    }
    
    // Look for janitor/cleanup mentions
    const patterns = [
      /janitor[:\s]+(\d+)%/i,
      /cleanup[:\s]+(\d+)%/i,
      /refresh[:\s]+(\d+)%/i,
      /stale[:\s]+(\d+)%/i,
      /outdated[:\s]+(\d+)%/i
    ];
    
    for (const pattern of patterns) {
      const match = content?.match(pattern);
      if (match) {
        const ratio = parseInt(match[1]);
        return { value: `${ratio}%`, trend: ratio > 40 ? 'negative' : 'positive' };
      }
    }
    
    // Default estimate based on content age markers
    return { value: '~25%', trend: 'neutral' };
  },
  
  /**
   * Extract Moat Value from content or global data
   */
  extractMoatValue(content, globalData) {
    if (globalData.moatValuation) {
      return { value: this.formatCurrency(globalData.moatValuation), trend: 'positive' };
    }
    
    // Look for dollar values
    const patterns = [
      /\$[\d,]+(?:\.\d+)?[KMB]?/i,
      /moat[:\s]+\$?([\d,]+)/i,
      /value[:\s]+\$?([\d,]+)/i,
      /worth[:\s]+\$?([\d,]+)/i
    ];
    
    for (const pattern of patterns) {
      const match = content?.match(pattern);
      if (match) {
        let value = match[0].replace(/[$,]/g, '');
        if (value.endsWith('K')) value = parseFloat(value) * 1000;
        else if (value.endsWith('M')) value = parseFloat(value) * 1000000;
        else value = parseFloat(value) || 0;
        return { value: this.formatCurrency(value), trend: value > 50000 ? 'positive' : 'neutral' };
      }
    }
    
    return { value: '~$75K', trend: 'neutral' };
  },
  
  /**
   * Format currency with K/M suffix
   */
  formatCurrency(value) {
    if (typeof value === 'string') return value;
    if (value >= 1000000) return '$' + (value / 1000000).toFixed(1) + 'M';
    if (value >= 1000) return '$' + (value / 1000).toFixed(0) + 'K';
    return '$' + Math.round(value);
  }
};

// Expose globally
if (typeof window !== 'undefined') {
  window.MetricsCalculator = MetricsCalculator;
  window.calculateHeroMetrics = (content, sectionNum) => MetricsCalculator.calculateHeroMetrics(content, sectionNum);
}
</script>
