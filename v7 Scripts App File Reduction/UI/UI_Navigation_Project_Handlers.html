<!--
  UI_Navigation_Project_Handlers.html
  Navigation Event Wiring & Project Management Functions
  Extracted from UI_Scripts_App.html IIFE (Phase 3)
  
  Functions exposed to window scope for cross-module access:
  - refreshProjectList, loadProject, doSaveProject
  - doNewProject, doRenameProject, doDeleteProject
  - runStage, displayStageResults, updateStageStatus
-->
<script>
  console.log('🔧 UI_Navigation_Project_Handlers.html loading...');

  // ═══════════════════════════════════════════════════════════════════════════
  // PROJECT MANAGEMENT FUNCTIONS
  // ═══════════════════════════════════════════════════════════════════════════

  /**
   * Refresh the project list dropdown from Google Sheets
   */
  window.refreshProjectList = function() {
    console.log('🔄 Refreshing project list...');
    const projectSelect = document.getElementById('projectSelect');
    
    if (!projectSelect) {
      console.error('❌ projectSelect element not found');
      return;
    }

    google.script.run
      .withSuccessHandler(function(projects) {
        console.log('📋 Projects loaded:', projects ? projects.length : 0);
        projectSelect.innerHTML = '<option value="">-- Select Project --</option>';
        
        if (projects && projects.length > 0) {
          projects.forEach(function(project) {
            const option = document.createElement('option');
            option.value = project.name || project;
            option.textContent = project.name || project;
            projectSelect.appendChild(option);
          });
        }
      })
      .withFailureHandler(function(error) {
        console.error('❌ Failed to load projects:', error);
        window.showToast('Failed to load projects: ' + error, 'error');
      })
      .getProjectList();
  };

  /**
   * Load a project by name
   * @param {string} name - Project name to load
   */
  window.loadProject = function(name) {
    if (!name) {
      console.log('⚠️ No project name provided');
      window.fillFormData?.({});
      window.recalcScores?.();
      return;
    }

    console.log('📂 Loading project:', name);
    window.showLoadingIndicator?.(name);

    google.script.run
      .withSuccessHandler(function(res) {
        window.hideLoadingIndicator?.();
        
        console.log('✅ loadProject SUCCESS handler called');
        console.log('📦 Response type:', typeof res);
        console.log('📦 Has data?', res && res.data);
        
        if (res && res.data) {
          console.log('✅ Filling form with data...');
          console.log('📝 Sample data keys:', Object.keys(res.data).slice(0, 10).join(', '));
          
          window.fillFormData?.(res.data);
          
          // Store current project reference
          window.currentProjectName = name;
          window.currentProjectData = res;
          
          const saveStatus = document.getElementById('saveStatus');
          if (saveStatus) {
            saveStatus.textContent = res.updatedAt 
              ? 'Loaded · ' + new Date(res.updatedAt).toLocaleTimeString()
              : 'Loaded';
          }
          
          window.recalcScores?.();
          window.showToast?.('Project "' + name + '" loaded', 'success');
          
          // Auto-load saved competitor analysis
          if (res.competitorAnalysis && res.competitorAnalysis.success && res.competitorAnalysis.competitors) {
            console.log('🎯 Found saved competitor analysis for project!');
            console.log('   Competitors:', res.competitorAnalysis.competitors.length);
            
            // Clear previous competitor data
            window._lastCompetitorData = null;
            window._eliteTabIntelligence = null;
            window._organizedData = null;
            window.competitorIntelligenceData = null;
            
            // Build proper data structure for renderCompetitorIntelligence
            // V34 FIX: Surface executiveBrief and killMoves to top level for UI access
            const analysis = res.competitorAnalysis.analysis || res.competitorAnalysis.geminiAnalysis || {};
            const geminiAnalysis = res.competitorAnalysis.geminiAnalysis || res.competitorAnalysis.analysis || {};
            
            // V34: Surface executiveBrief from multiple possible locations
            const surfacedBrief = res.competitorAnalysis.executiveBrief ||
                                  analysis.executiveBrief ||
                                  geminiAnalysis.executiveBrief ||
                                  null;
            
            // V34: Surface killMoves from multiple possible locations
            const surfacedKillMoves = res.competitorAnalysis.killMoves ||
                                      analysis.killMoves ||
                                      geminiAnalysis.killMoves ||
                                      [];
            
            if (surfacedBrief) {
              console.log('   ✅ V34: Surfaced executiveBrief - keys:', Object.keys(surfacedBrief).join(', '));
            } else {
              console.log('   ⚠️ V34: No executiveBrief found to surface');
            }
            
            const competitorData = {
              success: true,
              competitors: res.competitorAnalysis.competitors,
              analysis: analysis,
              geminiAnalysis: geminiAnalysis,
              // V34 FIX: Surface to top level for UI_Strategic_Display.html
              executiveBrief: surfacedBrief,
              killMoves: surfacedKillMoves,
              eliteTabIntelligence: res.competitorAnalysis.eliteTabIntelligence || null,
              overview: res.competitorAnalysis.overview || null,
              yourDomain: res.competitorAnalysis.yourDomain || '',
              metadata: {
                competitorCount: res.competitorAnalysis.competitors.length,
                timestamp: res.competitorAnalysis.timestamp,
                source: 'saved'
              }
            };
            
            // Store and render
            window.competitorIntelligenceData = competitorData;
            
            // Render if function exists
            if (typeof window.renderCompetitorIntelligence === 'function') {
              const resultsDiv = document.getElementById('comp-results');
              const emptyState = document.getElementById('comp-empty-state');
              if (resultsDiv && emptyState) {
                emptyState.style.display = 'none';
                resultsDiv.style.display = 'block';
                window.renderCompetitorIntelligence(competitorData);
              }
            }
          }
          
          // =========================================================================
          // V7.9 ELITE STATE HYDRATION: Auto-fetch & render saved workflow stages
          // Uses CHUNKED hydration to avoid HTTP 400 (50KB limit)
          // V7.9 FIX: Skip if a stage is actively running
          // =========================================================================
          window.hydrateWorkflowStages = function(projectId) {
            console.log('💎 STATE HYDRATION: Checking saved workflow stages for', projectId);
            
            // V7.9 FIX: Skip hydration if a stage is actively running
            if (window.stageRunningState?.isRunning) {
              const runningFor = Date.now() - (window.stageRunningState?.startedAt || Date.now());
              console.log('⏳ Stage ' + window.stageRunningState?.stageNum + ' is running (' + Math.round(runningFor/1000) + 's) - skipping auto-hydration');
              console.log('   Hydration will occur when stage completes.');
              return;
            }
            
            // Use chunked hydration to avoid HTTP 400
            if (typeof window.hydrateStage1FromDatabase === 'function') {
              console.log('   Using V7.9 chunked hydration...');
              window.hydrateStage1FromDatabase(projectId);
            } else {
              // Fallback: Try to load Stage 1 from MySQL (may cause HTTP 400 for large data)
              console.warn('⚠️ Chunked hydration not available, using legacy method');
              google.script.run
                .withSuccessHandler(function(stageResult) {
                  if (stageResult && stageResult.success) {
                    console.log('💎 Stage 1 hydrated from MySQL!');
                    console.log('   📊 JSON keys:', stageResult.json ? Object.keys(stageResult.json).join(', ') : 'none');
                    console.log('   📄 Report length:', stageResult.report?.length || 0);
                    console.log('   ⏱️ Timestamp:', stageResult.timestamp);
                    
                    // Hide placeholder, show container
                    const placeholder = document.getElementById('stage1-placeholder');
                    const container = document.getElementById('stage1-unified-container');
                    if (placeholder) placeholder.style.display = 'none';
                    if (container) {
                      container.style.display = 'block';
                      container.classList.add('hydrated-from-sql');
                    }
                    
                    // Update timestamp display
                    const stage1Timestamp = document.getElementById('stage1-timestamp');
                    if (stage1Timestamp && stageResult.timestamp) {
                      const date = new Date(stageResult.timestamp);
                      stage1Timestamp.textContent = 'Completed ' + date.toLocaleString();
                    }
                    
                    // Render with fadeIn animation
                    if (typeof window.renderUnifiedStage1Results === 'function') {
                      console.log('   🎨 Rendering Stage 1 with fadeInUp animation...');
                      window.renderUnifiedStage1Results(stageResult.report, stageResult.json);
                    } else if (typeof window.displayStageResults === 'function') {
                      window.displayStageResults(1, stageResult);
                    }
                    
                    // Update stage status and unlock Stage 2
                    window.updateStageStatus?.(1, 'completed');
                    window.updateStageLock?.(2, false);
                    
                    // Store in ORACLE_STATE for tab injection
                    window.ORACLE_STATE = window.ORACLE_STATE || {};
                    window.ORACLE_STATE.stage1_results = stageResult;
                    window.ORACLE_STATE.projectId = projectId;
                    
                    window.showToast?.('💎 Strategy restored from archive');
                  } else {
                    console.log('⚠️ No saved Stage 1 results for', projectId);
                  }
                })
                .withFailureHandler(function(error) {
                  console.warn('⚠️ Stage hydration failed:', error);
                })
                .loadWorkflowStageResults(projectId, 1);
            }
          };
          
          // Legacy support: Check if workflowStage1 is in project response
          if (res.workflowStage1 && res.workflowStage1.success) {
            console.log('🎯 Found saved Stage 1 results in project response!');
            
            // Update timestamp display
            const stage1Timestamp = document.getElementById('stage1-timestamp');
            if (stage1Timestamp) {
              const date = new Date(res.workflowStage1.timestamp);
              stage1Timestamp.textContent = 'Completed ' + date.toLocaleString();
            }
            
            // Display the results using existing renderer
            if (typeof window.displayStageResults === 'function') {
              console.log('   ✅ Restoring Stage 1 UI...');
              window.displayStageResults(1, res.workflowStage1);
              
              // Update stage status indicator
              window.updateStageStatus?.(1, 'completed');
              
              // Unlock Stage 2 since Stage 1 is complete
              window.updateStageLock?.(2, false);
              console.log('   🔓 Stage 2 unlocked based on saved Stage 1 completion');
            }
            
            // Check workflow status for additional stages
            if (res.workflowStatus && res.workflowStatus.stages) {
              const stages = res.workflowStatus.stages;
              for (let i = 2; i <= 5; i++) {
                if (stages[i] && stages[i].completed) {
                  console.log('   ✅ Stage ' + i + ' was previously completed');
                  window.updateStageStatus?.(i, 'completed');
                  // Unlock next stage
                  if (i < 5) {
                    window.updateStageLock?.(i + 1, false);
                  }
                }
              }
            }
          } else {
            // V7.2: If not in response, try async hydration from MySQL
            console.log('📡 Stage 1 not in response - attempting MySQL hydration...');
            setTimeout(() => window.hydrateWorkflowStages?.(name), 500);
          }
        } else {
          console.warn('⚠️ Project data is empty');
          window.showToast?.('Project not found or empty', 'warning');
        }
      })
      .withFailureHandler(function(error) {
        window.hideLoadingIndicator?.();
        console.error('❌ Failed to load project:', error);
        window.showToast?.('Failed to load project: ' + error, 'error');
      })
      .loadProject(name);
  };

  /**
   * Save current project
   */
  window.doSaveProject = function() {
    const projectSelect = document.getElementById('projectSelect');
    const projectName = projectSelect ? projectSelect.value : null;
    
    if (!projectName) {
      window.showToast('Please select a project first', 'warning');
      return;
    }

    console.log('💾 Saving project:', projectName);
    const formData = window.collectFormData();

    window.showLoadingIndicator('Saving...');

    google.script.run
      .withSuccessHandler(function(result) {
        window.hideLoadingIndicator();
        console.log('✅ Project saved:', projectName);
        window.showToast('Project "' + projectName + '" saved successfully', 'success');
      })
      .withFailureHandler(function(error) {
        window.hideLoadingIndicator();
        console.error('❌ Failed to save project:', error);
        window.showToast('Failed to save project: ' + error, 'error');
      })
      .saveProject(projectName, formData);
  };

  /**
   * Create a new project
   */
  window.doNewProject = function() {
    const projectNameInput = document.getElementById('projectNameInput');
    const newName = projectNameInput ? projectNameInput.value.trim() : '';
    
    if (!newName) {
      window.showToast('Please enter a project name', 'warning');
      return;
    }

    console.log('➕ Creating new project:', newName);
    window.showLoadingIndicator('Creating...');

    google.script.run
      .withSuccessHandler(function(result) {
        window.hideLoadingIndicator();
        console.log('✅ Project created:', newName);
        window.showToast('Project "' + newName + '" created', 'success');
        
        // Clear input and refresh list
        if (projectNameInput) projectNameInput.value = '';
        window.refreshProjectList();
        
        // Auto-select the new project
        setTimeout(function() {
          const projectSelect = document.getElementById('projectSelect');
          if (projectSelect) {
            projectSelect.value = newName;
            window.loadProject(newName);
          }
        }, 500);
      })
      .withFailureHandler(function(error) {
        window.hideLoadingIndicator();
        console.error('❌ Failed to create project:', error);
        window.showToast('Failed to create project: ' + error, 'error');
      })
      .createProject(newName);
  };

  /**
   * Rename current project
   */
  window.doRenameProject = function() {
    const projectSelect = document.getElementById('projectSelect');
    const projectNameInput = document.getElementById('projectNameInput');
    const oldName = projectSelect ? projectSelect.value : '';
    const newName = projectNameInput ? projectNameInput.value.trim() : '';
    
    if (!oldName) {
      window.showToast('Please select a project to rename', 'warning');
      return;
    }
    
    if (!newName) {
      window.showToast('Please enter a new name', 'warning');
      return;
    }

    if (oldName === newName) {
      window.showToast('New name is same as old name', 'warning');
      return;
    }

    console.log('✏️ Renaming project:', oldName, '→', newName);
    window.showLoadingIndicator('Renaming...');

    google.script.run
      .withSuccessHandler(function(result) {
        window.hideLoadingIndicator();
        console.log('✅ Project renamed:', oldName, '→', newName);
        window.showToast('Project renamed to "' + newName + '"', 'success');
        
        // Clear input and refresh list
        if (projectNameInput) projectNameInput.value = '';
        window.refreshProjectList();
        
        // Auto-select the renamed project
        setTimeout(function() {
          const projectSelect = document.getElementById('projectSelect');
          if (projectSelect) {
            projectSelect.value = newName;
          }
        }, 500);
      })
      .withFailureHandler(function(error) {
        window.hideLoadingIndicator();
        console.error('❌ Failed to rename project:', error);
        window.showToast('Failed to rename project: ' + error, 'error');
      })
      .renameProject(oldName, newName);
  };

  /**
   * Delete current project
   */
  window.doDeleteProject = function() {
    const projectSelect = document.getElementById('projectSelect');
    const projectName = projectSelect ? projectSelect.value : '';
    
    if (!projectName) {
      window.showToast('Please select a project to delete', 'warning');
      return;
    }

    if (!confirm('Are you sure you want to delete "' + projectName + '"? This cannot be undone.')) {
      return;
    }

    console.log('🗑️ Deleting project:', projectName);
    window.showLoadingIndicator('Deleting...');

    google.script.run
      .withSuccessHandler(function(result) {
        window.hideLoadingIndicator();
        console.log('✅ Project deleted:', projectName);
        window.showToast('Project "' + projectName + '" deleted', 'success');
        
        // Clear current project reference
        window.currentProjectName = null;
        window.currentProjectData = null;
        
        // Refresh list
        window.refreshProjectList();
      })
      .withFailureHandler(function(error) {
        window.hideLoadingIndicator();
        console.error('❌ Failed to delete project:', error);
        window.showToast('Failed to delete project: ' + error, 'error');
      })
      .deleteProject(projectName);
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // WORKFLOW STAGE EXECUTION - V7.6 FIX
  // NOTE: The actual runStage implementation is in UI_Stage_Runner.html
  // This file previously had a duplicate that caused HTTP 400 errors by
  // passing full competitor data (~5MB) instead of minimal payload (~100 bytes)
  // ═══════════════════════════════════════════════════════════════════════════

  // V7.6: REMOVED - The runStage function is now ONLY defined in UI_Stage_Runner.html
  // Do NOT define window.runStage here - it uses ultraMinimalPayload correctly
  // See: UI/UI_Stage_Runner.html line 24 for the correct implementation

  /**
   * Display stage results in the results panel
   * @param {number} stageNum - Stage number
   * @param {string|Object} result - Stage result data
   */
  window.displayStageResults = function(stageNum, result) {
    console.log('📄 Displaying results for stage:', stageNum);

    // Store result in form field
    const resultField = document.getElementById('stage' + stageNum + 'Result');
    if (resultField) {
      resultField.value = typeof result === 'object' ? JSON.stringify(result) : result;
    }

    // Find or create results container
    const resultsContainer = document.getElementById('stage-' + stageNum + '-results');
    if (resultsContainer) {
      // Format the result for display
      let displayHtml = '';
      
      if (typeof result === 'object' && result !== null) {
        // Handle structured result
        if (result.report) {
          displayHtml = window.formatMarkdownReport ? 
            window.formatMarkdownReport(result.report) : 
            '<pre>' + result.report + '</pre>';
        } else {
          displayHtml = '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
        }
      } else if (typeof result === 'string') {
        // Handle text/markdown result
        displayHtml = window.formatMarkdownReport ? 
          window.formatMarkdownReport(result) : 
          '<pre>' + result + '</pre>';
      }

      resultsContainer.innerHTML = displayHtml;
    }

    // Switch to results tab if it exists
    const resultsTab = document.querySelector('[data-tab="results"]');
    if (resultsTab) {
      window.setActiveTab('results');
    }
  };

  /**
   * Update stage status badge
   * @param {number} stageNum - Stage number
   * @param {string} status - Status: 'pending', 'running', 'completed', 'error'
   */
  window.updateStageStatus = function(stageNum, status) {
    const statusEl = document.querySelector('.stage-status[data-stage="' + stageNum + '"]');
    if (!statusEl) return;

    // Remove existing status classes
    statusEl.classList.remove('status-pending', 'status-running', 'status-completed', 'status-error');
    
    // Add new status class
    statusEl.classList.add('status-' + status);

    // Update status text
    const statusText = {
      'pending': '○ Pending',
      'running': '◐ Running...',
      'completed': '✓ Completed',
      'error': '✗ Error'
    };
    statusEl.textContent = statusText[status] || status;
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // GEMINI MODEL SELECTION
  // ═══════════════════════════════════════════════════════════════════════════

  /**
   * Load available Gemini models
   * Response format: { success: true, models: [{name, displayName}], currentModel: 'model-name' }
   */
  window.loadGeminiModels = function() {
    console.log('🤖 Loading Gemini models...');
    
    const geminiModelSelect = document.getElementById('geminiModelSelect');
    if (!geminiModelSelect) {
      console.warn('⚠️ geminiModelSelect element not found');
      return;
    }
    
    geminiModelSelect.innerHTML = '<option value="">Loading models...</option>';
    geminiModelSelect.disabled = true;
    
    google.script.run
      .withSuccessHandler(function(response) {
        console.log('📦 Gemini models response:', response);
        
        if (response && response.success && response.models && response.models.length > 0) {
          geminiModelSelect.innerHTML = '';
          
          response.models.forEach(function(model) {
            const option = document.createElement('option');
            option.value = model.name;  // Use 'name' property (e.g., 'gemini-3-flash-preview')
            option.textContent = model.displayName || model.name;  // Use 'displayName' for display
            
            // Select current model if it matches
            if (model.name === response.currentModel) {
              option.selected = true;
            }
            geminiModelSelect.appendChild(option);
          });
          
          geminiModelSelect.disabled = false;
          console.log('✅ Loaded ' + response.models.length + ' Gemini models');
          window.showToast?.('✅ Loaded ' + response.models.length + ' Gemini models');
        } else {
          // Fallback options - Updated Jan 2026
          geminiModelSelect.innerHTML = `
            <option value="gemini-3-flash-preview">Gemini 3 Flash Preview ⚡🆕 (Latest)</option>
            <option value="gemini-3-pro-preview">Gemini 3 Pro Preview 🧠🆕</option>
            <option value="gemini-2.5-flash">Gemini 2.5 Flash ⚡ (Stable)</option>
            <option value="gemini-2.5-pro">Gemini 2.5 Pro 🧠 (Stable)</option>
          `;
          geminiModelSelect.disabled = false;
          console.log('⚠️ Using fallback Gemini models');
        }
      })
      .withFailureHandler(function(error) {
        console.error('❌ Failed to load Gemini models:', error);
        geminiModelSelect.innerHTML = `
          <option value="gemini-3-flash-preview">Gemini 3 Flash Preview ⚡</option>
          <option value="gemini-2.5-flash">Gemini 2.5 Flash ⚡</option>
        `;
        geminiModelSelect.disabled = false;
        window.showToast?.('⚠️ Could not load models, using defaults');
      })
      .getGeminiModels();
  };

  /**
   * Save selected Gemini model preference
   * @param {string} modelName - Model ID to save
   */
  window.saveGeminiModel = function(modelName) {
    localStorage.setItem('serpifai-gemini-model', modelName);
    console.log('💾 Saved Gemini model preference:', modelName);
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // NAVIGATION EVENT WIRING HELPER
  // ═══════════════════════════════════════════════════════════════════════════

  /**
   * Wire up all navigation event handlers
   * Call this after DOM is ready
   */
  window.initNavigationHandlers = function() {
    console.log('🔌 Wiring navigation handlers...');

    // Navigation buttons
    const navBtns = document.querySelectorAll('.nav-btn');
    navBtns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        const tabName = btn.dataset.tab;
        if (tabName) {
          window.setActiveTab(tabName);
        }
      });
    });

    // Submenu navigation
    document.querySelectorAll('.nav-subbtn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const tabName = btn.dataset.tab;
        if (tabName) {
          window.setActiveTab(tabName);
        }
      });
    });

    // Stage panel accordion toggle
    document.querySelectorAll('.stage-panel').forEach(function(panel) {
      const header = panel.querySelector('.stage-header');
      if (header) {
        header.addEventListener('click', function(e) {
          // Prevent toggle if clicking buttons inside header
          if (e.target.closest('button') || e.target.closest('.btn-run-stage')) {
            return;
          }
          e.stopPropagation();
          
          const stageNum = panel.dataset.stage;
          console.log('Stage panel toggled:', stageNum);
          
          // Toggle this panel's open state
          panel.classList.toggle('open');
          
          // Ensure body is visible when open
          const body = panel.querySelector('.stage-body');
          if (body) {
            if (panel.classList.contains('open')) {
              body.style.maxHeight = 'none';
              body.style.overflow = 'visible';
            } else {
              body.style.maxHeight = '0';
              body.style.overflow = 'hidden';
            }
          }
        });
      }
    });

    // Run Stage buttons
    document.querySelectorAll('.btn-run-stage').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const stageNum = parseInt(btn.dataset.stage);
        if (stageNum) {
          window.runStage(stageNum, btn);
        }
      });
    });

    // Results tab navigation
    document.querySelectorAll('.results-tab-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const resultTab = btn.dataset.result;
        if (resultTab) {
          // Switch result sub-tab
          document.querySelectorAll('.results-tab-btn').forEach(function(b) {
            b.classList.remove('active');
          });
          btn.classList.add('active');
          
          document.querySelectorAll('.result-panel').forEach(function(panel) {
            panel.classList.remove('active');
          });
          const targetPanel = document.getElementById('result-' + resultTab);
          if (targetPanel) {
            targetPanel.classList.add('active');
          }
        }
      });
    });

    // Theme buttons
    const themeBtns = document.querySelectorAll('.btn-theme');
    themeBtns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        const theme = btn.dataset.theme;
        if (theme) {
          window.switchTheme(theme);
        }
      });
    });

    // Project management buttons
    const newProjectBtn = document.getElementById('newProjectBtn');
    if (newProjectBtn) {
      newProjectBtn.addEventListener('click', window.doNewProject);
    }

    const renameProjectBtn = document.getElementById('renameProjectBtn');
    if (renameProjectBtn) {
      renameProjectBtn.addEventListener('click', window.doRenameProject);
    }

    const deleteProjectBtn = document.getElementById('deleteProjectBtn');
    if (deleteProjectBtn) {
      deleteProjectBtn.addEventListener('click', window.doDeleteProject);
    }

    const saveProjectBtn = document.getElementById('saveProjectBtn');
    if (saveProjectBtn) {
      saveProjectBtn.addEventListener('click', window.doSaveProject);
    }

    const saveProjectBtnTop = document.getElementById('saveProjectBtnTop');
    if (saveProjectBtnTop) {
      saveProjectBtnTop.addEventListener('click', window.doSaveProject);
    }

    // Project select change handler
    const projectSelect = document.getElementById('projectSelect');
    if (projectSelect) {
      projectSelect.addEventListener('change', function() {
        window.loadProject(projectSelect.value);
      });
    }

    // Gemini model select handler
    const geminiModelSelect = document.getElementById('geminiModelSelect');
    if (geminiModelSelect) {
      geminiModelSelect.addEventListener('change', function() {
        window.saveGeminiModel(geminiModelSelect.value);
      });
    }

    console.log('✅ Navigation handlers wired');
  };

  /**
   * Toggle a specific stage panel open/closed
   * @param {number} stageNumber - Stage to toggle (1-5)
   */
  window.toggleStage = function(stageNumber) {
    const panel = document.querySelector('.stage-panel[data-stage="' + stageNumber + '"]');
    if (!panel) return;
    
    panel.classList.toggle('open');
    const body = panel.querySelector('.stage-body');
    if (body) {
      if (panel.classList.contains('open')) {
        body.style.maxHeight = 'none';
        body.style.overflow = 'visible';
      } else {
        body.style.maxHeight = '0';
        body.style.overflow = 'hidden';
      }
    }
  };

  /**
   * Update stage lock status based on workflow_log
   * @param {number} stageNumber - Stage number
   * @param {boolean} isLocked - Whether stage is locked
   */
  window.updateStageLock = function(stageNumber, isLocked) {
    const panel = document.querySelector('.stage-panel[data-stage="' + stageNumber + '"]');
    if (!panel) {
      console.warn('Stage panel not found for stage:', stageNumber);
      return;
    }
    
    // Toggle locked class on panel
    if (isLocked) {
      panel.classList.add('locked');
    } else {
      panel.classList.remove('locked');
    }
    
    const lockIcon = panel.querySelector('.stage-lock-icon');
    if (lockIcon) {
      lockIcon.style.display = isLocked ? 'inline-block' : 'none';
    }
    
    // Disable/enable run button
    const runBtn = panel.querySelector('.btn-run-stage');
    if (runBtn) {
      runBtn.disabled = isLocked;
      runBtn.style.opacity = isLocked ? '0.5' : '1';
      if (!isLocked) {
        runBtn.removeAttribute('disabled');
      }
    }
    
    console.log(`Stage ${stageNumber} lock status: ${isLocked ? '🔒 LOCKED' : '🔓 UNLOCKED'}`);
  };

  /**
   * Get stage completion percentage
   * @param {number} stageNumber - Stage number
   * @returns {number} - Percentage complete (0-100)
   */
  window.getStageProgress = function(stageNumber) {
    const panel = document.querySelector('.stage-panel[data-stage="' + stageNumber + '"]');
    if (!panel) return 0;
    
    const inputs = panel.querySelectorAll('input, textarea, select');
    let filled = 0;
    let total = 0;
    
    inputs.forEach(function(input) {
      total++;
      if (input.value && input.value.trim() !== '') {
        filled++;
      }
    });
    
    return total > 0 ? Math.round((filled / total) * 100) : 0;
  };

  /**
   * Update stage progress badge
   * @param {number} stageNumber - Stage number
   */
  window.updateStageProgressBadge = function(stageNumber) {
    const panel = document.querySelector('.stage-panel[data-stage="' + stageNumber + '"]');
    if (!panel) return;
    
    const progress = window.getStageProgress(stageNumber);
    let badge = panel.querySelector('.stage-progress-badge');
    
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'stage-progress-badge';
      badge.style.cssText = 'margin-left: 8px; padding: 2px 8px; background: #3b82f6; color: white; border-radius: 12px; font-size: 11px; font-weight: 600;';
      const header = panel.querySelector('.stage-header h3, .stage-header .stage-title');
      if (header) {
        header.appendChild(badge);
      }
    }
    
    badge.textContent = progress + '%';
    badge.style.background = progress === 100 ? '#10b981' : progress > 50 ? '#f59e0b' : '#3b82f6';
  };

  console.log('✅ UI_Navigation_Project_Handlers.html loaded');
  console.log('   Exposed: refreshProjectList, loadProject, doSaveProject');
  console.log('   Exposed: doNewProject, doRenameProject, doDeleteProject');
  console.log('   Exposed: runStage, displayStageResults, updateStageStatus');
  console.log('   Exposed: loadGeminiModels, saveGeminiModel, initNavigationHandlers');
  console.log('   Exposed: toggleStage, updateStageLock, getStageProgress, updateStageProgressBadge');
</script>
