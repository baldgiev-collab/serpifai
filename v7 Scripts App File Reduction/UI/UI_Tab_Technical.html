<script>
/**
 * ============================================================================
 * UI_Tab_Technical.html
 * ============================================================================
 * Technical SEO Tab Population & Charts
 * 
 * EXTRACTED FROM: UI_Scripts_App.html (Lines 1748-2624)
 * EXTRACTION DATE: 2026-01-10
 * 
 * Contains:
 * - populateTechnicalSEOTab() - Elite v2.0 Technical SEO Dashboard
 * - renderTechnicalSEOCharts() - Performance & RAG Readiness Charts
 * 
 * Dependencies:
 * - renderExecutiveGeminiInsight (UI_Executive_Renderer.html)
 * - generateExecutiveInsightConfig (UI_Executive_Config.html)
 * - renderRawDataComparisonTable (UI_Raw_Data_Tables.html)
 * - renderOnePercentStrategyPanel (UI_Strategy_Panel.html)
 * - Chart.js (external)
 * ============================================================================
 */

  /**
   * Populate Technical SEO Tab - ELITE v2.0
   * Uses REAL data from PageSpeed API, PHP Fetcher, and Gemini analysis
   * Data sources: apiData.pageSpeed, synthesized.technical, processedMetrics
   */
  function populateTechnicalSEOTab(data) {
    console.log('📊 Populating Technical SEO Tab (Elite v2.0 - Real Data)...');

    // V3.3: Use correct data-comp-panel selectors matching UI_Components_Competitors.html
    let metricsDiv = document.getElementById('comp-technical-metrics');
    let insightsDiv = document.getElementById('comp-technical-insights');

    if (!metricsDiv || !insightsDiv) {
      const panel = document.querySelector('[data-comp-panel="technical"]') ||
        document.getElementById('panel-technicalSEO');
      if (panel) {
        console.log('📦 Creating dynamic containers inside technical panel');
        if (!metricsDiv) {
          metricsDiv = panel.querySelector('#comp-technical-metrics');
          if (!metricsDiv) {
            const container = document.createElement('div');
            container.id = 'comp-technical-metrics';
            container.className = 'comp-metrics-grid';
            container.style.width = '100%';
            const header = panel.querySelector('.panel-header');
            if (header && header.nextSibling) panel.insertBefore(container, header.nextSibling);
            else panel.insertBefore(container, panel.firstChild);
            metricsDiv = container;
          }
        }
        if (!insightsDiv) {
          insightsDiv = panel.querySelector('#comp-technical-insights');
          if (!insightsDiv) {
            const container = document.createElement('div');
            container.id = 'comp-technical-insights';
            container.className = 'comp-insights';
            container.style.width = '100%';
            container.style.marginTop = '24px';
            panel.appendChild(container);
            insightsDiv = container;
          }
        }
      }
    }

    if (!metricsDiv || !insightsDiv) {
      console.warn('⚠️ Technical SEO tab containers not found - check UI_Components_Competitors.html has data-comp-panel="technical"');
      return;
    }

    const competitors = data.competitors || [];
    const gemini = data.geminiAnalysis || data.analysis || {};
    const techCategories = gemini.categories?.technicalSEO || {};

    if (competitors.length === 0) {
      metricsDiv.innerHTML = '<div class="empty-state" style="text-align:center;padding:40px;"><p>No competitors to analyze.</p></div>';
      return;
    }

    // ---------------------------------------------------------------------------
    // HELPER: Format scores to clean whole numbers (removes floating-point noise)
    // ---------------------------------------------------------------------------
    const formatScore = (score) => {
      if (score === null || score === undefined || isNaN(score)) return 'N/A';
      return Math.round(Number(score));
    };

    // ---------------------------------------------------------------------------
    // HELPER: Calculate RAG Readiness based on Schema, semantic structure, and crawlability
    // ---------------------------------------------------------------------------
    const calculateRAGReadiness = (comp) => {
      const synthesized = comp.synthesized || {};
      const website = synthesized.website || {};
      const schemaTypes = website.schemaTypes || [];
      const wordCount = website.wordCount || 0;
      const hasH1 = website.h1 && website.h1.length > 0;
      const hasDescription = website.description && website.description.length > 50;

      let score = 0;
      // Schema markup (40 points max)
      if (schemaTypes.length >= 4) score += 40;
      else if (schemaTypes.length >= 2) score += 25;
      else if (schemaTypes.length >= 1) score += 15;

      // Content depth for LLM context (30 points max)
      if (wordCount >= 2000) score += 30;
      else if (wordCount >= 1000) score += 20;
      else if (wordCount >= 500) score += 10;

      // Semantic structure (30 points max)
      if (hasH1) score += 15;
      if (hasDescription) score += 15;

      return {
        score: Math.min(100, score),
        level: score >= 70 ? 'High' : score >= 40 ? 'Medium' : 'Low',
        color: score >= 70 ? '#22c55e' : score >= 40 ? '#f59e0b' : '#ef4444',
        schemaCount: schemaTypes.length,
        hasRichSnippets: schemaTypes.some(s => ['Article', 'FAQPage', 'HowTo', 'Product', 'Review'].includes(s))
      };
    };

    // ---------------------------------------------------------------------------
    // HELPER: Calculate Predicted CVR Penalty based on performance score
    // Research: Google data shows 1s delay = 7% conversion loss
    // ---------------------------------------------------------------------------
    const calculateCVRPenalty = (perfScore) => {
      if (!perfScore || perfScore === 0) return { penalty: 'N/A', bounceIncrease: 'N/A', color: '#6b7280' };

      // Baseline: 90+ performance = no penalty
      // Every 10 points below 90 = ~5% CVR loss, ~8% bounce increase
      const baseline = 90;
      const deficit = Math.max(0, baseline - perfScore);
      const penaltyPercent = Math.round(deficit * 0.5); // 5% per 10 points
      const bounceIncrease = Math.round(deficit * 0.8); // 8% per 10 points

      let color = '#22c55e';
      if (penaltyPercent >= 20) color = '#ef4444';
      else if (penaltyPercent >= 10) color = '#f59e0b';

      return {
        penalty: penaltyPercent > 0 ? `-${penaltyPercent}%` : '0%',
        bounceIncrease: bounceIncrease > 0 ? `+${bounceIncrease}%` : '0%',
        color: color,
        revenue: penaltyPercent >= 20 ? 'Critical' : penaltyPercent >= 10 ? 'Significant' : penaltyPercent > 0 ? 'Minor' : 'Optimal'
      };
    };

    // Build Elite Technical SEO Dashboard
    // Count how many competitors have real PageSpeed data
    const pageSpeedDataCount = competitors.filter(c => {
      const ps = c.apiData?.pageSpeed?.scores || {};
      return ps.performance > 0 || ps.seo > 0;
    }).length;
    const dataSourceLabel = pageSpeedDataCount === competitors.length ? 'All API Data' :
      pageSpeedDataCount > 0 ? `${pageSpeedDataCount}/${competitors.length} API` : 'Cached/Estimated';
    const dataSourceColor = pageSpeedDataCount === competitors.length ? '#22c55e' :
      pageSpeedDataCount > 0 ? '#f59e0b' : '#ef4444';

    // Generate executive insight for technical SEO
    const avgPerfScore = competitors.reduce((sum, c) => {
      const ps = c.apiData?.pageSpeed?.scores || {};
      return sum + (ps.performance || c.processedMetrics?.performanceScore || 0);
    }, 0) / (competitors.length || 1);
    
    const techExecConfig = generateExecutiveInsightConfig('technical', competitors, gemini);
    techExecConfig.executiveSummary = `Technical analysis of ${competitors.length} competitors shows average performance score of ${Math.round(avgPerfScore)}. ${avgPerfScore < 50 ? 'CRITICAL: Performance issues severely impacting organic visibility and conversions.' : avgPerfScore < 75 ? 'Performance optimization required to maintain competitive advantage.' : 'Technical foundations are strong - focus on continuous monitoring.'}`;
    
    // Override with actual API data insights
    if (techCategories.analysis) techExecConfig.executiveSummary = techCategories.analysis;
    techExecConfig.dataProofs = ['PageSpeed Insights API', 'Core Web Vitals', 'Lighthouse Audit', 'Schema Analysis'];

    let html = `
          <!-- EXECUTIVE INTELLIGENCE BRIEF -->
          ${renderExecutiveGeminiInsight(techExecConfig)}
          
          <!-- TECHNICAL SEO HEADER -->
          <div style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; padding: 28px; border-radius: 16px; margin-bottom: 28px; box-shadow: 0 8px 24px rgba(245,158,11,0.35);">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
              <div>
                <h3 style="margin: 0 0 8px; font-size: 24px; font-weight: 800;">⚡ Technical SEO & Performance Analysis</h3>
                <p style="margin: 0; opacity: 0.9; font-size: 14px;">Real-time data from PageSpeed Insights API • Core Web Vitals • RAG Readiness • CVR Impact</p>
                <div style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;">
                  <span style="background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; font-size: 11px; display: inline-flex; align-items: center; gap: 4px;" title="Data from Google PageSpeed Insights API">
                    <span style="width: 6px; height: 6px; border-radius: 50%; background: ${dataSourceColor};"></span>
                    ${dataSourceLabel} from PageSpeed API
                  </span>
                  <span style="background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; font-size: 11px;" title="Schema data from PHP Oracle Fetcher">📊 Schema: Oracle Fetcher</span>
                </div>
              </div>
              <div style="display: flex; gap: 16px;">
                <div style="text-align: center; background: rgba(255,255,255,0.15); padding: 12px 20px; border-radius: 10px;">
                  <div style="font-size: 28px; font-weight: 800;">${competitors.length}</div>
                  <div style="font-size: 11px; opacity: 0.85;">Competitors</div>
                </div>
                <div style="text-align: center; background: rgba(255,255,255,0.15); padding: 12px 20px; border-radius: 10px;" title="PageSpeed data freshness">
                  <div style="font-size: 28px; font-weight: 800;">${pageSpeedDataCount}</div>
                  <div style="font-size: 11px; opacity: 0.85;">API Verified</div>
                </div>
              </div>
            </div>
          </div>
          
          <!-- --------------------------------------------------------------------------- -->
          <!-- SECTION 1: CORE WEB VITALS + RAG READINESS + CVR PENALTY TABLE -->
          <!-- --------------------------------------------------------------------------- -->
          <div style="background: white; padding: 28px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 28px; overflow-x: auto;">
            <h4 style="margin: 0 0 8px; font-size: 20px; font-weight: 800; color: #202124;">
              🎯 Core Web Vitals & 2025 Performance Moat
            </h4>
            <p style="margin: 0 0 24px; font-size: 14px; color: #666;">
              Speed → AI Citations → Revenue. Sites with low performance scores face measurable conversion penalties.
            </p>
            <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
              <thead>
                <tr style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: white;">
                  <th style="text-align: left; padding: 16px 14px; border-radius: 10px 0 0 0; font-weight: 700;">Competitor</th>
                  <th style="text-align: center; padding: 16px 14px; font-weight: 700;">Performance</th>
                  <th style="text-align: center; padding: 16px 14px; font-weight: 700;">SEO Score</th>
                  <th style="text-align: center; padding: 16px 14px; font-weight: 700;">Accessibility</th>
                  <th style="text-align: center; padding: 16px 14px; font-weight: 700;">Best Practices</th>
                  <th style="text-align: center; padding: 16px 14px; font-weight: 700; background: rgba(245,158,11,0.3);">🤖 RAG Ready</th>
                  <th style="text-align: center; padding: 16px 14px; font-weight: 700; background: rgba(239,68,68,0.3);">💸 CVR Penalty</th>
                  <th style="text-align: center; padding: 16px 14px; border-radius: 0 10px 0 0; font-weight: 700;">Site Health</th>
                </tr>
              </thead>
              <tbody>`;

    // Process each competitor with REAL data
    competitors.forEach((comp, index) => {
      const pm = comp.processedMetrics || {};
      const apiData = comp.apiData || {};
      const pageSpeed = apiData.pageSpeed || {};
      const scores = pageSpeed.scores || {};

      // Extract REAL PageSpeed data - USE formatScore to clean floating-point noise
      const perfScore = formatScore(scores.performance || pm.performanceScore || pm.pageSpeed || 0);
      const seoScore = formatScore(scores.seo || pm.seoScore || 0);
      const accessScore = formatScore(scores.accessibility || pm.accessibilityScore || 0);
      const bpScore = formatScore(scores.best_practices || pm.bestPracticesScore || 0);
      const siteHealth = formatScore(pm.siteHealth || (perfScore !== 'N/A' ? Math.round((perfScore + seoScore + accessScore + bpScore) / 4) : 0));

      // Calculate RAG Readiness and CVR Penalty
      const rag = calculateRAGReadiness(comp);
      const cvr = calculateCVRPenalty(perfScore !== 'N/A' ? perfScore : 0);

      const getScoreColor = (score) => {
        if (score === 'N/A') return '#6b7280';
        return score >= 80 ? '#22c55e' : score >= 50 ? '#f59e0b' : '#ef4444';
      };
      const getScoreBg = (score) => {
        if (score === 'N/A') return 'rgba(107,114,128,0.1)';
        return score >= 80 ? 'rgba(34,197,94,0.1)' : score >= 50 ? 'rgba(245,158,11,0.1)' : 'rgba(239,68,68,0.1)';
      };

      const rowBg = index % 2 === 1 ? 'background: #fafafa;' : '';
      
      // Determine data source for this competitor
      const hasPageSpeedAPI = scores.performance > 0 || scores.seo > 0;
      const dataSourceIcon = hasPageSpeedAPI ? '✅' : '📋';
      const dataSourceTitle = hasPageSpeedAPI ? 'PageSpeed API (Live Data)' : 'Cached/Estimated Data';

      html += `
            <tr style="border-bottom: 1px solid #f1f5f9; ${rowBg}">
              <td style="padding: 16px 14px;">
                <div style="font-weight: 700; color: #1f2937; font-size: 14px;" title="${dataSourceTitle}">
                  ${index + 1}. ${comp.domain}
                  <span style="font-size: 10px; margin-left: 4px;" title="${dataSourceTitle}">${dataSourceIcon}</span>
                </div>
              </td>
              <td style="text-align: center; padding: 16px 14px;" title="Performance Score from ${hasPageSpeedAPI ? 'PageSpeed Insights API' : 'Cached Data'}">
                <div style="display: inline-block; padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 15px; color: ${getScoreColor(perfScore)}; background: ${getScoreBg(perfScore)};">
                  ${perfScore}
                </div>
              </td>
              <td style="text-align: center; padding: 16px 14px;" title="SEO Score from ${hasPageSpeedAPI ? 'PageSpeed Insights API' : 'Cached Data'}">
                <div style="display: inline-block; padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 15px; color: ${getScoreColor(seoScore)}; background: ${getScoreBg(seoScore)};">
                  ${seoScore}
                </div>
              </td>
              <td style="text-align: center; padding: 16px 14px;" title="Accessibility Score from ${hasPageSpeedAPI ? 'PageSpeed Insights API' : 'Cached Data'}">
                <div style="display: inline-block; padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 15px; color: ${getScoreColor(accessScore)}; background: ${getScoreBg(accessScore)};">
                  ${accessScore}
                </div>
              </td>
              <td style="text-align: center; padding: 16px 14px;" title="Best Practices Score from ${hasPageSpeedAPI ? 'PageSpeed Insights API' : 'Cached Data'}">
                <div style="display: inline-block; padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 15px; color: ${getScoreColor(bpScore)}; background: ${getScoreBg(bpScore)};">
                  ${bpScore}
                </div>
              </td>
              <td style="text-align: center; padding: 16px 14px; background: rgba(245,158,11,0.05);">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
                  <span style="display: inline-block; padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 12px; color: white; background: ${rag.color};">${rag.level}</span>
                  <span style="font-size: 11px; color: #666;">${rag.schemaCount} Schema${rag.schemaCount !== 1 ? 's' : ''}</span>
                </div>
              </td>
              <td style="text-align: center; padding: 16px 14px; background: rgba(239,68,68,0.05);">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
                  <span style="font-weight: 800; font-size: 16px; color: ${cvr.color};">${cvr.penalty}</span>
                  <span style="font-size: 11px; color: #666;">Bounce ${cvr.bounceIncrease}</span>
                </div>
              </td>
              <td style="text-align: center; padding: 16px 14px;">
                <div style="display: inline-block; padding: 10px 16px; border-radius: 10px; font-weight: 800; font-size: 16px; color: ${getScoreColor(siteHealth)}; background: ${getScoreBg(siteHealth)};">
                  ${siteHealth}
                </div>
              </td>
            </tr>`;
    });

    html += `
              </tbody>
            </table>
            
            <!-- Legend -->
            <div style="margin-top: 20px; padding: 16px; background: #f8fafc; border-radius: 10px; display: flex; flex-wrap: wrap; gap: 20px; font-size: 12px;">
              <div><strong>🤖 RAG Ready:</strong> Semantic Density for AI/LLM crawlability. Low = AI agents can't extract quality context.</div>
              <div><strong>💸 CVR Penalty:</strong> Estimated conversion rate loss vs 90+ baseline. Based on Google's 1s = 7% CVR loss research.</div>
            </div>
          </div>
          
          <!-- --------------------------------------------------------------------------- -->
          <!-- SECTION 2: RAG READINESS DEEP DIVE -->
          <!-- --------------------------------------------------------------------------- -->
          <div style="background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%); padding: 28px; border-radius: 16px; box-shadow: 0 8px 24px rgba(15,23,42,0.4); margin-bottom: 28px; color: white;">
            <h4 style="margin: 0 0 8px; font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 12px;">
              🤖 2025 RAG Readiness Analysis
              <span style="font-size: 12px; font-weight: 500; background: rgba(245,158,11,0.3); padding: 4px 12px; border-radius: 20px;">AI Citation Potential</span>
            </h4>
            <p style="margin: 0 0 24px; font-size: 14px; opacity: 0.9; line-height: 1.6;">
              In 2025, a site is technically "healthy" only if it's readable by AI agents. Schema markup, semantic density, and structured content determine citation probability.
            </p>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
              ${competitors.slice(0, 6).map((comp, idx) => {
      const rag = calculateRAGReadiness(comp);
      const synthesized = comp.synthesized || {};
      const website = synthesized.website || {};
      const schemaTypes = website.schemaTypes || [];
      const wordCount = website.wordCount || 0;

      return `
                <div style="background: rgba(255,255,255,0.08); padding: 20px; border-radius: 12px; border-left: 5px solid ${rag.color};">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                    <span style="font-size: 15px; font-weight: 700;">${comp.domain}</span>
                    <span style="padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 13px; color: white; background: ${rag.color};">${rag.score}/100</span>
                  </div>
                  
                  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
                    <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;">
                      <div style="font-size: 11px; opacity: 0.7; margin-bottom: 4px;">Schema Types</div>
                      <div style="font-size: 18px; font-weight: 800; color: ${schemaTypes.length > 0 ? '#22c55e' : '#ef4444'};">${schemaTypes.length || 0}</div>
                    </div>
                    <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;">
                      <div style="font-size: 11px; opacity: 0.7; margin-bottom: 4px;">Content Depth</div>
                      <div style="font-size: 14px; font-weight: 700;">${wordCount > 0 ? wordCount.toLocaleString() + ' words' : 'N/A'}</div>
                    </div>
                  </div>
                  
                  <div style="font-size: 12px; opacity: 0.8;">
                    <strong>AI Verdict:</strong> ${rag.level === 'High' ? '✅ Optimized for LLM extraction' : rag.level === 'Medium' ? '⚠️ Partial AI readiness' : '❌ Poor LLM crawlability - low citation probability'}
                  </div>
                  
                  ${schemaTypes.length > 0 ? `
                    <div style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px;">
                      ${schemaTypes.slice(0, 4).map(s => `<span style="font-size: 10px; background: rgba(34,197,94,0.2); color: #22c55e; padding: 3px 8px; border-radius: 10px;">${s}</span>`).join('')}
                      ${schemaTypes.length > 4 ? `<span style="font-size: 10px; background: rgba(255,255,255,0.1); padding: 3px 8px; border-radius: 10px;">+${schemaTypes.length - 4} more</span>` : ''}
                    </div>
                  ` : `
                    <div style="margin-top: 10px; font-size: 11px; color: #f87171;">⚠️ No Schema detected - invisible to AI agents</div>
                  `}
                </div>
              `;
    }).join('')}
            </div>
            
            <!-- Kill Move Callout -->
            <div style="margin-top: 24px; background: linear-gradient(135deg, rgba(239,68,68,0.2), rgba(245,158,11,0.2)); padding: 20px; border-radius: 12px; border: 2px dashed rgba(255,255,255,0.3);">
              <h5 style="margin: 0 0 10px; font-size: 16px; font-weight: 700;">🎯 Serpifai's #1 Technical Kill Move</h5>
              <p style="margin: 0; font-size: 14px; line-height: 1.6;">
                Competitors with <strong>no Schema markup</strong> are invisible to AI search engines (Perplexity, ChatGPT Search, Google AI Overviews). 
                Serpifai should achieve <strong>RAG Readiness 90+</strong> with comprehensive Schema (Article, FAQPage, HowTo, SoftwareApplication) 
                to dominate AI citations while competitors remain in the "old SEO" paradigm.
              </p>
            </div>
          </div>
          
          <!-- --------------------------------------------------------------------------- -->
          <!-- SECTION 3: SPEED-TO-REVENUE IMPACT ANALYSIS -->
          <!-- --------------------------------------------------------------------------- -->
          <div style="background: white; padding: 28px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 28px;">
            <h4 style="margin: 0 0 8px; font-size: 20px; font-weight: 800; color: #202124;">
              💰 Speed-to-Revenue Impact Analysis
            </h4>
            <p style="margin: 0 0 24px; font-size: 14px; color: #666; line-height: 1.5;">
              Google research: Every 100ms of latency = 1% revenue loss. Performance scores below 90 translate directly to conversion penalties.
            </p>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
              ${competitors.slice(0, 4).map((comp, idx) => {
      const pm = comp.processedMetrics || {};
      const scores = comp.apiData?.pageSpeed?.scores || {};
      const perfScore = formatScore(scores.performance || pm.performanceScore || 0);
      const cvr = calculateCVRPenalty(perfScore !== 'N/A' ? perfScore : 0);

      const impactLevel = cvr.revenue;
      const bgGradient = impactLevel === 'Critical' ? 'linear-gradient(135deg, #fef2f2, #fee2e2)' :
        impactLevel === 'Significant' ? 'linear-gradient(135deg, #fffbeb, #fef3c7)' :
          impactLevel === 'Minor' ? 'linear-gradient(135deg, #f0fdf4, #dcfce7)' :
            'linear-gradient(135deg, #ecfdf5, #d1fae5)';
      const borderColor = impactLevel === 'Critical' ? '#ef4444' :
        impactLevel === 'Significant' ? '#f59e0b' :
          impactLevel === 'Minor' ? '#22c55e' : '#10b981';

      return `
                <div style="background: ${bgGradient}; padding: 20px; border-radius: 12px; border-left: 5px solid ${borderColor};">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <span style="font-size: 16px; font-weight: 700; color: #1f2937;">${comp.domain}</span>
                    <span style="padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 12px; color: white; background: ${borderColor};">${impactLevel}</span>
                  </div>
                  
                  <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; text-align: center;">
                    <div>
                      <div style="font-size: 11px; color: #6b7280; margin-bottom: 4px;">Performance</div>
                      <div style="font-size: 24px; font-weight: 800; color: ${cvr.color};">${perfScore}</div>
                    </div>
                    <div>
                      <div style="font-size: 11px; color: #6b7280; margin-bottom: 4px;">CVR Penalty</div>
                      <div style="font-size: 24px; font-weight: 800; color: ${cvr.color};">${cvr.penalty}</div>
                    </div>
                    <div>
                      <div style="font-size: 11px; color: #6b7280; margin-bottom: 4px;">Bounce ↑</div>
                      <div style="font-size: 24px; font-weight: 800; color: ${cvr.color};">${cvr.bounceIncrease}</div>
                    </div>
                  </div>
                  
                  <div style="margin-top: 14px; padding: 12px; background: white; border-radius: 8px; font-size: 12px; color: #374151;">
                    ${impactLevel === 'Critical' ? '🚨 <strong>Critical:</strong> Estimated 20%+ revenue leakage. Immediate Core Web Vitals optimization required.' :
