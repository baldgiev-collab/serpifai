<script>
/**
 * UI_Charts_Renderers.html
 * Chart rendering functions for various data visualization components
 * Extracted from UI_Scripts_App.html for modularization

/**
 * Render Conversion Charts (Funnel + Revenue Models)
 */
function renderConversionCharts(conversionData) {
  console.log('📊 renderConversionCharts called with', conversionData.length, 'items');
  if (!window.competitorCharts) window.competitorCharts = {};
  if (typeof Chart === 'undefined') { console.error('❌ Chart.js not loaded'); return; }

  // Funnel Architecture Bar Chart
  const funnelCtx = document.getElementById('chart-conversion-funnel');
  if (funnelCtx) {
    if (window.competitorCharts['conversion-funnel']) window.competitorCharts['conversion-funnel'].destroy();
    window.competitorCharts['conversion-funnel'] = new Chart(funnelCtx, {
      type: 'bar',
      data: {
        labels: conversionData.slice(0, 6).map(c => c.domain?.split('.')[0] || 'Unknown'),
        datasets: [
          { label: 'Funnel Score', data: conversionData.slice(0, 6).map(c => c.funnelScore || 0), backgroundColor: 'rgba(245, 158, 11, 0.7)', borderColor: '#f59e0b', borderWidth: 1 },
          { label: 'Persuasion', data: conversionData.slice(0, 6).map(c => c.landingPersuasion || 0), backgroundColor: 'rgba(139, 92, 246, 0.7)', borderColor: '#8b5cf6', borderWidth: 1 }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 1200 }, scales: { y: { beginAtZero: true, max: 100 } }, plugins: { legend: { position: 'top', labels: { boxWidth: 12 } } } }
    });
  }

  // Revenue Model Distribution Doughnut
  const modelsCtx = document.getElementById('chart-conversion-models');
  if (modelsCtx) {
    if (window.competitorCharts['conversion-models']) window.competitorCharts['conversion-models'].destroy();
    const modelCounts = {};
    conversionData.forEach(c => { modelCounts[c.revenueModel || 'Unknown'] = (modelCounts[c.revenueModel || 'Unknown'] || 0) + 1; });
    window.competitorCharts['conversion-models'] = new Chart(modelsCtx, {
      type: 'doughnut',
      data: {
        labels: Object.keys(modelCounts),
        datasets: [{ data: Object.values(modelCounts), backgroundColor: ['#f59e0b', '#3b82f6', '#22c55e', '#8b5cf6', '#ec4899', '#14b8a6'], borderWidth: 2, borderColor: '#fff' }]
      },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 1000 }, plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } } } }
    });
  }
  console.log('   ✅ Conversion charts rendered');
}

/**
 * Render Distribution Charts (PageRank + Visibility Radar)
 */
function renderDistributionCharts(distData) {
  console.log('📊 renderDistributionCharts called with', distData.length, 'items');
  if (!window.competitorCharts) window.competitorCharts = {};
  if (typeof Chart === 'undefined') { console.error('❌ Chart.js not loaded'); return; }

  // PageRank Bar Chart
  const backlinksCtx = document.getElementById('chart-distribution-backlinks');
  if (backlinksCtx) {
    if (window.competitorCharts['distribution-backlinks']) window.competitorCharts['distribution-backlinks'].destroy();
    window.competitorCharts['distribution-backlinks'] = new Chart(backlinksCtx, {
      type: 'bar',
      data: {
        labels: distData.slice(0, 6).map(d => d.domain?.split('.')[0] || 'Unknown'),
        datasets: [{ label: 'PageRank', data: distData.slice(0, 6).map(d => d.pageRank || 0), backgroundColor: distData.slice(0, 6).map(d => d.pageRank >= 5 ? 'rgba(34, 197, 94, 0.7)' : d.pageRank >= 3 ? 'rgba(59, 130, 246, 0.7)' : 'rgba(249, 115, 22, 0.7)'), borderWidth: 1 }]
      },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 1200 }, scales: { y: { beginAtZero: true, max: 10 } }, plugins: { legend: { display: false } } }
    });
  }

  // Visibility Radar
  const radarCtx = document.getElementById('chart-distribution-radar');
  if (radarCtx) {
    if (window.competitorCharts['distribution-radar']) window.competitorCharts['distribution-radar'].destroy();
    const colors = ['#8b5cf6', '#3b82f6', '#22c55e', '#f59e0b'];
    window.competitorCharts['distribution-radar'] = new Chart(radarCtx, {
      type: 'radar',
      data: {
        labels: ['PageRank', 'Domain Auth', 'SERP Results', 'Visibility', 'External Links'],
        datasets: distData.slice(0, 4).map((d, i) => ({
          label: d.domain?.split('.')[0] || 'Unknown',
          data: [(d.pageRank || 0) * 10, d.domainAuthority || 0, (d.serpResults || 0) * 10, d.serpVisibility || 0, Math.min(100, (d.externalLinks || 0) / 10)],

    });
  }
  console.log('   ✅ Distribution charts rendered');
}

/**
 * Render Authority Charts (PageRank + Link Architecture)
 */
function renderAuthorityCharts(authorityData) {
  console.log('📊 renderAuthorityCharts called with', authorityData.length, 'items');
  if (!window.competitorCharts) window.competitorCharts = {};
  if (typeof Chart === 'undefined') { console.error('❌ Chart.js not loaded'); return; }

  // PageRank Comparison (canvas id: chart-authority-velocity)
  const prCtx = document.getElementById('chart-authority-velocity');
  if (prCtx) {
    if (window.competitorCharts['authority-velocity']) window.competitorCharts['authority-velocity'].destroy();
    window.competitorCharts['authority-velocity'] = new Chart(prCtx, {
      type: 'bar',
      data: {
        labels: authorityData.slice(0, 6).map(a => a.domain?.split('.')[0] || 'Unknown'),
        datasets: [
          { label: 'PageRank', data: authorityData.slice(0, 6).map(a => a.pageRank || 0), backgroundColor: 'rgba(234, 179, 8, 0.7)', borderColor: '#eab308', borderWidth: 1 },
          { label: 'Topical Auth', data: authorityData.slice(0, 6).map(a => (a.topicalRelevance || 0) / 10), backgroundColor: 'rgba(59, 130, 246, 0.7)', borderColor: '#3b82f6', borderWidth: 1 }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 1200 }, scales: { y: { beginAtZero: true, max: 10 } }, plugins: { legend: { position: 'top', labels: { boxWidth: 12 } } } }
    });
  }

  // Link Architecture Doughnut (canvas id: chart-authority-network)
  const linkCtx = document.getElementById('chart-authority-network');
  if (linkCtx) {
    if (window.competitorCharts['authority-network']) window.competitorCharts['authority-network'].destroy();
    const totalInt = authorityData.reduce((s, a) => s + (a.internalLinks || 0), 0);
    const totalExt = authorityData.reduce((s, a) => s + (a.externalLinks || 0), 0);
    window.competitorCharts['authority-network'] = new Chart(linkCtx, {
      type: 'doughnut',
      data: {
        labels: ['Internal Links', 'External Links'],
        datasets: [{ data: [totalInt, totalExt], backgroundColor: ['#eab308', '#3b82f6'], borderWidth: 2, borderColor: '#fff' }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 12 } } } }
    });
  }
  console.log('   ✅ Authority charts rendered');
}

/**
 * Render Content Systems Charts (Workflow Maturity + AI vs Manual)
 */
function renderContentSystemsCharts(systemsData) {
  console.log('📊 renderContentSystemsCharts called with', systemsData?.length || 0, 'items');
  if (!window.competitorCharts) window.competitorCharts = {};
  if (typeof Chart === 'undefined') { console.error('❌ Chart.js not loaded'); return; }
  if (!systemsData || systemsData.length === 0) { console.warn('⚠️ No systems data for charts'); return; }

  // Get competitor colors
  const colors = ['#0ea5e9', '#22c55e', '#fb923c', '#a855f7', '#f472b6', '#14b8a6'];

  // Radar Chart - Workflow Maturity
  const radarCtx = document.getElementById('chart-content-systems-radar');
  if (radarCtx) {
    if (window.competitorCharts['content-systems-radar']) {
      window.competitorCharts['content-systems-radar'].destroy();
    }
    window.competitorCharts['content-systems-radar'] = new Chart(radarCtx, {
      type: 'radar',
      data: {
        labels: ['Framework', 'AI Workflow', 'Prompt Patterns', 'E-E-A-T', 'Link Equity', 'Editorial'],
        datasets: systemsData.slice(0, 4).map((sys, i) => ({
          label: sys.domain?.split('.')[0] || 'Unknown',
          data: [
            sys.frameworkMaturity || 50,
            sys.aiWorkflowRatio || 30,
            (sys.promptPatterns || 5) * 10,
            sys.eeatIntegration || 60,
            sys.linkEquityFlow || 50,
            sys.editorialConsistency || 70
          ],
          backgroundColor: colors[i] + '30',
          borderColor: colors[i],
          borderWidth: 2
        }))
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { r: { beginAtZero: true, max: 100 } },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } }
      }
    });
  }

  // Bar Chart - AI vs Manual Workflow
  const barCtx = document.getElementById('chart-content-systems-bar');
  if (barCtx) {
    if (window.competitorCharts['content-systems-bar']) {
      window.competitorCharts['content-systems-bar'].destroy();
    }
    window.competitorCharts['content-systems-bar'] = new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: systemsData.slice(0, 6).map(s => s.domain?.split('.')[0] || 'Unknown'),
        datasets: [
          { label: 'AI Workflow %', data: systemsData.slice(0, 6).map(s => s.aiWorkflowRatio || 30), backgroundColor: 'rgba(14, 165, 233, 0.7)', borderColor: '#0ea5e9', borderWidth: 1 },
          { label: 'Manual %', data: systemsData.slice(0, 6).map(s => 100 - (s.aiWorkflowRatio || 30)), backgroundColor: 'rgba(156, 163, 175, 0.5)', borderColor: '#9ca3af', borderWidth: 1 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { x: { stacked: true }, y: { stacked: true, max: 100 } },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } }
      }
    });
  }

  console.log('   ✅ Content Systems charts rendered');
}

// Export renderContentSystemsCharts to window
window.renderContentSystemsCharts = renderContentSystemsCharts;

console.log('✅ UI_Charts_Renderers.html loaded');
</script>
