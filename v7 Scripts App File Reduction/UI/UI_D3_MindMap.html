  |  UI_D3_MindMap.html - D3.js Force-Directed Mind Map Visualization                |
  |  Creates interactive "Topic Mind Map" with connecting lines                        |
  |                                                                                    |
  |  FEATURES:                                                                         |
  |    - Force-directed D3.js layout with physics simulation                           |
  |    - Interactive zoom, pan, and drag                                               |
  |    - Keyword clustering by intent with connecting lines                            |
  |    - Color-coded by difficulty/opportunity                                         |
  |    - Animated connections between related topics                                   |
  |                                                                                    |
  |  EXPORTS:                                                                          |
  |    - window.renderMindMap(containerId, keywords, options)                          |
  |    - window.showMindMapModal(keywords)                                             |
  |                                                                                    |
  |  DEPENDENCIES: D3.js v7 (loaded in UI_Scripts_App.html)                            |

<style>
  .mind-map-container {
    width: 100%;
    height: 600px;
    background: radial-gradient(circle at center, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    border-radius: 16px;
    overflow: hidden;
    position: relative;
  }
  
  .mind-map-container svg {
    width: 100%;
    height: 100%;
  }
  
  .mind-map-node {
    cursor: pointer;
    transition: all 0.3s ease;
  }
  
  .mind-map-node circle {
    stroke: rgba(255, 255, 255, 0.4);
    stroke-width: 1.5px;
  }
  
  .mind-map-node:hover circle {
    stroke: #fff;
    stroke-width: 3px;
    filter: drop-shadow(0 0 12px currentColor);
  }
  
  .mind-map-node text {
    font-size: 10px;
    fill: #e2e8f0;
    text-anchor: middle;
    pointer-events: none;
    font-weight: 500;

  }
  
  .mind-map-link {
    stroke: rgba(148, 163, 184, 0.15);
    stroke-width: 1px;
    fill: none;

  .mind-map-link.category-link {
    stroke: rgba(99, 102, 241, 0.4);
    stroke-width: 2px;
  }
  
  .mind-map-center-node circle {
    fill: url(#mindmapCenterGradient) !important;
    stroke: #fbbf24 !important;
    stroke-width: 4px;
    filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.5));
  }
  
  .mind-map-category-node circle {
    stroke-width: 2.5px !important;

  .mind-map-legend {

    bottom: 16px;

    background: rgba(15, 23, 42, 0.95);

  .mind-map-legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 5px;
  }
  
  .mind-map-legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
  }
  
  .mind-map-stats {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(15, 23, 42, 0.95);
    border-radius: 12px;
    padding: 14px 18px;
    border: 1px solid rgba(148, 163, 184, 0.2);
    backdrop-filter: blur(10px);
  }
  
  .mind-map-stat {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 5px;
  }
  
  .mind-map-stat-value {
    font-weight: 700;
    color: #f1f5f9;
  }
  
  .mind-map-tooltip {
    position: absolute;
    background: rgba(15, 23, 42, 0.98);
    border: 1px solid rgba(99, 102, 241, 0.5);
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 12px;
    color: #e2e8f0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease;
    z-index: 1000;
    max-width: 300px;
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(10px);
  }
  
  .mind-map-tooltip.visible {
    opacity: 1;
  }
  
  .mind-map-tooltip-keyword {
    font-weight: 700;

  .mind-map-tooltip-metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;

  }
  
  .mind-map-tooltip-metric {
    font-size: 11px;
  }
  
  .mind-map-tooltip-metric span {

  .mind-map-controls {
    position: absolute;

    display: flex;
    gap: 8px;
  }
  
  .mind-map-control-btn {
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid rgba(148, 163, 184, 0.2);
    color: #94a3b8;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }
  
  .mind-map-control-btn:hover {
    background: rgba(99, 102, 241, 0.2);
    color: #a5b4fc;
  }
</style>

<script>
(function() {
  'use strict';
  
  // V12.0: Enhanced Mind Map with Page-Based Clustering + Real Metrics
  // Features:
  // - Page-based clustering: Keywords grouped by source page/URL
  // - Real metrics: Uses actual KD/SV from fetcher data (not defaults)
  // - Semantic grouping: Clusters by topic similarity
  // - Visual hierarchy: Domain → Pages → Keywords
  
  // Intent categories with colors
  const INTENT_CATEGORIES = {
    'what': { color: '#6366f1', label: 'What/Definition', icon: '❓', patterns: ['what is', 'what are', 'define', 'meaning'] },
    'why': { color: '#8b5cf6', label: 'Why/Reason', icon: '🤔', patterns: ['why', 'reason', 'because', 'cause'] },
    'how': { color: '#22c55e', label: 'How/Tutorial', icon: '📝', patterns: ['how to', 'how do', 'guide', 'tutorial', 'steps'] },
    'vs': { color: '#f59e0b', label: 'Vs/Comparison', icon: '⚔️', patterns: [' vs ', ' versus ', 'compared to', 'difference between'] },
    'best': { color: '#ec4899', label: 'Best/Top', icon: '🏆', patterns: ['best ', 'top ', 'leading', 'premier'] },
    'buy': { color: '#14b8a6', label: 'Commercial', icon: '🛒', patterns: ['buy', 'price', 'cost', 'cheap', 'discount'] },
    'other': { color: '#64748b', label: 'Other', icon: '📌', patterns: [] }
  };
  
  // V12.0: Keyword type colors (from breakdown categories)
  const KEYWORD_TYPE_COLORS = {
    'primary': { color: '#dc2626', label: 'Primary', icon: '🎯' },
    'semantic': { color: '#2563eb', label: 'Semantic', icon: '🔗' },
    'longtail': { color: '#16a34a', label: 'Long-tail', icon: '📝' },
    'secondary': { color: '#7c3aed', label: 'Secondary', icon: '⚡' },
    'branded': { color: '#f59e0b', label: 'Branded', icon: '🏷️' }
  };
  
  // V12.0: Page cluster colors (for source page grouping)
  const PAGE_CLUSTER_COLORS = [
    '#6366f1', '#8b5cf6', '#ec4899', '#f43f5e', '#f97316',
    '#eab308', '#22c55e', '#14b8a6', '#0ea5e9', '#3b82f6'
  ];
  
  // Difficulty colors
  const DIFFICULTY_COLORS = {
    easy: '#22c55e',     // Green (0-30)
    medium: '#f59e0b',   // Amber (31-60)
    hard: '#ef4444'      // Red (61-100)
  };
  
  /**
   * V12.0: Extract real metrics from keyword object
   * Prioritizes actual data over defaults
   */
  function extractRealMetrics(kw) {
    const keyword = typeof kw === 'string' ? kw : (kw.keyword || kw.query || kw.term || '');
    
    // Get REAL metrics from fetcher data
    const volume = kw.volume || kw.searchVolume || kw.sv || kw.estimatedVolume || 0;
    const difficulty = kw.difficulty || kw.kd || kw.keywordDifficulty || 0;
    const traffic = kw.traffic || kw.estimatedTraffic || kw.monthlyTraffic || 0;
    const cpc = kw.cpc || kw.costPerClick || 0;
    const position = kw.position || kw.avgPosition || kw.rank || 0;
    
    // Source page/URL if available
    const sourceUrl = kw.url || kw.sourceUrl || kw.page || kw.link || '';
    const sourceTitle = kw.pageTitle || kw.title || '';
    
    // Keyword type from breakdown category
    const type = kw.type || kw.category || kw.cluster || '';
    
    return {
      keyword,
      volume,
      difficulty,
      traffic,
      cpc,
      position,
      sourceUrl,
      sourceTitle,
      type,
      intent: kw.intent || categorizeKeyword(keyword),
      _hasRealData: volume > 0 || difficulty > 0 || traffic > 0
    };
  }
  
  /**
   * V12.0: Cluster keywords by source page
   * Creates page-based grouping for hierarchical visualization
   */
  function clusterBySourcePage(keywords) {
    const pageMap = {};
    const unclustered = [];
    
    keywords.forEach(kw => {
      const metrics = extractRealMetrics(kw);
      const pageKey = metrics.sourceUrl || metrics.sourceTitle || '';
      
      if (pageKey) {
        if (!pageMap[pageKey]) {
          pageMap[pageKey] = {
            url: metrics.sourceUrl,
            title: metrics.sourceTitle || extractPageTitle(metrics.sourceUrl),
            keywords: [],
            totalVolume: 0,
            avgDifficulty: 0,
            totalTraffic: 0
          };
        }
        pageMap[pageKey].keywords.push({ ...kw, ...metrics });
        pageMap[pageKey].totalVolume += metrics.volume;
        pageMap[pageKey].totalTraffic += metrics.traffic;
      } else {
        unclustered.push({ ...kw, ...metrics });
      }
    });
    
    // Calculate averages for page clusters
    Object.values(pageMap).forEach(page => {
      if (page.keywords.length > 0) {
        page.avgDifficulty = Math.round(
          page.keywords.reduce((sum, k) => sum + k.difficulty, 0) / page.keywords.length
        );
      }
    });
    
    return { pages: Object.values(pageMap), unclustered };
  }
  
  /**
   * V12.0: Cluster keywords by type (primary/semantic/longtail/secondary)
   */
  function clusterByType(keywords) {
    const typeMap = {};
    
    keywords.forEach(kw => {
      const metrics = extractRealMetrics(kw);
      const type = metrics.type || 'other';
      
      if (!typeMap[type]) {
        typeMap[type] = {
          type,
          config: KEYWORD_TYPE_COLORS[type] || INTENT_CATEGORIES['other'],
          keywords: [],
          totalVolume: 0,
          avgDifficulty: 0
        };
      }
      typeMap[type].keywords.push({ ...kw, ...metrics });
      typeMap[type].totalVolume += metrics.volume;
    });
    
    // Calculate averages
    Object.values(typeMap).forEach(cluster => {
      if (cluster.keywords.length > 0) {
        cluster.avgDifficulty = Math.round(
          cluster.keywords.reduce((sum, k) => sum + k.difficulty, 0) / cluster.keywords.length
        );
      }
    });
    
    return Object.values(typeMap).filter(c => c.keywords.length > 0);
  }
  
  /**
   * V12.0: Extract page title from URL
   */
  function extractPageTitle(url) {
    if (!url) return 'Homepage';
    try {
      const path = new URL(url).pathname;
      if (path === '/' || path === '') return 'Homepage';
      
      // Extract meaningful title from path
      const parts = path.split('/').filter(Boolean);
      const lastPart = parts[parts.length - 1] || '';
      return lastPart
        .replace(/[-_]/g, ' ')
        .replace(/\.(html|htm|php|aspx)$/i, '')
        .split(' ')
        .map(w => w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ')
        .substring(0, 25) || 'Page';
    } catch {
      return 'Page';
    }
  }
  
  /**
   * Categorize keyword by intent
   */
  function categorizeKeyword(keyword) {
    const lower = (keyword || '').toLowerCase();
    
    for (const [intent, config] of Object.entries(INTENT_CATEGORIES)) {
      if (intent === 'other') continue;
      if (config.patterns.some(p => lower.includes(p))) {
        return intent;
      }
    }
    
    return 'other';
  }
  
  /**
   * Get difficulty color
   */
  function getDifficultyColor(difficulty) {
    const d = difficulty || 0;
    if (d === 0) return '#94a3b8';  // No data - gray
    if (d <= 30) return DIFFICULTY_COLORS.easy;
    if (d <= 60) return DIFFICULTY_COLORS.medium;
    return DIFFICULTY_COLORS.hard;
  }
  
  /**
   * V12.0: Build force-directed graph with PAGE-BASED clustering
   * Hierarchy: Center → Pages → Keywords
   */
  function buildGraphData(keywords, centerLabel, options = {}) {
    const nodes = [];
    const links = [];
    const clusterMode = options.clusterMode || 'auto'; // 'page', 'type', 'intent', 'auto'
    
    // Add center node
    const centerId = 'center';
    nodes.push({
      id: centerId,
      name: centerLabel || 'Keywords',
      type: 'center',
      size: 45,
      color: '#fbbf24'
    });
    
    // V12.0: Determine best clustering method
    const { pages, unclustered } = clusterBySourcePage(keywords);
    const typeClusters = clusterByType(keywords);
    
    // Use page-based clustering if we have page data
    const hasPageData = pages.length > 0 && pages.some(p => p.url || p.title !== 'Homepage');
    const hasTypeData = typeClusters.some(c => c.type !== 'other' && c.keywords.length > 0);
    
    let clusterMethod = clusterMode;
    if (clusterMode === 'auto') {
      clusterMethod = hasPageData ? 'page' : (hasTypeData ? 'type' : 'intent');
    }
    
    console.log(`🧠 [Mind Map V12.0] Cluster method: ${clusterMethod}, Pages: ${pages.length}, Type clusters: ${typeClusters.length}`);
    
    // V12.0: PAGE-BASED CLUSTERING
    if (clusterMethod === 'page' && hasPageData) {
      pages.slice(0, 8).forEach((page, pageIdx) => {
        const pageId = `page_${pageIdx}`;
        const pageColor = PAGE_CLUSTER_COLORS[pageIdx % PAGE_CLUSTER_COLORS.length];
        
        nodes.push({
          id: pageId,
          name: page.title || `Page ${pageIdx + 1}`,
          fullName: page.url || page.title,
          type: 'page',
          size: 22 + Math.min(10, page.keywords.length),
          color: pageColor,
          icon: '📄',
          totalVolume: page.totalVolume,
          totalTraffic: page.totalTraffic,
          keywordCount: page.keywords.length,
          avgDifficulty: page.avgDifficulty
        });
        
        links.push({ source: centerId, target: pageId, type: 'page' });
        
        // Add keywords under this page
        page.keywords.slice(0, 6).forEach((kw, kwIdx) => {
          const kwId = `kw_${pageIdx}_${kwIdx}`;
          addKeywordNode(nodes, links, kwId, pageId, kw, pageColor);
        });
      });
      
      // Add unclustered keywords as a separate group
      if (unclustered.length > 0) {
        const otherId = 'page_other';
        nodes.push({
          id: otherId,
          name: 'Other Keywords',
          type: 'page',
          size: 20,
          color: '#64748b',
          icon: '📌',
          keywordCount: unclustered.length
        });
        links.push({ source: centerId, target: otherId, type: 'page' });
        
        unclustered.slice(0, 8).forEach((kw, idx) => {
          const kwId = `kw_other_${idx}`;
          addKeywordNode(nodes, links, kwId, otherId, kw, '#64748b');
        });
      }
    }
    // V12.0: TYPE-BASED CLUSTERING (primary/semantic/longtail/secondary)
    else if (clusterMethod === 'type' && hasTypeData) {
      typeClusters.forEach((cluster, clusterIdx) => {
        const clusterId = `type_${cluster.type}`;
        const config = KEYWORD_TYPE_COLORS[cluster.type] || INTENT_CATEGORIES['other'];
        
        nodes.push({
          id: clusterId,
          name: config.label || cluster.type,
          type: 'category',
          size: 24,
          color: config.color,
          icon: config.icon,
          keywordCount: cluster.keywords.length,
          totalVolume: cluster.totalVolume,
          avgDifficulty: cluster.avgDifficulty
        });
        
        links.push({ source: centerId, target: clusterId, type: 'category' });
        
        cluster.keywords.slice(0, 8).forEach((kw, idx) => {
          const kwId = `kw_${cluster.type}_${idx}`;
          addKeywordNode(nodes, links, kwId, clusterId, kw, config.color);
        });
      });
    }
    // INTENT-BASED CLUSTERING (fallback)
    else {
      const intentMap = {};
      
      keywords.forEach((kw, i) => {
        const metrics = extractRealMetrics(kw);
        if (!metrics.keyword) return;
        
        const intent = metrics.intent;
        const config = INTENT_CATEGORIES[intent];
        
        if (!intentMap[intent]) {
          intentMap[intent] = { config, keywords: [], catId: `cat_${intent}` };
          nodes.push({
            id: intentMap[intent].catId,
            name: config.label,
            type: 'category',
            intent: intent,
            size: 25,
            color: config.color,
            icon: config.icon
          });
          links.push({ source: centerId, target: intentMap[intent].catId, type: 'category' });
        }
        intentMap[intent].keywords.push(metrics);
      });
      
      // Add keyword nodes for each intent cluster
      Object.values(intentMap).forEach(cluster => {
        cluster.keywords.slice(0, 8).forEach((kw, idx) => {
          const kwId = `kw_${cluster.catId}_${idx}`;
          addKeywordNode(nodes, links, kwId, cluster.catId, kw, cluster.config.color);
        });
      });
    }
    
    return { nodes, links };
  }
  
  /**
   * V12.0: Add a keyword node with REAL metrics
   */
  function addKeywordNode(nodes, links, kwId, parentId, kw, clusterColor) {
    const keyword = kw.keyword || kw.term || kw.query || '';
    const volume = kw.volume || kw.sv || 0;
    const difficulty = kw.difficulty || kw.kd || 0;
    const traffic = kw.traffic || 0;
    const cpc = kw.cpc || 0;
    const position = kw.position || 0;
    
    // V12.0: Size based on REAL volume (log scale for better distribution)
    const baseSize = 6;
    const volumeScale = volume > 0 ? Math.log10(Math.max(10, volume)) : 1;
    const size = Math.max(5, Math.min(18, baseSize + volumeScale * 2));
    
    // V12.0: Color based on REAL KD (gray if no data)
    const color = difficulty > 0 ? getDifficultyColor(difficulty) : (clusterColor + '99');
    
    nodes.push({
      id: kwId,
      name: keyword.length > 26 ? keyword.substring(0, 26) + '...' : keyword,
      fullName: keyword,
      type: 'keyword',
      volume: volume,
      difficulty: difficulty,
      kd: difficulty,
      sv: volume,
      traffic: traffic,
      cpc: cpc,
      position: position,
      size: size,
      color: color,
      _hasRealData: volume > 0 || difficulty > 0,
      _clusterColor: clusterColor
    });
    
    links.push({ source: parentId, target: kwId, type: 'keyword' });
  }
  
  /**
   * Render Force-Directed Mind Map visualization
   */
  window.renderMindMap = function(containerId, keywords, options = {}) {
    const container = document.getElementById(containerId);
    if (!container) {
      console.error('Mind Map container not found:', containerId);
      return;
    }
    
    // Clear existing content
    container.innerHTML = '';
    container.className = 'mind-map-container';
    
    // V12.0: Build graph with auto cluster detection
    const graphData = buildGraphData(keywords, options.centerLabel || 'Keywords', {
      clusterMode: options.clusterMode || 'auto'
    });
    
    // Get dimensions
    const width = container.clientWidth || 800;
    const height = container.clientHeight || 600;
    
    // Create SVG
    const svg = d3.select(container)
      .append('svg')
      .attr('width', width)
      .attr('height', height);
    
    // Add gradient definitions
    const defs = svg.append('defs');
    
    // Center node gradient
    const centerGradient = defs.append('radialGradient')
      .attr('id', 'mindmapCenterGradient');
    centerGradient.append('stop').attr('offset', '0%').attr('stop-color', '#fcd34d');
    centerGradient.append('stop').attr('offset', '100%').attr('stop-color', '#d97706');
    
    // Arrow marker for links
    defs.append('marker')
      .attr('id', 'arrow')
      .attr('viewBox', '0 -5 10 10')
      .attr('refX', 20)
      .attr('refY', 0)
      .attr('markerWidth', 4)
      .attr('markerHeight', 4)
      .attr('orient', 'auto')
      .append('path')
      .attr('d', 'M0,-5L10,0L0,5')
      .attr('fill', 'rgba(148, 163, 184, 0.3)');
    
    // Create zoom behavior
    const zoom = d3.zoom()
      .scaleExtent([0.3, 4])
      .on('zoom', (event) => {
        g.attr('transform', event.transform);
      });
    
    svg.call(zoom);
    
    // Main group for zooming
    const g = svg.append('g')
      .attr('transform', `translate(${width/2}, ${height/2})`);
    
    // Create force simulation
    const simulation = d3.forceSimulation(graphData.nodes)
      .force('link', d3.forceLink(graphData.links)
        .id(d => d.id)
        .distance(d => {
          if (d.type === 'category') return 150;
          return 80;
        })
        .strength(d => {
          if (d.type === 'category') return 0.8;
          return 0.5;
        })
      )
      .force('charge', d3.forceManyBody()
        .strength(d => {
          if (d.type === 'center') return -800;
          if (d.type === 'category') return -400;
          return -50;
        })
      )
      .force('collide', d3.forceCollide()
        .radius(d => d.size + 10)
        .strength(0.8)
      )
      .force('center', d3.forceCenter(0, 0))
      .force('radial', d3.forceRadial(d => {
        if (d.type === 'center') return 0;
        if (d.type === 'category') return 120;
        return 250;
      }).strength(0.3));
    
    // Draw links
    const link = g.append('g')
      .selectAll('line')
      .data(graphData.links)
      .join('line')
      .attr('class', d => `mind-map-link ${d.type === 'category' || d.type === 'page' ? 'category-link' : ''}`)
      .attr('stroke', d => {
        if (d.type === 'category' || d.type === 'page') {
          const target = graphData.nodes.find(n => n.id === d.target || n.id === d.target?.id);
          return target?.color || 'rgba(148, 163, 184, 0.4)';
        }
        return 'rgba(148, 163, 184, 0.15)';
      });
    
    // Draw nodes
    const node = g.append('g')
      .selectAll('g')
      .data(graphData.nodes)
      .join('g')
      .attr('class', d => {
        let cls = 'mind-map-node';
        if (d.type === 'center') cls += ' mind-map-center-node';
        if (d.type === 'category' || d.type === 'page') cls += ' mind-map-category-node';
        return cls;
      })
      .call(d3.drag()
        .on('start', dragstarted)
        .on('drag', dragged)
        .on('end', dragended)
      );
    
    // Node circles
    node.append('circle')
      .attr('r', d => d.size)
      .attr('fill', d => {
        if (d.type === 'center') return 'url(#mindmapCenterGradient)';
        return d.color;
      })
      .style('opacity', d => d.type === 'keyword' ? 0.9 : 1);
    
    // Node labels
    node.append('text')
      .attr('dy', d => d.type === 'keyword' ? (d.size + 12) : 0)
      .attr('text-anchor', 'middle')
      .text(d => d.name)
      .style('font-size', d => {
        if (d.type === 'center') return '14px';

  // Structure: 6 Pillars × 5 Clusters × 6+ Keywords = 180+ nodes

  const PILLAR_CONFIG = {
    centerRadius: 45,
    pillarRadius: 30,
    clusterRadius: 18,
    keywordRadius: 8,
    centerToPillarDistance: 140,
    pillarToClusterDistance: 70,
    clusterToKeywordDistance: 35,
    transitionDuration: 800,
    nodeStaggerDelay: 15,
    maxKeywordsPerCluster: 3,
    pillarColors: ['#6366f1', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b', '#ef4444']
  };

  function initPillarMindMap(container, data) {
    container.innerHTML = '';
    
    const width = container.clientWidth || 600;
    const height = container.clientHeight || 500;
    
    let pillars = extractPillarsData(data);
    const centerLabel = data?.contentPillarMindMap?.center || 
                        data?.coreTopic || 
                        data?.dashboardCharts?.contentPillarMindMap?.center ||
                        'Content Strategy';
    
    if (!pillars || pillars.length === 0) {
      pillars = window.validatePillarDepth?.([], centerLabel) || generatePlaceholderPillarsData();
    }
    
    console.log(`📊 Pillar mind map: ${pillars.length} pillars, center: "${centerLabel}"`);
    
    const hierarchyData = buildPillarHierarchyData(pillars, centerLabel);
    console.log(`📍 Nodes: ${hierarchyData.nodes.length}, Links: ${hierarchyData.links.length}`);
    
    const svg = d3.select(container)
      .append('svg')
      .attr('class', 'pillar-mindmap-svg')
      .attr('width', width)
      .attr('height', height)
      .attr('viewBox', `0 0 ${width} ${height}`);
    
    addPillarGradientDefs(svg);
    
    const simulation = createPillarForceSimulation(hierarchyData, width, height);
    renderPillarMindMapNodes(svg, hierarchyData, simulation);
    addPillarZoomBehavior(svg, width, height);
    addPillarNodeInteractions(svg, hierarchyData);
    addPillarMindMapLegend(container, pillars);
    addPillarMindMapControls(container, svg);
    
    window._currentPillarMindMap = { svg, simulation, data: hierarchyData };
    console.log('✅ Pillar mind map created successfully');
  }

  function extractPillarsData(data) {
    // V9.4 FIX: Check more possible data paths for pillar data
    if (Array.isArray(data)) return data;
    
    // Direct pillars property (from normalizePillarData)
    if (data?.pillars?.length) return data.pillars;
    
    // contentPillarMindMap format
    if (data?.contentPillarMindMap?.pillars?.length) return data.contentPillarMindMap.pillars;
    if (data?.dashboardCharts?.contentPillarMindMap?.pillars?.length) return data.dashboardCharts.contentPillarMindMap.pillars;
    
    // contentPillars array directly
    if (data?.contentPillars?.length) return data.contentPillars;
    if (data?.dashboardCharts?.contentPillars?.length) return data.dashboardCharts.contentPillars;
    
    // strategicContentPillarsChart
    if (data?.dashboardCharts?.strategicContentPillarsChart?.length) {
      return data.dashboardCharts.strategicContentPillarsChart.map((item, idx) => ({
        name: item.label || item.name || `Pillar ${idx + 1}`,
        clusters: [],
        moatScore: item.value || 7,
        competitiveGap: 6
      }));
    }
    
    // Last resort: parse from report text
    if (data?.report || data?.analysis_text) {
      return window.parsePillarStructureFromContent?.(data.report || data.analysis_text) || [];
    }
    return [];
  }

  /**
   * TASK 32: Build pillar hierarchy data structure
   */
  function buildPillarHierarchyData(pillars, centerLabel) {
    const nodes = [];
    const links = [];
    
    nodes.push({
      id: 'center', label: centerLabel, type: 'center',
      radius: PILLAR_CONFIG.centerRadius, color: '#6366f1', depth: 0
    });
    
    pillars.forEach((pillar, pIdx) => {
      const pillarId = `pillar-${pIdx + 1}`;
      const pillarColor = PILLAR_CONFIG.pillarColors[pIdx % 6];
      
      nodes.push({
        id: pillarId, label: pillar.name || `Pillar ${pIdx + 1}`,
        type: 'pillar', radius: PILLAR_CONFIG.pillarRadius, color: pillarColor,
        depth: 1, pillarIndex: pIdx, moatScore: pillar.moatScore || 7,
        competitiveGap: pillar.competitiveGap || 6,
        funnelCoverage: pillar.funnelCoverage || 'partial',
        clusterCount: pillar.clusters?.length || 0
      });
      
      links.push({ source: 'center', target: pillarId, strength: 0.8, type: 'center-pillar' });
      
      (pillar.clusters || []).forEach((cluster, cIdx) => {
        const clusterId = `cluster-${pIdx + 1}-${cIdx + 1}`;
        const clusterColor = adjustPillarColorOpacity(pillarColor, 0.7);
        
        nodes.push({
          id: clusterId, label: cluster.name || `Cluster ${cIdx + 1}`,
          type: 'cluster', radius: PILLAR_CONFIG.clusterRadius, color: clusterColor,
          depth: 2, pillarIndex: pIdx, clusterIndex: cIdx,
          funnelStage: cluster.funnelStage || cluster.intent || 'awareness',
          intent: cluster.intent || 'informational', priority: cluster.priority || 5,
          keywordCount: cluster.keywords?.length || 0, parentPillar: pillarId
        });
        
        links.push({ source: pillarId, target: clusterId, strength: 0.5, type: 'pillar-cluster' });
        
        (cluster.keywords || []).slice(0, PILLAR_CONFIG.maxKeywordsPerCluster).forEach((kw, kIdx) => {
          const kwId = `kw-${pIdx + 1}-${cIdx + 1}-${kIdx + 1}`;
          const kwText = typeof kw === 'string' ? kw : (kw.keyword || kw.kw || `KW ${kIdx + 1}`);
          
          nodes.push({
            id: kwId, label: kwText, type: 'keyword',
            radius: PILLAR_CONFIG.keywordRadius,
            color: adjustPillarColorOpacity(pillarColor, 0.4),
            depth: 3, pillarIndex: pIdx, clusterIndex: cIdx,
            volume: kw.volume || kw.vol || 'N/A', difficulty: kw.kd || kw.difficulty || 'M',
            source: kw.source || 'analysis', gap: kw.gap || 'opportunity', parentCluster: clusterId
          });
          
          links.push({ source: clusterId, target: kwId, strength: 0.3, type: 'cluster-keyword' });
        });
      });
    });
    
    return { nodes, links };
  }

  /**
   * TASK 33: Create force simulation
   */
  function createPillarForceSimulation(data, width, height) {
    const centerNode = data.nodes.find(n => n.type === 'center');
    if (centerNode) { centerNode.fx = width / 2; centerNode.fy = height / 2; }
    
    return d3.forceSimulation(data.nodes)
      .force('link', d3.forceLink(data.links)
        .id(d => d.id)
        .distance(d => {
          if (d.type === 'center-pillar') return PILLAR_CONFIG.centerToPillarDistance;
          if (d.type === 'pillar-cluster') return PILLAR_CONFIG.pillarToClusterDistance;
          return PILLAR_CONFIG.clusterToKeywordDistance;
        })
        .strength(d => d.strength)
      )
      .force('charge', d3.forceManyBody().strength(d => {
        if (d.type === 'center') return -400;
        if (d.type === 'pillar') return -200;
        if (d.type === 'cluster') return -80;
        return -20;
      }))
      .force('center', d3.forceCenter(width / 2, height / 2))
      .force('collision', d3.forceCollide().radius(d => d.radius + 8).strength(0.8))
      .force('radial', d3.forceRadial(d => {
        if (d.type === 'pillar') return PILLAR_CONFIG.centerToPillarDistance;
        if (d.type === 'cluster') return PILLAR_CONFIG.centerToPillarDistance + PILLAR_CONFIG.pillarToClusterDistance;
        if (d.type === 'keyword') return PILLAR_CONFIG.centerToPillarDistance + PILLAR_CONFIG.pillarToClusterDistance + PILLAR_CONFIG.clusterToKeywordDistance;
        return 0;
      }, width / 2, height / 2).strength(d => d.type === 'center' ? 0 : 0.3))
      .alphaDecay(0.02).velocityDecay(0.4);
  }

  /**
   * TASK 34: Render nodes with animations
   */
  function renderPillarMindMapNodes(svg, data, simulation) {
    const g = svg.append('g').attr('class', 'pillar-mindmap-main-group');
    
    const link = g.append('g').attr('class', 'pillar-links')
      .selectAll('line').data(data.links).enter().append('line')
      .attr('stroke', d => d.type === 'center-pillar' ? 'url(#pillar-link-gradient)' : '#94a3b8')
      .attr('stroke-opacity', d => d.type === 'center-pillar' ? 0.6 : (d.type === 'pillar-cluster' ? 0.4 : 0.2))
      .attr('stroke-width', d => d.type === 'center-pillar' ? 2.5 : (d.type === 'pillar-cluster' ? 1.5 : 1))
      .attr('stroke-dasharray', d => d.type === 'cluster-keyword' ? '2,2' : null);
    
    const node = g.append('g').attr('class', 'pillar-nodes')
      .selectAll('g').data(data.nodes).enter().append('g')
      .attr('class', d => `pillar-node pillar-node-${d.type}`)
      .attr('data-id', d => d.id).attr('data-pillar', d => d.pillarIndex ?? -1)
      .call(d3.drag()
        .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
        .on('end', (e, d) => { if (!e.active) simulation.alphaTarget(0); if (d.type !== 'center') { d.fx = null; d.fy = null; } })
      );
    
    node.append('circle').attr('r', 0)
      .attr('fill', d => d.type === 'center' ? 'url(#pillar-center-gradient)' : d.color)
      .attr('stroke', d => d3.rgb(d.color).darker(0.3))
      .attr('stroke-width', d => d.type === 'center' ? 3 : (d.type === 'pillar' ? 2 : 1))
      .transition().duration(PILLAR_CONFIG.transitionDuration)
      .delay((d, i) => i * PILLAR_CONFIG.nodeStaggerDelay)
      .attr('r', d => d.radius).ease(d3.easeElasticOut.amplitude(1).period(0.5));
    
    node.append('text')
      .attr('dy', d => d.type === 'keyword' ? d.radius + 12 : (d.type === 'cluster' ? d.radius + 14 : 4))
      .attr('text-anchor', 'middle')
      .attr('font-size', d => d.type === 'center' ? '12px' : (d.type === 'pillar' ? '10px' : (d.type === 'cluster' ? '8px' : '7px')))
      .attr('fill', d => d.type === 'center' ? '#ffffff' : 'var(--text-primary, #1f2937)')
      .attr('font-weight', d => (d.type === 'center' || d.type === 'pillar') ? 600 : 400)
      .attr('pointer-events', 'none')
      .text(d => truncatePillarLabel(d.label, d.type))
      .attr('opacity', 0).transition().duration(PILLAR_CONFIG.transitionDuration / 2)
      .delay((d, i) => PILLAR_CONFIG.transitionDuration / 2 + i * PILLAR_CONFIG.nodeStaggerDelay).attr('opacity', 1);
    
    node.filter(d => d.type === 'cluster' && d.funnelStage)
      .append('text').attr('class', 'pillar-funnel-badge')
      .attr('dy', d => -(d.radius + 4)).attr('text-anchor', 'middle').attr('font-size', '8px')
      .text(d => getPillarFunnelEmoji(d.funnelStage))
      .attr('opacity', 0).transition().delay((d, i) => PILLAR_CONFIG.transitionDuration + i * 10).attr('opacity', 1);
    
    simulation.on('tick', () => {
      link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
      node.attr('transform', d => `translate(${d.x},${d.y})`);
    });
    
    svg._pillarLink = link; svg._pillarNode = node;
  }

  /**
   * TASK 35: Zoom and pan
   */
  function addPillarZoomBehavior(svg, width, height) {
    const zoom = d3.zoom().scaleExtent([0.3, 3])
      .on('zoom', e => svg.select('.pillar-mindmap-main-group').attr('transform', e.transform));
    svg.call(zoom); svg._pillarZoom = zoom;
    
    window.zoomPillarMindMap = factor => svg.transition().duration(300).call(zoom.scaleBy, factor);
    window.resetPillarMindMapZoom = () => svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
    window.fitPillarMindMapToView = () => {
      const bounds = svg.select('.pillar-mindmap-main-group').node().getBBox();
      const scale = 0.9 / Math.max(bounds.width / width, bounds.height / height);
      const translate = [width / 2 - scale * (bounds.x + bounds.width / 2), height / 2 - scale * (bounds.y + bounds.height / 2)];
      svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale));
    };
  }

  /**
   * TASK 36: Node interactions
   */
  function addPillarNodeInteractions(svg, data) {
    const nodes = svg.selectAll('.pillar-node');
    
    nodes.on('click', function(event, d) {
      event.stopPropagation();
      const connectedIds = new Set([d.id]);
      data.links.forEach(link => {
        const sId = typeof link.source === 'object' ? link.source.id : link.source;
        const tId = typeof link.target === 'object' ? link.target.id : link.target;
        if (sId === d.id) connectedIds.add(tId);
        if (tId === d.id) connectedIds.add(sId);
      });
      if (d.type === 'pillar') {
        data.nodes.forEach(n => { if (n.pillarIndex === d.pillarIndex) connectedIds.add(n.id); });
      }
      nodes.classed('dimmed', n => !connectedIds.has(n.id)).classed('highlighted', n => connectedIds.has(n.id));
      svg.selectAll('.pillar-links line').classed('dimmed', l => {
        const sId = typeof l.source === 'object' ? l.source.id : l.source;
        const tId = typeof l.target === 'object' ? l.target.id : l.target;
        return !connectedIds.has(sId) || !connectedIds.has(tId);
      });
      showPillarNodeTooltip(event, d);
    })
    .on('mouseover', function(e, d) { d3.select(this).select('circle').transition().duration(200).attr('r', d.radius * 1.15); d3.select(this).raise(); })
    .on('mouseout', function(e, d) { d3.select(this).select('circle').transition().duration(200).attr('r', d.radius); });
    
    svg.on('click', function(event) {
      if (event.target.tagName === 'svg' || event.target.classList?.contains('pillar-mindmap-main-group')) {
        nodes.classed('dimmed', false).classed('highlighted', false);
        svg.selectAll('.pillar-links line').classed('dimmed', false);
        hidePillarNodeTooltip();
      }
    });
  }

  /**
   * TASK 41: Export PNG
   */
  window.exportPillarMindMapAsPNG = function() {
    const svg = window._currentPillarMindMap?.svg;
    if (!svg) { console.error('❌ No pillar mind map to export'); return; }
    const svgNode = svg.node();
    let svgString = new XMLSerializer().serializeToString(svgNode);
    if (!svgString.includes('xmlns')) svgString = svgString.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    const width = svgNode.getAttribute('width') || 800;
    const height = svgNode.getAttribute('height') || 600;
    canvas.width = width * 2; canvas.height = height * 2;
    ctx.scale(2, 2);
    img.onload = function() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      const link = document.createElement('a');
      link.download = `pillar-mindmap-${new Date().toISOString().split('T')[0]}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    };
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));
  };

  // Helper functions
  function adjustPillarColorOpacity(hex, opacity) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${opacity})`;
  }
  
  function truncatePillarLabel(label, type) {
    if (!label) return '';
    const max = { center: 20, pillar: 18, cluster: 15, keyword: 12, legend: 20 }[type] || 15;
    return label.length > max ? label.substring(0, max - 2) + '…' : label;
  }
  
  function getPillarFunnelEmoji(stage) {
    return { awareness: '🌟', consideration: '🔍', decision: '💰', retention: '🔄', advocacy: '📣',
             informational: '🌟', comparative: '🔍', transactional: '💰', educational: '🔄', community: '📣' }[stage?.toLowerCase()] || '🎯';
  }
  
  function capitalizePillar(str) { return str ? str.charAt(0).toUpperCase() + str.slice(1) : ''; }
  
  function addPillarGradientDefs(svg) {
    const defs = svg.append('defs');
    const cg = defs.append('radialGradient').attr('id', 'pillar-center-gradient').attr('cx', '30%').attr('cy', '30%');
    cg.append('stop').attr('offset', '0%').attr('stop-color', '#818cf8');
    cg.append('stop').attr('offset', '100%').attr('stop-color', '#4f46e5');
    const lg = defs.append('linearGradient').attr('id', 'pillar-link-gradient').attr('gradientUnits', 'userSpaceOnUse');
    lg.append('stop').attr('offset', '0%').attr('stop-color', '#6366f1').attr('stop-opacity', 0.6);
    lg.append('stop').attr('offset', '100%').attr('stop-color', '#8b5cf6').attr('stop-opacity', 0.3);
  }
  
  function generatePlaceholderPillarsData() {
    const pillars = [];
    const stages = ['awareness', 'consideration', 'decision', 'retention', 'advocacy'];
    for (let i = 0; i < 6; i++) {
      const clusters = stages.map((s, j) => ({
        name: `${capitalizePillar(s)} Cluster`, funnelStage: s, intent: s, priority: 10 - j,
        keywords: Array(6).fill(null).map((_, k) => ({ keyword: `Keyword ${k + 1}`, volume: '1K', kd: 'M' }))
      }));
      pillars.push({ name: `Content Pillar ${i + 1}`, moatScore: 8 - i * 0.3, competitiveGap: 7, funnelCoverage: 'complete', clusters });
    }
    return pillars;
  }

  // ════════════════════════════════════════════════════════════════════════════════
  // V7.22 PHASE 5 TASK 48: MIND MAP TESTING UTILITIES
  // ════════════════════════════════════════════════════════════════════════════════

  /**
   * Test mind map with 6×5×6 structure validation
   * @param {string} containerId - Container ID to render test map
   * @returns {Object} Test results with validation status
   */
  window.testPillarMindMap = function(containerId = 'pillar-mindmap-container') {
    console.group('🧪 Pillar Mind Map Test');
    
    const results = {
      passed: true,
      renderTime: 0,
      structure: { pillars: 0, clusters: 0, keywords: 0 },
      acceptanceCriteria: {
        has6Pillars: false,
        has5ClustersPerPillar: false,
        has6KeywordsPerCluster: false,
        rendersUnder500ms: false,
        hasZoomPan: false,
        hasTooltips: false
      }
    };
    
    // Generate test data with 6×5×6 structure
    const testData = window.generatePillarMindMapTestData?.() || generatePlaceholderPillarsData();
    
    // Validate structure
    results.structure.pillars = testData.length;
    results.acceptanceCriteria.has6Pillars = testData.length >= 6;
    
    let totalClusters = 0;
    let totalKeywords = 0;
    let allClustersHave5 = true;
    let allClustersHave6Keywords = true;
    
    testData.forEach(pillar => {
      const clusterCount = pillar.clusters?.length || 0;
      totalClusters += clusterCount;
      if (clusterCount < 5) allClustersHave5 = false;
      
      (pillar.clusters || []).forEach(cluster => {
        const kwCount = cluster.keywords?.length || 0;
        totalKeywords += kwCount;
        if (kwCount < 6) allClustersHave6Keywords = false;
      });
    });
    
    results.structure.clusters = totalClusters;
    results.structure.keywords = totalKeywords;
    results.acceptanceCriteria.has5ClustersPerPillar = allClustersHave5;
    results.acceptanceCriteria.has6KeywordsPerCluster = allClustersHave6Keywords;
    
    // Render timing test
    const container = document.getElementById(containerId);
    if (container) {
      const startTime = performance.now();
      
      try {
        window.createInteractivePillarMindMap(containerId, {
          pillars: testData,
          coreTopicName: 'Test Mind Map'
        });
        
        results.renderTime = performance.now() - startTime;
        results.acceptanceCriteria.rendersUnder500ms = results.renderTime < 500;
        
        // Check for zoom behavior
        const svg = container.querySelector('svg');
        results.acceptanceCriteria.hasZoomPan = !!svg?.getAttribute('cursor');
        
        // Check for tooltip capability
        results.acceptanceCriteria.hasTooltips = typeof window.showPillarNodeTooltip === 'function';
        
      } catch (e) {
        console.error('Mind map render error:', e);
        results.passed = false;
      }
    } else {
      console.warn('Container not found:', containerId);
      results.passed = false;
    }
    
    // Overall pass/fail
    results.passed = Object.values(results.acceptanceCriteria).every(v => v === true);
    
    // Log results
    console.log('📊 Structure Validation:');
    console.log(`  Pillars: ${results.structure.pillars} (need 6) ${results.acceptanceCriteria.has6Pillars ? '✅' : '❌'}`);
    console.log(`  Clusters: ${results.structure.clusters} (need 30) ${results.acceptanceCriteria.has5ClustersPerPillar ? '✅' : '❌'}`);
    console.log(`  Keywords: ${results.structure.keywords} (need 180) ${results.acceptanceCriteria.has6KeywordsPerCluster ? '✅' : '❌'}`);
    console.log(`  Render Time: ${results.renderTime.toFixed(1)}ms ${results.acceptanceCriteria.rendersUnder500ms ? '✅' : '❌'}`);
    
    console.log('📋 Acceptance Criteria:');
    Object.entries(results.acceptanceCriteria).forEach(([key, value]) => {
      console.log(`  ${value ? '✅' : '❌'} ${key}`);
    });
    
    console.log(results.passed ? '✅ All tests passed!' : '❌ Some tests failed');
    console.groupEnd();
    
    return results;
  };

  /**
   * Generate test data for 6×5×6 pillar structure
   * @returns {Array} Array of 6 pillars with 5 clusters each with 6 keywords
   */
  window.generatePillarMindMapTestData = function() {
    const pillarNames = [
      'Core Product Mastery', 'Customer Success Stories', 'Industry Thought Leadership',
      'Technical Deep Dives', 'Competitive Intelligence', 'Market Expansion'
    ];
    const stages = ['awareness', 'consideration', 'decision', 'retention', 'advocacy'];
    const intents = ['informational', 'navigational', 'transactional', 'commercial', 'educational'];
    
    return pillarNames.map((name, pIdx) => ({
      name,
      moatScore: 7 + Math.random() * 2,
      competitiveGap: 6 + Math.random() * 3,
      funnelCoverage: 'complete',
      clusters: stages.map((stage, cIdx) => ({
        name: `${name.split(' ')[0]} ${capitalizePillar(stage)} Hub`,
        funnelStage: stage,
        intent: intents[cIdx],
        priority: 10 - cIdx,
        keywords: Array(6).fill(null).map((_, kIdx) => ({
          keyword: `${name.split(' ')[0].toLowerCase()}-${stage}-kw-${kIdx + 1}`,
          volume: `${Math.floor(Math.random() * 10) + 1}K`,
          kd: ['L', 'M', 'H'][Math.floor(Math.random() * 3)],
          intent: intents[kIdx % 5]
        }))
      }))
    }));
  };

  /**

   */
  window.quickTestMindMap = function() {
    // Create test container if needed
    let container = document.getElementById('test-mindmap-container');
    if (!container) {
      container = document.createElement('div');
      container.id = 'test-mindmap-container';
      container.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:800px;height:600px;background:#fff;z-index:10000;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.3);';
      document.body.appendChild(container);
      
      // Add close button
      const closeBtn = document.createElement('button');
      closeBtn.textContent = '✕ Close Test';
      closeBtn.style.cssText = 'position:absolute;top:10px;right:10px;z-index:10001;padding:8px 16px;cursor:pointer;';
      closeBtn.onclick = () => container.remove();
      container.appendChild(closeBtn);
    }
    
    return window.testPillarMindMap('test-mindmap-container');
  };

  console.log('🗺️ V7.21 Elite Pillar Mind Map functions loaded');
})();
