<style>
  /* ═══════════════════════════════════════════════════════════════════════ */

  /* ═══════════════════════════════════════════════════════════════════════ */

  /* Source Code Section */
  .proof-source-section {

  .proof-source-header {

  /* Parsing Logic Breadcrumb */
  .proof-parsing-logic {

  /* AI/RAG View Section */

  }
  
  .proof-rag-header {

  /* Confidence Meter */
  .proof-confidence-meter {

  /* D3 Mind Map Integration Tooltip */
  .mindmap-proof-tooltip {

    z-index: 9999;

  .mindmap-proof-tooltip.visible {

</style>

<script>
  // ═══════════════════════════════════════════════════════════════════════════
  // ZERO-TRUST PROOF INJECTION ENGINE
  // ═══════════════════════════════════════════════════════════════════════════
  
  /**
   * Initialize proof icons across all tabs
   * Call this after rendering competitor data
   */
  function ZT_initializeProofIcons() {
    console.log('[ZeroTrust] Initializing proof icons across all tabs...');
    
    // Create side panel if not exists
    ZT_createSidePanel();
    
    // Scan for injectable metrics
    ZT_injectProofIcons();
    
    console.log('[ZeroTrust] Proof icon initialization complete');
  }
  
  /**
   * Create the Audit Trail side panel
   */
  function ZT_createSidePanel() {
    // Create backdrop
    let backdrop = document.getElementById('zt-sidepanel-backdrop');
    if (!backdrop) {
      backdrop = document.createElement('div');
      backdrop.id = 'zt-sidepanel-backdrop';
      backdrop.className = 'audit-trail-sidepanel-backdrop';
      backdrop.onclick = ZT_closeSidePanel;
      document.body.appendChild(backdrop);
    }
    
    // Create side panel
    let panel = document.getElementById('zt-sidepanel');
    if (!panel) {
      panel = document.createElement('div');
      panel.id = 'zt-sidepanel';
      panel.className = 'audit-trail-sidepanel';
      panel.innerHTML = `
        <div class="sidepanel-header">
          <h3>
            <span>🛡️</span>
            <span>Zero-Trust Audit Trail</span>
          </h3>
          <button class="sidepanel-close" onclick="ZT_closeSidePanel()">✕</button>
        </div>
        <div class="sidepanel-body" id="zt-sidepanel-body">
          <!-- Dynamic content injected here -->
        </div>
      `;
      document.body.appendChild(panel);
    }
  }
  
  /**
   * Open the side panel with proof content
   * @param {string} metricId - The metric ID to show proof for
   * @param {Object} competitor - The competitor object with evidenceMap
   * 
   * v24.0: Falls back to ORACLE_STATE if competitor is empty
   */
  function ZT_openSidePanel(metricId, competitor) {
    console.log('[ZeroTrust] Opening side panel for:', metricId);
    
    const backdrop = document.getElementById('zt-sidepanel-backdrop');
    const panel = document.getElementById('zt-sidepanel');
    const body = document.getElementById('zt-sidepanel-body');
    
    if (!panel || !body) {
      console.error('[ZeroTrust] Side panel not found, creating...');
      ZT_createSidePanel();
      return ZT_openSidePanel(metricId, competitor);
    }
    
    // v24.0: Ensure we have a competitor object
    let activeCompetitor = competitor;
    if (!activeCompetitor || !activeCompetitor.evidenceMap) {
      // Try to find competitor from ORACLE_STATE
      activeCompetitor = ZT_getCompetitorByDomain(competitor?.domain || '');
      console.log('[ZeroTrust] Fetched competitor from state:', activeCompetitor?.domain);
    }
    
    // If still no evidence, try to fetch it
    if (!activeCompetitor?.evidenceMap) {
      console.log('[ZeroTrust] No evidenceMap, showing loading state');
      body.innerHTML = ZT_renderLoadingState(metricId);
      backdrop?.classList.add('active');
      panel.classList.add('active');
      
      // Attempt to load evidence asynchronously
      ZT_loadEvidenceAsync(metricId, activeCompetitor?.domain, body);
      return;
    }
    
    // Get proof data
    const proof = ZT_getProof(activeCompetitor, metricId);
    
    // Render proof content
    body.innerHTML = ZT_renderProofContent(metricId, proof, activeCompetitor);
    
    // Show panel
    backdrop?.classList.add('active');
    panel.classList.add('active');
  }
  
  /**
   * Render loading state while fetching evidence
   */
  function ZT_renderLoadingState(metricId) {
    return `
      <div style="text-align: center; padding: 60px 20px;">
        <div style="width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #f59e0b; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
        <h4 style="margin: 0 0 10px;">Loading Evidence...</h4>
        <p style="opacity: 0.7; font-size: 13px;">Fetching proof for: ${metricId}</p>
      </div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    `;
  }
  
  /**
   * Load evidence asynchronously from backend
   */
  function ZT_loadEvidenceAsync(metricId, domain, bodyElement) {
    const jobToken = window.ORACLE_STATE?.jobToken;
    
    if (!jobToken) {
      bodyElement.innerHTML = ZT_renderNoProofState(metricId, 'No job token available');
      return;
    }
    
    // Call backend to get evidence snippet
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success && result.evidence) {
            // Store in ORACLE_STATE for future use
            if (domain && window.ORACLE_STATE?.competitors?.[domain]) {
              window.ORACLE_STATE.competitors[domain].evidenceMap = 
                window.ORACLE_STATE.competitors[domain].evidenceMap || {};
              window.ORACLE_STATE.competitors[domain].evidenceMap[metricId] = result.evidence;
            }
            
            const proof = { found: true, ...result.evidence };
            const comp = ZT_getCompetitorByDomain(domain);
            bodyElement.innerHTML = ZT_renderProofContent(metricId, proof, comp);
          } else {
            bodyElement.innerHTML = ZT_renderNoProofState(metricId, result.message || 'Evidence not found');
          }
        })
        .withFailureHandler(function(error) {
          bodyElement.innerHTML = ZT_renderNoProofState(metricId, error.message || 'Failed to load evidence');
        })
        .getEvidenceSnippet(jobToken, domain, metricId);
    } else {
      bodyElement.innerHTML = ZT_renderNoProofState(metricId, 'Script bridge not available');
    }
  }
  
  /**
   * Render no proof available state
   */
  function ZT_renderNoProofState(metricId, message) {
    return `
      <div style="text-align: center; padding: 60px 20px;">
        <div style="font-size: 48px; margin-bottom: 20px;">🔍</div>
        <h4 style="margin: 0 0 10px;">No Proof Available</h4>
        <p style="opacity: 0.7; font-size: 13px;">${message}</p>
        <div style="margin-top: 16px; font-size: 11px; opacity: 0.5;">Metric: ${metricId}</div>
      </div>
    `;
  }
  
  /**
   * Close the side panel
   */
  function ZT_closeSidePanel() {
    const backdrop = document.getElementById('zt-sidepanel-backdrop');
    const panel = document.getElementById('zt-sidepanel');
    
    backdrop?.classList.remove('active');
    panel?.classList.remove('active');
  }
  
  /**
   * Get proof data for a metric
   */
  function ZT_getProof(competitor, metricId) {
    if (!competitor?.evidenceMap) {
      return { found: false, message: 'No evidence map available' };
    }
    
    const evidence = competitor.evidenceMap[metricId];
    if (!evidence) {
      return { found: false, message: `No proof for: ${metricId}` };
    }
    
    return { found: true, ...evidence };
  }
  
  /**
   * Render proof content for the side panel
   */
  function ZT_renderProofContent(metricId, proof, competitor) {
    if (!proof.found) {
      return `
        <div style="text-align: center; padding: 60px 20px;">
          <div style="font-size: 48px; margin-bottom: 20px;">🔍</div>
          <h4 style="margin: 0 0 10px;">No Proof Available</h4>
          <p style="opacity: 0.7; font-size: 13px;">${proof.message}</p>
        </div>
      `;
    }
    
    const confidenceColor = proof.confidence >= 90 ? '#22c55e' : 
                            proof.confidence >= 70 ? '#84cc16' :
                            proof.confidence >= 50 ? '#f59e0b' : '#ef4444';
    
    // Parse parsing logic steps
    const parsingSteps = (proof.source || 'Unknown').split(' → ');
    
    // Check if this is a content metric (show RAG view)
    const isContentMetric = metricId.startsWith('content.') || metricId === 'aeo.ragCleanView';
    
    return `
      <!-- Metric Value -->
      <div style="background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(22, 163, 74, 0.05)); border-radius: 12px; padding: 18px; margin-bottom: 20px;">
        <div style="font-size: 12px; opacity: 0.7; margin-bottom: 8px;">${metricId}</div>
        <div style="font-size: 24px; font-weight: 800; color: #22c55e;">
          ${typeof proof.value === 'object' ? JSON.stringify(proof.value).substring(0, 50) : proof.value}
        </div>
        <div style="font-size: 11px; opacity: 0.6; margin-top: 6px;">
          Competitor: ${competitor?.domain || 'Unknown'}
        </div>
      </div>
      
      <!-- Source Code View -->
      <div class="proof-source-section">
        <div class="proof-source-header">
          <div class="proof-source-title">
            <span>📄</span>
            Raw HTML Source
          </div>
          <button onclick="ZT_copyToClipboard(this, 'proof-raw-code')" style="background: rgba(255,255,255,0.1); border: none; color: white; padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer;">
            📋 Copy
          </button>
        </div>
        <div class="proof-source-code" id="proof-raw-code">${ZT_escapeHtml(proof.raw?.snippet || 'No raw snippet available')}</div>
      </div>
      
      <!-- Parsing Logic Breadcrumb -->
      <div class="proof-parsing-logic">
        <h5>🔗 Parsing Logic Breadcrumb</h5>
        <div class="proof-parsing-steps">
          ${parsingSteps.map((step, i) => `
            ${i > 0 ? '<span class="proof-step-arrow">→</span>' : ''}
            <span class="proof-step">${step}</span>
          `).join('')}
        </div>
      </div>
      
      ${isContentMetric ? `
      <!-- AI/RAG View -->
      <div class="proof-rag-section">
        <div class="proof-rag-header">
          <span style="font-size: 20px;">🤖</span>
          <h5>AI/RAG Clean View</h5>
          <span style="font-size: 10px; background: rgba(139, 92, 246, 0.3); padding: 2px 8px; border-radius: 10px;">LLM Readable</span>
        </div>
        <div class="proof-rag-content">${ZT_generateRAGView(competitor)}</div>
      </div>
      ` : ''}
      
      <!-- Confidence Meter -->
      <div class="proof-confidence-meter">
        <div class="confidence-header">
          <span class="confidence-label">Proof Confidence</span>
          <span class="confidence-value" style="color: ${confidenceColor}">${proof.confidence}%</span>
        </div>
        <div class="confidence-bar">
          <div class="confidence-bar-fill" style="width: ${proof.confidence}%; background: ${confidenceColor};"></div>
        </div>
        <div style="margin-top: 10px; font-size: 11px; opacity: 0.7;">
          ${proof.confidence >= 90 ? '✅ Verified - Direct extraction from source' :
            proof.confidence >= 70 ? '👍 High - Reliable extraction method' :
            proof.confidence >= 50 ? '⚠️ Medium - Some estimation involved' :
            '❌ Low - Significant estimation or fallback'}
        </div>
      </div>
      
      <!-- Timestamp -->
      <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 11px; opacity: 0.6; display: flex; justify-content: space-between;">
        <span>Captured: ${new Date(proof.timestamp).toLocaleString()}</span>
        <span>ZeroTrust v1.0</span>
      </div>
    `;
  }
  
  /**
   * Generate RAG-friendly clean view of content
   */
  function ZT_generateRAGView(competitor) {
    const website = competitor?.synthesized?.website || {};
    
    let markdown = '';
    if (website.title) markdown += `# ${website.title}\n\n`;
    if (website.h1) markdown += `## ${website.h1}\n\n`;
    if (website.description) markdown += `${website.description}\n\n`;
    
    const h2s = Array.isArray(website.h2) ? website.h2 : [];
    h2s.slice(0, 5).forEach(h2 => {
      markdown += `### ${h2}\n\n`;
    });
    
    return markdown || 'No structured content available for RAG view';
  }
  
  /**
   * Inject proof icons into existing metrics
   */
  function ZT_injectProofIcons() {
    // Find all data-metric elements
    const metricElements = document.querySelectorAll('[data-metric-id]');
    
    metricElements.forEach(el => {
      // Skip if already has proof icon
      if (el.querySelector('.elite-proof-icon')) return;
      
      const metricId = el.getAttribute('data-metric-id');
      const competitorDomain = el.getAttribute('data-competitor');
      
      // Create proof icon
      const icon = document.createElement('button');
      icon.className = 'elite-proof-icon';
      icon.innerHTML = '🛡️';
      icon.title = 'View proof';
      icon.onclick = (e) => {
        e.stopPropagation();
        const competitor = ZT_getCompetitorByDomain(competitorDomain);
        ZT_openSidePanel(metricId, competitor);
      };
      
      // Wrap in container
      el.classList.add('elite-metric-container');
      el.appendChild(icon);
    });
    
    console.log(`[ZeroTrust] Injected ${metricElements.length} proof icons`);
  }
  
  /**
   * Helper: Get competitor object by domain
   * v24.0: Uses ORACLE_STATE first, then fallback to legacy sources
   */
  function ZT_getCompetitorByDomain(domain) {
    // PRIORITY 1: Check ORACLE_STATE
    if (window.ORACLE_STATE?.competitors?.[domain]) {
      return window.ORACLE_STATE.competitors[domain];
    }
    
    // PRIORITY 2: Legacy currentCompetitors array
    const competitors = window.currentCompetitors || 
                       window.competitorData?.competitors || 
                       [];
    const found = competitors.find(c => c.domain === domain);
    if (found) return found;
    
    // PRIORITY 3: Return first available competitor if domain not found
    // (fallback for when domain is empty or unknown)
    if (!domain && Object.keys(window.ORACLE_STATE?.competitors || {}).length > 0) {
      const firstDomain = Object.keys(window.ORACLE_STATE.competitors)[0];
      return window.ORACLE_STATE.competitors[firstDomain];
    }
    
    if (!domain && competitors.length > 0) {
      return competitors[0];
    }
    
    return {};
  }
  
  /**
   * Helper: Escape HTML for display
   */
  function ZT_escapeHtml(text) {
    if (!text) return '';
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
  
  /**
   * Helper: Copy to clipboard
   */
  function ZT_copyToClipboard(btn, elementId) {
    const el = document.getElementById(elementId);
    if (el) {
      navigator.clipboard.writeText(el.textContent)
        .then(() => {
          const original = btn.textContent;
          btn.textContent = '✅ Copied!';
          setTimeout(() => btn.textContent = original, 2000);
        });
    }
  }
  
  /**
   * Create a metric with built-in proof icon
   * Use this when rendering new metrics
   * 
   * @param {string} metricId - The metric identifier
   * @param {*} value - The metric value
   * @param {Object} competitor - The competitor object
   * @param {Object} options - Display options
   * @returns {string} HTML string
   */
  function ZT_createMetricWithProof(metricId, value, competitor, options = {}) {
    const evidence = competitor?.evidenceMap?.[metricId];
    const confidence = evidence?.confidence || 50;
    
    const confidenceClass = confidence >= 90 ? 'verified' : 
                            confidence < 60 ? 'low-confidence' : '';
    
    const confidenceLevel = confidence >= 90 ? 'high' :
                            confidence >= 60 ? 'medium' : 'low';
    
    const displayValue = typeof value === 'object' ? JSON.stringify(value) : value;
    
    return `
      <span class="elite-metric-container" data-metric-id="${metricId}" data-competitor="${competitor?.domain || ''}">
        <span class="elite-metric-value">${options.format ? options.format(displayValue) : displayValue}</span>
        <button class="elite-proof-icon ${confidenceClass}" 
                data-confidence="${confidenceLevel}"
                onclick="ZT_openSidePanel('${metricId}', ZT_getCompetitorByDomain('${competitor?.domain || ''}'))"
                title="View proof (${confidence}% confidence)">
          🛡️
        </button>
      </span>
    `;
  }
  
  /**
   * Create proof icon HTML for inline use in renderers
   * Called by ELITE_UIRenderer when building card HTML
   * 
   * @param {string} metricId - The metric identifier
   * @returns {string} HTML string for the proof icon button
   */
  function ZT_createProofIconHTML(metricId) {
    if (!metricId) return '';
    
    // Get current competitor from global state
    const competitor = window.currentActiveCompetitor || 
                       window.competitorData?.competitors?.[0] || 
                       {};
    
    const evidence = competitor?.evidenceMap?.[metricId];
    const confidence = evidence?.confidence || 50;
    
    const confidenceClass = confidence >= 90 ? 'verified' : 
                            confidence < 60 ? 'low-confidence' : '';
    
    const confidenceLevel = confidence >= 90 ? 'high' :
                            confidence >= 60 ? 'medium' : 'low';
    
    // Use escaped quotes for onclick since this is embedded in HTML
    return `
      <button class="elite-proof-icon ${confidenceClass}" 
              data-confidence="${confidenceLevel}"
              data-metric-id="${metricId}"
              onclick="ZT_handleProofClick(event, '${metricId}')"
              title="View proof (${confidence}% confidence)">
        🛡️
      </button>
    `;
  }
  
  /**
   * Handle proof icon click event
   * Wrapper to find competitor and open side panel
   */
  function ZT_handleProofClick(event, metricId) {
    event.stopPropagation();
    
    // Find the competitor from context
    const container = event.target.closest('[data-competitor]');
    const competitorDomain = container?.getAttribute('data-competitor') || '';
    
    const competitor = competitorDomain 
      ? ZT_getCompetitorByDomain(competitorDomain)
      : (window.currentActiveCompetitor || window.competitorData?.competitors?.[0] || {});
    
    ZT_openSidePanel(metricId, competitor);
  }
  
  /**
   * D3 Mind Map Integration
   * Add hover tooltips showing source evidence
   */
  function ZT_initMindMapProofs(mindMapNodes, competitor) {
    if (!mindMapNodes || !Array.isArray(mindMapNodes)) return;
    
    // Create tooltip element
    let tooltip = document.getElementById('mindmap-proof-tooltip');
    if (!tooltip) {
      tooltip = document.createElement('div');
      tooltip.id = 'mindmap-proof-tooltip';
      tooltip.className = 'mindmap-proof-tooltip';
      document.body.appendChild(tooltip);
    }
    
    // Attach hover handlers to each node
    mindMapNodes.forEach(node => {
      const metricId = node.metricId || `content.${node.type || 'unknown'}`;
      const evidence = competitor?.evidenceMap?.[metricId];
      
      if (node.element) {
        node.element.addEventListener('mouseenter', (e) => {
          tooltip.innerHTML = `
            <div class="tooltip-header">
              <span>🛡️</span>
              ${node.label || node.name}
            </div>
            <div>${evidence?.value || node.value || 'N/A'}</div>
            ${evidence?.source ? `<div class="tooltip-source">📊 ${evidence.source}</div>` : ''}
          `;
          
          tooltip.style.left = (e.pageX + 15) + 'px';
          tooltip.style.top = (e.pageY - 10) + 'px';
          tooltip.classList.add('visible');
        });
        
        node.element.addEventListener('mouseleave', () => {
          tooltip.classList.remove('visible');
        });
        
        node.element.addEventListener('click', () => {
          ZT_openSidePanel(metricId, competitor);
        });
      }
    });
  }
  
  // Expose functions globally
  window.ZT_initializeProofIcons = ZT_initializeProofIcons;
  window.ZT_openSidePanel = ZT_openSidePanel;
  window.ZT_closeSidePanel = ZT_closeSidePanel;
  window.ZT_createMetricWithProof = ZT_createMetricWithProof;
  window.ZT_createProofIconHTML = ZT_createProofIconHTML;
  window.ZT_handleProofClick = ZT_handleProofClick;
  window.ZT_initMindMapProofs = ZT_initMindMapProofs;
  
  /**
   * Open Audit Trail for Strategic Command metrics
   * @param {string} domain - Competitor domain
   * @param {string} metricType - 'programmatic', 'emotional', 'semantic', etc.
   */
  window.openAuditTrail = function(domain, metricType) {
    console.log(`[AuditTrail] Opening for ${domain} / ${metricType}`);
    
    // Get competitor data from ORACLE_STATE or global
    const competitor = window.ORACLE_STATE?.competitors?.[domain] || 
                       window.competitorData?.competitors?.find(c => c.domain === domain) ||
                       { domain: domain };
    
    // Get strategic audit data
    const strategicAudit = competitor.strategicAudit || {};
    const evidenceMap = competitor.evidenceMap || {};
    
    // Build evidence content based on metric type
    let evidenceHtml = '';
    
    switch(metricType) {
      case 'programmatic':
        const moat = strategicAudit.programmaticMoat || {};
        const moatEvidence = evidenceMap.programmatic || moat.evidence || {};
        evidenceHtml = buildProgrammaticMoatEvidence(domain, moat, moatEvidence);
        break;
        
      case 'emotional':
        const debt = strategicAudit.emotionalDebt || {};
        const emotionalEvidence = evidenceMap.emotional || debt.evidence || {};
        evidenceHtml = buildEmotionalDebtEvidence(domain, debt, emotionalEvidence);
        break;
        
      case 'semantic':
        const triplets = strategicAudit.semanticTriplets || {};
        const semanticEvidence = evidenceMap.semantic || triplets.evidence || {};
        evidenceHtml = buildSemanticTripletsEvidence(domain, triplets, semanticEvidence);
        break;
        
      default:
        evidenceHtml = `<div style="padding: 20px; text-align: center;">No evidence available for ${metricType}</div>`;
    }
    
    // Open in side panel
    ZT_openSidePanel(`strategic.${metricType}`, competitor, evidenceHtml);
  };

  function buildProgrammaticMoatEvidence(domain, moat, evidence) {
    const statusColor = moat.is_programmatic ? '#22c55e' : '#f59e0b';

        <h3 style="margin: 0 0 16px; color: #f59e0b; display: flex; align-items: center; gap: 8px;">
          🏗️ Programmatic Moat Analysis
          <span style="background: ${statusColor}20; color: ${statusColor}; padding: 4px 10px; border-radius: 12px; font-size: 11px;">${statusText}</span>
        </h3>
        
        <div class="evidence-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
          <div class="evidence-stat" style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px;">
            <div style="font-size: 24px; font-weight: 700; color: ${statusColor};">${moat.similarity_score || 0}%</div>
            <div style="font-size: 11px; color: #6b7280;">DOM Similarity</div>
          </div>
          <div class="evidence-stat" style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px;">
            <div style="font-size: 18px; font-weight: 600;">${moat.pattern_type || 'Unknown'}</div>
            <div style="font-size: 11px; color: #6b7280;">Pattern Type</div>
          </div>
        </div>
        
        ${evidence.sharedClasses?.length ? `
        <div class="evidence-block" style="margin-bottom: 16px;">
          <div style="font-size: 12px; color: #f59e0b; margin-bottom: 8px;">Shared CSS Classes (${evidence.sharedClasses.length}):</div>
          <div style="display: flex; flex-wrap: wrap; gap: 4px;">
            ${evidence.sharedClasses.slice(0, 15).map(c => `<code style="background: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 10px;">.${c}</code>`).join('')}
          </div>
        </div>
        ` : ''}
        
        ${evidence.templateSignatures?.length ? `
        <div class="evidence-block" style="margin-bottom: 16px;">
          <div style="font-size: 12px; color: #22c55e; margin-bottom: 8px;">Template Signatures Detected:</div>
          <div style="display: flex; flex-wrap: wrap; gap: 4px;">
            ${evidence.templateSignatures.map(sig => `<code style="background: #064e3b; padding: 2px 6px; border-radius: 4px; font-size: 10px;">${sig.framework}: ${sig.pattern}</code>`).join('')}
          </div>
        </div>
        ` : ''}
        
        <div class="evidence-footer" style="font-size: 10px; color: #6b7280; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px;">
          Source: FT_Oracle_EliteDataSystem.gs → detectProgrammaticMoat()<br>
          Confidence: ${moat.confidence || 0}%
        </div>
      </div>
    `;
  }
  
  /**
   * Build evidence HTML for Emotional Debt
