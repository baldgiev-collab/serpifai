    position: absolute;
    top: -8px;

      '#EC4899', // Pink

  function buildDynamicCompetitorConfig() {
    const competitors = getDynamicCompetitors();
    const config = {};
    
    competitors.forEach((comp, index) => {
      const name = comp.name || comp.domain || 'Competitor';
      const id = name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/^-+|-+$/g, '');
      
      // V11.3: Determine type based on index (first 2 are incumbents, next 2 challengers, rest niche)

      if (index < 2) type = 'incumbent';
      else if (index < 4) type = 'challenger';
      
      // V11.3: Extract metrics from competitor data if available
      const metrics = comp.metrics || {};
      const authority = metrics.authorityScore || metrics.authority?.score || (50 + Math.random() * 40);
      const usability = metrics.uxScore || metrics.ux?.score || (30 + Math.random() * 50);
      const entityDensity = metrics.entityDensity || (50 + Math.floor(Math.random() * 30));

  // ═══════════════════════════════════════════════════════════════════════════════
  // COMPONENT 1: MARKET GRAVITY HUB (D3.js Quadrant Map)
  // ═══════════════════════════════════════════════════════════════════════════════
  
  function renderMarketGravityD3(competitorData) {
    console.log('🌐 Rendering Market Gravity D3.js quadrant map...');
    
    const svg = d3.select('#market-gravity-svg');
    if (svg.empty()) {
      console.error('❌ SVG element not found');
      return;
    }
    
    const container = document.getElementById('market-gravity-svg');
    const width = container.clientWidth || 800;
    const height = 420;
    const margin = { top: 40, right: 40, bottom: 60, left: 60 };
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;
    
    // Clear existing content
    svg.selectAll('*').remove();
    
    // Set SVG dimensions
    svg.attr('width', width).attr('height', height);
    
    // Create gradient definitions
    const defs = svg.append('defs');
    
    // Vector gradient (green to teal)
    const vectorGradient = defs.append('linearGradient')
      .attr('id', 'vectorGradient')
      .attr('x1', '0%').attr('y1', '0%')
      .attr('x2', '100%').attr('y2', '0%');
    vectorGradient.append('stop').attr('offset', '0%').attr('stop-color', '#10b981');
    vectorGradient.append('stop').attr('offset', '100%').attr('stop-color', '#06b6d4');
    
    // Destabilization zone gradient
    const destabGradient = defs.append('radialGradient')
      .attr('id', 'destabilizationGradient')
      .attr('cx', '50%').attr('cy', '50%').attr('r', '50%');
    destabGradient.append('stop').attr('offset', '0%').attr('stop-color', '#10b981').attr('stop-opacity', '0.3');
    destabGradient.append('stop').attr('offset', '100%').attr('stop-color', '#10b981').attr('stop-opacity', '0');
    
    // Main group with margins
    const g = svg.append('g')
      .attr('transform', `translate(${margin.left}, ${margin.top})`);
    
    // Scales
    const xScale = d3.scaleLinear().domain([0, 100]).range([0, innerWidth]);
    const yScale = d3.scaleLinear().domain([0, 100]).range([innerHeight, 0]);
    
    // Draw quadrant backgrounds
    const quadrants = [
      { x: 0, y: 0, w: innerWidth/2, h: innerHeight/2, label: 'HIGH AUTHORITY\nLOW USABILITY', class: 'q1' },
      { x: innerWidth/2, y: 0, w: innerWidth/2, h: innerHeight/2, label: 'HIGH AUTHORITY\nHIGH USABILITY', class: 'q2' },
      { x: 0, y: innerHeight/2, w: innerWidth/2, h: innerHeight/2, label: 'LOW AUTHORITY\nLOW USABILITY', class: 'q3' },
      { x: innerWidth/2, y: innerHeight/2, w: innerWidth/2, h: innerHeight/2, label: 'LOW AUTHORITY\nHIGH USABILITY', class: 'q4' }
    ];
    
    g.selectAll('.quadrant-bg')
      .data(quadrants)
      .enter()
      .append('rect')
      .attr('class', d => `quadrant-bg ${d.class}`)
      .attr('x', d => d.x)
      .attr('y', d => d.y)
      .attr('width', d => d.w)
      .attr('height', d => d.h)
      .attr('fill', (d, i) => i === 1 ? 'rgba(16, 185, 129, 0.05)' : 'rgba(255, 255, 255, 0.02)')

    // Quadrant labels

      .data(quadrants)
      .enter()
      .append('text')
      .attr('class', 'quadrant-label')
      .attr('x', d => d.x + d.w/2)
      .attr('y', d => d.y + 20)
      .attr('text-anchor', 'middle')
      .each(function(d) {
        const lines = d.label.split('\n');
        const text = d3.select(this);

          text.append('tspan')
            .attr('x', d.x + d.w/2)
            .attr('dy', i === 0 ? 0 : 12)
            .text(line);
        });
      });
    
    // Axis labels

      .attr('class', 'axis-label')
      .attr('x', innerWidth/2)
      .attr('y', innerHeight + 45)

    g.append('text')

      .attr('y', -40)
      .attr('text-anchor', 'middle')
      .text('← MARKET AUTHORITY');
    
    // V11.2: Prepare competitor nodes data - now fully dynamic!

      id: 'your-brand',
      name: yourBrand.name,
      type: 'you',
      x: xScale(yourBrand.position.usability),
      y: yScale(yourBrand.position.authority),
      color: yourBrand.color,

    // V11.2: Add competitors from DYNAMIC config (not hardcoded!)

      const analysisComp = competitorData.find(c => c.id === key || c.name?.toLowerCase() === comp.name?.toLowerCase());
      const pos = analysisComp?.position || comp.position;
      
      nodes.push({
        id: key,
        name: comp.name,
        type: comp.type,
        x: xScale(pos.usability),
        y: yScale(pos.authority),
        color: comp.color,
        logo: comp.logo,
        radius: 22
      });
    });
    
    // V11.2: Calculate destabilization zone (target area)
    const yourBrandNode = nodes.find(n => n.id === 'your-brand');
    const incumbentCenter = {
      x: d3.mean(nodes.filter(n => n.type === 'incumbent'), d => d.x) || innerWidth * 0.3,
      y: d3.mean(nodes.filter(n => n.type === 'incumbent'), d => d.y) || innerHeight * 0.3
    };
    
    // Draw destabilization zone
    g.append('ellipse')
      .attr('class', 'destabilization-zone')
      .attr('cx', incumbentCenter.x)
      .attr('cy', incumbentCenter.y)
      .attr('rx', 100)
      .attr('ry', 60);
    
    // V11.2: Draw "Your Vector" arrow from YOUR BRAND toward incumbent center
    const vectorPath = d3.path();
    vectorPath.moveTo(yourBrandNode.x, yourBrandNode.y);
    
    // Bezier curve toward destabilization zone
    const targetX = incumbentCenter.x - 40;
    const targetY = incumbentCenter.y + 40;
    const cpX = (yourBrandNode.x + targetX) / 2;
    const cpY = yourBrandNode.y - 50;
    
    vectorPath.quadraticCurveTo(cpX, cpY, targetX, targetY);
    
    g.append('path')
      .attr('class', 'your-vector-arrow')
      .attr('d', vectorPath.toString());
    
    // Arrow head
    const arrowAngle = Math.atan2(targetY - cpY, targetX - cpX);
    const arrowSize = 12;
    
    g.append('polygon')
      .attr('class', 'vector-arrowhead')
      .attr('points', `
        ${targetX},${targetY}
        ${targetX - arrowSize * Math.cos(arrowAngle - Math.PI/6)},${targetY - arrowSize * Math.sin(arrowAngle - Math.PI/6)}
        ${targetX - arrowSize * Math.cos(arrowAngle + Math.PI/6)},${targetY - arrowSize * Math.sin(arrowAngle + Math.PI/6)}
      `);
    
    // Vector label
    g.append('text')
      .attr('x', cpX)
      .attr('y', cpY - 12)
      .attr('text-anchor', 'middle')
      .attr('fill', '#10b981')
      .attr('font-size', '11px')
      .attr('font-weight', '600')
      .text('YOUR VECTOR →');
    
    g.append('text')
      .attr('x', cpX)
      .attr('y', cpY + 2)
      .attr('text-anchor', 'middle')
      .attr('fill', '#34d399')
      .attr('font-size', '9px')
      .text('Destabilize Incumbents');
    
    // Draw competitor nodes
    const nodeGroups = g.selectAll('.competitor-node')
      .data(nodes)
      .enter()
      .append('g')
      .attr('class', d => `competitor-node ${d.type}`)
      .attr('data-competitor', d => d.id)
      .attr('transform', d => `translate(${d.x}, ${d.y})`)
      .style('cursor', 'pointer')
      .on('click', function(event, d) {
        // V11.2: Allow clicking any non-your-brand competitor
        if (d.id !== 'your-brand') {
          toggleCompetitorGhosting(d.id);
        }
      })
      .on('mouseover', function(event, d) {
        showCompetitorTooltip(event, d);
      })
      .on('mouseout', hideCompetitorTooltip);
    
    // Node circles
    nodeGroups.append('circle')
      .attr('r', d => d.radius)
      .attr('fill', d => d.type === 'you' 
        ? 'url(#yourBrandGlow)' 
        : d.color)
      .attr('stroke', d => d.type === 'you' ? '#10b981' : 'rgba(255,255,255,0.3)')
      .attr('stroke-width', d => d.type === 'you' ? 3 : 2)
      .style('filter', d => d.type === 'you' ? 'drop-shadow(0 0 15px rgba(16, 185, 129, 0.6))' : 'none');
    
    // V11.2: Your brand special glow (renamed from serpifaiGlow)
    const yourBrandGlow = defs.append('radialGradient')
      .attr('id', 'yourBrandGlow');
    yourBrandGlow.append('stop').attr('offset', '0%').attr('stop-color', '#34d399');
    yourBrandGlow.append('stop').attr('offset', '70%').attr('stop-color', '#10b981');
    yourBrandGlow.append('stop').attr('offset', '100%').attr('stop-color', '#059669');
    
    // Node labels
    nodeGroups.append('text')
      .attr('text-anchor', 'middle')
      .attr('dy', d => d.type === 'you' ? 5 : 4)
      .attr('fill', 'white')
      .attr('font-size', d => d.type === 'you' ? '16px' : '11px')
      .attr('font-weight', '700')
      .text(d => d.logo);
    
    // Node name labels (below)
    nodeGroups.append('text')
      .attr('text-anchor', 'middle')
      .attr('y', d => d.radius + 16)
      .attr('fill', '#94a3b8')
      .attr('font-size', '10px')
      .attr('font-weight', '500')
      .text(d => d.name);
    
    console.log('✅ Market Gravity D3 visualization rendered');
  }
  
  // ═══════════════════════════════════════════════════════════════════════════════
  // COMPONENT 2: EMOTIONAL DEBT AUDIT (Sentiment Cards)
  // ═══════════════════════════════════════════════════════════════════════════════
  
  function renderEmotionalDebtCard(type, title, icon, subtitle, frustrations) {
    const items = frustrations.map(f => `
      <li class="frustration-item">
        <div class="frustration-severity severity-${f.severity}"></div>
        <div class="frustration-content">
          <p class="frustration-text">${f.text}</p>
          <span class="frustration-impact">📊 ${f.impact}</span>
        </div>
      </li>
    `).join('');
    
    return `
      <div class="sentiment-card ${type}">
        <div class="sentiment-header">
          <div class="sentiment-icon">${icon}</div>
          <div class="sentiment-title">
            <h3>${title}</h3>
            <span>${subtitle}</span>
          </div>
        </div>
        <ul class="frustration-list">
          ${items}
        </ul>
      </div>
    `;
  }
  
  // ═══════════════════════════════════════════════════════════════════════════════
  // COMPONENT 3: RAG-READY MOAT READINESS TABLE
  // V11.2: Now fully dynamic using getDynamicBrandName() and getDynamicCompetitors()
  // ═══════════════════════════════════════════════════════════════════════════════
  
  function renderMoatReadinessTable(competitorData) {
    // Prepare rows data
    const rows = [];
    
    // V11.2: Add YOUR BRAND first (dynamic, not hardcoded)
    const yourBrand = FORENSICS_CONFIG.SERPIFAI; // Uses getYourBrand() getter
    rows.push({
      id: 'your-brand',
      name: yourBrand.name,
      logo: yourBrand.logo,
      type: 'You',
      isYou: true,
      entityDensity: yourBrand.ragScore.entityDensity,
      citationPotential: yourBrand.ragScore.citationPotential,
      ragStability: yourBrand.ragScore.ragStability,
      overallScore: Math.round((yourBrand.ragScore.entityDensity + yourBrand.ragScore.citationPotential + yourBrand.ragScore.ragStability) / 3)
    });
    
    // V11.2: Add dynamic competitors from FORENSICS_CONFIG.INCUMBENTS getter
    const dynamicCompetitors = FORENSICS_CONFIG.INCUMBENTS;
    Object.entries(dynamicCompetitors).forEach(([key, comp]) => {
      const analysisComp = competitorData.find(c => c.id === key || c.name?.toLowerCase() === comp.name?.toLowerCase());
      const rag = analysisComp?.ragScore || comp.ragScore;
      
      rows.push({
        id: key,
        name: comp.name,
        logo: comp.logo,
        type: comp.type.charAt(0).toUpperCase() + comp.type.slice(1),
        isYou: false,
        entityDensity: rag.entityDensity,
        citationPotential: rag.citationPotential,
        ragStability: rag.ragStability,
        overallScore: Math.round((rag.entityDensity + rag.citationPotential + rag.ragStability) / 3)
      });
    });
    
    // Sort by overall score (Your brand stays first)
    rows.sort((a, b) => {
      if (a.isYou) return -1;
      if (b.isYou) return 1;
      return b.overallScore - a.overallScore;
    });
    
    const tableRows = rows.map((row, idx) => {
      const yourBrandScore = rows.find(r => r.isYou)?.overallScore || 85;
      const gap = row.overallScore - yourBrandScore;
      const gapClass = gap > 0 ? 'threat' : gap < -5 ? 'advantage' : 'neutral';
      const gapText = gap > 0 ? `+${gap}` : gap < 0 ? `${gap}` : '—';
      
      return `
        <tr class="${row.isYou ? 'is-you' : ''}" 
            data-competitor="${row.id}"
            onclick="${row.isYou ? '' : `toggleCompetitorGhosting('${row.id}')`}">
          <td>
            <div class="competitor-name-cell">
              <div class="competitor-logo" style="background: ${row.isYou ? 'linear-gradient(135deg, #10b981, #059669)' : 'linear-gradient(135deg, #1e293b, #334155)'}">${row.logo}</div>
              <div class="competitor-info">
                <h4>${row.name}</h4>
                <span>${row.type}</span>
              </div>
            </div>
          </td>
          <td>
            <div class="moat-score-bar">
              <div class="moat-score-fill ${getScoreClass(row.entityDensity)}" style="width: ${row.entityDensity}%"></div>
            </div>
            <div class="moat-score-label" style="color: ${getScoreColor(row.entityDensity)}">${row.entityDensity}%</div>
          </td>
          <td>
            <div class="moat-score-bar">
              <div class="moat-score-fill ${getScoreClass(row.citationPotential)}" style="width: ${row.citationPotential}%"></div>
            </div>
            <div class="moat-score-label" style="color: ${getScoreColor(row.citationPotential)}">${row.citationPotential}%</div>
          </td>
          <td>
            <div class="moat-score-bar">
              <div class="moat-score-fill ${getScoreClass(row.ragStability)}" style="width: ${row.ragStability}%"></div>
            </div>
            <div class="moat-score-label" style="color: ${getScoreColor(row.ragStability)}">${row.ragStability}%</div>
          </td>
          <td>
            <div style="font-size: 18px; font-weight: 700; color: ${getScoreColor(row.overallScore)}">${row.overallScore}</div>
          </td>
          <td>
            ${row.isYou ? '<span style="color: #10b981; font-weight: 600;">—</span>' : `<span class="gap-indicator ${gapClass}">${gapClass === 'advantage' ? '↑' : gapClass === 'threat' ? '↓' : ''} ${gapText}</span>`}
          </td>
        </tr>
      `;
    }).join('');
    
    return `
      <table class="glassmorphic-gap-table">
        <thead>
          <tr>
            <th style="width: 180px;">Competitor</th>
            <th>Entity Density</th>
            <th>Citation Potential</th>
            <th>RAG Stability</th>
            <th>Overall</th>
            <th>Gap vs You</th>
          </tr>
        </thead>
        <tbody>
          ${tableRows}
        </tbody>
      </table>
      <p style="color: #64748b; font-size: 11px; margin-top: 16px; text-align: center;">
        💡 Click any competitor row to activate <strong>Competitor Ghosting</strong> and highlight counter-strategies
      </p>
    `;
  }
  
  function getScoreClass(score) {
    if (score >= 85) return 'excellent';
    if (score >= 70) return 'good';
    if (score >= 50) return 'average';
    return 'poor';
  }
  
  function getScoreColor(score) {
    if (score >= 85) return '#10b981';
    if (score >= 70) return '#3b82f6';
    if (score >= 50) return '#f59e0b';
    return '#ef4444';
  }
  
  // ═══════════════════════════════════════════════════════════════════════════════
  // COMPONENT 4: COMPETITOR GHOSTING SYSTEM
  // ═══════════════════════════════════════════════════════════════════════════════
  
  function bindGhostingHandlers() {
    // Already bound via onclick in HTML
    console.log('👻 Competitor Ghosting handlers ready');
  }
  
  /**
   * Toggle competitor ghosting - highlights report sections that counter selected competitor
   * @param {string} competitorId - The competitor ID to ghost/unghost
   */
  window.toggleCompetitorGhosting = function(competitorId) {
    console.log('👻 Toggle ghosting for:', competitorId);
    
    // If same competitor, deactivate
    if (currentGhostedCompetitor === competitorId) {
      deactivateGhosting();
      return;
    }
    
    // Deactivate previous ghosting
    if (currentGhostedCompetitor) {
      deactivateGhosting();
    }
    
    // Activate new ghosting
    currentGhostedCompetitor = competitorId;
    const competitor = FORENSICS_CONFIG.INCUMBENTS[competitorId];
    
    if (!competitor) {
      console.warn('⚠️ Unknown competitor:', competitorId);
      return;
    }
    
    // Update table row selection
    document.querySelectorAll('.glassmorphic-gap-table tbody tr').forEach(row => {
      row.classList.remove('selected');
      if (row.dataset.competitor === competitorId) {
        row.classList.add('selected');
      }
    });
    
    // V11.2: Update D3 nodes - use 'your-brand' instead of 'serpifai'
    d3.selectAll('.competitor-node').each(function(d) {
      const node = d3.select(this);
      if (d.id === competitorId || d.id === 'your-brand') {
        node.classed('selected', d.id === competitorId);
        node.classed('ghosted', false);
      } else {
        node.classed('ghosted', true);
        node.classed('selected', false);
      }
    });
    
    // Show ghosting indicator
    showGhostingIndicator(competitor.name);
    
    // Highlight counter-strategy sections in the report
    highlightCounterStrategies(competitorId, competitor.name);
    
    window.showToast?.(`👻 Ghosting ${competitor.name} - Counter-strategies highlighted`);
  };
  
  function deactivateGhosting() {
    console.log('👻 Deactivating ghosting');
    currentGhostedCompetitor = null;
    
    // Remove all highlights
    document.querySelectorAll('.ghost-highlight').forEach(el => {
      el.classList.remove('ghost-highlight');
      el.removeAttribute('data-counter-target');
    });
    
    // Remove selection from table
    document.querySelectorAll('.glassmorphic-gap-table tbody tr').forEach(row => {
      row.classList.remove('selected');
    });
    
    // Reset D3 nodes
    d3.selectAll('.competitor-node')
      .classed('ghosted', false)
      .classed('selected', false);
    
    // Remove indicator
    const indicator = document.querySelector('.competitor-ghost-active');
    if (indicator) indicator.remove();
  }
  
  function showGhostingIndicator(competitorName) {
    // Remove existing indicator
    const existing = document.querySelector('.competitor-ghost-active');
    if (existing) existing.remove();
    
    const indicator = document.createElement('div');
    indicator.className = 'competitor-ghost-active';
    indicator.innerHTML = `
      <span>👻</span>
      <span>Ghosting: <strong>${competitorName}</strong></span>
      <button class="ghost-dismiss" onclick="deactivateGhosting()">×</button>
    `;
    document.body.appendChild(indicator);
  }
  
  function highlightCounterStrategies(competitorId, competitorName) {
    const mappings = FORENSICS_CONFIG.GHOST_MAPPINGS[competitorId] || [];
    
    // Find report sections that counter this competitor
    mappings.forEach(sectionKey => {
      // Try multiple selectors to find matching sections
      const selectors = [
        `[data-section-id="${sectionKey}"]`,
        `[data-counter="${sectionKey}"]`,
        `.section-${sectionKey}`,
        `#${sectionKey}`,
        `[id*="${sectionKey}"]`
      ];
      
      selectors.forEach(selector => {
        document.querySelectorAll(selector).forEach(el => {
          el.classList.add('ghost-highlight');
          el.setAttribute('data-counter-target', competitorName);
        });
      });
    });
    
    // Also highlight by content matching
    const reportSections = document.querySelectorAll('.bento-section, .elite-section, .report-section, [class*="section"]');
    
    reportSections.forEach(section => {
      const text = section.textContent?.toLowerCase() || '';
      const weaknesses = FORENSICS_CONFIG.INCUMBENTS[competitorId]?.weaknesses || [];
      
      // Check if section addresses any of the competitor's weaknesses
      const addressesWeakness = weaknesses.some(weakness => {
        const weaknessKeywords = weakness.toLowerCase().split(' ').filter(w => w.length > 4);
        return weaknessKeywords.some(kw => text.includes(kw));
      });
      
      if (addressesWeakness) {
        section.classList.add('ghost-highlight');
        section.setAttribute('data-counter-target', competitorName);
      }
    });
  }
  
  // Expose deactivateGhosting globally
  window.deactivateGhosting = deactivateGhosting;
  
  // ═══════════════════════════════════════════════════════════════════════════════
  // HELPER: Extract competitor data from analysis JSON
  // V10.7 FIX: Prioritize window._lastCompetitorData which has REAL competitor domains
  // ═══════════════════════════════════════════════════════════════════════════════
  
  function extractCompetitorData(analysisJson) {
    const competitors = [];
    
    // V10.7: PRIORITY 1 - Use _lastCompetitorData (set by COMP_Tab_Render.html)
    // This contains the REAL competitor domains from MySQL (moz.com, ahrefs.com, etc.)
    const lastCompData = window._lastCompetitorData;
    const compArray = lastCompData?.competitors || 
                      lastCompData?.competitorsArray || 
                      (Array.isArray(lastCompData) ? lastCompData : null);
    
    if (compArray?.length) {
      console.log(`📊 V10.7 extractCompetitorData: Using _lastCompetitorData (${compArray.length} competitors)`);
      compArray.forEach(comp => {
        const name = comp.domain || comp.url || comp.name || 'Unknown';
        competitors.push({
          id: name.toLowerCase().replace(/[^a-z0-9]/g, ''),
          name: name,
          position: {
            authority: comp.processedMetrics?.authorityScore || comp.synthesized?.authority?.score || 50,
            usability: comp.processedMetrics?.uxScore || comp.synthesized?.ux?.score || 50
          },
          ragScore: {
            entityDensity: comp.processedMetrics?.entityDensity || 60,
            citationPotential: comp.processedMetrics?.aeoScore || comp.synthesized?.aeo?.citeabilityScore || 55,
            ragStability: comp.processedMetrics?.techScore || 65
          }
        });
      });
      console.log(`📊 V10.7 extractCompetitorData: Found ${competitors.length} competitors from _lastCompetitorData`);
      return competitors;
    }
    
    // V10.7: PRIORITY 2 - Use currentCompetitorData (also set by COMP_Tab_Render)
    const currCompData = window.currentCompetitorData?.competitors;
    if (currCompData?.length) {
      console.log(`📊 V10.7 extractCompetitorData: Using currentCompetitorData (${currCompData.length} competitors)`);
      currCompData.forEach(comp => {
        const name = comp.domain || comp.url || comp.name || 'Unknown';
        competitors.push({
          id: name.toLowerCase().replace(/[^a-z0-9]/g, ''),
          name: name,
          position: {
            authority: comp.processedMetrics?.authorityScore || 50,
            usability: comp.processedMetrics?.uxScore || 50
          },
          ragScore: {
            entityDensity: comp.processedMetrics?.entityDensity || 60,
            citationPotential: comp.processedMetrics?.aeoScore || 55,
            ragStability: comp.processedMetrics?.techScore || 65
          }
        });
      });
      console.log(`📊 V10.7 extractCompetitorData: Found ${competitors.length} competitors from currentCompetitorData`);
      return competitors;
    }
    
    // V10.7: PRIORITY 3 - Use _competitorAnalysisData (legacy)
    if (window._competitorAnalysisData?.competitorsArray?.length) {
      console.log('📊 V10.7 extractCompetitorData: Using _competitorAnalysisData');
      window._competitorAnalysisData.competitorsArray.forEach(comp => {
        competitors.push({
          id: (comp.domain || comp.name || '').toLowerCase().replace(/[^a-z0-9]/g, ''),
          name: comp.domain || comp.name || 'Competitor',
          position: {
            authority: comp.processedMetrics?.authorityScore || 50,
            usability: comp.processedMetrics?.uxScore || 50
          },
          ragScore: {
            entityDensity: comp.processedMetrics?.entityDensity || 60,
            citationPotential: comp.processedMetrics?.aeoScore || 55,
            ragStability: comp.processedMetrics?.techScore || 65
          }
        });
      });
      console.log(`📊 V10.7 extractCompetitorData: Found ${competitors.length} competitors from _competitorAnalysisData`);
      return competitors;
    }

    // V10.7: FALLBACK - Check analysisJson for competitor structure (but NOT chart data!)
    // Only use paths that contain REAL competitor objects with domain fields
    if (analysisJson?.competitors?.length && analysisJson.competitors[0]?.domain) {
      console.log('📊 V10.7 extractCompetitorData: Using analysisJson.competitors');
      analysisJson.competitors.forEach(comp => {
        competitors.push({
          id: (comp.domain || '').toLowerCase().replace(/[^a-z0-9]/g, ''),
          name: comp.domain || comp.name || 'Competitor',
          position: {
            authority: comp.authority || 50,
            usability: comp.usability || 50
          },
          ragScore: {
            entityDensity: 60,
            citationPotential: 55,
            ragStability: 65
          }
        });
      });
      return competitors;
    }
    
    // V10.7: If still empty, return empty - don't try to extract from chart data
    // as that contains visualization labels NOT competitor domains
    console.log('📊 V10.7 extractCompetitorData: No competitor domain data found - returning empty');
    return competitors;
  }
  
  // ═══════════════════════════════════════════════════════════════════════════════
  // TOOLTIP SYSTEM
  // V11.2: Updated to use dynamic 'your-brand' ID instead of 'serpifai'
  // ═══════════════════════════════════════════════════════════════════════════════
  
  function showCompetitorTooltip(event, d) {
    const existing = document.getElementById('competitor-tooltip');
    if (existing) existing.remove();
    
    // V11.2: Use 'your-brand' ID instead of 'serpifai'
    const isYourBrand = d.id === 'your-brand';
    const comp = isYourBrand 
      ? FORENSICS_CONFIG.SERPIFAI // Uses getYourBrand() getter
      : FORENSICS_CONFIG.INCUMBENTS[d.id];
    
    if (!comp) return;
    
    const tooltip = document.createElement('div');
    tooltip.id = 'competitor-tooltip';
    tooltip.style.cssText = `
      position: fixed;
      left: ${event.clientX + 15}px;
      top: ${event.clientY + 15}px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 12px;
      padding: 16px;
      z-index: 10000;
      max-width: 280px;
      color: #f8fafc;
      font-size: 13px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    `;
    
    const traits = isYourBrand ? comp.strengths : comp.weaknesses;
    const traitLabel = isYourBrand ? '✅ Strengths' : '⚠️ Weaknesses';
    
    tooltip.innerHTML = `
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
        <div style="width: 40px; height: 40px; border-radius: 10px; background: ${comp.color}; display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; font-weight: 700;">${comp.logo}</div>
        <div>
          <div style="font-weight: 600; font-size: 15px;">${comp.name}</div>
          <div style="color: #94a3b8; font-size: 11px; text-transform: uppercase;">${isYourBrand ? 'YOUR POSITION' : comp.type}</div>
        </div>
      </div>
      <div style="margin-bottom: 12px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
          <span style="color: #94a3b8;">Authority</span>
          <span style="font-weight: 600;">${comp.position.authority}%</span>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span style="color: #94a3b8;">Usability</span>
          <span style="font-weight: 600;">${comp.position.usability}%</span>
        </div>
      </div>
      <div style="border-top: 1px solid rgba(148, 163, 184, 0.1); padding-top: 12px;">
        <div style="font-weight: 600; margin-bottom: 8px; font-size: 11px; color: ${isYourBrand ? '#10b981' : '#f59e0b'}">${traitLabel}</div>
        ${(traits || ['Pending analysis']).map(t => `<div style="font-size: 12px; color: #cbd5e1; margin-bottom: 4px;">• ${t}</div>`).join('')}
      </div>
      ${!isYourBrand ? '<div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(148, 163, 184, 0.1); color: #94a3b8; font-size: 11px; text-align: center;">Click to activate <strong>Ghosting</strong></div>' : ''}
    `;
    
    document.body.appendChild(tooltip);
  }
  
  function hideCompetitorTooltip() {
    const tooltip = document.getElementById('competitor-tooltip');
    if (tooltip) tooltip.remove();
  }
  
  console.log('✅ UI_Competitor_Forensics.html loaded (V11.2 Dynamic Competitors)');
</script>
