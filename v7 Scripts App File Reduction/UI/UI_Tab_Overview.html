    // EXECUTIVE INTELLIGENCE BRIEF - Overview
    const gemini = data.geminiAnalysis || data.analysis || {};
    const overviewExecConfig = generateExecutiveInsightConfig('overview', competitors, gemini);
    metricsHtml += renderExecutiveGeminiInsight(overviewExecConfig);

    // COMPARATIVE METRICS TABLE (Ahrefs-style)
    metricsHtml += `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">

    competitors.forEach((comp, index) => {

      // If domain is an object, try to extract string

      // Ensure domain is a string
      domain = String(domain);

      const cats = comp.categories || {};

      // DIAGNOSTIC: Log actual data structure for first competitor
      if (index === 0) {

      // ---------------------------------------------------------------

      const compWithDomain = {
        ...comp,
        domain: domain,

      // ---------------------------------------------------------------
      // ? USE REAL API DATA FROM BACKEND
      // Backend returns comp.snapshot and comp.apiData from enrichWithAPIs()

        console.log('      apiData:', !!compWithDomain.apiData);

      let backlinks = 'N/A';
      let refDomains = 'N/A';

      let organicTraffic = 'N/A';

      if (compWithDomain.processedMetrics) {
        const pm = compWithDomain.processedMetrics;
        console.log(`   ? processedMetrics available for ${domain}:`, pm);

        // ---------------------------------------------------------------
        // ELITE AUTHORITY SCORE - Multi-Signal Hybrid Engine (2026)
        // Priority: Gemini Estimate > Hybrid Calculation > PageRank Fallback
        // ---------------------------------------------------------------
        authorityScore = calculateEliteAuthorityScore(pm, compWithDomain.apiData, compWithDomain.synthesized);
        console.log(`      Elite Authority Score: ${authorityScore} (hybrid calculation)`);

        // Traffic & Keywords
        if (pm.estimatedTraffic !== undefined) organicTraffic = pm.estimatedTraffic;
        if (pm.organicKeywords !== undefined) organicKeywords = pm.organicKeywords;

        // Backlinks & Ref Domains (NEW: from PageRank estimation)
        if (pm.backlinks !== undefined && pm.backlinks !== 0) backlinks = pm.backlinks;
        else if (pm.estimatedBacklinks !== undefined && pm.estimatedBacklinks !== 0) backlinks = pm.estimatedBacklinks;
        if (pm.refDomains !== undefined && pm.refDomains !== 0) refDomains = pm.refDomains;
        else if (pm.estimatedRefDomains !== undefined && pm.estimatedRefDomains !== 0) refDomains = pm.estimatedRefDomains;

        // Site Health & PageSpeed
        if (pm.siteHealth !== undefined && pm.siteHealth !== 0) siteHealth = pm.siteHealth;
        if (pm.performanceScore !== undefined && pm.performanceScore !== 0) pageSpeed = pm.performanceScore;
        else if (pm.pageSpeed !== undefined && pm.pageSpeed !== 0) pageSpeed = pm.pageSpeed;

        console.log(`      From processedMetrics: authority=${authorityScore}, traffic=${organicTraffic}, keywords=${organicKeywords}, backlinks=${backlinks}, refDomains=${refDomains}, health=${siteHealth}, speed=${pageSpeed}`);
      }

      // Extract from apiData (preferred source - direct from APIs)
      // NOTE: apiData structure from backend:
      // - pageSpeed.scores.{seo, performance, accessibility, best_practices}
      // - openPageRank.{page_rank_decimal, rank}
      // - serper.{organicKeywords, estimatedTraffic, organic[]}
      if (compWithDomain.apiData) {
        console.log(`   ? apiData available for ${domain}`);
        console.log(`      apiData keys: ${Object.keys(compWithDomain.apiData).join(', ')}`);

        // Authority Score from OpenPageRank (handle 0 as valid value)
        // v28.4: API returns pageRank/domainRank (not page_rank_decimal/rank)
        if (compWithDomain.apiData.openPageRank) {
          const opr = compWithDomain.apiData.openPageRank;
          console.log(`      openPageRank structure: ${JSON.stringify(opr)}`);
          // v28.4: Handle both naming conventions - try new names first, then fallback to old
          const pageRankDecimal = opr.pageRank ?? opr.page_rank_decimal;
          const domainRank = opr.domainRank ?? opr.rank;

              <div class="insight-card" style="background: white; padding: 24px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
                <h4 style="margin: 0 0 15px; font-size: 18px; font-weight: 700; color: #202124;">🎯 Strategic Insights</h4>
                <ul style="margin: 0; padding-left: 20px; line-height: 2;">
            `;
        data.insights.strategicInsights.forEach(insight => {
          insightsHtml += `<li style="margin-bottom: 12px; color: #555; font-size: 15px;">${insight}</li>`;
        });
        insightsHtml += `
                </ul>
              </div>
            `;
      }

      if (data.insights.actionableRecommendations && data.insights.actionableRecommendations.length > 0) {
        insightsHtml += `
              <div class="insight-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 24px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(240,147,251,0.3);">
                <h4 style="margin: 0 0 15px; font-size: 18px; font-weight: 700;">💡 Actionable Recommendations</h4>
                <ol style="margin: 0; padding-left: 24px; line-height: 2;">
            `;
        data.insights.actionableRecommendations.forEach(rec => {
          insightsHtml += `<li style="margin-bottom: 12px; font-weight: 500; font-size: 15px;">${rec}</li>`;
        });
        insightsHtml += `
                </ol>
              </div>
            `;
      }
    }

    if (!insightsHtml) {
      insightsHtml = `
            <div style="padding: 40px; text-align: center; color: #666; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
              <div style="font-size: 48px; margin-bottom: 16px;">🤖</div>
              <p style="font-size: 16px; margin: 0;">AI insights will appear here once analysis is complete.</p>
            </div>
          `;
    }

    insightsDiv.innerHTML = insightsHtml;

    console.log('✅ Overview tab populated successfully');

    } catch (error) {
      // ═══════════════════════════════════════════════════════════════════════════
      // ERROR HANDLING - Show user-friendly error and log details for debugging
      // ═══════════════════════════════════════════════════════════════════════════
      console.error('❌ CRITICAL ERROR in populateOverviewTab:', error);
      console.error('   Stack trace:', error.stack);
      console.error('   Data that caused error:', data);
      
      // Show error in UI so user knows something went wrong
      const metricsDiv = document.getElementById('comp-overview-metrics');
      if (metricsDiv) {
        metricsDiv.innerHTML = `
          <div style="background: #fef2f2; border: 2px solid #ef4444; border-radius: 12px; padding: 24px; margin: 16px 0;">
            <h3 style="color: #dc2626; margin: 0 0 12px;">❌ Overview Tab Rendering Error</h3>
            <p style="color: #7f1d1d; margin: 0 0 12px;">An error occurred while rendering the Overview tab.</p>
            <details style="margin-top: 12px;">
              <summary style="color: #991b1b; cursor: pointer; font-weight: 600;">Technical Details (click to expand)</summary>
              <pre style="background: #fee2e2; padding: 12px; border-radius: 8px; margin-top: 8px; font-size: 11px; overflow-x: auto; white-space: pre-wrap;">${error.message}\n\n${error.stack || 'No stack trace available'}</pre>
            </details>
            <p style="color: #991b1b; margin: 16px 0 0; font-size: 13px;">Please refresh the page and try again. If this persists, check the browser console (F12) for more details.</p>
          </div>
        `;
      }
    }
  }

  /**
   * ═══════════════════════════════════════════════════════════════════════════
   * PAGESPEED FALLBACK ESTIMATION ENGINE (2026)
   * ═══════════════════════════════════════════════════════════════════════════
   * Estimates PageSpeed/Health when API fails or returns 0%
   * Uses domain signals, tech stack detection, and industry benchmarks
   */
  function estimatePageSpeedFallback(domain, processedMetrics, synthesized) {
    const pm = processedMetrics || {};
    const synth = synthesized || {};
    
    // Tech stack performance benchmarks (2026 data)
    const TECH_BENCHMARKS = {
      'wordpress': { performance: 55, seo: 75 },
      'shopify': { performance: 65, seo: 80 },
      'wix': { performance: 50, seo: 70 },
      'squarespace': { performance: 60, seo: 75 },
      'webflow': { performance: 70, seo: 82 },
      'nextjs': { performance: 85, seo: 90 },
      'react': { performance: 70, seo: 78 },
      'vue': { performance: 72, seo: 78 },
      'angular': { performance: 65, seo: 75 },
      'custom': { performance: 68, seo: 80 },
      'enterprise': { performance: 75, seo: 85 }
    };
    
    // Industry performance benchmarks
    const INDUSTRY_BENCHMARKS = {
      'saas': { performance: 72, seo: 82 },
      'seo': { performance: 78, seo: 88 },
      'ecommerce': { performance: 58, seo: 75 },
      'media': { performance: 55, seo: 78 },
      'finance': { performance: 68, seo: 80 },
      'default': { performance: 65, seo: 78 }
    };
    
    // Detect tech stack from domain signals
    const detectTechStack = (domain, synth) => {
      const techSignals = synth?.technicalSEO || synth?.technical || {};
      const framework = techSignals.framework || techSignals.cms || '';
      const domainLower = domain.toLowerCase();
      
      // Check for known platforms
      if (framework.toLowerCase().includes('wordpress') || domainLower.includes('.wordpress.')) return 'wordpress';
      if (framework.toLowerCase().includes('shopify') || domainLower.includes('.myshopify.')) return 'shopify';
      if (framework.toLowerCase().includes('next') || framework.toLowerCase().includes('vercel')) return 'nextjs';
      if (framework.toLowerCase().includes('react')) return 'react';
      if (framework.toLowerCase().includes('vue')) return 'vue';
      if (framework.toLowerCase().includes('angular')) return 'angular';
      
      // Infer from domain characteristics
      if (domainLower.match(/semrush|ahrefs|moz|serpstat|seranking/)) return 'enterprise';
      if (domainLower.match(/\.io$|\.ai$|\.app$/)) return 'saas';
      
      return 'custom';
    };
    
    // Detect industry
    const detectIndustry = (domain) => {
      const domainLower = domain.toLowerCase();
      if (domainLower.match(/seo|serp|keyword|backlink|rank/)) return 'seo';
      if (domainLower.match(/shop|store|buy|cart|ecommerce/)) return 'ecommerce';
      if (domainLower.match(/saas|software|tool|platform|app/)) return 'saas';
      if (domainLower.match(/news|blog|media|magazine/)) return 'media';
      if (domainLower.match(/bank|finance|invest|trading/)) return 'finance';
      return 'default';
    };
    
    const techStack = detectTechStack(domain, synth);
    const industry = detectIndustry(domain);
    
    // Get base benchmarks
    const techBench = TECH_BENCHMARKS[techStack] || TECH_BENCHMARKS.custom;
    const industryBench = INDUSTRY_BENCHMARKS[industry] || INDUSTRY_BENCHMARKS.default;
    
    // Authority adjustment: Higher authority domains tend to have better performance
    const authorityBonus = pm.pageRank > 5 ? 8 : pm.pageRank > 3 ? 4 : 0;
    
    // Calculate estimated scores (weighted average of tech + industry + authority)
    const estimatedPerformance = Math.min(95, Math.round(
      (techBench.performance * 0.4) + (industryBench.performance * 0.4) + (authorityBonus * 2)
    ));
    
    const estimatedSEO = Math.min(98, Math.round(
      (techBench.seo * 0.4) + (industryBench.seo * 0.4) + (authorityBonus * 2)
    ));
    
    console.log(`      PageSpeed Fallback: tech=${techStack}, industry=${industry}, auth_bonus=${authorityBonus} → perf=${estimatedPerformance}%, seo=${estimatedSEO}%`);
    
    return {
      performance: estimatedPerformance,
      seo: estimatedSEO,
      source: 'Estimated (API unavailable)',
      techStack: techStack,
      industry: industry,
      isEstimated: true
    };
  }

  /**
   * ═══════════════════════════════════════════════════════════════════════════
   * EXTRACT ELITE TRAFFIC METRICS
   * Oracle Elite v17.0 + 2026 CTR Model - Ahrefs/Semrush Level Accuracy
   * ═══════════════════════════════════════════════════════════════════════════
   */
  function extractEliteTrafficMetrics(comp, synthesized, pageRank) {
    const elite = synthesized?.eliteTraffic || comp.synthesized?.eliteTraffic || {};
    const pm = comp.processedMetrics || {};
    const stages = comp.stages || {};
    const serper = stages?.serper?.data || comp.apiData?.serper || {};
    const organic = synthesized?.seo?.organic || serper.organic || [];
    
    // TOP PAGES - Priority order: eliteTraffic > synthesized > snapshot > apiData
    const topPagesFromFetcher = elite.topPages || 
                                 synthesized?.topPages || 
                                 comp.synthesized?.topPages || 
                                 comp.snapshot?.topPages ||
                                 [];
    
    const keywordBreakdownFromFetcher = elite.keywordBreakdown || 
                                         synthesized?.keywordBreakdown || 
                                         comp.synthesized?.keywordBreakdown || [];
    
    const oracleKeywords = synthesized?.oracleKeywords || 
                           comp.synthesized?.oracleKeywords ||
                           elite.keywordBreakdown || [];
    
    const keywordClusters = synthesized?.keywordClusters ||
                            comp.synthesized?.keywordClusters || [];
    
    const eliteBacklinks = synthesized?.eliteBacklinks ||
                           comp.synthesized?.eliteBacklinks || {};
    
    const geographic = synthesized?.geographic ||
                       comp.synthesized?.geographic || {};
    
    const eliteAuthority = synthesized?.eliteAuthority ||
                           comp.synthesized?.eliteAuthority || {};
    
    // V9.4: Pass domain directly since pm.domain is often undefined
    const competitorDomain = comp.domain || comp.url || '';
    
    console.log('🔍 extractEliteTrafficMetrics:', {
      domain: competitorDomain,
      hasElite: !!elite.organicTraffic,
      topPagesCount: topPagesFromFetcher.length,
      keywordBreakdownCount: keywordBreakdownFromFetcher.length
    });
    
    if (elite.organicTraffic !== undefined) {
      return {
        organicTraffic: elite.organicTraffic || 0,
        trafficValue: elite.trafficValue || 0,
        trafficValueFormatted: '$' + (elite.trafficValue || 0).toLocaleString() + '/mo',
        avgPosition: elite.avgPosition || 0,
        relativeKD: elite.relativeKD || 50,
        kdTier: getKDTier(elite.relativeKD || 50),
        topPages: (topPagesFromFetcher).map((p, i) => ({
          rank: i + 1,
          url: p.url || '',
          title: p.title || '',
          traffic: p.traffic || 0,
          trafficShare: p.trafficShare || 0,
          keywords: p.keywords || 1,
          avgPosition: p.avgPosition || 0,
          topKeyword: p.topKeyword || ''
        })),
        keywordBreakdown: (keywordBreakdownFromFetcher).slice(0, 30),
        oracleKeywords: oracleKeywords.slice(0, 50),
        keywordClusters: keywordClusters,
        keywordCount: elite.keywordCount || oracleKeywords.length || keywordBreakdownFromFetcher.length,
        positionDistribution: elite.positionDistribution || {},
        intentDistribution: elite.intentDistribution || {},
        backlinks: eliteBacklinks,
        geographic: geographic,
        authority: eliteAuthority,
        serpFeatures: elite.serpFeatures || [],
        serpModifier: elite.serpModifier || 0,
        methodology: elite.methodology || 'Oracle Elite v17.0 + 2026 CTR Model',
        source: 'Oracle Elite Calculator',
        hasRealData: true,
        oracleVersion: synthesized?.oracleVersion || comp.synthesized?.oracleVersion || '17.0.0'
      };
    }
    
    // V9.4: Pass domain directly to fallback function
    return calculateFallbackEliteTraffic(organic, pageRank, pm, competitorDomain);
  }

  /**
   * Get KD Tier label and color
   */
  function getKDTier(kd) {
    if (kd <= 20) return { label: 'Very Easy', color: '#22c55e', icon: '🟢' };
    if (kd <= 40) return { label: 'Easy', color: '#84cc16', icon: '🟡' };
    if (kd <= 60) return { label: 'Medium', color: '#f59e0b', icon: '🟠' };
    if (kd <= 80) return { label: 'Hard', color: '#ef4444', icon: '🔴' };
    return { label: 'Very Hard', color: '#7c3aed', icon: '💀' };
  }

  /**
   * ═══════════════════════════════════════════════════════════════════════════
   * ELITE TRAFFIC & VALUE CALCULATOR (2026 CTR Model) - Fallback
   * ═══════════════════════════════════════════════════════════════════════════
   */
  function calculateFallbackEliteTraffic(organic, pageRank, pm) {
    const CTR_CURVE = {
      1: 0.398, 2: 0.187, 3: 0.102, 4: 0.072, 5: 0.051,
      6: 0.037, 7: 0.028, 8: 0.021, 9: 0.016, 10: 0.012
    };
    
    const INDUSTRY_CPC = {
      'saas': 3.50, 'software': 3.20, 'seo': 4.80, 'marketing': 3.80,
      'finance': 5.20, 'insurance': 6.50, 'legal': 7.80, 'health': 2.40,
      'ecommerce': 1.80, 'retail': 1.50, 'education': 2.20, 'travel': 2.00,
      'technology': 3.00, 'business': 2.80, 'default': 2.50
    };
    
    const detectIndustry = (keyword, domain) => {
      const text = (keyword + ' ' + domain).toLowerCase();
      if (text.match(/seo|serp|keyword|backlink|ranking/)) return 'seo';
      if (text.match(/saas|software|app|tool|platform/)) return 'saas';
      if (text.match(/marketing|advertis|campaign|social/)) return 'marketing';
      if (text.match(/finance|invest|bank|trading|crypto/)) return 'finance';
      if (text.match(/health|medical|doctor|pharma/)) return 'health';
      if (text.match(/shop|store|buy|ecommerce|product/)) return 'ecommerce';
      if (text.match(/legal|lawyer|attorney|law/)) return 'legal';
      return 'default';
    };
    
    const getEstimatedCPC = (keyword, domain) => {
      const industry = detectIndustry(keyword, domain);
      return INDUSTRY_CPC[industry] || INDUSTRY_CPC.default;
    };
    
    // Volume should come from real Serper data - only use estimation when no data available
    const getEstimatedVolume = (position, pageRank, realVolume) => {
      // Priority 1: Use real volume from Serper if available
      if (realVolume && realVolume > 0) {
        return realVolume;
      }
      // Fallback: Position-based estimate (clearly marked in UI)
      const baseVolume = position <= 2 ? 5000 : position <= 5 ? 2500 : 1000;
      const authorityMultiplier = pageRank > 5 ? 2.0 : pageRank > 3 ? 1.5 : 1.0;
      return Math.round(baseVolume * authorityMultiplier);
    };
    
    let totalTraffic = 0;
    let totalValue = 0;
    const keywordBreakdown = [];
    const pageTrafficMap = {};
    const domain = pm?.domain || '';
    
    // V11.0 FIX: If no organic data but we have PageRank, generate estimates
    // This prevents showing all zeros in the UI
    if (!organic || organic.length === 0) {
      console.log(`[Elite Traffic V11.0] No SERP data for ${domain} - generating PageRank-based estimates`);
      
      // PageRank-based traffic estimation (more accurate than zeros)
      const pr = pageRank || 0;
      let estTraffic = 0;
      let estValue = 0;
      let estKD = 50;
      
      if (pr > 0) {
        // PageRank-based estimation using power law
        // PR 1 ≈ 500 traffic, PR 3 ≈ 5K, PR 5 ≈ 50K, PR 7 ≈ 500K
        estTraffic = Math.round(500 * Math.pow(3.2, pr));
        estTraffic = Math.min(estTraffic, 2000000); // Cap at 2M
        estValue = Math.round(estTraffic * 2.50 * 0.05); // Est. 5% monetizable at $2.50 CPC
        estKD = Math.min(90, Math.round(20 + pr * 10)); // Higher PR = harder to compete
      } else {
        // No PageRank - use processedMetrics or minimal estimate
        estTraffic = pm?.estimatedTraffic || 500;
        estValue = Math.round(estTraffic * 0.12); // ~12% value ratio
        estKD = 35;
      }
      
      return {
        organicTraffic: estTraffic,
        trafficValue: estValue,
        trafficValueFormatted: '$' + estValue.toLocaleString() + '/mo',
        avgPosition: 0,
        relativeKD: estKD,
        kdTier: getKDTier(estKD),
        topPages: [],
        keywordBreakdown: [],
        serpFeatures: [],
        serpModifier: 0,
        methodology: 'PageRank-Based Estimation',
        source: 'PageRank Estimation',
        hasRealData: false,
        _isEstimated: true,
        _message: 'Estimated from PageRank. Run full analysis for real data.'
      };
    }
    
    organic.forEach((item, index) => {
      const position = item.position || (index + 1);
      if (position > 10) return;
      
      const keyword = item.title || item.query || `Keyword #${position}`;
      const ctr = CTR_CURVE[position] || 0.005;
      // Use real volume from item if available, otherwise estimate
      const realVolume = item.volume || item.searchVolume || item.estimatedVolume || 0;
      const volume = getEstimatedVolume(position, pageRank, realVolume);
      const traffic = Math.round(volume * ctr);
      const cpc = item.cpc || getEstimatedCPC(keyword, domain);
      const value = Math.round(traffic * cpc);
      
      keywordBreakdown.push({
        keyword: keyword,
        position: position,
        volume: volume,
        ctr: Math.round(ctr * 1000) / 10,
        traffic: traffic,
        cpc: cpc,
        value: value,
        industry: detectIndustry(keyword, domain)
      });
      
      const url = item.link || '';
      if (!pageTrafficMap[url]) {
        pageTrafficMap[url] = { url: url, title: item.title || '', traffic: 0, keywords: 0 };
      }
      pageTrafficMap[url].traffic += traffic;
      pageTrafficMap[url].keywords += 1;
      
      totalTraffic += traffic;
      totalValue += value;
    });
    
    const topPages = Object.values(pageTrafficMap)
      .sort((a, b) => b.traffic - a.traffic)
      .slice(0, 10)
      .map((p, i) => ({
        ...p,
        rank: i + 1,
        trafficShare: totalTraffic > 0 ? Math.round((p.traffic / totalTraffic) * 1000) / 10 : 0
      }));
    
    const userAuthority = window.serpifaiUserAuthority || 30;
    const competitorAuthority = pageRank > 0 ? Math.round(pageRank * 10) : 50;
    const avgKeywordDifficulty = keywordBreakdown.length > 0 
      ? keywordBreakdown.reduce((sum, k) => sum + (k.position <= 3 ? 70 : k.position <= 5 ? 55 : 40), 0) / keywordBreakdown.length
      : 50;
    
    const competitiveRatio = competitorAuthority / Math.max(userAuthority, 1);
    const baseKD = Math.min(100, Math.max(10, avgKeywordDifficulty * competitiveRatio * 0.8));
    const highVolumeKeywords = keywordBreakdown.filter(k => k.volume > 3000).length;
    const kdModifier = highVolumeKeywords > 3 ? 1.15 : highVolumeKeywords > 1 ? 1.05 : 1.0;
    const relativeKD = Math.min(100, Math.max(1, Math.round(baseKD * kdModifier)));
    
    return {
      organicTraffic: totalTraffic,
      trafficValue: totalValue,
      trafficValueFormatted: '$' + totalValue.toLocaleString() + '/mo',
      avgPosition: organic.length > 0 
        ? Math.round(organic.reduce((sum, o) => sum + (o.position || 0), 0) / organic.length * 10) / 10 
        : 0,
      relativeKD: relativeKD,
      kdTier: getKDTier(relativeKD),
      topPages: topPages,
      keywordBreakdown: keywordBreakdown.slice(0, 20),
      serpFeatures: [],
      serpModifier: 0,
      methodology: 'Client-Side Fallback',
      source: 'Fallback Estimation',
      hasRealData: organic.length > 0
    };
  }


  console.log(' UI_Tab_Overview.html loaded');
  console.log('   Exports: window.populateOverviewTab');

</script>
