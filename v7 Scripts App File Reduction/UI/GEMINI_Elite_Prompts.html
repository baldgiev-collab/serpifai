<script>
(function() {
  'use strict';
  
  // ==========================================
  // ELITE PROMPT FRAMEWORK
  // ==========================================
  
  /**
   * Elite prompt builder with dynamic context injection
   */
  class ElitePromptBuilder {
    constructor() {
      this.templates = {};
      this.contextProviders = {};
    }
    
    /**
     * Register a prompt template
     * @param {string} id - Template ID
     * @param {object} template - { system, user, outputFormat }
     */
    registerTemplate(id, template) {
      this.templates[id] = template;
    }
    
    /**
     * Register a context provider function
     * @param {string} id - Provider ID
     * @param {function} provider - Function that returns context object
     */
    registerContextProvider(id, provider) {
      this.contextProviders[id] = provider;
    }
    
    /**
     * Build a prompt with context
     * @param {string} templateId - Template ID
     * @param {object} data - Data to inject
     * @returns {object} { system, user, outputFormat }
     */
    build(templateId, data = {}) {
      const template = this.templates[templateId];
      if (!template) {
        console.warn(`Template ${templateId} not found`);
        return null;
      }
      
      // Gather context from all providers
      const context = {};
      Object.entries(this.contextProviders).forEach(([id, provider]) => {
        try {
          context[id] = provider(data);
        } catch (e) {
          console.warn(`Context provider ${id} failed:`, e);
        }
      });
      
      // Merge data and context
      const fullContext = { ...data, ...context };
      
      // Build prompt strings
      return {
        system: this.interpolate(template.system, fullContext),
        user: this.interpolate(template.user, fullContext),
        outputFormat: template.outputFormat
      };
    }
    
    /**
     * Interpolate variables into template string
     * @param {string} template - Template with {{variable}} placeholders
     * @param {object} data - Data object
     * @returns {string} Interpolated string
     */
    interpolate(template, data) {
      return template.replace(/\{\{(\w+(?:\.\w+)*)\}\}/g, (match, path) => {
        const value = path.split('.').reduce((obj, key) => obj?.[key], data);
        return value !== undefined ? value : match;
      });
    }
  }
  
  // Create global instance
  const elitePrompts = new ElitePromptBuilder();
  
  // ==========================================
  // F1: EXECUTIVE BRIEF PROMPTS

- Risk Assessment (with probability and impact)
- Next Steps (specific, timebound actions)`,
    
    user: `Analyze this competitive landscape for {{domain}}:

MARKET POSITION:

- Estimated Monthly Traffic: {{traffic}}

YOUR METRICS:
{{yourMetrics}}

COMPETITOR METRICS:
{{competitorMetrics}}

CONTENT ANALYSIS:
{{contentAnalysis}}

{{backlinkProfile}}

  // ==========================================
  // F3: KILL MOVE PLAYBOOKS

COMPETITOR WEAKNESSES IDENTIFIED:
{{weaknesses}}

{{strengths}}

KEYWORD GAPS:
{{keywordGaps}}

{{backlinkOpportunities}}

  // ==========================================
  // F4: RISK ASSESSMENT & THREAT SCORING

  elitePrompts.registerTemplate('risk_assessment', {
    system: `You are a risk analyst assessing competitive threats and SEO vulnerabilities.

Risk Categories:
1. ALGORITHM RISK - Dependency on volatile ranking factors

6. MARKET RISK - Industry changes, search behavior shifts
7. RESOURCE RISK - Team/budget constraints

For each risk:
- Probability: 1-10 (likelihood of occurring)
- Impact: 1-10 (severity if it occurs)
- Risk Score: Probability × Impact
- Mitigation: Specific action to reduce risk
- Early Warning: Metrics to monitor`,
    
    user: `Conduct a comprehensive risk assessment for {{domain}}:

CURRENT STATE:
- Authority: {{authority}}

- Core Web Vitals: {{cwvStatus}}

  // ==========================================

  // ==========================================
  
  elitePrompts.registerTemplate('opportunity_sizing', {
    system: `You are a market analyst sizing SEO opportunities using TAM/SAM/SOM framework.

TAM (Total Addressable Market):
- All search volume in the vertical/industry
- Maximum possible organic traffic

SAM (Serviceable Available Market):
- Keywords you could realistically target

SOM (Serviceable Obtainable Market):

For each opportunity:
- Monthly Search Volume
- Current Position (if ranking)
- Realistic Target Position
- Expected CTR at target position
- Estimated Monthly Traffic Gain
- Traffic Value (CPC × Traffic)`,
    
    user: `Size the organic search opportunity for {{domain}}:

CURRENT PERFORMANCE:
- Monthly Organic Traffic: {{currentTraffic}}
- Keywords Ranking Top 10: {{top10Keywords}}
- Keywords Ranking 11-50: {{top50Keywords}}
- Average Position: {{avgPosition}}

{{keywordData}}

Calculate:

2. SAM: Realistic targetable keywords and traffic
3. SOM (6-month): What you can capture in 6 months
4. SOM (12-month): What you can capture in 12 months

    outputFormat: 'json'

  // ==========================================
  // ADDITIONAL STRATEGIC PROMPTS
  // ==========================================
  
  elitePrompts.registerTemplate('content_strategy', {
    system: `You are a content strategist developing a data-driven content roadmap.

{{contentAudit}}

{{keywordGaps}}

{{topContent}}

  elitePrompts.registerTemplate('technical_audit', {
    system: `You are a technical SEO expert conducting a comprehensive site audit.

Technical Audit Categories:
1. CRAWLABILITY - Indexation, robots, sitemaps
2. PERFORMANCE - Core Web Vitals, page speed

    user: `Conduct a technical SEO audit for {{domain}}:

CORE WEB VITALS:
- LCP: {{lcp}}ms (threshold: 2500ms)
- FID: {{fid}}ms (threshold: 100ms)  
- CLS: {{cls}} (threshold: 0.1)

PAGESPEED SCORES:
- Performance: {{performance}}/100
- Accessibility: {{accessibility}}/100
- Best Practices: {{bestPractices}}/100
- SEO: {{seoScore}}/100

CRAWL DATA:
{{crawlData}}

MOBILE USABILITY:
{{mobileData}}

SCHEMA IMPLEMENTATION:
{{schemaData}}

Provide:
1. Top 10 issues ranked by priority score
2. Quick wins (high impact, low effort)
3. Technical debt items to address
4. Schema optimization opportunities
5. Performance optimization roadmap`,
    
    outputFormat: 'json'
  });
  
  // ==========================================
  // CONTEXT PROVIDERS
  // ==========================================
  
  elitePrompts.registerContextProvider('competitors', (data) => {
    if (!data.competitors) return '';
    
    return data.competitors.map((comp, i) => {
      return `${i + 1}. ${comp.domain}
   - Authority: ${comp.authority || 'N/A'}
   - Traffic: ${comp.traffic?.toLocaleString() || 'N/A'}
   - Keywords: ${comp.keywords?.toLocaleString() || 'N/A'}`;
    }).join('\n');
  });
  
  elitePrompts.registerContextProvider('competitorSummary', (data) => {
    if (!data.competitors) return 'No competitor data available';
    
    return data.competitors.slice(0, 5).map((comp, i) => {
      return `${i + 1}. ${comp.domain}: Authority ${comp.authority || '?'}, Traffic ${(comp.traffic || 0).toLocaleString()}/mo`;
    }).join('\n');
  });
  
  // ==========================================
  // PROMPT EXECUTION
  // ==========================================
  
  /**
   * Execute an Elite prompt with Gemini
   * @param {string} templateId - Template ID
   * @param {object} data - Context data
   * @param {object} options - { stream, maxTokens }
   * @returns {Promise<object>} Gemini response
   */
  async function executeElitePrompt(templateId, data, options = {}) {
    const prompt = elitePrompts.build(templateId, data);
    if (!prompt) {
      throw new Error(`Failed to build prompt: ${templateId}`);
    }
    
    console.log('🏆 Executing Elite Prompt:', templateId);
    console.log('📝 System:', prompt.system.substring(0, 100) + '...');
    console.log('📝 User:', prompt.user.substring(0, 100) + '...');
    
    // Use backend Gemini client
    try {
      const response = await new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .callGeminiElite(prompt.system, prompt.user, prompt.outputFormat);
      });
      
      return {
        success: true,
        data: response,
        prompt: templateId
      };
    } catch (error) {
      console.error('Elite prompt execution failed:', error);
      return {
        success: false,
        error: error.message,
        prompt: templateId
      };
    }
  }
  
  /**
   * Get available Elite prompts
   * @returns {array} List of template IDs and descriptions
   */
  function getElitePromptList() {
    return [
      { id: 'executive_brief', name: 'Executive Brief', description: 'C-suite presentation-ready competitive analysis' },
      { id: 'competitive_moat', name: 'Competitive Moats', description: 'Economic moat identification and building strategy' },
      { id: 'kill_moves', name: 'Kill Moves', description: 'Tactical playbooks to capture competitor market share' },
      { id: 'risk_assessment', name: 'Risk Assessment', description: 'Threat scoring and mitigation planning' },
      { id: 'opportunity_sizing', name: 'Opportunity Sizing', description: 'TAM/SAM/SOM market opportunity analysis' },
      { id: 'content_strategy', name: 'Content Strategy', description: 'Data-driven content roadmap development' },
      { id: 'technical_audit', name: 'Technical Audit', description: 'Comprehensive technical SEO analysis' }
    ];
  }
  
  // ==========================================
  // EXPORT TO WINDOW
  // ==========================================
  
  window.elitePrompts = elitePrompts;
  window.ElitePromptBuilder = ElitePromptBuilder;
  window.executeElitePrompt = executeElitePrompt;
  window.getElitePromptList = getElitePromptList;
  
  console.log('✅ GEMINI_Elite_Prompts.html loaded - Category F Elite Prompting v1.0');
  console.log('📋 Available prompts:', getElitePromptList().map(p => p.id).join(', '));
  
})();
</script>
