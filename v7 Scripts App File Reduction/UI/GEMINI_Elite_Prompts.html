  /**
   * Elite prompt builder with dynamic context injection
   */
  class ElitePromptBuilder {
    constructor() {
      this.templates = {};
      this.contextProviders = {};
    }
    
    /**
     * Register a prompt template
     * @param {string} id - Template ID
     * @param {object} template - { system, user, outputFormat }
     */
    registerTemplate(id, template) {
      this.templates[id] = template;
    }
    
    /**
     * Register a context provider function
     * @param {string} id - Provider ID
     * @param {function} provider - Function that returns context object
     */
    registerContextProvider(id, provider) {
      this.contextProviders[id] = provider;
    }
    
    /**
     * Build a prompt with context
     * @param {string} templateId - Template ID
     * @param {object} data - Data to inject
     * @returns {object} { system, user, outputFormat }
     */
    build(templateId, data = {}) {
      const template = this.templates[templateId];
      if (!template) {
        console.warn(`Template ${templateId} not found`);
        return null;
      }
      
      // Gather context from all providers
      const context = {};
      Object.entries(this.contextProviders).forEach(([id, provider]) => {
        try {
          context[id] = provider(data);
        } catch (e) {
          console.warn(`Context provider ${id} failed:`, e);
        }
      });
      
      // Merge data and context
      const fullContext = { ...data, ...context };
      
      // Build prompt strings
      return {
        system: this.interpolate(template.system, fullContext),
        user: this.interpolate(template.user, fullContext),
        outputFormat: template.outputFormat
      };
    }
    
    /**
     * Interpolate variables into template string
     * @param {string} template - Template with {{variable}} placeholders
     * @param {object} data - Data object
     * @returns {string} Interpolated string
     */
    interpolate(template, data) {
      return template.replace(/\{\{(\w+(?:\.\w+)*)\}\}/g, (match, path) => {
        const value = path.split('.').reduce((obj, key) => obj?.[key], data);
        return value !== undefined ? value : match;
      });
    }
  }

  /**
   * V12.0: Get schema for a specific chart type
   * @param {string} chartType - Chart type (radar, bar, bubble, etc.)
   * @returns {Object|null} Chart schema
   */
  function getChartSchema(chartType) {
    return CHART_SCHEMAS[chartType] || null;
  }
  
  /**
   * V12.0: Validate chart data against schema
   * @param {Object} data - Chart data to validate
   * @param {string} chartType - Expected chart type
   * @returns {Object} { isValid: boolean, issues: Array }
   */
  function validateChartData(data, chartType) {
    const schema = CHART_SCHEMAS[chartType];
    if (!schema) {
      return { isValid: false, issues: ['Unknown chart type: ' + chartType] };
    }
    
    const issues = [];
    
    // Basic structure validation
    if (chartType === 'radar' || chartType === 'bar' || chartType === 'line' || chartType === 'doughnut') {
      if (!data.labels || !Array.isArray(data.labels)) {
        issues.push('Missing or invalid labels array');
      }
      if (!data.datasets || !Array.isArray(data.datasets)) {
        issues.push('Missing or invalid datasets array');
      }
    }
    
    if (chartType === 'bubble' || chartType === 'scatter') {
      if (!data.datasets || !Array.isArray(data.datasets)) {
        issues.push('Missing or invalid datasets array');
      } else {
        data.datasets.forEach((ds, i) => {
          if (!ds.data || !Array.isArray(ds.data)) {
            issues.push(`Dataset ${i} missing data array`);
          }
        });
      }
    }
    
    if (chartType === 'heatmap') {
      if (!data.xLabels || !data.yLabels || !data.data) {
        issues.push('Heatmap requires xLabels, yLabels, and data');
      }
    }
    
    if (chartType === 'gauge') {
      if (typeof data.value !== 'number') {
        issues.push('Gauge requires numeric value');
      }
    }
    
    if (chartType === 'force') {
      if (!data.nodes || !data.links) {
        issues.push('Force graph requires nodes and links arrays');
      }
    }
    
    if (chartType === 'timeline') {
      if (!data.items || !Array.isArray(data.items)) {
        issues.push('Timeline requires items array');
      }
    }
    
    return { isValid: issues.length === 0, issues };
  }

   * @returns {string} Prompt instructions for generating chart data
   */
  function getChartPromptInstructions(chartType) {
    const schema = CHART_SCHEMAS[chartType];
    if (!schema) {
      return '';
    }
    
    return `
Generate ${chartType} chart data following this EXACT schema:
\`\`\`json
${JSON.stringify(schema.example, null, 2)}
\`\`\`

Schema description: ${schema.description}
`;
  }
  
  // ==========================================
  // EXPORT TO WINDOW
  // ==========================================
  
  window.elitePrompts = elitePrompts;
  window.ElitePromptBuilder = ElitePromptBuilder;
  window.executeElitePrompt = executeElitePrompt;
  window.getElitePromptList = getElitePromptList;
  
  // V12.0: Export chart schema helpers
  window.CHART_SCHEMAS = CHART_SCHEMAS;
  window.getChartSchema = getChartSchema;
  window.validateChartData = validateChartData;
  window.getChartPromptInstructions = getChartPromptInstructions;
  
  console.log('✅ GEMINI_Elite_Prompts.html loaded - Category F Elite Prompting v12.0');
  console.log('📋 Available prompts:', getElitePromptList().map(p => p.id).join(', '));
  console.log('📊 Chart schemas:', Object.keys(CHART_SCHEMAS).join(', '));
  
})();
</script>
