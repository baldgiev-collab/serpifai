<style>
/* ═══════════════════════════════════════════════════════════════════════════
   V12.0 PHASE 6 TODO 6.10: PREMIUM MODAL STYLING
   Theme-aware modal system with premium animations
   ═══════════════════════════════════════════════════════════════════════════ */

/* Modal Backdrop */
.modal-backdrop {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--surface-overlay, rgba(0,0,0,0.6));
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: modalFadeIn 0.2s ease;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

/* Modal Container */
.modal-container {
  background: var(--surface, #ffffff);
  border-radius: var(--radius-xl, 16px);
  width: 90%;
  max-width: 600px;
  max-height: 85vh;
  overflow: hidden;
  box-shadow: var(--shadow-xl, 0 25px 50px -12px rgba(0,0,0,0.25));
  animation: modalSlideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  border: 1px solid var(--border-subtle, rgba(0,0,0,0.1));
}

/* Modal Header */
.modal-header {
  background: linear-gradient(135deg, var(--brand-primary, #6366f1) 0%, var(--brand-secondary, #8b5cf6) 100%);
  padding: 20px 24px;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-header-alt {
  background: var(--surface-elevated, #f8fafc);
  border-bottom: 1px solid var(--border-subtle, #e2e8f0);
  color: var(--text-primary, #0f172a);
}

.modal-title {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
}

.modal-subtitle {
  margin: 6px 0 0;
  font-size: 13px;
  opacity: 0.85;
}

.modal-close {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 150ms ease;
}

.modal-close:hover {
  background: rgba(255,255,255,0.3);
  transform: scale(1.1);
}

/* Modal Body */
.modal-body {
  padding: 24px;
  max-height: calc(85vh - 80px);
  overflow-y: auto;
  color: var(--text-primary, #1e293b);
}

/* Modal Footer */
.modal-footer {
  padding: 16px 24px;
  background: var(--surface-soft, #f8fafc);
  border-top: 1px solid var(--border-subtle, #e2e8f0);
  display: flex;
  justify-content: flex-end;
  gap: 12px;
}

/* Modal Animations */
@keyframes modalFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes modalSlideUp {
  from { 
    opacity: 0; 
    transform: translateY(20px) scale(0.95);
  }
  to { 
    opacity: 1; 
    transform: translateY(0) scale(1);
  }
}

@keyframes modalFadeOut {
  from { opacity: 1; }
  to { opacity: 0; }
}

/* Dark Theme Modal Overrides */
[data-theme="dark"] .modal-container {
  background: var(--surface, #0f172a);
  border-color: var(--border-subtle, rgba(148,163,184,0.2));
}

[data-theme="dark"] .modal-close {
  background: rgba(255,255,255,0.15);
}

[data-theme="dark"] .modal-body {
  color: var(--text-primary, #f1f5f9);
}

[data-theme="dark"] .modal-footer {
  background: var(--surface-elevated, #1e293b);
  border-color: var(--border-subtle, rgba(148,163,184,0.2));
}

/* Aurora Theme Modal Overrides */
[data-theme="aurora"] .modal-backdrop {
  background: rgba(0,0,0,0.75);
}

[data-theme="aurora"] .modal-container {
  background: rgba(15,23,42,0.95);
  border-color: rgba(52,211,153,0.2);
  box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 60px rgba(52,211,153,0.1);
}

[data-theme="aurora"] .modal-header {
  background: linear-gradient(135deg, rgba(52,211,153,0.9) 0%, rgba(16,185,129,0.9) 100%);
}

[data-theme="aurora"] .modal-body {
  color: #f0fdf4;
}

[data-theme="aurora"] .modal-footer {
  background: rgba(30,41,59,0.8);
  border-color: rgba(52,211,153,0.2);
}

/* Neon Theme Modal Overrides */
[data-theme="neon"] .modal-backdrop {
  background: rgba(30,27,75,0.6);
}

[data-theme="neon"] .modal-container {
  box-shadow: 0 25px 50px rgba(139,92,246,0.15), 0 0 40px rgba(139,92,246,0.1);
  border-color: rgba(139,92,246,0.25);
}

[data-theme="neon"] .modal-header {
  background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
}

[data-theme="neon"] .modal-footer {
  background: #f5f3ff;
  border-color: rgba(139,92,246,0.2);
}
</style>

<script>
/**
 * V12.0 UI Modal System - Theme-Aware Clickable Metric Detail Modals
 * Phase 6 TODO 6.10: Premium modal animations and styling
 * Shows detailed raw data when users click on any metric value
 */

// Global store for detail data
window._metricDetailData = window._metricDetailData || {};

/**
 * V12.0 FIX: Generic closeModal function used by UI_Components_Modal.html
 * This was missing, causing: Uncaught ReferenceError: closeModal is not defined
 * @param {string} modalId - Optional ID of modal to close (default: 'modal')
 */
window.closeModal = function(modalId) {
  const id = modalId || 'modal';
  const modal = document.getElementById(id);
  if (modal) {
    // Add fade-out animation
    modal.style.animation = 'modalFadeOut 0.2s ease forwards';
    setTimeout(() => {
      modal.style.display = 'none';
      modal.style.animation = '';
    }, 200);
  }
};

// Also provide a generic open modal function
window.openModal = function(modalId, title, content) {
  const id = modalId || 'modal';
  const modal = document.getElementById(id);
  if (modal) {
    const titleEl = document.getElementById('modalTitle');
    const bodyEl = document.getElementById('modalBody');
    if (titleEl && title) titleEl.textContent = title;
    if (bodyEl && content) bodyEl.innerHTML = content;
    modal.style.display = 'flex';
    modal.style.animation = 'modalFadeIn 0.2s ease forwards';
  }
};

/**
 * Show detailed modal for a clicked metric
 * @param {string} metricKey - Unique key for this metric
 * @param {string} metricLabel - Display name
 * @param {Array} competitorValues - Array of {domain, value, source, details} objects
 */
window.showMetricDetailModal = function(metricKey, metricLabel, competitorValues) {
  // Remove existing modal if any
  const existingModal = document.getElementById('metric-detail-modal');
  if (existingModal) existingModal.remove();
  
  const modal = document.createElement('div');
  modal.id = 'metric-detail-modal';
  modal.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 10000; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease;';
  
  // Sort by value (highest first for scores)
  const sorted = [...competitorValues].sort((a, b) => {
    const valA = typeof a.value === 'number' ? a.value : parseFloat(a.value) || 0;
    const valB = typeof b.value === 'number' ? b.value : parseFloat(b.value) || 0;
    return valB - valA;
  });
  
  modal.innerHTML = `
    <div style="background: white; border-radius: 16px; width: 90%; max-width: 800px; max-height: 85vh; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); animation: slideUp 0.3s ease;">
      <div style="background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%); padding: 20px 24px; color: white; display: flex; align-items: center; justify-content: space-between;">
        <div>
          <h2 style="margin: 0; font-size: 20px; font-weight: 600;">📊 ${escapeHtml(metricLabel)}</h2>
          <p style="margin: 6px 0 0; font-size: 13px; opacity: 0.85;">${competitorValues.length} competitors analyzed</p>
        </div>
        <button onclick="closeMetricDetailModal()" style="background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center;">&times;</button>
      </div>
      
      <div style="padding: 24px; max-height: calc(85vh - 80px); overflow-y: auto;">
        <div style="display: grid; gap: 16px;">
          ${sorted.map((item, idx) => {
            const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
            const isTop = idx < 3;
            const valueDisplay = typeof item.value === 'object' ? JSON.stringify(item.value, null, 2) : item.value;
            
            return `
              <div style="background: ${isTop ? 'linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%)' : '#f8fafc'}; border-radius: 12px; padding: 20px; border-left: 4px solid ${idx === 0 ? '#10b981' : idx === 1 ? '#3b82f6' : idx === 2 ? '#f59e0b' : '#9ca3af'};">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
                  <div style="display: flex; align-items: center; gap: 12px;">
                    <span style="font-size: 24px;">${medal}</span>
                    <div>
                      <div style="font-size: 16px; font-weight: 700; color: #1e293b;">${escapeHtml(item.domain || 'Unknown')}</div>
                      ${item.source ? `<span style="background: ${getSourceColor(item.source).bg}; color: ${getSourceColor(item.source).text}; padding: 2px 8px; border-radius: 8px; font-size: 10px; font-weight: 500; margin-top: 4px; display: inline-block;">${item.source}</span>` : ''}
                    </div>
                  </div>
                  <div style="text-align: right;">
                    <div style="font-size: 28px; font-weight: 800; color: ${isTop ? '#10b981' : '#64748b'};">${escapeHtml(String(valueDisplay))}</div>
                  </div>
                </div>
                ${item.details ? `
                  <div style="background: white; border-radius: 8px; padding: 12px; margin-top: 12px;">
                    <div style="font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 8px; text-transform: uppercase;">Raw Data Details</div>
                    <pre style="margin: 0; font-size: 11px; color: #374151; white-space: pre-wrap; word-break: break-all; font-family: 'Monaco', 'Consolas', monospace; max-height: 150px; overflow-y: auto;">${escapeHtml(typeof item.details === 'object' ? JSON.stringify(item.details, null, 2) : String(item.details))}</pre>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
  
  // Close on backdrop click
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeMetricDetailModal();
  });
  
  // Close on ESC key
  document.addEventListener('keydown', function escHandler(e) {
    if (e.key === 'Escape') {
      closeMetricDetailModal();
      document.removeEventListener('keydown', escHandler);
    }
  });
  
  document.body.appendChild(modal);
};

window.closeMetricDetailModal = function() {
  const modal = document.getElementById('metric-detail-modal');
  if (modal) modal.remove();
};

/**
 * Show PAA questions in a detail modal
 * @param {string} domain - The competitor domain
 * @param {Array} questions - Array of PAA question strings
 */
window.showPAADetailModal = function(domain, questions) {
  const existingModal = document.getElementById('paa-detail-modal');
  if (existingModal) existingModal.remove();
  
  const modal = document.createElement('div');
  modal.id = 'paa-detail-modal';
  modal.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 10000; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease;';
  
  const questionsList = Array.isArray(questions) ? questions : [];
  
  modal.innerHTML = `
    <div style="background: white; border-radius: 16px; width: 90%; max-width: 600px; max-height: 80vh; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);">
      <div style="background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); padding: 20px 24px; color: white; display: flex; align-items: center; justify-content: space-between;">
        <div>
          <h2 style="margin: 0; font-size: 18px; font-weight: 600;">❓ People Also Ask Questions</h2>
          <p style="margin: 6px 0 0; font-size: 13px; opacity: 0.9;">${escapeHtml(domain)} • ${questionsList.length} questions found</p>
        </div>
        <button onclick="document.getElementById('paa-detail-modal').remove()" style="background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px;">&times;</button>
      </div>
      
      <div style="padding: 20px; max-height: calc(80vh - 100px); overflow-y: auto;">
        ${questionsList.length > 0 ? `
          <div style="background: #eff6ff; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 12px; color: #1e40af;">
            💡 <strong>Pro Tip:</strong> Answer these questions in your content to improve AI citation probability. Each answered PAA can increase visibility by 15%.
          </div>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            ${questionsList.map((q, i) => `
              <div style="background: #f8fafc; padding: 16px; border-radius: 12px; border-left: 4px solid #3b82f6;">
                <div style="display: flex; align-items: flex-start; gap: 12px;">
                  <span style="background: #3b82f6; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0;">${i + 1}</span>
                  <div style="flex: 1;">
                    <div style="font-size: 14px; font-weight: 500; color: #1e293b; line-height: 1.5;">${escapeHtml(q)}</div>
                    <div style="margin-top: 8px; font-size: 11px; color: #64748b;">Source: Google Serper API</div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        ` : `
          <div style="text-align: center; padding: 40px 20px; color: #64748b;">
            <div style="font-size: 48px; margin-bottom: 16px;">🔍</div>
            <div style="font-size: 16px; font-weight: 500; margin-bottom: 8px;">No PAA Questions Found</div>
            <div style="font-size: 13px;">This competitor doesn't appear in People Also Ask results for the target keyword.</div>
          </div>
        `}
      </div>
    </div>
  `;
  
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  document.body.appendChild(modal);
};

/**
 * Show score calculation breakdown in a detail modal
 * @param {string} metricName - The metric name (e.g., "AI Readiness")
 * @param {string} domain - The competitor domain
 * @param {number} totalScore - The final calculated score
 * @param {Object} breakdown - Object with individual score components
 */
window.showScoreBreakdownModal = function(metricName, domain, totalScore, breakdown) {
  const existingModal = document.getElementById('score-breakdown-modal');
  if (existingModal) existingModal.remove();
  
  const modal = document.createElement('div');
  modal.id = 'score-breakdown-modal';
  modal.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 10000; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease;';
  
  // Build breakdown rows - supports AI Readiness and FAQ Score breakdowns
  const breakdownLabels = {
    // AI Readiness score components
    base: { label: 'Base Score', icon: '🏁', desc: 'Starting baseline for all competitors' },
    faqPage: { label: 'FAQPage Schema', icon: '❓', desc: 'Detected FAQPage schema markup' },
    howTo: { label: 'HowTo Schema', icon: '📝', desc: 'Detected HowTo schema markup' },
    article: { label: 'Article Schema', icon: '📰', desc: 'Detected Article/BlogPosting schema' },
    org: { label: 'Organization Schema', icon: '🏢', desc: 'Detected Organization/LocalBusiness schema' },
    product: { label: 'Product Schema', icon: '🛒', desc: 'Detected Product schema markup' },
    threeSchemas: { label: '3+ Schema Types', icon: '📋', desc: 'Has 3 or more schema types total' },
    wordCount: { label: 'Content Depth (2000+ words)', icon: '📚', desc: 'Content has 2000+ words' },
    paa: { label: 'PAA Presence', icon: '💬', desc: 'Appears in People Also Ask results' },
    // FAQ Score components
    faqPageSchema: { label: 'FAQPage Schema', icon: '❓', desc: 'Has FAQPage structured data (+40)' },
    howToSchema: { label: 'HowTo Schema', icon: '📝', desc: 'Has HowTo structured data (+20)' },
    contentFAQs: { label: 'Content FAQ Section', icon: '📄', desc: 'Content depth suggests FAQ coverage (+15)' },
    paaAlignment: { label: 'PAA Question Alignment', icon: '💬', desc: 'Appears in People Also Ask (+15)' },
    structuredAnswers: { label: 'Multiple Schema Types', icon: '📋', desc: 'Has 2+ schema types for answer depth (+10)' }
  };
  
  let breakdownHtml = '';
  let runningTotal = 0;
  
  Object.entries(breakdown || {}).forEach(([key, value]) => {
    const config = breakdownLabels[key] || { label: key, icon: '📌', desc: '' };
    const numValue = parseInt(value) || 0;
    runningTotal += numValue;
    const isActive = numValue > 0;
    
    breakdownHtml += `
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: ${isActive ? '#f0fdf4' : '#f8fafc'}; border-radius: 8px; border-left: 4px solid ${isActive ? '#10b981' : '#e5e7eb'};">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="font-size: 18px;">${config.icon}</span>
          <div>
            <div style="font-size: 13px; font-weight: 600; color: #1e293b;">${config.label}</div>
            <div style="font-size: 11px; color: #64748b;">${config.desc}</div>
          </div>
        </div>
        <div style="font-size: 16px; font-weight: 700; color: ${isActive ? '#10b981' : '#9ca3af'};">
          ${isActive ? '+' : ''}${numValue}
        </div>
      </div>
    `;
  });
  
  modal.innerHTML = `
    <div style="background: white; border-radius: 16px; width: 90%; max-width: 500px; max-height: 85vh; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);">
      <div style="background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); padding: 20px 24px; color: white; display: flex; align-items: center; justify-content: space-between;">
        <div>
          <h2 style="margin: 0; font-size: 18px; font-weight: 600;">📊 ${escapeHtml(metricName)} Breakdown</h2>
          <p style="margin: 6px 0 0; font-size: 13px; opacity: 0.9;">${escapeHtml(domain)}</p>
        </div>
        <button onclick="document.getElementById('score-breakdown-modal').remove()" style="background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px;">&times;</button>
      </div>
      
      <div style="padding: 20px; max-height: calc(85vh - 140px); overflow-y: auto;">
        <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;">
          ${breakdownHtml}
        </div>
        
        <div style="background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); color: white; padding: 16px 20px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between;">
          <div>
            <div style="font-size: 12px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.5px;">Final Score</div>
            <div style="font-size: 11px; opacity: 0.7; margin-top: 2px;">Capped at 100%</div>
          </div>
          <div style="font-size: 36px; font-weight: 800;">${totalScore}%</div>
        </div>
      </div>
    </div>
  `;
  
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  document.body.appendChild(modal);
};
</script>
