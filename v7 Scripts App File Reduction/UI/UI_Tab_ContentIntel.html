<script>
  /**
   * ============================================================================
   * UI_Tab_ContentIntel.html
   * ============================================================================
   * Extracted from UI_Scripts_App.html for modular architecture
   * 
   * Contains:
   * - populateContentIntelligenceTab() - Main Content Intelligence tab population
   * 
   * Dependencies:
   * - renderExecutiveGeminiInsight() from UI_Executive_Renderer.html
   * - renderRawDataComparisonTable() from UI_Raw_Data_Tables.html
   * - renderOnePercentStrategyPanel() from UI_Strategy_Panel.html
   * - renderEliteContentStrategy() from UI_Scripts_App.html (or dedicated file)
   * - renderContentIntelligenceCharts() from UI_Scripts_App.html (or dedicated file)
   * - getGeminiInsightsForTab() from UI_Gemini_Insights.html
   * - generateExecutiveInsightConfig() from UI_Executive_Config.html
   * ============================================================================
   */

  /**
   * Populate Content Intelligence Tab - ELITE v9.0
   * Uses FT_GenerateEliteTabIntelligence → PSEO Detection, Topical Coverage,
   * Content Velocity, Direct-to-Answer, Content Quality Matrix, Kill Moves
   */
  function populateContentIntelligenceTab(data) {
    console.log('📊 Populating Content Intelligence Tab (Elite v9.0 - CONTENT STRATEGY)...');

    // V3.3: Use correct data-comp-panel selectors matching UI_Components_Competitors.html
    let metricsDiv = document.getElementById('comp-content-metrics');
    let insightsDiv = document.getElementById('comp-content-insights');

    if (!metricsDiv || !insightsDiv) {
      const panel = document.querySelector('[data-comp-panel="content"]') ||
        document.getElementById('panel-contentIntelligence');
      if (panel) {
        console.log('🔧 Creating dynamic containers inside content panel');
        if (!metricsDiv) {
          metricsDiv = panel.querySelector('#comp-content-metrics') || (() => {
            const c = document.createElement('div'); c.id = 'comp-content-metrics'; c.className = 'comp-metrics-grid'; c.style.width = '100%';
            const h = panel.querySelector('.panel-header'); if (h?.nextSibling) panel.insertBefore(c, h.nextSibling); else panel.insertBefore(c, panel.firstChild);
            return c;
          })();
        }
        if (!insightsDiv) {
          insightsDiv = panel.querySelector('#comp-content-insights') || (() => {
            const c = document.createElement('div'); c.id = 'comp-content-insights'; c.className = 'comp-insights'; c.style.width = '100%'; c.style.marginTop = '24px';
            panel.appendChild(c); return c;
          })();
        }
      }
    }

    if (!metricsDiv || !insightsDiv) {
      console.warn('⚠️ Content Intelligence tab containers not found - check UI_Components_Competitors.html has data-comp-panel="content"');
      return;
    }

    const competitors = data.competitors || [];
    const gemini = data.geminiAnalysis || data.analysis || {};
    const contentStrategy = gemini.categories?.contentStrategy || gemini.contentStrategy || {};

    if (competitors.length === 0) {
      metricsDiv.innerHTML = '<div class="empty-state" style="text-align:center;padding:40px;"><p>No competitors to analyze.</p></div>';
      return;
    }

    // ---------------------------------------------------------------------------
    // ELITE TAB INTELLIGENCE v9.0 - Check for enhanced data
    // ---------------------------------------------------------------------------
    const eliteData = data.eliteTabIntelligence || window._eliteTabIntelligence;
    const contentStrat = eliteData?.contentStrategy;

    if (contentStrat) {
      console.log('🚀 Using ELITE Tab Intelligence v9.0 for Content Strategy Tab');
      console.log('   Topical Coverage:', contentStrat.topicalCoverageScore?.length || 0);
      console.log('   PSEO Detection:', contentStrat.pseoPatternDetection?.length || 0);
      console.log('   Content Velocity:', contentStrat.contentVelocity?.length || 0);
      console.log('   Kill Moves:', contentStrat.killMoves?.length || 0);

      // CRITICAL: Mark Elite mode active to prevent chart rendering attempts
      window._contentEliteModeActive = true;

      renderEliteContentStrategy(metricsDiv, insightsDiv, contentStrat, competitors, eliteData);
      return;
    }

    // Fallback mode - charts will be rendered
    window._contentEliteModeActive = false;

    // FALLBACK: Original content analysis (this is normal if Elite mode wasn't enabled)
    console.log('📋 Using standard content analysis mode...');
    
    // NEW: Check organized data from FT_OracleDataOrganizer for content/headings data
    const organizedData = data?.organizedData || 
                          data?.eliteTabIntelligence?.organizedData ||
                          window._organizedData ||
                          window._eliteTabIntelligence?.organizedData;
    const organizedContentMap = {};
    if (organizedData && organizedData.length > 0) {
      console.log('📦 Found organized data for content tab');
      organizedData.forEach(comp => {
        const rawData = comp?.tabData?.contentIntel?.rawData;
        if (rawData) {
          organizedContentMap[comp.domain] = rawData;
        }
      });
    }

    // DEBUG: Log first competitor's data structure
    if (competitors.length > 0) {
      const c = competitors[0];
      
      // v28.7 FIX: Check all possible synthesized data locations
      const synthData = c.synthesized || c.rawData?.synthesized || c.finalData?.synthesized || {};
      
      // Check all possible serper data locations
      const serperData = c.stages?.serper?.data || c.apiData?.serper || synthData.seo || {};
      const organicCount = serperData.organic?.length || c.keywordProfile?.organic?.length || 0;
      const paaCount = serperData.peopleAlsoAsk?.length || c.keywordProfile?.peopleAlsoAsk?.length || 0;
      const relatedCount = serperData.relatedSearches?.length || c.keywordProfile?.relatedSearches?.length || 0;
      
      console.log('🔍 DEBUG - First competitor data structure:');
      console.log('   Domain:', c.domain);
      console.log('   synthesized (direct):', c.synthesized ? 'EXISTS' : 'MISSING');
      console.log('   rawData.synthesized:', c.rawData?.synthesized ? 'EXISTS' : 'MISSING');
      console.log('   synthData (resolved):', synthData ? 'EXISTS' : 'MISSING');
      console.log('   synthData.website:', synthData?.website);
      console.log('   synthData.website.title:', synthData?.website?.title);
      console.log('   synthData.website.wordCount:', synthData?.website?.wordCount);
      console.log('   synthData.website.dataSource:', synthData?.website?.dataSource);
      console.log('   synthData.topPages:', synthData?.topPages);
      console.log('   snapshot.metadata:', c.snapshot?.metadata);
      console.log('   serper.organic:', organicCount, 'results (from stages/apiData/synthesized)');
      console.log('   serper.peopleAlsoAsk:', paaCount, 'questions');
      console.log('   serper.relatedSearches:', relatedCount, 'terms');
      console.log('   keywordProfile:', c.keywordProfile ? 'EXISTS' : 'N/A');
      console.log('   organizedContentData:', organizedContentMap[c.domain] ? 'AVAILABLE' : 'N/A');
    }

    // Generate executive insight for content
    const contentExecConfig = generateExecutiveInsightConfig('content', competitors, gemini);
    const avgWordCount = competitors.reduce((sum, c) => {
      const orgData = organizedContentMap[c.domain] || {};
      // v28.7 FIX: Check all synthesized locations
      const synthData = c.synthesized || c.rawData?.synthesized || c.finalData?.synthesized || {};
      const wc = orgData.wordCount || synthData?.website?.wordCount || c.processedMetrics?.wordCount || 0;
      return sum + wc;
    }, 0) / (competitors.length || 1);
    
    contentExecConfig.executiveSummary = `Content analysis across ${competitors.length} competitors shows average word count of ${Math.round(avgWordCount)}. ${avgWordCount < 1000 ? 'Content depth is below industry standards - significant expansion opportunity.' : avgWordCount < 2000 ? 'Moderate content depth - targeted expansion recommended.' : 'Strong content foundations - focus on topical authority.'}`;
    if (contentStrategy.analysis) contentExecConfig.executiveSummary = contentStrategy.analysis;
    contentExecConfig.dataProofs = ['Oracle Fetcher', 'Serper API', 'Content Analysis', 'Heading Structure'];

    // Build Elite Content Intelligence Dashboard
    let html = `
          <!-- EXECUTIVE INTELLIGENCE BRIEF -->
          ${renderExecutiveGeminiInsight(contentExecConfig)}
          
          <!-- CONTENT INTELLIGENCE HEADER -->
          <div style="background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; padding: 24px; border-radius: 16px; margin-bottom: 24px; box-shadow: 0 4px 15px rgba(59,130,246,0.3);">
            <h3 style="margin: 0 0 16px; font-size: 22px; font-weight: 700;">📈 Organic Traffic & Content Intelligence</h3>
            <p style="margin: 0; opacity: 0.9; font-size: 14px;">Deep content analysis from PHP Fetcher, SERP data, and semantic analysis</p>
          </div>
          
          <!-- CONTENT METRICS COMPARISON TABLE -->
          <div style="background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 24px; overflow-x: auto;">
            <h4 style="margin: 0 0 20px; font-size: 16px; font-weight: 700; color: #202124;">
              📊 Content Quality & Depth Analysis
              <span style="font-size: 11px; font-weight: 400; color: #666; margin-left: 8px;">[Data Source: PHP Fetcher + Serper API]</span>
            </h4>
            <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
              <thead>
                <tr style="background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);">
                  <th style="text-align: left; padding: 14px 12px; border-bottom: 2px solid #e2e8f0; font-weight: 700;">Competitor</th>
                  <th style="text-align: center; padding: 14px 12px; border-bottom: 2px solid #e2e8f0; font-weight: 700;">Word Count</th>
                  <th style="text-align: center; padding: 14px 12px; border-bottom: 2px solid #e2e8f0; font-weight: 700;">Title</th>
                  <th style="text-align: center; padding: 14px 12px; border-bottom: 2px solid #e2e8f0; font-weight: 700;">Schema Types</th>
                  <th style="text-align: center; padding: 14px 12px; border-bottom: 2px solid #e2e8f0; font-weight: 700;">SERP Pages</th>
                  <th style="text-align: center; padding: 14px 12px; border-bottom: 2px solid #e2e8f0; font-weight: 700;">Content Score</th>
                  <th style="text-align: center; padding: 14px 12px; border-bottom: 2px solid #e2e8f0; font-weight: 700;">Data Source</th>
                </tr>
              </thead>
              <tbody>`;

    // Process each competitor with REAL content data
    competitors.forEach((comp, index) => {
      const pm = comp.processedMetrics || {};
      const synthesized = comp.synthesized || {};
      const website = synthesized.website || {};
      const content = synthesized.content || {};
      const apiData = comp.apiData || {};
      const serper = apiData.serper || {};
      const snapshot = comp.snapshot || {};

      // Extract REAL content data
      const wordCount = website.wordCount || snapshot.metadata?.wordCount || pm.wordCount || 0;
      const title = website.title || snapshot.metadata?.title || 'N/A';
      const schemaTypes = website.schemaTypes || snapshot.schema?.types || [];
      const serpPages = (serper.organic || []).length || pm.indexedPages || 0;
      const hasRealData = wordCount > 0 || title !== 'N/A';

      // Calculate content score based on real signals
      let contentScore = 40; // Base
      if (wordCount >= 3000) contentScore += 25;
      else if (wordCount >= 1500) contentScore += 15;
      else if (wordCount >= 500) contentScore += 5;
      if (schemaTypes.length >= 3) contentScore += 20;
      else if (schemaTypes.length >= 1) contentScore += 10;
      if (serpPages >= 10) contentScore += 15;
      else if (serpPages >= 5) contentScore += 8;
      contentScore = Math.min(100, contentScore);

      const dataSource = hasRealData ? '✅ Fetcher API' : (pm.wordCount ? '📦 Cached' : '⏳ Pending');
      const getScoreColor = (score) => score >= 70 ? '#22c55e' : score >= 50 ? '#3b82f6' : '#f59e0b';

      html += `
            <tr style="border-bottom: 1px solid #f1f5f9; ${index % 2 === 1 ? 'background: #fafafa;' : ''}">
              <td style="padding: 16px 12px;">
                <div style="font-weight: 600; color: #1f2937;">${index + 1}. ${comp.domain}</div>
              </td>
              <td style="text-align: center; padding: 16px 12px;">
                <span style="font-weight: 700; color: ${wordCount >= 1500 ? '#22c55e' : wordCount >= 500 ? '#3b82f6' : '#6b7280'};">
                  ${wordCount > 0 ? wordCount.toLocaleString() : 'N/A'}
                </span>
              </td>
              <td style="padding: 16px 12px; max-width: 200px;">
                <div style="font-size: 12px; color: #374151; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${title}">
                  ${title.substring(0, 40)}${title.length > 40 ? '...' : ''}
                </div>
              </td>
              <td style="text-align: center; padding: 16px 12px;">
                ${schemaTypes.length > 0 ?
          `<span style="background: #dcfce7; color: #166534; padding: 4px 8px; border-radius: 6px; font-size: 11px;">${schemaTypes.length} types</span>` :
          `<span style="background: #fee2e2; color: #991b1b; padding: 4px 8px; border-radius: 6px; font-size: 11px;">None</span>`
        }
              </td>
              <td style="text-align: center; padding: 16px 12px;">
                <span style="font-weight: 600; color: #374151;">${serpPages}</span>
              </td>
              <td style="text-align: center; padding: 16px 12px;">
                <div style="display: inline-block; padding: 6px 12px; border-radius: 8px; font-weight: 700; color: white; background: ${getScoreColor(contentScore)};">
                  ${contentScore}/100
                </div>
              </td>
              <td style="text-align: center; padding: 16px 12px;">
                <span style="font-size: 11px; color: ${hasRealData ? '#22c55e' : '#f59e0b'};">${dataSource}</span>
              </td>
            </tr>`;
    });

    html += `
              </tbody>
            </table>
          </div>
          
          <!-- CONTENT DEEP DIVE CARDS - Enhanced with Clickable Links -->
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 24px;">`;

    // Content detail cards with real data + clickable top pages
    competitors.slice(0, 6).forEach((comp, index) => {
      const synthesized = comp.synthesized || {};
      const website = synthesized.website || {};
      const content = synthesized.content || {};
      const apiData = comp.apiData || {};
      const serper = apiData.serper || {};
      const snapshot = comp.snapshot || {};
      const stages = comp.stages || {};

      // Extract metadata with proper fallbacks
      const title = website.title || snapshot.metadata?.title || '';
      const description = website.description || snapshot.metadata?.description || '';
      const h1 = website.h1 || snapshot.metadata?.h1 || '';
      const wordCount = website.wordCount || snapshot.metadata?.wordCount || 0;
      const schemaTypes = website.schemaTypes || snapshot.schema?.types || [];
      const dataSource = website.dataSource || (stages.phpFetcher?.success ? 'PHP Fetcher' : 'Serper SERP');

      // Get top pages from synthesized.topPages (new) or fallback to serper organic
      const topPages = synthesized.topPages || content.topPages || (serper.organic || []).slice(0, 5).map((item, i) => ({
        position: item.position || (i + 1),
        title: item.title || '',
        url: item.link || '',
        snippet: item.snippet || ''
      }));

      const borderColors = ['#3b82f6', '#22c55e', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6'];

      html += `
            <div style="background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-top: 4px solid ${borderColors[index] || '#6b7280'};">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h5 style="margin: 0; font-size: 14px; font-weight: 700; color: #374151;">${comp.domain}</h5>
                <span style="font-size: 10px; padding: 3px 8px; border-radius: 12px; background: ${dataSource.includes('PHP') ? '#dcfce7' : '#dbeafe'}; color: ${dataSource.includes('PHP') ? '#166534' : '#1e40af'};">${dataSource}</span>
              </div>
              
              <!-- Page Title -->
              <div style="margin-bottom: 14px;">
                <div style="font-size: 10px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">📄 Page Title</div>
                <div style="font-size: 13px; color: #1f2937; font-weight: 500; line-height: 1.4;">${title ? (title.substring(0, 70) + (title.length > 70 ? '...' : '')) : '<span style="color:#9ca3af;">Not detected</span>'}</div>
              </div>
              
              <!-- Meta Description -->
              <div style="margin-bottom: 14px;">
                <div style="font-size: 10px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">📝 Meta Description</div>
                <div style="font-size: 12px; color: #4b5563; line-height: 1.5;">${description ? (description.substring(0, 140) + (description.length > 140 ? '...' : '')) : '<span style="color:#9ca3af;">Not detected</span>'}</div>
              </div>
              
              <!-- H1 Heading -->
              <div style="margin-bottom: 14px;">
                <div style="font-size: 10px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">🏷️ H1 Heading</div>
                <div style="font-size: 13px; color: #374151; font-weight: 500;">${h1 ? (h1.substring(0, 60) + (h1.length > 60 ? '...' : '')) : '<span style="color:#9ca3af;">Not detected</span>'}</div>
              </div>
              
              <!-- Content Metrics Row -->
              <div style="display: flex; gap: 16px; margin-bottom: 16px; padding: 12px; background: #f9fafb; border-radius: 8px;">
                <div style="text-align: center; flex: 1;">
                  <div style="font-size: 18px; font-weight: 700; color: ${wordCount >= 1500 ? '#22c55e' : wordCount >= 500 ? '#3b82f6' : '#9ca3af'};">${wordCount > 0 ? wordCount.toLocaleString() : '—'}</div>
                  <div style="font-size: 10px; color: #6b7280;">Words</div>
                </div>
                <div style="text-align: center; flex: 1;">
                  <div style="font-size: 18px; font-weight: 700; color: ${schemaTypes.length > 0 ? '#8b5cf6' : '#9ca3af'};">${schemaTypes.length || '—'}</div>
                  <div style="font-size: 10px; color: #6b7280;">Schema</div>
                </div>
                <div style="text-align: center; flex: 1;">
                  <div style="font-size: 18px; font-weight: 700; color: #3b82f6;">${topPages.length || 0}</div>
                  <div style="font-size: 10px; color: #6b7280;">SERP Hits</div>
                </div>
              </div>
              
              <!-- Top Indexed Pages with CLICKABLE LINKS -->
              ${topPages.length > 0 ? `
              <div>
                <div style="font-size: 10px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;">🔗 Top Indexed Pages</div>
                ${topPages.slice(0, 5).map((p, i) => {
        const pageUrl = p.url || p.link || '';
        const pageTitle = p.title || pageUrl.split('/').pop() || 'Page ' + (i + 1);
        return `
                  <a href="${pageUrl}" target="_blank" rel="noopener" style="display: block; margin-bottom: 8px; padding: 10px 12px; background: #f0f9ff; border-radius: 8px; text-decoration: none; border-left: 3px solid #3b82f6; transition: all 0.2s;" onmouseover="this.style.background='#dbeafe'; this.style.transform='translateX(4px)';" onmouseout="this.style.background='#f0f9ff'; this.style.transform='translateX(0)';">
                    <div style="font-size: 12px; color: #1e40af; font-weight: 500; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                      ${i + 1}. ${pageTitle.substring(0, 50)}${pageTitle.length > 50 ? '...' : ''}
                    </div>
                    <div style="font-size: 10px; color: #6b7280; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                      🌐 ${pageUrl.substring(0, 45)}${pageUrl.length > 45 ? '...' : ''}
                    </div>
                  </a>`;
      }).join('')}
              </div>
              ` : `
              <div style="padding: 16px; background: #fef3c7; border-radius: 8px; text-align: center;">
                <span style="font-size: 11px; color: #92400e;">⚠️ No SERP data available - run analysis again</span>
              </div>
              `}
            </div>`;
    });

    html += `
          </div>
          
          <!-- --------------------------------------------------------------------------- -->
          <!-- ELITE RAW CONTENT DATA COMPARISON (Ahrefs/SEMrush Level) -->
          <!-- --------------------------------------------------------------------------- -->
          <h4 style="margin: 30px 0 20px; font-size: 20px; font-weight: 800; color: #202124;">
            📊 Raw Content Data Comparison (Ahrefs/SEMrush Level)
          </h4>
        `;

    // Content Depth & Structure Comparison - v28.7: Use helper function
    const contentDepthData = competitors.slice(0, 6).map(c => {
      const website = getWebsiteData(c);  // v28.7: Use helper
      return {
        domain: c.domain,
        wordCount: website.wordCount || 0,
        h1Count: (website.h1 || []).length,
        h2Count: (website.h2 || []).length,
        h3Count: (website.h3 || []).length
      };
    });
    const contentLeader = contentDepthData.reduce((best, c) => c.wordCount > (best?.wordCount || 0) ? c : best, null);
    const geminiContentInsight = contentLeader && contentLeader.wordCount > 0
      ? `${contentLeader.domain} leads with ${contentLeader.wordCount.toLocaleString()} words. Comprehensive content (2000+ words) ranks 2.3x better for competitive terms. Target ${Math.max(contentLeader.wordCount + 500, 2000)} words to outrank.`
      : 'Word count data pending. Run analysis to benchmark content depth against competitors.';

    html += renderRawDataComparisonTable({
      title: 'Content Depth & Structure',
      icon: '📏',
      description: 'Word count, heading structure, and content organization from each competitor',
      competitors: competitors,
      geminiInsight: geminiContentInsight,
      dataExtractor: (c) => {
        const website = getWebsiteData(c);  // v28.7: Use helper
        const snapshot = c.snapshot || {};
        return {
          wordCount: website.wordCount || snapshot.metadata?.wordCount || 0,
          h1Count: (website.h1 || []).length,
          h2Count: (website.h2 || []).length,
          h3Count: (website.h3 || []).length,
          totalHeadings: (website.h1 || []).length + (website.h2 || []).length + (website.h3 || []).length,
          paragraphs: website.paragraphs || Math.ceil((website.wordCount || 0) / 150),
          avgSentenceLength: website.avgSentenceLength || 15,
          readability: website.readabilityScore || (website.wordCount > 1500 ? 'Long-form' : website.wordCount > 500 ? 'Medium' : 'Short')
        };
      },
      fields: [
        { key: 'wordCount', label: 'Word Count', icon: '📝', type: 'number', compareMode: 'highest' },
        { key: 'h1Count', label: 'H1 Tags', icon: '🏷️', type: 'number' },
        { key: 'h2Count', label: 'H2 Tags', icon: '📌', type: 'number', compareMode: 'highest' },
        { key: 'h3Count', label: 'H3 Tags', icon: '📍', type: 'number' },
        { key: 'totalHeadings', label: 'Total Headings', icon: '🔢', type: 'number', compareMode: 'highest' },
        { key: 'readability', label: 'Content Type', icon: '📖', type: 'text' }
      ]
    });

    // Title & Meta Comparison - v28.7: Use helper function
    html += renderRawDataComparisonTable({
      title: 'Title & Meta Tags Analysis',
      icon: '🏷️',
      description: 'Actual title tags and meta descriptions from each competitor homepage',
      competitors: competitors,
      geminiInsight: 'Optimal title length is 50-60 characters, meta description 150-160 characters. Include primary keyword in both for maximum click-through rate.',
      dataExtractor: (c) => {
        const website = getWebsiteData(c);  // v28.7: Use helper
        const snapshot = c.snapshot || {};
        const metadata = snapshot.metadata || {};
        const title = website.title || metadata.title || '';
        const description = website.description || website.metaDescription || metadata.description || '';
        return {
          title: title || 'Not detected',
          titleLength: title.length,
          titleOptimal: title.length >= 50 && title.length <= 60 ? '✅ Optimal' : title.length > 60 ? '⚠️ Too Long' : '⚠️ Too Short',
          metaDescription: description || 'Not detected',
          metaLength: description.length,
          metaOptimal: description.length >= 150 && description.length <= 160 ? '✅ Optimal' : description.length > 160 ? '⚠️ Too Long' : '⚠️ Too Short'
        };
      },
      fields: [
        { key: 'title', label: 'Page Title', icon: '📄', type: 'text-long' },
        { key: 'titleLength', label: 'Title Length', icon: '📐', type: 'number', compareMode: 'closest_to_55' },
        { key: 'titleOptimal', label: 'Title Status', icon: '✓', type: 'text' },
        { key: 'metaDescription', label: 'Meta Description', icon: '📝', type: 'text-long' },
        { key: 'metaLength', label: 'Meta Length', icon: '📐', type: 'number', compareMode: 'closest_to_155' }
      ]
    });

    // H1 and H2 Headings Deep Dive - v28.7: Use helper function
    html += renderRawDataComparisonTable({
      title: 'Heading Tags (H1/H2) Deep Dive',
      icon: '🔤',
      description: 'Actual H1 and top H2 headings extracted from each competitor page',
      competitors: competitors,
