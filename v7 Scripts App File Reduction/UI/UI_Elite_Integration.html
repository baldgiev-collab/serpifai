  <script>
  /**
   * ═══════════════════════════════════════════════════════════════════════════
   * ELITE COMPETITOR ANALYSIS INTEGRATION (v6 SaaS)
   * ═══════════════════════════════════════════════════════════════════════════
   * Wires up Stage 1 "Analyze Competitors" button to PHP Gateway backend
   * Handles: Loading states, progress tracking, error handling, result rendering
   * Uses: google.script.run → UI_Main.gs → runEliteCompetitorAnalysis() → UI_Gateway.gs → PHP Gateway
   * ═══════════════════════════════════════════════════════════════════════════
   */

  /**
   * Initialize competitor analysis button handler
   */
  function initCompetitorAnalysis() {
    const analyzeBtn = document.getElementById('btnAnalyzeCompetitors');
    
    if (analyzeBtn) {
      analyzeBtn.addEventListener('click', handleCompetitorAnalysisClick);
      console.log('✅ Competitor analysis button initialized');
    } else {
      console.warn('⚠️ Competitor analysis button not found');
    }
  }

  /**
   * Handle analyze button click
   */
  async function handleCompetitorAnalysisClick(event) {
    event.preventDefault();
    
    console.log('');
    console.log('═══════════════════════════════════════════════════════════════');
    console.log('🚀 COMPETITOR ANALYSIS BUTTON CLICKED');
    console.log('═══════════════════════════════════════════════════════════════');
    console.log('Event:', event.type);
    console.log('Button:', event.target.id);
    console.log('Timestamp:', new Date().toISOString());
    console.log('');
    
    try {
      // 1. COLLECT COMPETITOR URLs
      console.log('[1/5] 📋 Collecting competitor URLs...');
      const competitorInput = document.getElementById('keyCompetitors');
      console.log('   Input element found:', !!competitorInput);
      console.log('   Input value:', competitorInput ? competitorInput.value.substring(0, 50) + '...' : 'NULL');
      
      let competitorUrls = [];
      
      if (competitorInput && competitorInput.value.trim()) {
        competitorUrls = competitorInput.value
          .split(/[,\n]/)
          .map(url => {
            url = url.trim();
            
            // Remove protocols
            url = url.replace(/^https?:\/\//i, '');
            
            // Remove trailing slashes and paths
            url = url.split('/')[0];
            
            // Normalize company names to domains
            const domainMap = {
              'toptal': 'toptal.com',
              'globant': 'globant.com',
              'turing': 'turing.com',
              'andela': 'andela.com',
              'epam systems': 'epam.com',
              'epam': 'epam.com',
              'thoughtworks': 'thoughtworks.com',
              'thoughtworks.': 'thoughtworks.com'
            };
            
            const lowerUrl = url.toLowerCase();
            if (domainMap[lowerUrl]) {
              console.log(`   🔄 Normalized "${url}" → "${domainMap[lowerUrl]}"`);
              return domainMap[lowerUrl];
            }
            
            // If no dot in URL, add .com
            if (!url.includes('.')) {
              console.log(`   🔄 Added .com to "${url}" → "${url}.com"`);
              return url.toLowerCase() + '.com';
            }
            
            return url.toLowerCase();
          })
          .filter(url => url.length > 0);
        
        console.log('   Found competitors:', competitorUrls.length);
        console.log('   Normalized competitors:', competitorUrls);
        
        if (competitorUrls.length > 6) {
          console.log('   ❌ Too many competitors:', competitorUrls.length);
          showToast('Maximum 6 competitors allowed', 'warning');
          return;
        }
        
        if (competitorUrls.length === 0) {
          console.log('   ❌ No competitors after parsing');
          showToast('Please enter at least one competitor URL', 'warning');
          return;
        }
        
        console.log(`   ✅ Will analyze ${competitorUrls.length} competitors`);
      } else {
        console.log('   ❌ No competitor input found or empty');
        showToast('Please enter competitor URLs in Stage 1', 'warning');
        return;
      }
      
      // 2. COLLECT PROJECT CONTEXT from Stage 1 form
      console.log('[2/5] 🎯 Collecting project context...');
      const projectContext = collectProjectContext();
      console.log('   Brand:', projectContext.brandName || '(empty)');
      console.log('   Target Audience:', projectContext.targetAudience || '(empty)');
      console.log('   Core Topic:', projectContext.coreTopic || '(empty)');
      
      // 3. VERIFY LICENSE KEY
      console.log('[3/5] 🔑 Verifying license key...');
      
      // Try to get license key status from settings
      let hasLicenseKey = false;
      try {
        const settingsData = window.settingsModule ? window.settingsModule.getSettings() : null;
        hasLicenseKey = settingsData && settingsData.hasLicenseKey;
        console.log('   License key status:', hasLicenseKey ? '✅ Present' : '⚠️ Not found');
      } catch (e) {
        console.log('   ⚠️ Could not check license key:', e.message);
      }
      
      // 4. SHOW LOADING STATE
      console.log('[4/5] ⏳ Showing loading state...');
      
      // Add analyzing class to button for visual feedback with estimated time
      const analyzeBtn = document.getElementById('btnAnalyzeCompetitors');
      if (analyzeBtn) {
        analyzeBtn.classList.add('analyzing');
        analyzeBtn.disabled = true;
        
        // Realistic estimate based on actual API timings:
        // - PageSpeed API: ~5-8s per competitor
        // - OpenPageRank API: ~2-3s per competitor
        // - Serper API: ~3-4s per competitor
        // - Gemini AI analysis: ~10-15s total
        // Total: ~25-30s per competitor + 15s for AI
        const estimatedSeconds = (competitorUrls.length * 28) + 15;
        const estimatedMinutes = Math.floor(estimatedSeconds / 60);
        const estimatedSecs = estimatedSeconds % 60;
        const timeText = estimatedMinutes > 0 
          ? `${estimatedMinutes}:${estimatedSecs.toString().padStart(2, '0')}`
          : `${estimatedSeconds}s`;
        
        // Update button content with status and time
        analyzeBtn.innerHTML = `
          <span class="btn-icon">⏳</span>
          <span class="btn-text">Initializing...</span>
          <span class="btn-time">${timeText}</span>
        `;
        
        // Start status updates on the button
        startButtonStatusUpdates(analyzeBtn, competitorUrls.length, estimatedSeconds);
        
        console.log('   ✅ Button state updated to analyzing');
        console.log('   ⏱️ Estimated time:', estimatedSeconds, 'seconds');
      }
      
      showCompetitorLoadingState(competitorUrls.length);
      
      // 5. CALL BACKEND API via Gateway
      console.log('[5/5] 📡 Calling backend API...');
      console.log('   → Function: runEliteCompetitorAnalysis');
      console.log('   → Competitors:', competitorUrls.length, 'domains');
      console.log('   → Project:', projectContext.brandName || 'Unknown');
      console.log('');
      
      const result = await callCompetitorAnalysisAPI(competitorUrls, projectContext);
      
      // 5. HIDE LOADING, SHOW RESULTS
      console.log('');
      console.log('📥 Backend response received');
      console.log('   Success:', result?.success);
      console.log('   Error:', result?.error || 'None');
      console.log('');
      
      hideCompetitorLoadingState();
      resetAnalyzeButton(result?.success ? 'success' : 'error');
      
      if (result && result.success) {
        // Switch to competitor tab
        switchToCompetitorTab();
        
        // Render results
        renderCompetitorIntelligence(result);
        
        const competitorCount = result.competitors ? Object.keys(result.competitors).length : 0;
        console.log('✅ SUCCESS! Analyzed', competitorCount, 'competitors');
        console.log('═══════════════════════════════════════════════════════════════');
        console.log('');
        
        showToast(`✅ Analysis complete! ${competitorCount} competitors loaded`, 'success');
      } else {
        console.log('❌ FAILED:', result?.error || 'Unknown error');
        console.log('═══════════════════════════════════════════════════════════════');
        console.log('');
        
        showToast(result?.error || 'Analysis failed', 'error');
        showCompetitorError(result?.error || 'Unknown error occurred');
      }
      
    } catch (error) {
      console.log('');
      console.log('❌ ❌ Error:', error);
      console.log('   Message:', error.message);
      console.log('   Stack:', error.stack);
      console.log('═══════════════════════════════════════════════════════════════');
      console.log('');
      
      hideCompetitorLoadingState();
      resetAnalyzeButton('error');
      
      // Handle credit errors
      if (error.message && error.message.includes('credit')) {
        showToast('Insufficient credits. Please upgrade your plan.', 'error');
      } else {
        showToast('Analysis failed: ' + error.message, 'error');
      }
      
      showCompetitorError(error.message);
    }
  }

  /**
   * Reset the analyze button to its original state
   * @param {string} status - 'success' or 'error'
   */
  function resetAnalyzeButton(status) {
    const analyzeBtn = document.getElementById('btnAnalyzeCompetitors');
    if (!analyzeBtn) return;
    
    // Clear any status update timers
    if (window.buttonStatusTimer) {
      clearInterval(window.buttonStatusTimer);
      window.buttonStatusTimer = null;
    }
    
    analyzeBtn.classList.remove('analyzing');
    analyzeBtn.disabled = false;
    
    if (status === 'success') {
      analyzeBtn.innerHTML = `
        <span class="btn-icon">✅</span>
        <span class="btn-text">Analysis Complete!</span>
      `;
      
      // Reset after 3 seconds
      setTimeout(() => {
        analyzeBtn.innerHTML = `
          <span class="btn-icon">⚡</span>
          <span class="btn-text">Analyze Competitors</span>
        `;
      }, 3000);
    } else {
      analyzeBtn.innerHTML = `
        <span class="btn-icon">❌</span>
        <span class="btn-text">Analysis Failed</span>
      `;
      
      // Reset after 3 seconds
      setTimeout(() => {
        analyzeBtn.innerHTML = `
          <span class="btn-icon">⚡</span>
          <span class="btn-text">Analyze Competitors</span>
        `;
      }, 3000);
    }
  }

  /**
   * Start status updates on the button during analysis
   * Shows progressive (non-repeating) status messages with countdown timer
   * Based on realistic API call timing:
   * - PageSpeed API: ~5-8s per competitor
   * - OpenPageRank API: ~2-3s per competitor  
   * - Serper API: ~3-4s per competitor
   * - Gemini AI: ~10-15s total
   * Total: ~25-30s per competitor
   */
  function startButtonStatusUpdates(analyzeBtn, competitorCount, estimatedSeconds) {
    // Progressive statuses with approximate timing (percentage of total time)
    const statuses = [
      { text: 'Initializing analysis...', percent: 0 },
      { text: 'Fetching competitor websites...', percent: 5 },
      { text: 'Analyzing SEO metrics...', percent: 15 },
      { text: 'Checking page speed scores...', percent: 30 },
      { text: 'Getting domain authority...', percent: 45 },
      { text: 'Gathering SERP intelligence...', percent: 60 },
      { text: 'Running AI analysis...', percent: 75 },
      { text: 'Generating strategic insights...', percent: 85 },
      { text: 'Finalizing report...', percent: 95 }
    ];
    
    let secondsElapsed = 0;
    const startTime = Date.now();
    
    // Update every second for smoother countdown
    window.buttonStatusTimer = setInterval(() => {
      secondsElapsed = Math.floor((Date.now() - startTime) / 1000);
      
      // Calculate progress percentage
      const progressPercent = Math.min(99, Math.floor((secondsElapsed / estimatedSeconds) * 100));
      
      // Find appropriate status based on progress (don't repeat)
      let currentStatus = statuses[0].text;
      for (let i = statuses.length - 1; i >= 0; i--) {
        if (progressPercent >= statuses[i].percent) {
          currentStatus = statuses[i].text;
          break;
        }
      }
      
      // Calculate remaining time (but don't go below 5 seconds to avoid "0s" awkwardness)
      const remainingSeconds = Math.max(5, estimatedSeconds - secondsElapsed);
      const remainingMinutes = Math.floor(remainingSeconds / 60);
      const remainingSecs = remainingSeconds % 60;
      
      let timeText;
      if (secondsElapsed > estimatedSeconds * 1.5) {
        // Taking much longer than expected - be honest
        timeText = 'Processing...';
      } else if (secondsElapsed > estimatedSeconds) {
        // Over estimate but not too much - show finishing
        timeText = 'Finishing...';
      } else if (remainingMinutes > 0) {
        timeText = `${remainingMinutes}:${remainingSecs.toString().padStart(2, '0')}`;
      } else {
        timeText = `${remainingSecs}s`;
      }
      
      // Update button content (don't remove analyzing class)
      if (analyzeBtn && analyzeBtn.classList.contains('analyzing')) {
        analyzeBtn.innerHTML = `
          <span class="btn-icon">⏳</span>
          <span class="btn-text">${currentStatus}</span>
          <span class="btn-time">${timeText}</span>
        `;
      }
    }, 1000); // Update every second for smoother UX
  }

  /**
   * Collect project context from Stage 1 form fields
   */
  function collectProjectContext() {
    return {
      // Required fields
      brandName: getFieldValue('brandName'),
      targetAudience: getFieldValue('targetAudience'),
      audiencePains: getFieldValue('audiencePains'),
      audienceDesired: getFieldValue('audienceDesired'),
      productOrService: getFieldValue('productOrService'),
      coreTopic: getFieldValue('coreTopic'),
      quarterlyObjective: getFieldValue('quarterlyObjective'),
      
      // Optional strategic fields
      brandIdeology: getFieldValue('brandIdeology'),
      brandArchetype: getFieldValue('brandArchetype'),
      brandLexicon: getFieldValue('brandLexicon'),
      uvp: getFieldValue('uvp'),
      existingMessaging: getFieldValue('existingMessaging'),
      
      // Audience intelligence
      secondaryAudience: getFieldValue('secondaryAudience'),
      customerDemographics: getFieldValue('customerDemographics'),
      geographicFocus: getFieldValue('geographicFocus'),
      industryVertical: getFieldValue('industryVertical'),
      
      // Competitive advantage
      competitiveAdvantages: getFieldValue('competitiveAdvantages'),
      coreMarketProblem: getFieldValue('coreMarketProblem'),
      
      // Goals & channels
      northStarKpis: getFieldValue('northStarKpis'),
      contentGoals: getFieldValue('contentGoals'),
      primaryChannels: getFieldValue('primaryChannels'),
      contentFormats: getFieldValue('contentFormats'),
      seasonality: getFieldValue('seasonality'),
      futureVision: getFieldValue('futureVision')
    };
  }

  /**
   * Get field value helper
   */
  function getFieldValue(fieldId) {
    const field = document.getElementById(fieldId);
    return field ? field.value.trim() : '';
  }

  /**
   * Call backend API for competitor analysis via PHP Gateway
   * Routes through UI_Main.gs → runEliteCompetitorAnalysis() → UI_Gateway.gs → PHP Gateway
   */
  async function callCompetitorAnalysisAPI(competitors, projectContext) {
    console.log('📡 Starting competitor analysis via Gateway...');
    console.log('   Competitors:', competitors.length);
    console.log('   Project:', projectContext.brandName || 'Unknown');
    
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(result => {
          console.log('📥 Gateway response received:', result);
          
          if (result && result.success) {
            console.log('✅ Analysis successful');
            console.log('   Total metrics:', result.metadata?.totalMetrics || 0);
            
            // Convert object to array if needed
            const convertedResult = convertCompetitorsToArray(result);
            resolve(convertedResult);
          } else {
            console.error('❌ Analysis failed:', result ? result.error : 'Unknown');
            reject(new Error(result?.error || 'Analysis failed'));
          }
        })
        .withFailureHandler(error => {
          console.error('❌ Gateway call failed:', error);
          // V9.0: Better error messages for common issues
          let errorMessage = error.message || 'Unknown error';
          if (errorMessage.includes('Exceeded maximum execution time') || errorMessage.includes('timeout')) {
            errorMessage = 'Analysis timed out. Try with fewer competitors (2-3 instead of 6) or try again.';
          } else if (errorMessage.includes('Forbidden') || errorMessage.includes('403')) {
            errorMessage = 'Access denied. Please check your license key in Settings.';
          } else if (errorMessage.includes('Network') || errorMessage.includes('fetch')) {
            errorMessage = 'Network error. Check your internet connection and try again.';
          }
          reject(new Error(errorMessage));
        })
        .runEliteCompetitorAnalysis(competitors, projectContext);
    });
  }

  /**
   * Convert competitors object to array format expected by renderer
   */
  function convertCompetitorsToArray(result) {
    console.log('🔄 Converting competitors object to array...');
    
    if (!result || !result.competitors) {
      console.warn('⚠️ No competitors data to convert');
      return result;
    }
    
    // Check if already an array
    if (Array.isArray(result.competitors)) {
      console.log('✅ Competitors in array format:', result.competitors.length, 'items');
      
      // Check if array contains strings (domains only) or objects
      const firstItem = result.competitors[0];
      
      if (typeof firstItem === 'string') {
        console.warn('⚠️ Competitors are strings only - converting to objects');
        
        // Convert string array to object array
        const competitorsArray = result.competitors.map(domain => ({
          domain: domain,
          url: 'https://' + domain.replace(/\/$/, ''),
          categories: result.competitorData?.[domain]?.categories || {},
          rawData: result.competitorData?.[domain]?.rawData || {},
          processedMetrics: result.competitorData?.[domain]?.processedMetrics || {}
        }));
        
        console.log('✅ Converted', competitorsArray.length, 'string domains to objects');
        
        return {
          ...result,
          competitors: competitorsArray
        };
      }
      
      console.log('✅ Competitors already in object format');
      return result;
    }
    
    // Convert object to array
    const competitorsArray = Object.entries(result.competitors).map(([domain, data]) => ({
      domain: domain,
      url: data.url || 'https://' + domain,
      categories: data.categories || {},
      rawData: data.rawData || {},
      processedMetrics: data.processedMetrics || {},
      ...data
    }));
    
    console.log(`✅ Converted ${competitorsArray.length} competitors from object to array format`);
    
    return {
      ...result,
      competitors: competitorsArray
    };
  }

  /**
   * Show competitor loading state
   */
  function showCompetitorLoadingState(competitorCount) {
    const loadingState = document.getElementById('comp-loading-state');
    const statusEl = document.getElementById('comp-loading-status');
    const progressEl = document.getElementById('comp-loading-progress');
    const detailsEl = document.getElementById('comp-loading-details');
    
    if (!loadingState) return;
    
    // Hide other states
    document.getElementById('comp-empty-state').style.display = 'none';
    document.getElementById('comp-results').style.display = 'none';
    
    // Show loading
    loadingState.style.display = 'block';
    
    // Update status
    if (statusEl) {
      statusEl.textContent = `Analyzing ${competitorCount} competitor${competitorCount > 1 ? 's' : ''}...`;
    }
    
    // Animate progress
    animateProgressBar(progressEl, competitorCount);
    
    // Show analysis steps
    if (detailsEl) {
      const steps = [
        { text: '🔍 Fetching SEO metrics...', delay: 0 },
        { text: '🏆 Collecting domain authority...', delay: 2000 },
        { text: '⚡ Analyzing page speed...', delay: 4000 },
        { text: '🔎 Gathering SERP intelligence...', delay: 6000 },
        { text: '🤖 Running AI analysis...', delay: 8000 },
        { text: '📊 Generating insights...', delay: 10000 }
      ];
      
      detailsEl.innerHTML = '';
      
      steps.forEach(step => {
        setTimeout(() => {
          const stepEl = document.createElement('div');
          stepEl.className = 'loading-step';
          stepEl.textContent = step.text;
          detailsEl.appendChild(stepEl);
        }, step.delay);
      });
    }
  }

  /**
   * Animate progress bar
   */
  function animateProgressBar(progressEl, competitorCount) {
    if (!progressEl) return;
    
    const estimatedTime = competitorCount * 2000; // 2s per competitor
    const steps = 100;
    const interval = estimatedTime / steps;
    
    let progress = 0;
    
    const timer = setInterval(() => {
      progress += 1;
      progressEl.style.width = progress + '%';
      
      if (progress >= 95) {
        clearInterval(timer);
      }
    }, interval);
    
    // Store timer to clear on completion
    window.competitorProgressTimer = timer;
  }

  /**
   * Hide competitor loading state
   */
  function hideCompetitorLoadingState() {
    const loadingState = document.getElementById('comp-loading-state');
    if (loadingState) {
      loadingState.style.display = 'none';
    }
    
    // Clear progress timer
    if (window.competitorProgressTimer) {
      clearInterval(window.competitorProgressTimer);
    }
    
    // Set progress to 100%
    const progressEl = document.getElementById('comp-loading-progress');
    if (progressEl) {
      progressEl.style.width = '100%';
    }
  }

  /**
   * Switch to competitor intelligence tab
   */
  function switchToCompetitorTab() {
    console.log('📍 Switching to competitor intelligence tab...');
    
    // Use the global setActiveTab function if available (proper tab switching)
    if (typeof setActiveTab === 'function') {
      setActiveTab('competitors');
      console.log('   ✅ Used setActiveTab("competitors")');
      return;
    }
    
    // Fallback: Manual tab switching using CSS classes only (no inline styles!)
    // This ensures other tabs can be switched back properly
    document.querySelectorAll('.tab').forEach(tab => {
      tab.classList.remove('active');
      // DON'T set display:none - let CSS handle visibility via .active class
    });
    
    // Show competitor tab
    const compTab = document.getElementById('tab-competitors');
    if (compTab) {
      compTab.classList.add('active');
      console.log('   ✅ Activated tab-competitors');
    }
    
    // Update sidebar active state
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.classList.remove('active');
    });
    
    const compNavBtn = document.querySelector('.nav-btn[data-tab="competitors"]');
    if (compNavBtn) {
      compNavBtn.classList.add('active');
    }
    
    // Scroll to top
    window.scrollTo(0, 0);
  }

  /**
   * Show toast notification
   */
  function showToast(message, type = 'info') {
    console.log(`[${type.toUpperCase()}] ${message}`);
    
    // Create toast element if it doesn't exist
    let toast = document.getElementById('elite-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'elite-toast';
      toast.className = 'elite-toast';
      document.body.appendChild(toast);
    }
    
    // Set message and type
    toast.textContent = message;
    toast.className = `elite-toast elite-toast-${type} elite-toast-show`;
    
    // Auto-hide after 5 seconds
    setTimeout(() => {
      toast.classList.remove('elite-toast-show');
    }, 5000);
  }

  /**
   * Show competitor error state
   */
  function showCompetitorError(errorMessage) {
    const emptyState = document.getElementById('comp-empty-state');
    if (!emptyState) return;
    
    emptyState.innerHTML = `
      <div class="empty-state-icon">⚠️</div>
      <h3 class="empty-state-title">Analysis Error</h3>
      <p class="empty-state-text">${errorMessage}</p>
      <button class="btn-primary" onclick="location.reload()">Try Again</button>
    `;
    
    emptyState.style.display = 'block';
    document.getElementById('comp-results').style.display = 'none';
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // COMPETITOR TAB NAVIGATION
  // ═══════════════════════════════════════════════════════════════════════════

  /**
   * Initialize competitor tab navigation
   */
  function initCompetitorTabNavigation() {
    const tabButtons = document.querySelectorAll('.comp-tab-btn');
    
    tabButtons.forEach(btn => {
      btn.addEventListener('click', function() {
        const targetTab = this.getAttribute('data-comp-tab');
        switchCompetitorCategoryTab(targetTab);
      });
    });
    
    console.log('✅ Competitor tab navigation initialized');
  }

  /**
   * Switch between competitor category tabs
   */
  function switchCompetitorCategoryTab(tabName) {
    // Update tab buttons
    document.querySelectorAll('.comp-tab-btn').forEach(btn => {
      btn.classList.remove('active');
    });
    
    const activeBtn = document.querySelector(`[data-comp-tab="${tabName}"]`);
    if (activeBtn) {
      activeBtn.classList.add('active');
    }
    
    // Update tab panels
    document.querySelectorAll('.comp-tab-panel').forEach(panel => {
      panel.classList.remove('active');
      panel.style.display = 'none';
    });
    
    const activePanel = document.querySelector(`[data-comp-panel="${tabName}"]`);
    if (activePanel) {
      activePanel.classList.add('active');
      activePanel.style.display = 'block';
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // INITIALIZATION
  // ═══════════════════════════════════════════════════════════════════════════

  // Initialize on page load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      initCompetitorAnalysis();
      initCompetitorTabNavigation();
    });
  } else {
    initCompetitorAnalysis();
    initCompetitorTabNavigation();
  }

  console.log('✅ Elite Competitor Integration loaded (v6 SaaS)');
  </script>

  <style>
  /* Toast notifications */
  .elite-toast {
    position: fixed;
