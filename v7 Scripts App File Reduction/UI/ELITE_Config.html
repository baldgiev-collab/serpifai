// Score color thresholds
function getScoreColor(score) {
  if (score >= 80) return '#10b981'; // Emerald
  if (score >= 60) return '#3b82f6'; // Blue
  if (score >= 40) return '#f59e0b'; // Amber
  return '#ef4444'; // Red
}

function getScoreClass(score) {
  if (score >= 80) return 'excellent';
  if (score >= 60) return 'good';
  if (score >= 40) return 'average';
  return 'needs-work';
}

function getMetricValueClass(value) {
  if (typeof value === 'number') {
    if (value >= 80) return 'metric-excellent';
    if (value >= 60) return 'metric-good';
    if (value >= 40) return 'metric-average';
    return 'metric-poor';
  }
  return 'metric-neutral';
}

// Chart color palette
function getColorByIndex(index) {
  const colors = [
    '#1a73e8', '#34a853', '#fbbc04', '#ea4335', '#8e24aa',
    '#00acc1', '#ff6f00', '#c2185b', '#7cb342', '#5e35b1'
  ];
  return colors[index % colors.length];
}

function getChartColors(count) {
  const colors = [];
  for (let i = 0; i < count; i++) {
    colors.push(getColorByIndex(i));
  }
  return colors;
}

function getChartScales(chartType) {
  const baseScales = {
    y: {
      beginAtZero: true,
      max: 100,
      grid: { color: 'rgba(0, 0, 0, 0.05)' }
    },
    x: {
      grid: { display: false }
    }
  };
  
  if (chartType === 'radar') {
    return {
      r: {
        min: 0,
        max: 100,
        ticks: { stepSize: 20, display: false },
        grid: { color: 'rgba(0, 0, 0, 0.05)' }
      }
    };
  }
  
  return baseScales;
}
