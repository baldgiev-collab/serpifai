<!--
  ╔═══════════════════════════════════════════════════════════════════════════════════╗
  ║  UI_Executive_Renderer.html - Executive Gemini Insight Renderer                   ║
  ║  C-Suite Level Strategic Intelligence with CEO/CMO/CTO views                      ║
  ║                                                                                    ║
  ║  Dependencies: None                                                                ║
  ║  Exports: window.renderExecutiveGeminiInsight                                      ║
  ╚═══════════════════════════════════════════════════════════════════════════════════╝
-->
<script>
  /**
   * ═══════════════════════════════════════════════════════════════════════════
   * EXECUTIVE GEMINI INSIGHT RENDERER - C-Suite Level Strategic Intelligence
   * ═══════════════════════════════════════════════════════════════════════════
   * Provides CEO/CMO/CTO level guidance with actionable executive briefings
   */
  window.renderExecutiveGeminiInsight = function(config) {
    const { 
      title, icon, analysis, executiveSummary, ceoInsight, cmoInsight, ctoInsight,
      strategicImperative, competitiveThreats, marketOpportunity, investmentPriority,
      timelineToImpact, roiProjection, riskLevel, actionItems, kpis, competitors, dataProofs
    } = config;
    
    if (!analysis && !executiveSummary) return '';
    
    // Determine overall health status
    const getHealthStatus = () => {
      if (investmentPriority === 'Critical' || riskLevel === 'High') 
        return { color: '#dc2626', bg: '#fef2f2', icon: '🔴', label: 'URGENT ACTION REQUIRED' };
      if (investmentPriority === 'High' || riskLevel === 'Medium')
        return { color: '#d97706', bg: '#fffbeb', icon: '🟡', label: 'STRATEGIC PRIORITY' };
      return { color: '#059669', bg: '#ecfdf5', icon: '🟢', label: 'ON TRACK' };
    };
    
    const health = getHealthStatus();

    return `
      <div class="executive-insight-card" style="background: linear-gradient(135deg, ${health.bg} 0%, white 100%); border-radius: 16px; padding: 0; margin-bottom: 24px; border: 2px solid ${health.color}30; box-shadow: 0 10px 25px -5px ${health.color}15; overflow: hidden;">
        
        <!-- Executive Header -->
        <div style="background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%); padding: 20px 24px; display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 32px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));">${icon || '🤖'}</span>
            <div>
              <h3 style="margin: 0; font-size: 18px; color: white; font-weight: 700;">${title || 'Executive Intelligence Brief'}</h3>
              <p style="margin: 4px 0 0; font-size: 12px; color: rgba(255,255,255,0.8);">Gemini AI Strategic Analysis • ${new Date().toLocaleDateString()}</p>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; background: ${health.color}; padding: 8px 16px; border-radius: 20px;">
            <span>${health.icon}</span>
            <span style="font-size: 11px; font-weight: 700; color: white; text-transform: uppercase;">${health.label}</span>
          </div>
        </div>
        
        <!-- Executive Summary -->
        <div style="padding: 20px 24px; border-bottom: 1px solid #e5e7eb;">
          <div style="display: flex; align-items: flex-start; gap: 16px;">
            <div style="flex: 1;">
              <h4 style="margin: 0 0 10px; font-size: 14px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;">Executive Summary</h4>
              <p style="margin: 0; font-size: 15px; color: #1e293b; line-height: 1.6;">${executiveSummary || analysis}</p>
            </div>
            ${roiProjection ? `
              <div style="min-width: 120px; text-align: center; padding: 16px; background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%); border-radius: 12px;">
                <div style="font-size: 24px; font-weight: 800; color: #166534;">${roiProjection}</div>
                <div style="font-size: 11px; color: #15803d; margin-top: 4px;">Projected ROI</div>
              </div>
            ` : ''}
          </div>
        </div>
        
        <!-- C-Suite Insights Grid -->
        ${(ceoInsight || cmoInsight || ctoInsight) ? `
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-bottom: 1px solid #e5e7eb;">
            ${ceoInsight ? `
              <div style="padding: 16px 20px; border-right: 1px solid #e5e7eb;">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                  <span style="font-size: 18px;">👔</span>
                  <span style="font-size: 12px; font-weight: 700; color: #1e40af; text-transform: uppercase;">CEO View</span>
                </div>
                <p style="margin: 0; font-size: 13px; color: #374151; line-height: 1.5;">${ceoInsight}</p>
              </div>
            ` : ''}
            ${cmoInsight ? `
              <div style="padding: 16px 20px; border-right: 1px solid #e5e7eb;">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                  <span style="font-size: 18px;">📈</span>
                  <span style="font-size: 12px; font-weight: 700; color: #7c3aed; text-transform: uppercase;">CMO View</span>
                </div>
                <p style="margin: 0; font-size: 13px; color: #374151; line-height: 1.5;">${cmoInsight}</p>
              </div>
            ` : ''}
            ${ctoInsight ? `
              <div style="padding: 16px 20px;">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                  <span style="font-size: 18px;">⚙️</span>
                  <span style="font-size: 12px; font-weight: 700; color: #059669; text-transform: uppercase;">CTO View</span>
                </div>
                <p style="margin: 0; font-size: 13px; color: #374151; line-height: 1.5;">${ctoInsight}</p>
              </div>
            ` : ''}
          </div>
        ` : ''}
        
        <!-- Strategic Metrics Row -->
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; background: #f8fafc; border-bottom: 1px solid #e5e7eb;">
          ${investmentPriority ? `
            <div style="padding: 16px; text-align: center; border-right: 1px solid #e5e7eb;">
              <div style="font-size: 11px; color: #64748b; text-transform: uppercase; margin-bottom: 6px;">Priority Level</div>
              <div style="font-size: 16px; font-weight: 700; color: ${investmentPriority === 'Critical' ? '#dc2626' : investmentPriority === 'High' ? '#d97706' : '#3b82f6'};">${investmentPriority}</div>
            </div>
          ` : ''}
          ${timelineToImpact ? `
            <div style="padding: 16px; text-align: center; border-right: 1px solid #e5e7eb;">
              <div style="font-size: 11px; color: #64748b; text-transform: uppercase; margin-bottom: 6px;">Time to Impact</div>
              <div style="font-size: 16px; font-weight: 700; color: #1e293b;">${timelineToImpact}</div>
            </div>
          ` : ''}
          ${riskLevel ? `
            <div style="padding: 16px; text-align: center; border-right: 1px solid #e5e7eb;">
              <div style="font-size: 11px; color: #64748b; text-transform: uppercase; margin-bottom: 6px;">Risk Level</div>
              <div style="font-size: 16px; font-weight: 700; color: ${riskLevel === 'High' ? '#dc2626' : riskLevel === 'Medium' ? '#d97706' : '#059669'};">${riskLevel}</div>
            </div>
          ` : ''}
          ${marketOpportunity ? `
            <div style="padding: 16px; text-align: center;">
              <div style="font-size: 11px; color: #64748b; text-transform: uppercase; margin-bottom: 6px;">Opportunity</div>
              <div style="font-size: 16px; font-weight: 700; color: #059669;">${marketOpportunity}</div>
            </div>
          ` : ''}
        </div>
        
        <!-- Competitive Threats & Strategic Imperatives -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0;">
          ${competitiveThreats && competitiveThreats.length > 0 ? `
            <div style="padding: 20px 24px; border-right: 1px solid #e5e7eb;">
              <h4 style="margin: 0 0 12px; font-size: 13px; color: #dc2626; font-weight: 700; display: flex; align-items: center; gap: 6px;">
                <span>⚠️</span> Competitive Threats
              </h4>
              <ul style="margin: 0; padding-left: 18px;">
                ${competitiveThreats.slice(0, 4).map(t => `<li style="font-size: 13px; color: #374151; margin-bottom: 6px; line-height: 1.4;">${t}</li>`).join('')}
              </ul>
            </div>
          ` : ''}
          ${strategicImperative ? `
            <div style="padding: 20px 24px; background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);">
              <h4 style="margin: 0 0 12px; font-size: 13px; color: #1e40af; font-weight: 700; display: flex; align-items: center; gap: 6px;">
                <span>🎯</span> Strategic Imperative
              </h4>
              <p style="margin: 0; font-size: 14px; color: #1e3a8a; line-height: 1.5; font-weight: 500;">${strategicImperative}</p>
            </div>
          ` : ''}
        </div>
        
        <!-- Action Items -->
        ${actionItems && actionItems.length > 0 ? `
          <div style="padding: 20px 24px; border-top: 1px solid #e5e7eb; background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);">
            <h4 style="margin: 0 0 12px; font-size: 13px; color: #166534; font-weight: 700; display: flex; align-items: center; gap: 6px;">
              <span>✅</span> Priority Action Items
            </h4>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
              ${actionItems.slice(0, 6).map((item, idx) => `
                <div style="display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; background: white; border-radius: 8px; border-left: 3px solid ${idx === 0 ? '#dc2626' : idx === 1 ? '#d97706' : '#10b981'};">
                  <span style="font-size: 12px; font-weight: 700; color: ${idx === 0 ? '#dc2626' : idx === 1 ? '#d97706' : '#10b981'};">P${idx + 1}</span>
                  <span style="font-size: 12px; color: #374151; line-height: 1.4;">${item}</span>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}
        
        <!-- KPIs to Track -->
        ${kpis && kpis.length > 0 ? `
          <div style="padding: 16px 24px; border-top: 1px solid #e5e7eb; background: #f8fafc;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
              <span style="font-size: 14px;">📊</span>
              <span style="font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase;">KPIs to Track</span>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
              ${kpis.slice(0, 8).map(kpi => `<span style="background: white; border: 1px solid #e5e7eb; padding: 6px 12px; border-radius: 20px; font-size: 12px; color: #1e293b;">${kpi}</span>`).join('')}
            </div>
          </div>
        ` : ''}
        
        <!-- Data Proofs Footer -->
        ${dataProofs && dataProofs.length > 0 ? `
          <div style="padding: 12px 24px; border-top: 1px solid #e5e7eb; background: #1e293b;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 11px; color: #94a3b8;">🔍 Evidence Sources:</span>
              ${dataProofs.slice(0, 5).map(proof => `<span style="background: rgba(255,255,255,0.1); padding: 3px 10px; border-radius: 10px; font-size: 10px; color: #e2e8f0;">${proof}</span>`).join('')}
            </div>
          </div>
        ` : ''}
      </div>
    `;
  };

  console.log('✅ UI_Executive_Renderer.html loaded');
</script>
