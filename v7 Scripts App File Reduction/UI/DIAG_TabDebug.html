    'populateAuthorityInfluenceTab',

function diagnoseDataStructure(data) {

    Object.keys(data).forEach(key => {
      const val = data[key];
      const valType = Array.isArray(val) ? `Array[${val.length}]` : typeof val;
      console.log(`  ${key}: ${valType}`);
    });
  }
  
  return results;
}

function analyzeCompetitorObject(comp, results) {
  if (!comp) return;
  
  // Critical fields for each tab
  const criticalFields = {
    overview: ['domain', 'url', 'title', 'score', 'position'],
    conversion: ['conversionIntel', 'monetization', 'ctaAnalysis', 'conversion_signals'],
    distribution: ['distributionIntel', 'referralSources', 'socialSignals', 'distribution_channels'],
    audience: ['audienceIntel', 'targetAudience', 'userIntent', 'audience_segments'],
    geoaeo: ['geoAeoIntel', 'geoTargeting', 'aeoSignals', 'local_seo'],
    authority: ['authorityIntel', 'backlinks', 'domainAuthority', 'trustFlow'],
    performance: ['performanceIntel', 'coreWebVitals', 'pageSpeed', 'performance_metrics'],
    opportunities: ['opportunitiesIntel', 'gaps', 'weaknesses', 'quick_wins'],
    technical: ['technicalIntel', 'schema', 'meta', 'technical_seo'],
    brand: ['brandIntel', 'brandVoice', 'tone', 'messaging'],
    contentDna: ['contentIntel', 'contentStructure', 'topics', 'content_analysis'],
    keywords: ['keywords', 'keywordIntel', 'rankingKeywords', 'keyword_data']
  };
  
  console.log('\n--- Top-Level Fields ---');
  const topLevelKeys = Object.keys(comp);
  console.log('Fields found:', topLevelKeys.length);
  topLevelKeys.forEach(key => {
    const val = comp[key];
    let valDesc = '';
    if (val === null) valDesc = 'null';
    else if (val === undefined) valDesc = 'undefined';
    else if (Array.isArray(val)) valDesc = `Array[${val.length}]`;
    else if (typeof val === 'object') valDesc = `Object{${Object.keys(val).length} keys}`;
    else if (typeof val === 'string') valDesc = val.length > 50 ? `String(${val.length} chars)` : `"${val}"`;
    else valDesc = String(val);
    
    results.dataFields[key] = valDesc;
    console.log(`  📦 ${key}: ${valDesc}`);
  });
  
  // Check for Gemini data specifically
  console.log('\n--- Gemini/Elite Data Check ---');
  const geminiKeys = ['geminiIntel', 'gemini', 'eliteData', 'elite', 'aiAnalysis', 'geminiAnalysis'];
  geminiKeys.forEach(key => {
    if (comp[key]) {
      console.log(`✅ ${key} FOUND:`, typeof comp[key]);
      if (typeof comp[key] === 'object') {
        results.geminiData[key] = Object.keys(comp[key]);
        console.log(`   Sub-keys:`, Object.keys(comp[key]).join(', '));
      }
    }
  });
  
  // Check each tab's critical fields
  console.log('\n--- Tab Data Availability ---');
  Object.entries(criticalFields).forEach(([tab, fields]) => {
    const found = fields.filter(f => comp[f] !== undefined && comp[f] !== null);
    const missing = fields.filter(f => comp[f] === undefined || comp[f] === null);
    
    if (found.length > 0) {
      console.log(`✅ ${tab.toUpperCase()}: ${found.length}/${fields.length} fields`);
      console.log(`   Found: ${found.join(', ')}`);
    } else {
      console.log(`❌ ${tab.toUpperCase()}: 0/${fields.length} fields`);
      results.missingCritical.push(tab);
    }
    
    if (missing.length > 0 && found.length > 0) {
      console.log(`   Missing: ${missing.join(', ')}`);
    }
  });
  
  return results;
}

function dumpCompetitorData(index = 0) {
  console.log('\n========================================');
  console.log(`🔬 DIAGNOSTIC: Deep Data Dump - Competitor ${index}`);
  console.log('========================================\n');
  
  const sources = [
    { name: 'competitorData', val: window.competitorData },
    { name: 'currentCompetitorData', val: window.currentCompetitorData },
    { name: 'allCompetitorData', val: window.allCompetitorData },
    { name: 'geminiData', val: window.geminiData },
    { name: 'fetchedData', val: window.fetchedData }
  ];
  
  let foundData = null;
  let sourceName = '';
  
  for (const src of sources) {
    if (src.val) {
      foundData = src.val;
      sourceName = src.name;
      break;
    }
  }
  
  if (!foundData) {
    console.log('❌ No data found in any global variable');
    return;
  }
  
  console.log(`📦 Data source: window.${sourceName}`);
  
  let competitor;
  if (Array.isArray(foundData)) {
    console.log(`📊 Total competitors: ${foundData.length}`);
    competitor = foundData[index];
  } else {
    competitor = foundData;
  }
  
  if (!competitor) {
    console.log(`❌ No competitor at index ${index}`);
    return;
  }
  
  console.log('\n--- FULL DATA STRUCTURE ---');
  console.log(JSON.stringify(competitor, null, 2).substring(0, 10000));
  
  if (JSON.stringify(competitor).length > 10000) {
    console.log('\n... (truncated, data exceeds 10KB)');
    console.log(`Total data size: ${JSON.stringify(competitor).length} chars`);
  }
  
  return competitor;
}

      console.log(`   ⚠️ Tabs missing data: ${report.dataAnalysis.missingCritical.join(', ')}`);
    }
  }
  
  // Check critical helpers
  report.helpers = diagnoseCriticalHelpers();
  
  console.log('\n');
  console.log('═══════════════════════════════════════════════════════════════');
  console.log('To trace a specific tab, run: traceRenderPipeline("tabName")');
  console.log('Available tabs: audience, conversion, distribution, geoaeo,');
  console.log('                authority, performance, opportunities');
  console.log('═══════════════════════════════════════════════════════════════');
  
  // Store report for access
  window.diagReport = report;
  
  return report;
}
